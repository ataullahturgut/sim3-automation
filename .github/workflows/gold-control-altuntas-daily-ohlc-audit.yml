name: Gold Control Altuntas Daily OHLC Source Audit

on:
  push:
    branches:
      - gold-direction-altuntas-alexnet-candle-v1-20260921
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_ALTUNTAS_ALEXNET_CANDLE_V1_PREREG_2026-09-21.md'
      - 'gold_axis_2026/data_pipeline/twelve_xau_altuntas_daily_ohlc_audit.py'
      - '.github/workflows/gold-control-altuntas-daily-ohlc-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-altuntas-daily-ohlc-audit
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-altuntas-alexnet-candle-v1-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require provider credential
        run: test -n "$TWELVE_DATA_API_KEY"
      - name: Install dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Compile audit
        run: python -m py_compile gold_axis_2026/data_pipeline/twelve_xau_altuntas_daily_ohlc_audit.py
      - name: Run source audit
        run: python gold_axis_2026/data_pipeline/twelve_xau_altuntas_daily_ohlc_audit.py
      - name: Freeze audit summary
        run: |
          cp altuntas_ohlc_audit_artifact/altuntas_daily_ohlc_source_audit_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_ALTUNTAS_ALEXNET_CANDLE_V1_SOURCE_AUDIT_2026-09-21.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_ALTUNTAS_ALEXNET_CANDLE_V1_SOURCE_AUDIT_2026-09-21.json
          git diff --cached --quiet || git commit -m 'Freeze Altuntas daily OHLC source audit'
          git push origin HEAD:gold-direction-altuntas-alexnet-candle-v1-20260921
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-altuntas-daily-ohlc-source-audit
          retention-days: 30
          if-no-files-found: error
          path: altuntas_ohlc_audit_artifact/
