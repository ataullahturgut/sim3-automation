name: Gold H3 FLOW-VOL V1
on:
  push:
    branches: [gold-h3-flow-v1-20261003]
    paths:
      - 'gold_axis_2026/tools/gold_h3_flow_vol_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-flow-v1-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' requests
      - run: python gold_axis_2026/tools/gold_h3_flow_vol_v1.py
      - name: Commit FLOW-VOL evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_FLOW_VOL_V1_*
          if ! git diff --cached --quiet; then
            git commit -m "Record FLOW-VOL-H3 V1 evidence"
            git pull --rebase origin gold-h3-flow-v1-20261003
            git push origin HEAD:gold-h3-flow-v1-20261003
          fi
