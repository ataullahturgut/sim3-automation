name: Gold V46 2025 Full V22 Early Risk to SELL Signal Event Audit
on:
  workflow_dispatch:
  push:
    branches: [research/gold-v44-three-year-streaming-exit-validation-20261031]
    paths:
      - '.github/workflows/gold-v46-2025-original-v22-exit-detail.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v46_2025_v22_exit_event_detail.py'
permissions:
  contents: read
jobs:
  full-2025-v22-episode-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test causal chronological gating and syntax
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v44_three_year_v22_streaming_sell_only.py -v
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v46_2025_v22_exit_event_detail.py
      - name: Install Neon read-only driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check read-only source available
        run: test -n "$NEON_DATABASE_URL"
      - name: Replay 2025 original V22 warning dates and full exit timelines
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v46_2025_v22_exit_event_detail \
            --out gold-v46-2025-all-risks-exit-and-missed-rallies.json
      - name: Preserve all 2025 V22 risk windows, events, and future scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v46-2025-v22-warning-exit-event-audit
          path: gold-v46-2025-all-risks-exit-and-missed-rallies.json
          retention-days: 30
          if-no-files-found: warn
