name: Gold Control V1.30 September Replay Visibility Regression

on:
  push:
    branches:
      - gold-control-v130-september-replay-motor-visibility
      - gold-r4-direction-engine
      - gold-r4-direction-engine-ui-v122-final
    paths:
      - '.github/workflows/gold-control-v130-september-replay-motor-visibility.yml'
      - 'gold_axis_2026/apps/gold_control_mobile_v1.py'
      - 'gold_axis_2026/apps/forecast_source.py'
      - 'gold_axis_2026/apps/engine_observability_contract.py'
      - 'gold_axis_2026/apps/production_display_snapshot.json'
      - 'gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked app runtime
        run: |
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Verify frozen presentation contract and compile
        run: |
          grep -Fq '**Manifest version:** 1.30' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'REPLAY · PROSPECTIVE ISSUED DEĞİL' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq '31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'REPLAY ORIGIN' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'Eylül sonu → Ekim 2026 H=1' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'AUTO_SELECTOR = OFF' gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md
          grep -Fq 'AUTO_ENSEMBLE = OFF' gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md
          grep -Fq 'Target relevance and evidence provenance are separate' gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py gold_axis_2026/apps/forecast_source.py gold_axis_2026/apps/engine_observability_contract.py gold_axis_2026/apps/gold_control.py
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_engine_observability_contract.py test_aug31_state_replay_source.py test_production_display_snapshot.py
      - name: Read-only production replay and runtime audit
        run: |
          test -n "$NEON_DATABASE_URL"
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import os
          import psycopg
          from psycopg.rows import dict_row
          from forecast_source import TRACK_HISTORICAL_REPLAY, fetch_latest_expert_forecasts
          from runtime_source import fetch_runtime_observability
          from aug31_state_replay_source import fetch_aug31_state_replay
          url=os.environ['NEON_DATABASE_URL']
          rows=fetch_latest_expert_forecasts(url,TRACK_HISTORICAL_REPLAY)
          by={r['expert_id']:r for r in rows}
          assert set(by)=={'MOMENTUM_3M','RANDOM_WALK'}
          assert abs(float(by['MOMENTUM_3M']['forecast_value'])-4345.814584037808)<1e-9
          assert abs(float(by['RANDOM_WALK']['forecast_value'])-4397.305673870967)<1e-9
          assert all(str(r['target_month'])[:7]=='2026-09' for r in rows)
          assert all(r['evidence_class']=='HISTORICAL_REPLAY' for r in rows)
          assert all(r['canonical_authority'] is False for r in rows)
          assert all(r['auto_selector']=='OFF' and r['auto_ensemble']=='OFF' for r in rows)
          aug=fetch_aug31_state_replay(url)
          assert aug['target_context']=='2026-09'
          assert aug['state_as_of']=='2026-08-31T21:00:00+00:00'
          assert aug['evidence_class']=='HISTORICAL_REPLAY'
          assert aug['prospective_h1_claim'] is False
          assert aug['canonical_authority'] is False
          assert aug['monthly_direction_3m']=='DOWN'
          assert aug['fast_state']=='ROBUST_UP'
          assert aug['slow_state']=='ROBUST_UP'
          rt=fetch_runtime_observability(url)
          dist={}
          for r in rt['runtime']: dist[r['runtime_status']]=dist.get(r['runtime_status'],0)+1
          assert dist=={'ACTIVE':4,'WAITING':3,'BLOCKED':5},dist
          assert sum(1 for r in rt['runtime'] if r.get('direction_vote_permitted') is True)==3
          with psycopg.connect(url,autocommit=False,row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute('SET TRANSACTION READ ONLY')
              cur.execute('select count(*) n from monthly_forecast_contracts'); assert cur.fetchone()['n']==0
              cur.execute('select count(*) n from decision_signal_snapshots'); assert cur.fetchone()['n']==0
              cur.execute('select count(*) n from decision_runs'); assert cur.fetchone()['n']==0
              cur.execute('select count(*) n from decision_events'); assert cur.fetchone()['n']==0
            conn.rollback()
          print('V130_SEPTEMBER_CURRENT_MONTH_REFERENCE_PRODUCTION_AUDIT_PASS writes=NONE')
          PY
      - name: DB-backed 390x844 visual proof
        run: |
          rm -rf /tmp/v130_sep_reg && mkdir -p /tmp/v130_sep_reg
          streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8553 --server.address 127.0.0.1 >/tmp/v130_sep_reg.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8553/_stcore/health >/dev/null && break; sleep 1; done
          python - <<'PY'
          import re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/v130_sep_reg')
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
            page.goto('http://127.0.0.1:8553',wait_until='domcontentloaded',timeout=60000)
            page.get_by_text('GOLD CONTROL',exact=False).first.wait_for(state='visible',timeout=45000)
            nav=page.locator('.st-key-gc_main_nav label[data-testid="stRadioOption"]')
            nav.filter(has_text=re.compile('Tahmin',re.I)).first.click()
            page.get_by_text('EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE',exact=True).first.wait_for(state='visible',timeout=20000)
            body=page.locator('body').inner_text()
            for x in ('4,345.81 / 4,397.31 USD','3M Momentum / Random Walk','REPLAY · PROSPECTIVE ISSUED DEĞİL','31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT','DOWN','ROBUST_UP','REPLAY ORIGIN','EYLÜL 2026 HISTORICAL REPLAY','NOT_ISSUED_MISSED_2026_08_31_ORIGIN'):
              assert x in body,x
            top=body.split('GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI')[0]
            assert 'CANONICAL ORIGIN' not in top
            page.screenshot(path=str(out/'tahmin_september_current_month_reference_390x844.png'),full_page=False)
            nav.filter(has_text=re.compile('Görünüm',re.I)).first.click()
            heading=page.get_by_text('TÜM TAHMİN, YÖN, EVENT, REJİM VE RİSK MOTORLARI',exact=True).first
            heading.wait_for(state='visible',timeout=20000)
            body=page.locator('body').inner_text()
            for x in ('Eylül sonu → Ekim 2026 H=1','exact executable runner','authorized persisted monthly price reference','exact forward BOCPD','Toplam 12 motor/kanal'):
              assert x in body,x
            assert 'BUY' not in body and 'SELL' not in body and 'HOLD' not in body
            heading.evaluate("el=>el.scrollIntoView({block:'start'})")
            page.wait_for_timeout(300)
            page.screenshot(path=str(out/'gorunum_motor_timing_390x844.png'),full_page=False)
            b.close()
          print('V130_SEPTEMBER_CURRENT_MONTH_REFERENCE_DB_VISUAL_PASS')
          PY
          kill $PID || true; wait $PID || true
      - name: DB-less replay fallback proof
        run: |
          rm -rf /tmp/v130_sep_fallback && mkdir -p /tmp/v130_sep_fallback
          env -u NEON_DATABASE_URL streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8554 --server.address 127.0.0.1 >/tmp/v130_sep_fallback.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8554/_stcore/health >/dev/null && break; sleep 1; done
          env -u NEON_DATABASE_URL python - <<'PY'
          import re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/v130_sep_fallback')
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
            page.goto('http://127.0.0.1:8554',wait_until='domcontentloaded',timeout=60000)
            page.get_by_text('GOLD CONTROL',exact=False).first.wait_for(state='visible',timeout=45000)
            nav=page.locator('.st-key-gc_main_nav label[data-testid="stRadioOption"]')
            nav.filter(has_text=re.compile('Tahmin',re.I)).first.click()
            page.get_by_text('EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE',exact=True).first.wait_for(state='visible',timeout=20000)
            body=page.locator('body').inner_text()
            for x in ('4,345.81 / 4,397.31 USD','REPLAY · PROSPECTIVE ISSUED DEĞİL','31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT','DOWN','ROBUST_UP','REPLAY ORIGIN'):
              assert x in body,x
            page.screenshot(path=str(out/'tahmin_september_current_month_reference_fallback_390x844.png'),full_page=False)
            b.close()
          print('V130_SEPTEMBER_CURRENT_MONTH_REFERENCE_DBLESS_PASS')
          PY
          kill $PID || true; wait $PID || true
      - name: Upload regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v130-september-current-month-reference-regression
          path: |
            /tmp/v130_sep_reg/*.png
            /tmp/v130_sep_fallback/*.png
          if-no-files-found: error
          retention-days: 30
