name: Gold Control V1.30 September Replay and Motor Visibility

on:
  push:
    branches: [gold-control-v130-september-replay-motor-visibility]
    paths:
      - '.github/workflows/gold-control-v130-september-replay-motor-visibility.yml'
      - 'gold_axis_2026/apps/gold_control_mobile_v1.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: gold-control-v130-september-replay-motor-visibility
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked app runtime
        run: |
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Apply replay semantic-label patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/apps/gold_control_mobile_v1.py')
          text=p.read_text(encoding='utf-8')
          changed=False

          old='direction_text=f"{da} {display_state(direction,\'—\')}"; origin_text=fmt_time(forecast.get("forecast_origin"))'
          new=old+'; hero_kicker="GELECEK AY TAHMİNİ"; direction_label="MONTHLY DIRECTION / PRIOR"; origin_label="CANONICAL ORIGIN"'
          if old in text and new not in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('CANONICAL_HERO_LABEL_ANCHOR_MISSING')

          old='''        badge="REPLAY · PROSPECTIVE DEĞİL"\n        direction_text="31 AĞUSTOS REPLAY"\n        origin_text=fmt_time(replay_primary.get("forecast_origin"))\n'''
          new='''        badge="REPLAY · PROSPECTIVE DEĞİL"\n        direction_text="31 AĞUSTOS REPLAY"\n        origin_text=fmt_time(replay_primary.get("forecast_origin"))\n        hero_kicker="EYLÜL 2026 H=1 REPLAY"\n        direction_label="STATE BAĞLAMI"\n        origin_label="REPLAY ORIGIN"\n'''
          if old in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('REPLAY_HERO_LABEL_ANCHOR_MISSING')

          old='        hero_title=fstate.title; hero_sub=fstate.subtitle; badge="KANONİK SONUÇ YOK"; direction_text="—"; origin_text="—"\n'
          new='        hero_title=fstate.title; hero_sub=fstate.subtitle; badge="KANONİK SONUÇ YOK"; direction_text="—"; origin_text="—"; hero_kicker="GELECEK AY TAHMİNİ"; direction_label="MONTHLY DIRECTION / PRIOR"; origin_label="CANONICAL ORIGIN"\n'
          if old in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('EMPTY_HERO_LABEL_ANCHOR_MISSING')

          replacements={
            "<div class='gc-kicker'>GELECEK AY TAHMİNİ</div>":"<div class='gc-kicker'>{esc(hero_kicker)}</div>",
            "<div class='gc-hero-label'>MONTHLY DIRECTION / PRIOR</div>":"<div class='gc-hero-label'>{esc(direction_label)}</div>",
            "<div class='gc-hero-label'>CANONICAL ORIGIN</div>":"<div class='gc-hero-label'>{esc(origin_label)}</div>",
          }
          for a,b in replacements.items():
              if a in text:
                  text=text.replace(a,b,1); changed=True
              elif b not in text:
                  raise RuntimeError('HERO_HTML_LABEL_ANCHOR_MISSING:'+a)

          if changed:
              p.write_text(text,encoding='utf-8')
              print('V130_REPLAY_SEMANTIC_LABEL_PATCH_APPLIED')
          else:
              print('V130_REPLAY_SEMANTIC_LABEL_ALREADY_APPLIED')
          PY
      - name: Compile and deterministic tests
        run: |
          grep -Fq '**Manifest version:** 1.30' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'REPLAY · PROSPECTIVE DEĞİL' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'REPLAY ORIGIN' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'Eylül sonu → Ekim 2026 H=1' gold_axis_2026/apps/gold_control_mobile_v1.py
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py gold_axis_2026/apps/forecast_source.py gold_axis_2026/apps/engine_observability_contract.py
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_engine_observability_contract.py test_aug31_state_replay_source.py test_production_display_snapshot.py
      - name: Read-only production evidence audit
        run: |
          test -n "$NEON_DATABASE_URL"
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import os
          from forecast_source import TRACK_HISTORICAL_REPLAY, fetch_latest_expert_forecasts
          from runtime_source import fetch_runtime_observability
          url=os.environ['NEON_DATABASE_URL']
          rows=fetch_latest_expert_forecasts(url,TRACK_HISTORICAL_REPLAY)
          by={r['expert_id']:r for r in rows}
          assert set(by)=={'MOMENTUM_3M','RANDOM_WALK'}
          assert abs(float(by['MOMENTUM_3M']['forecast_value'])-4345.814584037808)<1e-9
          assert abs(float(by['RANDOM_WALK']['forecast_value'])-4397.305673870967)<1e-9
          assert all(r['evidence_class']=='HISTORICAL_REPLAY' and not r['canonical_authority'] for r in rows)
          rt=fetch_runtime_observability(url)
          dist={}
          for r in rt['runtime']: dist[r['runtime_status']]=dist.get(r['runtime_status'],0)+1
          assert dist=={'ACTIVE':4,'WAITING':3,'BLOCKED':5},dist
          assert sum(1 for r in rt['runtime'] if r.get('direction_vote_permitted') is True)==3
          print('V130_REPLAY_SEMANTIC_RUNTIME_AUDIT_PASS')
          PY
      - name: DB-backed 390x844 visual proof
        run: |
          rm -rf /tmp/v130_sep2 && mkdir -p /tmp/v130_sep2
          streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8552 --server.address 127.0.0.1 >/tmp/v130_sep2.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8552/_stcore/health >/dev/null && break; sleep 1; done
          python - <<'PY'
          import re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/v130_sep2')
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
            page.goto('http://127.0.0.1:8552',wait_until='domcontentloaded',timeout=60000)
            page.get_by_text('GOLD CONTROL',exact=False).first.wait_for(state='visible',timeout=45000)
            nav=page.locator('.st-key-gc_main_nav label[data-testid="stRadioOption"]')
            nav.filter(has_text=re.compile('Tahmin',re.I)).first.click()
            page.get_by_text('EYLÜL 2026 H=1 REPLAY',exact=True).first.wait_for(state='visible',timeout=20000)
            body=page.locator('body').inner_text()
            for x in ('4,345.81 / 4,397.31 USD','REPLAY · PROSPECTIVE DEĞİL','STATE BAĞLAMI','REPLAY ORIGIN','EYLÜL 2026 HISTORICAL REPLAY'):
              assert x in body,x
            assert 'CANONICAL ORIGIN' not in body.split('GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI')[0]
            page.screenshot(path=str(out/'tahmin_september_replay_top_390x844.png'),full_page=False)
            nav.filter(has_text=re.compile('Görünüm',re.I)).first.click()
            page.get_by_text('TÜM TAHMİN, YÖN, EVENT, REJİM VE RİSK MOTORLARI',exact=True).first.wait_for(state='visible',timeout=20000)
            body=page.locator('body').inner_text()
            for x in ('Eylül sonu → Ekim 2026 H=1','exact executable runner','authorized persisted monthly price reference','exact forward BOCPD'):
              assert x in body,x
            page.get_by_text('TÜM TAHMİN, YÖN, EVENT, REJİM VE RİSK MOTORLARI',exact=True).first.evaluate("el=>el.scrollIntoView({block:'start'})")
            page.wait_for_timeout(300)
            page.screenshot(path=str(out/'gorunum_motor_timing_390x844.png'),full_page=False)
            b.close()
          print('V130_REPLAY_SEMANTIC_VISUAL_PASS')
          PY
          kill $PID || true; wait $PID || true
      - name: Commit validated semantic-label change
        run: |
          if git diff --quiet -- gold_axis_2026/apps/gold_control_mobile_v1.py; then
            echo 'V130_REPLAY_SEMANTIC_HEAD_ALREADY_VALIDATED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/apps/gold_control_mobile_v1.py
          git commit -m 'gold-control: label September replay origin explicitly'
          git push origin HEAD:gold-control-v130-september-replay-motor-visibility
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v130-september-replay-motor-visibility-v2
          path: /tmp/v130_sep2/*.png
          if-no-files-found: error
          retention-days: 30
