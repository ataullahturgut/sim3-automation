name: Gold MIDAS ELMFIS Baseline V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_elmfis_baseline_v1.py
      - .github/workflows/gold-midas-elmfis-baseline-v1.yml

permissions:
  contents: read

jobs:
  elmfis-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_msvr_successor_v1.py gold_axis_2026/tools/vw_midas_elmfis_baseline_v1.py
      - name: Run ELMFIS baseline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_elmfis_baseline_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_elmfis_baseline_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['random_split']=='NONE'
          assert r['authority']['2025_role']=='LOCKED_TRANSPORT_NOT_SELECTION'
          assert r['authority']['2026_role']=='RETROSPECTIVE_STRESS_NOT_SELECTION'
          assert r['authority']['target_month_in_training'] is False
          assert r['authority']['authority_invariants_before']==r['authority']['authority_invariants_after']
          assert r['canonical_elmfis']['rules']==5
          assert 'sum_abs_error' in r['dev']['metrics']
          assert 'direction_accuracy_pct' in r['dev']['metrics']
          print('OUTPUT_GATE=PASS')
          print(json.dumps({
            'dev':r['dev']['metrics'],
            'transport_2025':r['transport_2025']['metrics'],
            'stress_2026':r['stress_2026']['metrics']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-elmfis-baseline-v1-${{ github.sha }}
          path: vw_midas_elmfis_baseline_v1_result.json
          retention-days: 30
