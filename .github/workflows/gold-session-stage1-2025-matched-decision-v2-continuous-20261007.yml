name: Gold Session Stage1 2025 Matched Decision V2 Continuous 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_stage1_2025_matched_decision_v2_continuous_20261007.py'
      - '.github/workflows/gold-session-stage1-2025-matched-decision-v2-continuous-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'
      - run: python gold_axis_2026/tools/gold_session_stage1_2025_matched_decision_v2_continuous_20261007.py
      - name: Record authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_STAGE1_2025_DECISION_V2_CONTINUOUS_OUT/summary.json gold_axis_2026/GOLD_SESSION_STAGE1_2025_MATCHED_DECISION_V2_CONTINUOUS_SUMMARY_2026-10-07.json
          cp gold_axis_2026/SESSION_STAGE1_2025_DECISION_V2_CONTINUOUS_OUT/matched_metrics.csv gold_axis_2026/GOLD_SESSION_STAGE1_2025_MATCHED_METRICS_V2_CONTINUOUS_2026-10-07.csv
          cp gold_axis_2026/SESSION_STAGE1_2025_DECISION_V2_CONTINUOUS_OUT/decisions.csv gold_axis_2026/GOLD_SESSION_STAGE1_2025_MATCHED_DECISIONS_V2_CONTINUOUS_2026-10-07.csv
          git add gold_axis_2026/GOLD_SESSION_STAGE1_2025_MATCHED_*_V2_CONTINUOUS_*
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected matched Stage-1 2025 decision"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
