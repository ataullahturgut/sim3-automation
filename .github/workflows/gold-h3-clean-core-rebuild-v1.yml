name: Gold H3 Clean Core Rebuild
# integrity-clean rerun v2

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_clean_core_rebuild_v1.py'
      - '.github/workflows/gold-h3-clean-core-rebuild-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT_DIR: gold_h3_clean_core_rebuild_out
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'lightgbm>=4,<5' 'xgboost>=3,<4' 'psycopg[binary]>=3.2,<4' requests
      - name: Resolve latest R2 readiness artifact
        id: aid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gold-short-horizon-global-xau-readiness-r2&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$AID"
          echo "aid=$AID" >> "$GITHUB_OUTPUT"
      - name: Run clean core rebuild
        env:
          READINESS_ARTIFACT: ${{ steps.aid.outputs.aid }}
        run: python gold_axis_2026/tools/gold_h3_clean_core_rebuild_v1.py
      - name: Commit clean evidence
        shell: bash
        run: |
          cp "$OUT_DIR/CLEAN_CORE_RESULT.md" gold_axis_2026/GOLD_H3_CLEAN_CORE_RESULT_2026-10-03.md
          cp "$OUT_DIR/clean_core_summary.json" gold_axis_2026/GOLD_H3_CLEAN_CORE_SUMMARY_2026-10-03.json
          cp "$OUT_DIR/clean_core_metrics.csv" gold_axis_2026/GOLD_H3_CLEAN_CORE_METRICS_2026-10-03.csv
          cp "$OUT_DIR/clean_aurora_predictions.csv" gold_axis_2026/GOLD_H3_CLEAN_AURORA_PREDICTIONS_2026-10-03.csv
          cp "$OUT_DIR/clean_aurora_comparison.csv" gold_axis_2026/GOLD_H3_CLEAN_AURORA_COMPARISON_2026-10-03.csv
          cp "$OUT_DIR/clean_aurora_switches.csv" gold_axis_2026/GOLD_H3_CLEAN_AURORA_SWITCHES_2026-10-03.csv
          cp "$OUT_DIR/clean_nova_a1_predictions.csv" gold_axis_2026/GOLD_H3_CLEAN_NOVA_A1_PREDICTIONS_2026-10-03.csv
          cp "$OUT_DIR/clean_expert_ledger.csv" gold_axis_2026/GOLD_H3_CLEAN_EXPERT_LEDGER_2026-10-03.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_CLEAN_*_2026-10-03.*
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild H3 core after price integrity correction"
            git pull --rebase origin gold-midas-headswap-v1-20260925
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-clean-core-rebuild
          path: gold_h3_clean_core_rebuild_out/
          retention-days: 90
