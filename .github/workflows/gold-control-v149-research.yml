name: Gold Control V1.49 research governance

on:
  pull_request:
    paths:
      - "gold_axis_2026/**"
      - ".github/workflows/gold-control-v149-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen test dependencies
        run: >-
          python -m pip install
          numpy==2.3.5
          pandas==2.2.3
          scipy==1.17.0
          scikit-learn==1.8.0
          pytest==9.0.2
      - name: Run V1.49 PIT and governance tests
        run: python -m pytest -q gold_axis_2026/tests/test_v149_research_governance.py
