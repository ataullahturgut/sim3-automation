name: GOLD Monthly H1 Family Migration - PLS1 First
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-h1-family-migration-pls1-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: PLS1 frozen scientific gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.4,<2'
      - name: Model+source parity smoke across DEV, TEST and 2026
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          test -n "$NEON_DATABASE_URL" || (echo MISSING_NEON_SECRET && exit 1)
          python gold_axis_2026/tools/gold_monthly_h1_family_replay_pls1_v1.py \
            --targets 2022-04,2025-01,2026-09 \
            --output /tmp/pls1-preflight.json
      - name: Enforce unchanged PLS1 chronology and independent source gate
        run: |
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/pls1-preflight.json'))
          assert r["model"]=="PLS1_V1_ALL4" and len(r["rows"])==3
          assert r["source_contract"]=="NEON_STAKTRAKR_GPR_V2"
          assert r["original_solver_modified"] is False
          assert r["database_writes"]=="NONE"
          for x in r["rows"]:
              assert x["inner_validation_rows"]==12
              assert x["training_last"]==x["origin_month"]
              assert len(x["origin_feature_sha256"])==64
              assert len(x["gpr_source_commit_sha"])==40
              assert math.isfinite(x["forecast_xau_average"])
          print("PLS1_MIGRATION_SMOKE_PASS_3_OF_3")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-h1-pls1-preflight
          path: /tmp/pls1-preflight.json
          retention-days: 90
  historical:
    name: PLS1 original DEV 33 + TEST 12 + STRESS 9
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.4,<2'
      - name: Read only 54-month true original PLS1 replay, no cherry-picked months
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          test -n "$NEON_DATABASE_URL"
          python gold_axis_2026/tools/gold_monthly_h1_family_replay_pls1_v1.py \
            --targets "2022-04,2022-05,2022-06,2022-07,2022-08,2022-09,2022-10,2022-11,2022-12,2023-01,2023-02,2023-03,2023-04,2023-05,2023-06,2023-07,2023-08,2023-09,2023-10,2023-11,2023-12,2024-01,2024-02,2024-03,2024-04,2024-05,2024-06,2024-07,2024-08,2024-09,2024-10,2024-11,2024-12,2025-01,2025-02,2025-03,2025-04,2025-05,2025-06,2025-07,2025-08,2025-09,2025-10,2025-11,2025-12,2026-01,2026-02,2026-03,2026-04,2026-05,2026-06,2026-07,2026-08,2026-09" \
            --output /tmp/pls1-full-54.json
      - name: Freeze period comparisons and reject incomplete/misordered output
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          r=json.load(open('/tmp/pls1-full-54.json'))
          rows=r['rows']
          assert len(rows)==54
          assert len(set(x['target_month'] for x in rows))==54
          assert rows[0]['target_month']=='2022-04' and rows[-1]['target_month']=='2026-09'
          phases={"DEV_2022_2024":rows[:33],"TEST_2025":rows[33:45],"STRESS_2026_JAN_SEP":rows[45:54]}
          assert [len(x) for x in phases.values()]==[33,12,9]
          result={"model":"PLS1_V1_ALL4","status":"COMPLETE_54_OF_54",
                  "original_frozen_model":True,
                  "data_contract":"NEON_STAKTRAKR_GPR_V2",
                  "source_firstprint_certified":False,"periods":{}}
          for p,rr in phases.items():
              n=len(rr);sae=sum(float(x['absolute_error']) for x in rr)
              mape=sum(float(x['absolute_percentage_error']) for x in rr)/n
              dire=sum(bool(x['direction_correct']) for x in rr)
              result['periods'][p]={"n":n,"sum_absolute_error_usd_oz":sae,
                "mape_pct":mape,"direction_correct":dire,"direction_pct":100*dire/n}
              print("PLS1_REPLAY_RESULT",p, "n=",n,"sumAE=",format(sae,'.8f'),
                "MAPE=",format(mape,'.8f'),"direction=",str(dire)+"/"+str(n))
          Path("/tmp/pls1-54-comparison.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print("PLS1_ALL_54_FROZEN_REPLAY_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-h1-pls1-full-54-original
          path: /tmp/pls1-full-54.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-h1-pls1-period-metrics
          path: /tmp/pls1-54-comparison.json
          retention-days: 90
