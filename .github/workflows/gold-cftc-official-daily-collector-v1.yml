name: Gold official CFTC GC SI daily collector (research source)
on:
  schedule:
    # Publish normally Fridays; daily recheck guards holidays and delays.
    - cron: '10 10 * * *'
    - cron: '10 22 * * *'
  workflow_dispatch:
  push:
    branches: [feature/gold-v22-cftc-daily-research-shadow-20261030]
    paths:
      - .github/workflows/gold-cftc-official-daily-collector-v1.yml
permissions:
  contents: read
concurrency:
  group: gold-official-cftc-gc-si-research-ingest-v1
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Append official CFTC GC/SI with first-capture provenance
        run: |
          python gold_axis_2026/data_pipeline/gold_cftc_official_futuresonly_gc_si_ingest_v1.py \
            --write --out official_cftc_gc_si_report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cftc-gc-si-research-source-v1
          path: official_cftc_gc_si_report.json
          retention-days: 30
          if-no-files-found: warn
