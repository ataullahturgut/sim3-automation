name: Gold Monthly ChHHO Strict Features Full DEV Replay

on:
  push:
    branches: [research-monthly-asof-label-free-20261023]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_strict_features_replay_v1.py
      - .github/workflows/gold-monthly-chhho-strict-features-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  frozen-optimizer:
    name: Strict X and anchor 33-fold optimized research arm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scientific dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: No Neon access
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download immutable authorized DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > frozen-snapshot.zip
          unzip -q frozen-snapshot.zip -d frozen_snapshot
          test -s frozen_snapshot/gold_monthly_dev_snapshot_v1.json
      - name: Syntax checks and source guard tests
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_strict_features_replay_v1.py
          python -m unittest discover -s gold_axis_2026/tools/tests -p 'test_monthly_origin_anchor_proxy_v1.py' -v
          python -m unittest discover -s gold_axis_2026/tools/tests -p 'test_monthly_label_free_forecast_v1.py' -v
      - name: Full ChHHO unchanged optimizer 33-month strict-source feature replay
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_strict_features_replay_v1.py \
            --snapshot frozen_snapshot/gold_monthly_dev_snapshot_v1.json \
            --output GOLD_MONTHLY_CHHHO_STRICT_FEATURE_REPLAY_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-chhho-strict-feature-replay-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_STRICT_FEATURE_REPLAY_V1.json
          if-no-files-found: error
          retention-days: 90
