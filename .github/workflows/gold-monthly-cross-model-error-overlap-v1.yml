name: Gold Monthly Cross Model Error Overlap V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_cross_model_error_overlap_v1.py
      - .github/workflows/gold-monthly-cross-model-error-overlap-v1.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3'
      - name: Download authoritative per-origin artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          for id in 10911447422 10915270480 10974037676 10958140025 10929616178 10979300075 10978660065 10978391582 10978271647 10978210827 10977234072; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "inputs/${id}.zip"
            mkdir -p "inputs/${id}"
            unzip -q "inputs/${id}.zip" -d "inputs/${id}"
          done
      - name: Run cross-model error overlap audit
        run: |
          python gold_axis_2026/tools/gold_monthly_cross_model_error_overlap_v1.py \
            --reference-rows gold_axis_2026/evidence/rbfnn_cross_family/reference_rows.json \
            --inputs-dir inputs \
            --output-json GOLD_MONTHLY_CROSS_MODEL_ERROR_OVERLAP_V1_2026-09-29.json \
            --output-md GOLD_MONTHLY_CROSS_MODEL_ERROR_OVERLAP_V1_2026-09-29.md
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-cross-model-error-overlap-${{ github.sha }}
          path: |
            GOLD_MONTHLY_CROSS_MODEL_ERROR_OVERLAP_V1_2026-09-29.json
            GOLD_MONTHLY_CROSS_MODEL_ERROR_OVERLAP_V1_2026-09-29.md
          if-no-files-found: error
          retention-days: 90
