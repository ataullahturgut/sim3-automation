name: Gold Control V1.61 literature short-horizon thesis research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v161_thesis/**"
      - "gold_axis_2026/tests/test_v161_literature_short_horizon.py"
      - "gold_axis_2026/GOLD_CONTROL_V161_LITERATURE_SHORT_HORIZON_METHOD_MEMO_2026-09-12.md"
      - ".github/workflows/gold-control-v161-literature-short-horizon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literature-short-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 requests==2.32.5 pytest==8.4.2
      - name: Test V1.61 chronology and interpretation locks
        run: python -m pytest -q gold_axis_2026/tests/test_v161_literature_short_horizon.py
      - name: Run V1.61 frozen literature short-horizon audit
        run: python -m gold_axis_2026.v161_thesis.run_v161_literature_short_horizon
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v161-literature-short-horizon-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v161_thesis/
