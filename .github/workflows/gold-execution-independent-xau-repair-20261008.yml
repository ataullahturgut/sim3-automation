name: Gold Execution Independent XAU 2025 Repair Candidate
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_histdata_independent_2025_2026_20261008.py'
      - '.github/workflows/gold-execution-independent-xau-repair-20261008.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-independent-xau-repair-20261008
  cancel-in-progress: false
jobs:
  independent-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'histdata-fetcher>=0.1' 'pandas>=2.2,<3' 'numpy>=2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Fetch independent candidate into private Neon
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_histdata_independent_2025_2026_20261008.py
          python gold_axis_2026/tools/gold_execution_histdata_independent_2025_2026_20261008.py
      - name: Commit only evidence no raw licensed prices
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_HISTDATA_INDEPENDENT_2025_2026_SOURCE_AUDIT_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_HISTDATA_INDEPENDENT_2025_2026_SOURCE_AUDIT_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record independent 2025/26 spot gold reconstruction evidence'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
