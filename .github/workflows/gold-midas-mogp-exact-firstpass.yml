name: Gold MIDAS MOGP Exact Firstpass

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_mogp_exact_firstpass.py
      - .github/workflows/gold-midas-mogp-exact-firstpass.yml

permissions:
  contents: read

jobs:
  mogp-firstpass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'torch>=2.4,<3' 'gpytorch>=1.13,<2'
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_mogp_exact_firstpass.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-mogp-exact-firstpass-${{ github.sha }}
          path: vw_midas_mogp_exact_firstpass.json
          retention-days: 30
