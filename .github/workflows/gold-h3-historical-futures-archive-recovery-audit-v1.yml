name: Gold H3 Historical Futures Archive Recovery Audit

on:
  push:
    branches: [gold-h3-oct5-diagnostic-nowcast-20261005]
    paths:
      - 'gold_axis_2026/tools/gold_h3_historical_futures_archive_recovery_audit_v1.py'
      - '.github/workflows/gold-h3-historical-futures-archive-recovery-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-oct5-diagnostic-nowcast-20261005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'requests>=2.31,<3'
      - run: python gold_axis_2026/tools/gold_h3_historical_futures_archive_recovery_audit_v1.py
      - name: Record archive audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             gold_axis_2026/GOLD_H3_HISTORICAL_FUTURES_ARCHIVE_RECOVERY_AUDIT_2026-10-05.json             gold_axis_2026/GOLD_H3_HISTORICAL_FUTURES_ARCHIVE_RECOVERY_AUDIT_2026-10-05.md
          if ! git diff --cached --quiet; then
            git commit -m "Record historical futures archive recovery audit"
            git pull --rebase origin gold-h3-oct5-diagnostic-nowcast-20261005
            git push origin HEAD:gold-h3-oct5-diagnostic-nowcast-20261005
          fi
