name: Gold V41 V22 Early Watch vs Cost-Sensitive Timed Exits Research
on:
  workflow_dispatch:
  push:
    branches: [research/gold-v41-v22-sequential-exit-profit-retention-20261030]
    paths:
      - '.github/workflows/gold-v41-watch-vs-exit-execution-research.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v41_v22_watch_sequential_exit_costs.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v41_v22_watch_sequential_exit_costs.py'
permissions:
  contents: read
jobs:
  replay-on-real-historical-neon:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Anti-lookahead, fee and chronological safety tests
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v41_v22_watch_sequential_exit_costs.py -v
      - name: Install database-only driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Confirm read-only Neon source
        run: test -n "$NEON_DATABASE_URL"
      - name: Freeze 2025 parameter selection, replay 2026 with actual 15m price bars
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v41_v22_watch_sequential_exit_costs \
            --out gold-v41-watch-exit-next-bar-costs.json
      - name: Save fully auditable portfolio path
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v41-watch-vs-exit-15m-net-returns
          path: gold-v41-watch-exit-next-bar-costs.json
          retention-days: 30
          if-no-files-found: warn
