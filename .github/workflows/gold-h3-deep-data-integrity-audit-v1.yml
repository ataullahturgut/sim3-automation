name: Gold H3 Deep Data Integrity Audit

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_deep_data_integrity_audit_v1.py'
      - '.github/workflows/gold-h3-deep-data-integrity-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT_DIR: gold_h3_integrity_deep_audit_out
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - run: test -n "$NEON_DATABASE_URL"
      - run: python gold_axis_2026/tools/gold_h3_deep_data_integrity_audit_v1.py
      - name: Commit audit evidence
        shell: bash
        run: |
          cp "$OUT_DIR/DEEP_DATA_INTEGRITY_AUDIT.md" gold_axis_2026/GOLD_H3_DEEP_DATA_INTEGRITY_AUDIT_2026-10-03.md
          cp "$OUT_DIR/deep_integrity_summary.json" gold_axis_2026/GOLD_H3_DEEP_DATA_INTEGRITY_SUMMARY_2026-10-03.json
          cp "$OUT_DIR/frozen_vs_neon_mismatches.csv" gold_axis_2026/GOLD_H3_FROZEN_VS_NEON_MISMATCHES_2026-10-03.csv
          cp "$OUT_DIR/frozen_only_dates.csv" gold_axis_2026/GOLD_H3_FROZEN_ONLY_DATES_2026-10-03.csv
          cp "$OUT_DIR/neon_only_dates.csv" gold_axis_2026/GOLD_H3_NEON_ONLY_DATES_2026-10-03.csv
          cp "$OUT_DIR/revision_chronology.csv" gold_axis_2026/GOLD_H3_DB_REVISION_CHRONOLOGY_2026-10-03.csv
          cp "$OUT_DIR/revision_summary.csv" gold_axis_2026/GOLD_H3_DB_REVISION_SUMMARY_2026-10-03.csv
          cp "$OUT_DIR/hourly_spike_reversion_candidates.csv" gold_axis_2026/GOLD_H3_HOURLY_SPIKE_REVERSION_CANDIDATES_2026-10-03.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_DEEP_DATA_INTEGRITY_*_2026-10-03.* gold_axis_2026/GOLD_H3_FROZEN_*_2026-10-03.csv gold_axis_2026/GOLD_H3_NEON_ONLY_DATES_2026-10-03.csv gold_axis_2026/GOLD_H3_DB_REVISION_*_2026-10-03.csv gold_axis_2026/GOLD_H3_HOURLY_SPIKE_REVERSION_CANDIDATES_2026-10-03.csv
          if ! git diff --cached --quiet; then
            git commit -m "Deep audit H3 database and frozen source integrity"
            git pull --rebase origin gold-midas-headswap-v1-20260925
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-deep-data-integrity-audit
          path: gold_h3_integrity_deep_audit_out/
          retention-days: 90
