name: Gold Control V1.30 Mobile QA Replay Alignment

on:
  push:
    branches: [gold-control-v130-mobile-qa-replay-alignment]
    paths:
      - '.github/workflows/gold-control-v130-mobile-qa-replay-alignment.yml'
      - 'gold_axis_2026/apps/mobile_viewport_qa.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: gold-control-v130-mobile-qa-replay-alignment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked app and browser runtime
        run: |
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Align stale browser markers with governed UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/apps/mobile_viewport_qa.py')
          text=p.read_text(encoding='utf-8')
          changed=False
          old='"MEVCUT KAYITLI DURUM","YÖN MOTORLARI ÖZETİ · STORED CONTEXT","TÜM TAHMİN VE YÖN MOTORLARI",'
          new='"MEVCUT KAYITLI DURUM","YÖN MOTORLARI ÖZETİ · STORED CONTEXT","TÜM TAHMİN, YÖN, EVENT, REJİM VE RİSK MOTORLARI",'
          if old in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('GORUNUM_MARKER_ANCHOR_MISSING')
          old='ordered(page, "GORUNUM", ["YÖN MOTORLARI ÖZETİ · STORED CONTEXT","TÜM TAHMİN VE YÖN MOTORLARI","SİNYAL ÖZETİ"'
          new='ordered(page, "GORUNUM", ["YÖN MOTORLARI ÖZETİ · STORED CONTEXT","TÜM TAHMİN, YÖN, EVENT, REJİM VE RİSK MOTORLARI","SİNYAL ÖZETİ"'
          if old in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('GORUNUM_ORDER_ANCHOR_MISSING')
          old='''        markers(page, "TAHMIN", ["GELECEK AY TAHMİNİ","MULTI-EXPERT MONTHLY FORECAST ENGINE"'''
          new='''        tahmin_body=body(page)\n        forecast_hero_marker="EYLÜL 2026 H=1 REPLAY" if "EYLÜL 2026 H=1 REPLAY" in tahmin_body else "GELECEK AY TAHMİNİ"\n        markers(page, "TAHMIN", [forecast_hero_marker,"MULTI-EXPERT MONTHLY FORECAST ENGINE"'''
          if old in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('TAHMIN_MARKER_ANCHOR_MISSING')
          old='ordered(page, "TAHMIN", ["GELECEK AY TAHMİNİ","GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI"'
          new='ordered(page, "TAHMIN", [forecast_hero_marker,"GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI"'
          if old in text:
              text=text.replace(old,new,1); changed=True
          elif new not in text:
              raise RuntimeError('TAHMIN_ORDER_ANCHOR_MISSING')
          if changed:
              p.write_text(text,encoding='utf-8')
              print('V130_MOBILE_QA_REPLAY_ALIGNMENT_PATCH_APPLIED')
          else:
              print('V130_MOBILE_QA_REPLAY_ALIGNMENT_ALREADY_APPLIED')
          PY
      - name: Compile and run deterministic contracts
        run: |
          python -m py_compile gold_axis_2026/apps/mobile_viewport_qa.py gold_axis_2026/apps/gold_control_mobile_v1.py
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_engine_observability_contract.py test_production_display_snapshot.py test_aug31_state_replay_source.py
      - name: Run full production-backed mobile viewport QA
        run: |
          rm -rf /tmp/gold_mobile_v130_qa
          streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8560 --server.address 127.0.0.1 >/tmp/gold_mobile_v130_browser.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8560/_stcore/health >/dev/null && break; sleep 1; done
          python gold_axis_2026/apps/mobile_viewport_qa.py --url http://127.0.0.1:8560 --out /tmp/gold_mobile_v130_qa
          kill $PID || true; wait $PID || true
          if grep -Eq 'ImportError|ModuleNotFoundError|Traceback \(most recent call last\)' /tmp/gold_mobile_v130_browser.log; then cat /tmp/gold_mobile_v130_browser.log; exit 1; fi
          echo 'V130_MOBILE_QA_REPLAY_ALIGNMENT_BROWSER_PASS'
      - name: Commit validated QA alignment
        run: |
          if git diff --quiet -- gold_axis_2026/apps/mobile_viewport_qa.py; then
            echo 'V130_MOBILE_QA_HEAD_ALREADY_VALIDATED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/apps/mobile_viewport_qa.py
          git commit -m 'ci: accept governed replay hero and expanded motor inventory'
          git push origin HEAD:gold-control-v130-mobile-qa-replay-alignment
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v130-mobile-qa-replay-alignment
          path: /tmp/gold_mobile_v130_qa/*.png
          if-no-files-found: error
          retention-days: 30
