name: Gold BOCPD authority cleanup

on:
  push:
    branches:
      - gold-bocpd-hourly-b2-selective-20260916
    paths:
      - '.github/workflows/gold-bocpd-authority-cleanup-20260917.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply BOCPD authority cleanup
        run: python gold_axis_2026/tools/_cleanup_bocpd_authority_20260917.py
      - name: Verify retained source surface
        run: |
          test -f gold_axis_2026/tools/bocpd_hourly_b2_baseline_r2_pre2025.py
          test -f gold_axis_2026/tools/bocpd_hourly_b2_adaptive_hazard_pre2025.py
          test -f gold_axis_2026/GOLD_CONTROL_BOCPD_B2_BASELINE_R2_PRE2025_RESULT_2026-09-17.md
          test -f gold_axis_2026/GOLD_CONTROL_BOCPD_B2_ADAPTIVE_HAZARD_V5_PRE2025_RESULT_2026-09-16.md
          test ! -f gold_axis_2026/tools/bocpd_hourly_b2_successor_pre2025.py
          test ! -f gold_axis_2026/tools/bocpd_hourly_candidate_b2_v1.py
          test ! -f gold_axis_2026/tools/bocpd_return_successor_v1.py
          python -m py_compile gold_axis_2026/tools/bocpd_hourly_b2_baseline_r2_pre2025.py
          python -m py_compile gold_axis_2026/tools/bocpd_hourly_b2_adaptive_hazard_pre2025.py
      - name: Commit cleaned authority surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No cleanup changes'; exit 1; }
          git commit -m 'Retain only BOCPD V5 and baseline R2 authority'
          git push origin HEAD:gold-bocpd-hourly-b2-selective-20260916
