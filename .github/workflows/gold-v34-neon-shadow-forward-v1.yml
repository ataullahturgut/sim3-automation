name: Gold V34 Neon four-metal actual forward runner (research shadow)
on:
  push:
    branches: [research/gold-v34-actual-neon-shadow-20261030]
    paths:
      - 'gold_axis_2026/research/case_control_v13/gold_v34_neon_staktrakr_forward_shadow_v1.py'
      - '.github/workflows/gold-v34-neon-shadow-forward-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-original-v34-on-neon:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original training dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Freeze original source code syntax
        run: python -m py_compile gold_axis_2026/research/case_control_v13/gold_v34_neon_staktrakr_forward_shadow_v1.py
      - name: Verify original historical forward parity
        run: python gold_axis_2026/research/case_control_v13/gold_v34_forward_parity_v1.py --mode historical-parity --out v34_parity_output.json
      - name: Compute actual V34 retro week Oct 26 with Neon overlap proof
        run: python gold_axis_2026/research/case_control_v13/gold_v34_neon_staktrakr_forward_shadow_v1.py --mode retrospective --out v34_retro_oct26.json
      - name: Exercise actual forward Nov 2 availability gate (NO WRITE)
        run: python gold_axis_2026/research/case_control_v13/gold_v34_neon_staktrakr_forward_shadow_v1.py --mode forward --out v34_forward_nov02_availability.json
      - name: Save data and model execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v34-neon-fourmetal-forward-shadow-v1
          path: |
            v34_parity_output.json
            v34_retro_oct26.json
            v34_forward_nov02_availability.json
          retention-days: 30
          if-no-files-found: warn
