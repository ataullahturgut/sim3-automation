name: Gold Monthly Boosting E4 Final Robustness V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-boosting-e4-final-robustness-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boosting-e4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'scipy>=1.13,<2'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'

      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_e4_final_robustness_v1.py

      - name: Run E4
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_e4_final_robustness_v1.py

      - name: Scientific gate
        run: |
          python - <<'PY'
          import json

          r=json.load(open('gold_monthly_boosting_e4_final_robustness_v1_result.json'))
          c=r['contract']

          assert r['scope']=='BOOSTING_E4_FINAL_ROBUSTNESS_V1'
          assert c['dev']=='2022-04..2024-12'
          assert c['dev_n']==33
          assert c['principal_candidates']==['CATBOOST_PRICE','FULL5_MEDIAN']
          assert c['robustness_role']=='DIAGNOSTIC_ONLY_NO_POSTHOC_RESELECTION'
          assert c['leave_one_component_out_role']=='DIAGNOSTIC_ONLY'
          assert c['random_split']=='NONE'
          assert c['database']=='READ_ONLY'
          assert c['2025_role']=='NOT_OPENED_NOT_EVALUATED'
          assert c['2026_role']=='QUARANTINED_NOT_USED'
          assert r['authority_invariants_before']==r['authority_invariants_after']

          p=r['principal']
          assert abs(p['CATBOOST_PRICE']['metrics']['sum_abs_error']-1460.433935309605)<1e-8
          assert p['CATBOOST_PRICE']['metrics']['direction_correct']==20
          assert abs(p['FULL5_MEDIAN']['metrics']['sum_abs_error']-1484.731330609916)<1e-8
          assert p['FULL5_MEDIAN']['metrics']['direction_correct']==23

          pair=r['pairwise']
          assert pair['CATBOOST_PRICE_wins']+pair['FULL5_MEDIAN_wins']+pair['ties']==33
          assert len(pair['rows'])==33

          d=r['direction_rescue_loss']
          assert d['rescue']+d['loss']+d['both_correct']+d['both_wrong']==33
          assert (23-20)==(d['rescue']-d['loss'])

          for k,v in r['worst_month_sensitivity'].items():
              assert v['remaining_n']==32
              assert abs(v['remaining_mae']*32-v['remaining_sum_abs_error'])<1e-8

          loo=r['leave_one_origin']
          assert loo['CATBOOST_PRICE_wins']+loo['FULL5_MEDIAN_wins']+loo['ties']==33
          assert len(loo['rows'])==33
          assert loo['selection_evidence'] is False

          loco=r['leave_one_component_out']
          assert set(loco)=={'CATBOOST_PRICE','CATBOOST_BALANCED','GBRT','LIGHTGBM','XGB_DIRECTION'}
          for v in loco.values():
              assert v['metrics']['n']==33
              assert v['selection_evidence'] is False

          assert r['e4_gate']=='PASS'
          assert r['e5_roles']=={
              'PRICE':'CATBOOST_PRICE',
              'BALANCE_DIRECTION':'FULL5_MEDIAN',
          }

          print('BOOSTING_E4_FINAL_ROBUSTNESS_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-e4-final-robustness-v1
          path: |
            gold_monthly_boosting_e4_final_robustness_v1_result.json
            gold_axis_2026/GOLD_MONTHLY_BOOSTING_E4_FINAL_ROBUSTNESS_RESULT_2026-09-28.md
          if-no-files-found: error

      - name: Commit result report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_MONTHLY_BOOSTING_E4_FINAL_ROBUSTNESS_RESULT_2026-09-28.md
          if git diff --cached --quiet; then
            echo "No result report change to commit"
          else
            git commit -m "Record Boosting E4 final robustness result"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
