name: Gold Control Macro V3 CPI Official Release Probe

on:
  push:
    branches: [gold-control-macro-event-successor-v3]
    paths: ['.github/workflows/gold-control-macro-event-v3-cpi-alfred-initial-release-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Query source-published release dates
        run: |
          python - <<'PY'
          import json, os, requests
          key=os.environ['FRED_API_KEY']
          base='https://api.stlouisfed.org/fred'
          r=requests.get(base+'/series/release',params={'series_id':'CPIAUCSL','api_key':key,'file_type':'json'},timeout=60)
          print('series_release_status',r.status_code)
          print(r.text[:2000])
          r.raise_for_status()
          d=r.json(); rel=(d.get('releases') or [])[0]; rid=rel['id']
          q={'release_id':rid,'api_key':key,'file_type':'json','realtime_start':'2016-01-01','realtime_end':'2026-09-08','limit':10000,'sort_order':'asc'}
          rr=requests.get(base+'/release/dates',params=q,timeout=60)
          print('release_dates_status',rr.status_code)
          rr.raise_for_status()
          x=rr.json().get('release_dates',[])
          print(json.dumps({'release':rel,'count':len(x),'first':x[:5],'last':x[-5:]},indent=2))
          PY
