name: Gold Monthly Challenger B B5 PLS1 Metal Ablation

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - gold_axis_2026/tools/gold_monthly_challenger_b_b5_pls1_metal_ablation_v1.py
  workflow_dispatch:

jobs:
  pls1-metal-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen packages
        run: python -m pip install 'numpy==2.4.6' 'psycopg[binary]==3.3.6' 'scikit-learn==1.9.1'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_challenger_b_b5_pls1_metal_ablation_v1.py
      - name: Run B5 PLS1 metal ablation
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_challenger_b_b5_pls1_metal_ablation_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open("gold_monthly_challenger_b_b5_pls1_metal_ablation_v1_result.json"))
          assert p["scientific_gate"] == "PASS"
          assert p["authority_invariants_unchanged"] is True
          assert p["contract"]["random_split"] == "NONE"
          assert p["reproduction_gate"]["pass"] is True
          assert p["contract"]["2025_role"] == "LOCKED_REPORT_ONLY"
          assert p["contract"]["2026_role"] == "QUARANTINED_REPORT_ONLY"
          assert len(p["variants"]) == 6
          print("B5_PLS1_METAL_ABLATION_GATE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-challenger-b-b5-pls1-metal-ablation-v1
          path: gold_monthly_challenger_b_b5_pls1_metal_ablation_v1_result.json
