name: Gold Control V1.49 thesis rich model

on:
  pull_request:
    paths:
      - "gold_axis_2026/v149_thesis/**"
      - "gold_axis_2026/tests/test_v149_rich_short_horizon.py"
      - ".github/workflows/gold-control-v149-thesis-rich-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrospective-rich-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 pytest==8.4.2
      - name: Test chronology, maturity, prefix invariance and determinism
        run: pytest -q gold_axis_2026/tests/test_v149_rich_short_horizon.py
      - name: Run frozen retrospective replay
        run: python -m gold_axis_2026.v149_thesis.run_rich_short_horizon
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v149-thesis-rich-model-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v149_thesis/
