name: Gold H3 FLOW CME Public Probe
on:
  push:
    branches: [gold-h3-flow-v1-20261003]
    paths:
      - 'gold_axis_2026/tools/gold_h3_flow_cme_public_probe_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-flow-v1-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check requests openpyxl pandas
      - run: python gold_axis_2026/tools/gold_h3_flow_cme_public_probe_v1.py
      - name: Commit probe evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_FLOW_CME_PUBLIC_PROBE_2026-10-03.*
          if ! git diff --cached --quiet; then
            git commit -m "Record FLOW-H3 CME public source probe"
            git pull --rebase origin gold-h3-flow-v1-20261003
            git push origin HEAD:gold-h3-flow-v1-20261003
          fi
