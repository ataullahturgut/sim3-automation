name: Gold Original PRAMV 2026 Macro PIT Availability and Vintage Readiness
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_pramv_macro_source_readiness_20261008.py
      - .github/workflows/gold-execution-2026-pramv-macro-pit-readiness.yml
permissions:
  contents: write
concurrency:
  group: gold-pramv-2026-macro-vintage-audit
  cancel-in-progress: false
jobs:
  macro-pit-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Check all source's macro first prints, historical consensus and Fed/BLS release dates without exposing numeric series
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_pramv_macro_source_readiness_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_pramv_macro_source_readiness_20261008.py
      - name: Commit aggregate source availability only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f=gold_axis_2026/GOLD_EXECUTION_2026_PRAMV_MACRO_PIT_SOURCE_READINESS_20261008.json
          if test -f "$f"; then git add "$f"; fi
          git diff --cached --quiet || git commit -m 'State actual 2026 macro source PIT counts and block original M4 if vintage missing'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
