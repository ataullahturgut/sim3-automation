name: Gold Control V1.50 role-hierarchical thesis research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v150_thesis/**"
      - "gold_axis_2026/tests/test_v150_role_hierarchy.py"
      - ".github/workflows/gold-control-v150-role-hierarchy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-only-role-hierarchy:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 pytest==8.4.2
      - name: Test V1.50 chronology and governance invariants
        run: python -m pytest -q gold_axis_2026/tests/test_v150_role_hierarchy.py
      - name: Run V1.50 development-only role hierarchy
        run: python -m gold_axis_2026.v150_thesis.run_v150_development_ci
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v150-role-hierarchy-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v150_thesis/
