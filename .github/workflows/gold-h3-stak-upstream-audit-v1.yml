name: Gold H3 Frozen Stak Upstream Audit
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_stak_upstream_audit_v1.py'
      - '.github/workflows/gold-h3-stak-upstream-audit-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OUT_DIR: gold_h3_stak_upstream_audit_out
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_h3_stak_upstream_audit_v1.py
      - name: Commit evidence
        run: |
          cp "$OUT_DIR/RESULT.md" gold_axis_2026/GOLD_H3_STAK_UPSTREAM_AUDIT_2026-10-03.md
          cp "$OUT_DIR/summary.json" gold_axis_2026/GOLD_H3_STAK_UPSTREAM_AUDIT_SUMMARY_2026-10-03.json
          cp "$OUT_DIR/stak_upstream_flags.csv" gold_axis_2026/GOLD_H3_STAK_UPSTREAM_FLAGS_2026-10-03.csv
          cp "$OUT_DIR/stak_source_type_diagnostics.csv" gold_axis_2026/GOLD_H3_STAK_SOURCE_DIAGNOSTICS_2026-10-03.csv
          cp "$OUT_DIR/stak_2026_multi_extreme_flags.csv" gold_axis_2026/GOLD_H3_STAK_2026_MULTI_EXTREME_FLAGS_2026-10-03.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_STAK_*_2026-10-03.*
          if ! git diff --cached --quiet; then
            git commit -m "Audit frozen StakTrakr upstream source"
            git pull --rebase origin gold-midas-headswap-v1-20260925
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-stak-upstream-audit
          path: gold_h3_stak_upstream_audit_out/
