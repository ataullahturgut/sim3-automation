name: Gold MIDAS Sequence DL Heads V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_sequence_dl_heads_v1.py
      - .github/workflows/gold-midas-sequence-dl-heads-v1.yml

permissions:
  contents: read

jobs:
  sequence-dl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'torch>=2.4,<3'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_sequence_dl_heads_v1.py
      - name: Run sequence DL heads
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_sequence_dl_heads_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_sequence_dl_heads_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['random_split']=='NONE'
          print('OUTPUT_GATE=PASS')
          print(json.dumps({
            'selected_spec':r['selected_spec'],
            'selected_2025':r['selected_result']['transport_2025']['metrics'],
            'selected_2026':r['selected_result']['stress_2026']['metrics'],
            'all_specs':r['all_specs_fixed_after_pre2025_design']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-sequence-dl-heads-v1-${{ github.sha }}
          path: vw_midas_sequence_dl_heads_v1_result.json
          retention-days: 30
