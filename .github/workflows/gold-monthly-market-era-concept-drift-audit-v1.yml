name: Gold Monthly Market Era Concept Drift Audit V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_market_era_concept_drift_audit_v1.py
      - .github/workflows/gold-monthly-market-era-concept-drift-audit-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install 'scipy>=1.13,<2'

      - name: Download frozen audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/audit
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11120035621/zip" > audit.zip
          unzip -q audit.zip -d inputs/audit
          test -f inputs/audit/GOLD_MONTHLY_ALARM_REGIME_V2_RELIABILITY_AUDIT_V1_2026-09-30.json

      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_market_era_concept_drift_audit_v1.py

      - name: Run audit
        run: |
          python gold_axis_2026/tools/gold_monthly_market_era_concept_drift_audit_v1.py             --audit-json inputs/audit/GOLD_MONTHLY_ALARM_REGIME_V2_RELIABILITY_AUDIT_V1_2026-09-30.json             --output GOLD_MONTHLY_MARKET_ERA_CONCEPT_DRIFT_AUDIT_V1_2026-09-30.json

      - name: Scientific governance gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_MARKET_ERA_CONCEPT_DRIFT_AUDIT_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scientific_gate']=='PASS'
          assert r['era_definition']['boundary_searched_posthoc'] is False
          g=r['governance']
          assert g['era_boundary_moved'] is False
          assert g['change_date_search_performed'] is False
          assert g['v2_retuned'] is False
          assert g['alarm_definitions_changed'] is False
          assert g['severity_thresholds_changed'] is False
          assert g['weights_fit'] is False
          assert g['forecast_modified'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'all':r['primary_pattern_all_rows'],
            'r2_only':r['primary_pattern_live_R2_only'],
            'pairwise_all':r['pairwise_diagnostics_all_rows'],
            'pairwise_r2':r['pairwise_diagnostics_live_R2_only'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-market-era-concept-drift-audit-v1-${{ github.sha }}
          path: GOLD_MONTHLY_MARKET_ERA_CONCEPT_DRIFT_AUDIT_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
