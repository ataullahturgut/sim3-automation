name: Gold H3 OCS Promising Diagnostic
on:
  push:
    branches: [gold-h3-ocs-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_ocs_promising_diagnostic.py'
      - '.github/workflows/gold-h3-ocs-promising-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-ocs-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_ocs_promising_diagnostic.py
      - name: Record diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_OCS_V1_PROMISING_070_010_DIAGNOSTIC_2026-10-04.md gold_axis_2026/GOLD_H3_OCS_V1_PROMISING_070_010_EVENTS_2026-10-04.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record OCS promising rare-trigger diagnostic"
            git pull --rebase origin gold-h3-ocs-v1-20261004
            git push origin HEAD:gold-h3-ocs-v1-20261004
          fi
