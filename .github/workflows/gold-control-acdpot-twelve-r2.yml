name: Gold Control ACDPOT Twelve R2

on:
  push:
    branches:
      - gold-downside-acdpot-hardr-v1-20260921
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_PREREG_2026-09-21.md'
      - 'gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1r2_twelve.py'
      - '.github/workflows/gold-control-acdpot-twelve-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-acdpot-twelve-r2
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-downside-acdpot-hardr-v1-20260921
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require provider credential
        run: test -n "$TWELVE_DATA_API_KEY"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'

      - name: Compile implementation
        run: python -m py_compile gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1r2_twelve.py

      - name: Run pre-2025 freeze
        run: |
          rm -rf acd_r2_pre
          mkdir -p acd_r2_pre
          python gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1r2_twelve.py             --stage pre2025 --outdir acd_r2_pre

      - name: Freeze pre-2025 evidence
        run: |
          cp acd_r2_pre/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_FROZEN_CONFIG_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_PRE2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_2024_FORECASTS_2026-09-21.csv
          git commit -m 'Freeze Twelve Data ACD-POT V1R2 pre-2025 evidence'
          git push origin HEAD:gold-downside-acdpot-hardr-v1-20260921

      - name: Run unchanged 2025 challenge
        run: |
          rm -rf acd_r2_2025
          mkdir -p acd_r2_2025
          python gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1r2_twelve.py             --stage 2025             --outdir acd_r2_2025             --config gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_FROZEN_CONFIG_2026-09-21.json             --pre-result gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_PRE2025_RESULT_2026-09-21.json

      - name: Freeze challenge outputs
        run: |
          cp acd_r2_2025/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1R2_2025_FORECASTS_2026-09-21.csv
          git commit -m 'Freeze Twelve Data ACD-POT V1R2 2025 challenge'
          git push origin HEAD:gold-downside-acdpot-hardr-v1-20260921

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-acdpot-twelve-r2
          retention-days: 30
          if-no-files-found: error
          path: |
            acd_r2_pre/
            acd_r2_2025/
