name: Gold Monthly Boosting CatBoost Vanilla 2026 Stress V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-boosting-catboost-vanilla-2026-stress-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  stress:
    name: catboost-vanilla-2026-stress
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_catboost_vanilla_2026_stress_v1.py
      - name: Run frozen 2026 stress
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_catboost_vanilla_2026_stress_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gold_monthly_boosting_catboost_vanilla_2026_stress_v1_result.json'))
          assert r['scope']=='BOOSTING_CATBOOST_VANILLA_FROZEN_2026_STRESS_V1'
          assert r['model']=='CATBOOST_VANILLA_FROZEN'
          assert r['targets']==['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07']
          assert r['2026_role']=='RETROSPECTIVE_STRESS_REPORT_ONLY_NO_TUNING'
          assert r['database']=='READ_ONLY'
          assert r['random_split']=='NONE'
          assert len(r['rows'])==7
          assert r['authority_invariants_before']==r['authority_invariants_after']
          print('CATBOOST_2026_STRESS_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-catboost-vanilla-2026-stress-v1
          path: gold_monthly_boosting_catboost_vanilla_2026_stress_v1_result.json
          if-no-files-found: error
