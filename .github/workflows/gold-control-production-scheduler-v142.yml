name: Gold Control Production Scheduler V1.42

# DATA INGESTION RESUMED 2026-10-30 after explicit user request.
# SECOND CATCH-UP ON MERGE AFTER FED SOURCE ISOLATION FIX (PR #151).
# Still data-only; no weekly ANN or V22/BASE14 live signal issuance.
# This workflow only refreshes source observations/snapshots. It DOES NOT issue
# weekly ANN forecasts, V22/BASE14 live alerts, or investment instructions.
# Hourly snapshot publication remains MANUAL: archived runtime status is not
# a verified current forecast and must not be auto-republished as live.
# All jobs have source-time / canonical persistence checks; separate live
# readiness workflow reports BLOCKED until genuine executors are verified.
on:
  # One-time recovery catch-up on approval/merge; subsequent runs use cron.
  push:
    branches: [main]
    paths: ['.github/workflows/gold-control-production-scheduler-v142.yml']
  schedule:
    - cron: '17 * * * *'
    - cron: '45 23 * * *'
    - cron: '25 6 * * *'
    - cron: '15 1 * * 2-6'
    - cron: '30 12 * * 2-6'
    - cron: '35 1 * * 2-6'
    - cron: '45 12 * * 2-6'
    - cron: '10 22 * * 1-5'
    # Independently validated FRED H.15/H.10 mirror; separate from direct DDP.
    - cron: '55 6 * * 2-6'
    - cron: '55 18 * * 2-6'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Explicit production lane to run'
        required: true
        default: 'core-daily'
        type: choice
        options:
          - core-hourly
          - snapshot-refresh
          - core-daily
          - fred-indices
          - twelve-market
          - xau-ny17
          - fred-macro


permissions:
  contents: read

jobs:
  validate-dispatcher:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify canonical scheduler contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gold-r4-direction-engine --depth=1
          for f in \
            .github/workflows/gold-data-neon-ingest.yml \
            .github/workflows/gold-data-fred-indices.yml \
            .github/workflows/gold-data-twelve-market.yml \
            .github/workflows/gold-data-xau-ny17.yml \
            .github/workflows/gold-data-fred-macro-mirror.yml \
            .github/workflows/gold-control-production-display-snapshot-refresh.yml
          do
            text="$(git show origin/gold-r4-direction-engine:$f)"
            grep -Fq 'workflow_call:' <<<"$text"
            if grep -Eq '^[[:space:]]+schedule:' <<<"$text"; then
              echo "Canonical reusable workflow still owns a schedule: $f" >&2
              exit 1
            fi
          done
          manifest="$(git show origin/gold-r4-direction-engine:gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md)"
          grep -Fq '**Manifest version:** 3.00' <<<"$manifest"
          grep -Fq '**Canonical branch:** gold-r4-direction-engine' <<<"$manifest"
          snapshot="$(git show origin/gold-r4-direction-engine:.github/workflows/gold-control-production-display-snapshot-refresh.yml)"
          # Target-context markers are defined by the snapshot publisher,
          # not by the separate gold direction-engine research manifest.
          grep -Fq 'LATEST_COMPLETE_12_ENGINE_TARGET_CONTEXT' <<<"$snapshot"
          grep -Fq 'LATEST_COMPLETE_7_FEATURE_TARGET_CONTEXT' <<<"$snapshot"
          grep -Fq 'GOLD_CONTROL_CURRENT_PRODUCTION_DISPLAY_SNAPSHOT_V142' <<<"$snapshot"
          echo 'V142_DEFAULT_BRANCH_DISPATCHER_AUTHORITY_PASS'

  core-hourly:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'core-hourly')
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-neon-ingest.yml@gold-r4-direction-engine
    with:
      mode: hourly
    secrets: inherit

  snapshot-refresh:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '27 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'snapshot-refresh')
    permissions:
      contents: write
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-control-production-display-snapshot-refresh.yml@gold-r4-direction-engine
    secrets: inherit

  core-daily:
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '45 23 * * *' || github.event.schedule == '25 6 * * *')) ||
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'core-daily')
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-neon-ingest.yml@gold-r4-direction-engine
    with:
      mode: daily
    secrets: inherit

  fred-indices:
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '15 1 * * 2-6' || github.event.schedule == '30 12 * * 2-6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'fred-indices')
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-fred-indices.yml@gold-r4-direction-engine
    with:
      mode: daily
    secrets: inherit

  twelve-market:
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '35 1 * * 2-6' || github.event.schedule == '45 12 * * 2-6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'twelve-market')
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-twelve-market.yml@gold-r4-direction-engine
    secrets: inherit

  fred-macro:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'schedule' && (github.event.schedule == '55 6 * * 2-6' || github.event.schedule == '55 18 * * 2-6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'fred-macro')
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-fred-macro-mirror.yml@gold-r4-direction-engine
    secrets: inherit

  xau-ny17:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'schedule' && github.event.schedule == '10 22 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'xau-ny17')
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-xau-ny17.yml@gold-r4-direction-engine
    with:
      # One-time repair after merge covers all 21–29 Oct NY17 trade dates.
      # All subsequent routine time-based runs use the existing seven days.
      reconcile_days: ${{ github.event_name == 'push' && 14 || 7 }}
    secrets: inherit
