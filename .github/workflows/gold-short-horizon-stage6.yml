name: Gold Short Horizon Stage6 Tactical Utility

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_stage6_utility.py'
      - '.github/workflows/gold-short-horizon-stage6.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stage6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run tactical utility simulation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: stage6_utility_out
        run: python gold_axis_2026/tools/gold_short_horizon_stage6_utility.py
      - name: Upload Stage6 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-stage6-utility
          path: stage6_utility_out/
          retention-days: 90
