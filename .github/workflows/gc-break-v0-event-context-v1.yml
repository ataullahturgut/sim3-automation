name: GC-BREAK V0 Event Context V1

on:
  push:
    branches:
      - gc-break-wp1-formation-backfill
    paths:
      - 'gold_axis_2026/gc_break_v0/gc_break_event_context_contract_v1.json'
      - 'gold_axis_2026/tools/gc_break_v0_event_context_v1.py'
      - '.github/workflows/gc-break-v0-event-context-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  event-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact frozen V2 dependency used by Market Shock V3
        run: |
          git fetch --no-tags --depth=1 origin gold-control-market-shock-challenger-v3
          git show origin/gold-control-market-shock-challenger-v3:gold_axis_2026/tools/market_shock_challenger_v2.py > gold_axis_2026/tools/market_shock_challenger_v2.py
          actual="$(git hash-object gold_axis_2026/tools/market_shock_challenger_v2.py)"
          test "$actual" = "287c3a4829483515c7bb7d3c540486263245ab4d"
          echo "MARKET_SHOCK_V2_DEPENDENCY_BLOB=$actual"
      - name: Install research-only dependencies
        run: python -m pip install --quiet numpy pandas scipy requests 'psycopg[binary]>=3.2,<4'
      - name: Require read source secret and compile
        run: |
          test -n "$NEON_DATABASE_URL"
          python -m py_compile gold_axis_2026/tools/gc_break_v0_governed_diagnostic_v1.py
          python -m py_compile gold_axis_2026/tools/gc_break_v0_event_context_v1.py
          python -m py_compile gold_axis_2026/tools/market_shock_challenger_v2.py
          python -m py_compile gold_axis_2026/tools/market_shock_challenger_v3.py
      - name: Rebuild governed diagnostic inputs locally
        run: python gold_axis_2026/tools/gc_break_v0_governed_diagnostic_v1.py
      - name: Run read-only event context integration
        run: python gold_axis_2026/tools/gc_break_v0_event_context_v1.py
      - name: Assert no DML / no authority write
        run: |
          ! grep -Eiq '\b(insert|update|delete|truncate|alter|drop|create)[[:space:]]' gold_axis_2026/tools/gc_break_v0_event_context_v1.py
          grep -q 'SET TRANSACTION READ ONLY' gold_axis_2026/tools/gc_break_v0_event_context_v1.py
          echo 'GC_BREAK_V0_EVENT_CONTEXT_READ_ONLY_PASS'
      - name: Upload event-context evidence
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-v0-event-context-v1
          if-no-files-found: error
          path: |
            gold_axis_2026/data_pipeline/audits/gc_break_v0_event_context_v1/
            gold_axis_2026/data_pipeline/audits/gc_break_v0_diagnostic_v1/
