name: Gold Monthly SVR Stage5A2 TLBO Tuned PSO V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-svr-stage5a2-tlbo-tuned-pso-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tlbo_tuned_pso:
    name: TLBO_TUNED_PSO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install 'numpy==2.4.6' 'psycopg[binary]==3.3.6' 'scikit-learn==1.9.1'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_svr_dwt_stage5a2_tlbo_tuned_pso_v1.py
      - name: Run TLBO-tuned PSO
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_svr_dwt_stage5a2_tlbo_tuned_pso_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gold_monthly_svr_dwt_stage5a2_tlbo_tuned_pso_result.json'))
          assert r['scope']=='STAGE5A2_TLBO_TUNED_PSO_DEV_ONLY_V1'
          assert r['method']=='TLBO_TUNED_PSO'
          c=r['contract']
          assert c['outer_tlbo_population']==6 and c['outer_tlbo_iterations']==5
          assert c['nested_pso_population']==12 and c['nested_pso_iterations']==20
          assert c['final_population']==24 and c['final_iterations']==45 and c['repeats']==3
          assert c['2025_role']=='LOCKED_NOT_OPENED' and c['2026_role']=='QUARANTINED_NOT_USED'
          assert c['random_split']=='NONE' and c['database']=='READ_ONLY'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert r['metrics']['n']==33 and len(r['rows'])==33
          for x in r['rows']:
              assert x['train_last'] < x['target']
              assert x['inner_valid_n'] >= 12
              assert len(x['repeat_records'])==3
              q=x['selected_pso']
              assert 0.2-1e-12 <= q['w'] <= 0.95+1e-12
              assert 0.2-1e-12 <= q['c1'] <= 3.0+1e-12
              assert 0.2-1e-12 <= q['c2'] <= 3.0+1e-12
              assert 0.05-1e-12 <= q['vmax_frac'] <= 0.8+1e-12
              p=x['selected_params']
              assert -8-1e-12 <= p['log2_C'] <= 12+1e-12
              assert -12-1e-12 <= p['log2_gamma'] <= 4+1e-12
              assert 0.01-1e-12 <= p['epsilon'] <= 0.50+1e-12
          print('SVR_STAGE5A2_TLBO_TUNED_PSO_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-svr-stage5a2-tlbo-tuned-pso-v1
          path: |
            gold_monthly_svr_dwt_stage5a2_tlbo_tuned_pso_result.json
            gold_axis_2026/GOLD_MONTHLY_SVR_DWT_STAGE5A2_TLBO_TUNED_PSO_RESULT_2026-09-28.md
          if-no-files-found: error
      - name: Commit result report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git add gold_axis_2026/GOLD_MONTHLY_SVR_DWT_STAGE5A2_TLBO_TUNED_PSO_RESULT_2026-09-28.md
          if git diff --cached --quiet; then
            echo "No report change"
          else
            git commit -m "Record SVR Stage 5A.2 TLBO-tuned PSO result"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
