name: Gold Monthly SVR Stage5A2 TLBO Tuned PSO Sharded V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-svr-stage5a2-tlbo-tuned-pso-sharded-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s1:
    name: TLBO_TUNED_PSO_S1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: python -m pip install 'numpy==2.4.6' 'psycopg[binary]==3.3.6' 'scikit-learn==1.9.1'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_svr_dwt_stage5a2_tlbo_tuned_pso_sharded_v1.py
      - name: Run shard s1
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_svr_dwt_stage5a2_tlbo_tuned_pso_sharded_v1.py --start 2022-04 --end 2022-10 --tag s1
      - name: Shard scientific gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('stage5a2_tlbo_tuned_pso_shard_s1.json'))
          assert d['scope']=='STAGE5A2_TLBO_TUNED_PSO_SHARD_V1'
          assert d['method']=='TLBO_TUNED_PSO'
          assert d['start']=='2022-04' and d['end']=='2022-10'
          assert d['2025_role']=='LOCKED_NOT_OPENED'
          assert d['2026_role']=='QUARANTINED_NOT_USED'
          assert d['authority_invariants_before']==d['authority_invariants_after']
          for x in d['rows']:
              assert x['train_last'] < x['target']
              assert x['inner_valid_n'] >= 12
              assert len(x['repeat_records'])==3
          print('SHARD_S1_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: svr-stage5a2-s1
          path: stage5a2_tlbo_tuned_pso_shard_s1.json
          if-no-files-found: error

