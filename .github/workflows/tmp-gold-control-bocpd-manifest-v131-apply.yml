name: TEMP Gold Control BOCPD Manifest V1.31 Apply

on:
  push:
    branches: [gold-control-bocpd-successor-v1]
    paths:
      - 'gold_axis_2026/tools/apply_manifest_v1_31_bocpd_successor.py'
      - '.github/workflows/tmp-gold-control-bocpd-manifest-v131-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-bocpd-successor-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fail-closed manifest reconciliation
        run: python gold_axis_2026/tools/apply_manifest_v1_31_bocpd_successor.py

      - name: Verify manifest diff scope
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md' || {
            echo 'Unexpected files changed by manifest reconciler'
            exit 1
          }
          grep -F '**Manifest version:** 1.31' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'BOCPD_RETURN_SUCCESSOR_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'RESEARCH_SHADOW_CANDIDATE_RISK_DIAGNOSTIC_COMPLETE_PROSPECTIVE_VALIDATION_REQUIRED' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md

      - name: Commit manifest only
        run: |
          set -euo pipefail
          if git diff --quiet -- gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md; then
            echo 'No manifest change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git commit -m 'gold-control: reconcile manifest v1.31 BOCPD successor research state'
          git push origin HEAD:gold-control-bocpd-successor-v1
