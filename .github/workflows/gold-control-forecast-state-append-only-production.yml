name: Gold Control Forecast State Append Only Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-forecast-state-append-only-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]
      - name: Guarded production migration and verify
        shell: python
        run: |
          import os
          from pathlib import Path
          import psycopg
          from psycopg.rows import dict_row
          tables=['forecast_input_snapshots','derived_feature_snapshots','monthly_forecast_contracts']
          sql=Path('gold_axis_2026/data_pipeline/schema_patch_forecast_state_append_only_v1.sql').read_text()
          with psycopg.connect(os.environ['NEON_DATABASE_URL'], autocommit=False, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  pre={}
                  for t in tables:
                      cur.execute(f'select count(*) as n from {t}')
                      pre[t]=int(cur.fetchone()['n'])
                  if any(pre.values()):
                      raise RuntimeError(f'PRODUCTION_MIGRATION_PRECONDITION_ROWS_NOT_ZERO:{pre}')
                  cur.execute(sql)
                  cur.execute('''
                    select event_object_table, count(distinct trigger_name) as n
                    from information_schema.triggers
                    where event_object_schema='public'
                      and event_object_table in ('forecast_input_snapshots','derived_feature_snapshots','monthly_forecast_contracts')
                    group by event_object_table order by event_object_table
                  ''')
                  coverage={r['event_object_table']:int(r['n']) for r in cur.fetchall()}
                  if set(coverage)!=set(tables) or any(v<1 for v in coverage.values()):
                      raise RuntimeError(f'PRODUCTION_TRIGGER_COVERAGE_FAILED:{coverage}')
              conn.commit()
          with psycopg.connect(os.environ['NEON_DATABASE_URL'], autocommit=False, row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute('SET TRANSACTION READ ONLY')
                  cur.execute('''
                    select event_object_table, count(distinct trigger_name) as n
                    from information_schema.triggers
                    where event_object_schema='public'
                      and event_object_table in ('forecast_input_snapshots','derived_feature_snapshots','monthly_forecast_contracts')
                    group by event_object_table order by event_object_table
                  ''')
                  coverage={r['event_object_table']:int(r['n']) for r in cur.fetchall()}
                  post={}
                  for t in tables:
                      cur.execute(f'select count(*) as n from {t}')
                      post[t]=int(cur.fetchone()['n'])
              conn.rollback()
          if set(coverage)!=set(tables) or any(v<1 for v in coverage.values()):
              raise RuntimeError(f'POST_COMMIT_TRIGGER_COVERAGE_FAILED:{coverage}')
          if any(post.values()):
              raise RuntimeError(f'POST_COMMIT_UNEXPECTED_ROWS:{post}')
          print('PRE_MIGRATION_ROWS_ZERO=YES')
          print('TRIGGER_COVERAGE=3_OF_3')
          print('POST_MIGRATION_ROWS_ZERO=YES')
          print('FORECAST_STATE_APPEND_ONLY_PRODUCTION_MIGRATION_PASS')
