name: Gold V14 Adaptive Decision Research
on:
  push:
    branches:
      - 'research-gold-v14-*'
  pull_request:
    branches:
      - 'research-gold-v13-sentez-hybrid-20261016'
  workflow_dispatch:
jobs:
  science-v14:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V14 causality and adaptive policy tests
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: node --test v14_karar_ogrenme.test.js v14_karar_run.test.js
      - name: V14 fee-net actual historical research and ablations
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v14_karar_run.js > v14_research_results.json
          node -e "const x=require('./v14_research_results.json'); console.log(JSON.stringify({version:x.version,gate:x.scientificGate,experiments:x.experiments.map(z=>({period:z.period,model:z.variant,final:z.final,hold:z.buyHold,trades:z.trades,mdd:z.maxDD}))},null,2))"
      - name: Preserve complete V14 experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-research-results
          path: gold_axis_2026/apps/portfolio_guard_v1/v14_research_results.json
          if-no-files-found: ignore
