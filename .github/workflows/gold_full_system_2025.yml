name: Gold Full System 2025 Replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/gold_h1_r1/run_full_system_2025.py'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python projects/gold_h1_r1/run_full_system_2025.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/gold_h1_r1/FULL_SYSTEM_2025_REPLAY.csv projects/gold_h1_r1/FULL_SYSTEM_2025_REPORT.md
          git diff --cached --quiet || (git commit -m 'Add full 2025 gold system replay results' && git push)
