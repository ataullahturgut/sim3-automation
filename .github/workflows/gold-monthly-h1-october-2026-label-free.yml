name: GOLD H1 October 2026 Label-Free Original Models
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_h1_october_2026_label_free_v1.py
      - .github/workflows/gold-monthly-h1-october-2026-label-free.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-model:
    name: October 2026 / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [CHHHO, DE_ABC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged original model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.4,<2'
      - name: Run actual original solver with complete September origin and no October price
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          test -n "$NEON_DATABASE_URL" || (echo "MISSING_NEON_DATABASE_URL" && exit 1)
          python gold_axis_2026/tools/gold_monthly_h1_october_2026_label_free_v1.py \
            --model "${{ matrix.model }}" --output /tmp/october-2026-result.json
      - name: Verify label-free October forecast is nonempty
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json,math,os
          a=json.load(open('/tmp/october-2026-result.json'))
          assert a['model']==os.environ['MODEL']
          assert a['target_month']=='2026-10' and a['origin_month']=='2026-09'
          assert a['source_contract']=='NEON_STAKTRAKR_GPR_V2'
          assert a['target_label'] is None and a['target_realized_price_usd_oz'] is None
          assert a['data_from_after_september'] is False
          assert a['provenance']['gpr_origin_archive'].endswith('data_gpr_export_202609.xls')
          assert a['provenance']['gpr_lag_month']=='2026-08'
          assert a['database_writes']==0
          assert a['training_rows']>=30
          assert len(a['input_eight_features_sha256'])==64
          assert math.isfinite(a['predicted_october_average_usd_oz']) and a['predicted_october_average_usd_oz']>0
          print('OCTOBER_2026_LABEL_FREE_MODEL_PASS',os.environ['MODEL'],a['predicted_october_average_usd_oz'])
          PY
      - name: Store reproducible model October forecast and input hash
        uses: actions/upload-artifact@v4
        with:
          name: gold-october-2026-${{ matrix.model }}
          path: /tmp/october-2026-result.json
          retention-days: 90
  compare:
    needs: actual-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gold-october-2026-*
          path: /tmp/october-results
      - name: Check identical prediction inputs and output comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=sorted(Path('/tmp/october-results').glob('*/october-2026-result.json'))
          assert len(p)==2, p
          r={a['model']:a for a in [json.loads(x.read_text()) for x in p]}
          assert set(r)=={'CHHHO','DE_ABC'}
          assert r['CHHHO']['input_eight_features_sha256']==r['DE_ABC']['input_eight_features_sha256']
          assert r['CHHHO']['training_rows']==r['DE_ABC']['training_rows']
          assert r['CHHHO']['origin_average_usd_oz']==r['DE_ABC']['origin_average_usd_oz']
          for model in ('CHHHO','DE_ABC'):
              x=r[model]
              print('FINAL_OCTOBER_2026',model,
                    'forecast=',format(x['predicted_october_average_usd_oz'],'.8f'),
                    'origin=',format(x['origin_average_usd_oz'],'.8f'),
                    'pct=',format(x['predicted_october_change_pct'],'.8f'),
                    'train=',x['training_rows'],
                    'target_label=',x['target_label'])
          result={
            'status':'BOTH_FULL_SOLVERS_SUCCEEDED_IDENTICAL_INPUTS',
            'target_month':'2026-10','origin_month':'2026-09',
            'generated_as_research_replay':True,
            'source_contract':'NEON_STAKTRAKR_GPR_V2',
            'actual_october_average':None,
            'models':r,
          }
          Path('/tmp/october-2026-both-models.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - name: Save unified October 2026 actual training comparison
        uses: actions/upload-artifact@v4
        with:
          name: gold-october-2026-actual-two-solvers-comparison
          path: /tmp/october-2026-both-models.json
          retention-days: 90
