name: Gold Monthly Label-Free As-Of Forecast Regression V1

on:
  push:
    branches:
      - research-monthly-asof-label-free-20261023
    paths:
      - gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
      - gold_axis_2026/tools/vw_midas_anfis_stage3c_literature_v1.py
      - gold_axis_2026/tools/tests/test_monthly_label_free_forecast_v1.py
      - .github/workflows/gold-monthly-label-free-origin-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  regression:
    name: Target-label absence and ChHHO smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen scientific dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Reject database connections
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Python compilation
        run: |
          python -m py_compile gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
          python -m py_compile gold_axis_2026/tools/vw_midas_anfis_stage3c_literature_v1.py
          python -m py_compile gold_axis_2026/tools/tests/test_monthly_label_free_forecast_v1.py
      - name: Run ten synthetic regression tests including actual ChHHO price inference
        run: python -m unittest discover -s gold_axis_2026/tools/tests -p 'test_monthly_label_free_forecast_v1.py' -v
