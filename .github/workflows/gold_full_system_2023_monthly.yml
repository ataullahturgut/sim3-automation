name: Gold Full System 2023 Monthly Replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/gold_h1_r1/run_full_system_2023_monthly.py'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python projects/gold_h1_r1/run_full_system_2023_monthly.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/gold_h1_r1/FULL_SYSTEM_2023_MONTHLY_REPLAY.csv projects/gold_h1_r1/FULL_SYSTEM_2023_MONTHLY_REPORT.md
          git diff --cached --quiet || git commit -m 'Run monthly 2023 gold full-system replay'
          git push
