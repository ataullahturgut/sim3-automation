name: Gold Execution Dukascopy Oct 2026 BID ASK Gap Repair
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_dukascopy_oct2026_retry_20261008.py'
      - '.github/workflows/gold-execution-dukascopy-oct2026-retry-20261008.yml'
permissions:
  contents: write
jobs:
  oct-gap-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_dukascopy_oct2026_retry_20261008.py
      - name: Publish 2026 October source QC dates without raw quotes
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_DUKASCOPY_OCT2026_SOURCE_GAP_RECOVERY_20261008.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_DUKASCOPY_OCT2026_SOURCE_GAP_RECOVERY_20261008.json
          git diff --cached --quiet || git commit -m 'Record matured October Dukascopy gold BID ASK source candidates and quarantine missing dates'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
