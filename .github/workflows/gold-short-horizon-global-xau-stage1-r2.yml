name: Gold Short Horizon Global XAU Stage1 R2

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_global_xau_stage1_r2.py'
      - 'gold_axis_2026/tools/gold_short_horizon_global_xau_stage1_r2_aggregate.py'
      - '.github/workflows/gold-short-horizon-global-xau-stage1-r2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        horizon: [1,3,5]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HORIZON: ${{ matrix.horizon }}
      OUT_DIR: global_xau_r2_stage1_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4,<5' 'xgboost>=3,<4' requests
      - name: Resolve R2 readiness artifact
        id: aid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gold-short-horizon-global-xau-readiness-r2&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$AID"
          echo "aid=$AID" >> "$GITHUB_OUTPUT"
      - name: Run R2 Stage1
        env:
          READINESS_ARTIFACT: ${{ steps.aid.outputs.aid }}
        run: python gold_axis_2026/tools/gold_short_horizon_global_xau_stage1_r2.py
      - uses: actions/upload-artifact@v4
        with:
          name: global-xau-r2-stage1-h${{ matrix.horizon }}
          path: global_xau_r2_stage1_out/
          retention-days: 90

  aggregate:
    needs: screen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'pandas>=2.2,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: global-xau-r2-stage1-h*
          path: stage1_download
      - name: Arrange horizons
        run: |
          mkdir -p h1 h3 h5
          cp stage1_download/global-xau-r2-stage1-h1/* h1/
          cp stage1_download/global-xau-r2-stage1-h3/* h3/
          cp stage1_download/global-xau-r2-stage1-h5/* h5/
      - name: Aggregate
        run: python gold_axis_2026/tools/gold_short_horizon_global_xau_stage1_r2_aggregate.py
      - name: Commit R2 Stage1 evidence
        run: |
          cp global_xau_r2_stage1_all/STAGE1_RESULT.md gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE1_RESULT_2026-10-02.md
          cp global_xau_r2_stage1_all/stage1_summary.json gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE1_SUMMARY_2026-10-02.json
          cp global_xau_r2_stage1_all/stage1_decisions.csv gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE1_DECISIONS_2026-10-02.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE1_*_2026-10-02.*
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Record Global XAU R2 Stage1"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: global-xau-r2-stage1-aggregate
          path: global_xau_r2_stage1_all/
          retention-days: 90
