name: Gold V15 Algorithm-Only Acceptance
on:
  push:
    branches:
      - 'research-gold-v15-*'
  pull_request:
    branches:
      - 'research-gold-v14-karar-ogrenme-20261016'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V15 static syntax audit
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: node --check v15_kavis_cekirdek.js
      - name: V15 algorithm-only synthetic acceptance
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: node --test v15_kavis_cekirdek.test.js
      - name: Confirm V15 CI has no historical portfolio replay
        run: |
          if grep -E 'v14_karar_run|v13_sentez_run|2026_FEB_SEP|v8_regret_engine' gold_axis_2026/apps/portfolio_guard_v1/v15_kavis_cekirdek.js gold_axis_2026/apps/portfolio_guard_v1/v15_kavis_cekirdek.test.js; then
            echo "Unexpected historical simulation in algorithm-only phase"
            exit 1
          fi
