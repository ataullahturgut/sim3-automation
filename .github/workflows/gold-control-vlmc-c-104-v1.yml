name: Gold Control VLMC-C 104 V1

on:
  push:
    branches:
      - gold-direction-vlmc-bs-family-v2-20260918
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_PREREG_2026-09-18.md'
      - 'gold_axis_2026/tools/direction_vlmc_c_104_v1_reference.R'
      - '.github/workflows/gold-control-vlmc-c-104-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-vlmc-c-104-v1
  cancel-in-progress: false

jobs:
  vlmc-c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-vlmc-bs-family-v2-20260918
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: false

      - name: Fetch pinned VLMC-C branch-test reference
        run: |
          curl -fL \
            https://raw.githubusercontent.com/ShaokunAn/VLMC-C/8195ee16dedbb3a89c288869ee9c0b856ea2ed4f/pruning_fun.R \
            -o /tmp/vlmc_c_pruning_fun.R
          test -s /tmp/vlmc_c_pruning_fun.R

      - name: Run pre-2025 VLMC-C validation
        run: |
          rm -rf vlmc_c_pre2025
          mkdir -p vlmc_c_pre2025
          Rscript gold_axis_2026/tools/direction_vlmc_c_104_v1_reference.R \
            gold_axis_2026/research_inputs/XAU_WEEKLY_SIGN_SOURCE_METHOD_V2_2022_2025.csv \
            gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_BS_FAMILY_V2_PRE2025_FORECASTS_2026-09-18.csv \
            pre2025 \
            vlmc_c_pre2025 \
            /tmp/vlmc_c_pruning_fun.R \
            104

      - name: Freeze pre-2025 VLMC-C evidence
        run: |
          cp vlmc_c_pre2025/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_PRE2025_FORECASTS_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_PRE2025_COMPARISON_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_PRE2025_SUMMARY_2026-09-18.R \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_PRE2025_SUMMARY_2026-09-18.txt
          git commit -m 'Freeze VLMC-C 104 pre-2025 validation'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Run unchanged post-diagnostic 2025 VLMC-C replay
        run: |
          rm -rf vlmc_c_2025
          mkdir -p vlmc_c_2025
          Rscript gold_axis_2026/tools/direction_vlmc_c_104_v1_reference.R \
            gold_axis_2026/research_inputs/XAU_WEEKLY_SIGN_SOURCE_METHOD_V2_2022_2025.csv \
            gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_BS_FAMILY_V2_2025_FORECASTS_2026-09-18.csv \
            2025 \
            vlmc_c_2025 \
            /tmp/vlmc_c_pruning_fun.R \
            104

      - name: Freeze 2025 VLMC-C forecasts before overlay
        run: |
          cp vlmc_c_2025/* gold_axis_2026/
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_2025_FORECASTS_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_2025_COMPARISON_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_2025_SUMMARY_2026-09-18.R \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_C_104_V1_2025_SUMMARY_2026-09-18.txt
          git commit -m 'Freeze VLMC-C 104 2025 forecasts before overlay'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-vlmc-c-104-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            vlmc_c_pre2025/
            vlmc_c_2025/
