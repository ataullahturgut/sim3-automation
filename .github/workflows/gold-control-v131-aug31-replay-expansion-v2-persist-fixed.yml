name: Gold Control V1.31 Aug31 Replay Expansion V2 Persist Fixed

on:
  push:
    branches:
      - gold-control-v131-aug31-replay-expansion-v2
    paths:
      - 'gold_axis_2026/data_pipeline/aug31_replay_expansion_v2_persist_fixed.py'
      - '.github/workflows/gold-control-v131-aug31-replay-expansion-v2-persist-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Compile fixed persistence graph
        run: python -m py_compile gold_axis_2026/data_pipeline/aug31_replay_expansion_v2_persist_fixed.py
      - name: Persist approved replay evidence append-only
        run: python gold_axis_2026/data_pipeline/aug31_replay_expansion_v2_persist_fixed.py
      - name: Independent production read-only audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,psycopg
          from psycopg.rows import dict_row
          u=os.environ['NEON_DATABASE_URL']
          with psycopg.connect(u,autocommit=False,row_factory=dict_row) as c:
            with c.cursor() as cur:
              cur.execute('SET TRANSACTION READ ONLY')
              cur.execute("select runtime_status,count(*)::int n from latest_engine_runtime_state group by runtime_status")
              assert {r['runtime_status']:r['n'] for r in cur.fetchall()}=={'ACTIVE':4,'WAITING':5,'BLOCKED':3}
              cur.execute("select count(*)::int n from latest_engine_runtime_state where direction_vote_permitted")
              assert cur.fetchone()['n']==3
              cur.execute("select engine_id,engine_version,status_code,metadata from latest_historical_replay_engine_state where target_context='2026-09' and engine_id in ('CAUSAL_PATCH','EMERGENCY_LEVEL','EMERGENCY_REVERSAL','BOCPD') order by engine_id")
              rows=cur.fetchall(); assert len(rows)==4, rows; by={r['engine_id']:r for r in rows}
              assert by['CAUSAL_PATCH']['metadata']['forecast_value']==4452.046728838838
              assert by['CAUSAL_PATCH']['metadata']['prospective_claim'] is False
              assert by['EMERGENCY_LEVEL']['metadata']['emergency_level']=='NEUTRAL'
              assert by['EMERGENCY_REVERSAL']['metadata']['emergency_reversal']=='OFF'
              assert by['BOCPD']['engine_version']=='BOCPD_RETURN_SUCCESSOR_V1'
              assert by['BOCPD']['metadata']['successor_state']=='NO_ADVERSE_BREAK_CANDIDATE'
              assert by['BOCPD']['metadata']['archived_engine_status']=='BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED'
              cur.execute("select count(*)::int n from derived_feature_snapshots where metadata->>'contract'='GOLD_CONTROL_AUG31_REPLAY_EXPANSION_V2_CHANGE_CONTROL_2026-09-04.md' and metadata->>'target_context'='2026-09'")
              assert cur.fetchone()['n']==6
              for t in ('monthly_forecast_contracts','decision_signal_snapshots','decision_runs','decision_events'):
                cur.execute(f'select count(*)::int n from {t}'); assert cur.fetchone()['n']==0
            c.rollback()
          print('AUG31_REPLAY_EXPANSION_V2_FIXED_POST_PERSIST_AUDIT_PASS')
          PY
