name: Gold Control COVLMC X3 V1

on:
  push:
    branches:
      - gold-direction-vlmc-bs-family-v2-20260918
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_PREREG_2026-09-18.md'
      - 'gold_axis_2026/research_inputs/XAU_COVLMC_PIT_X3_WEEKLY_2022_2025.csv'
      - 'gold_axis_2026/tools/direction_covlmc_x3_v1_reference.R'
      - '.github/workflows/gold-control-covlmc-x3-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-covlmc-x3-v1
  cancel-in-progress: false

jobs:
  covlmc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-vlmc-bs-family-v2-20260918
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: false

      - name: Install pinned VLMCX reference package
        run: |
          Rscript -e 'install.packages(c("berryFunctions"), repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/VLMCX_1.0.tar.gz", repos=NULL, type="source")'
          Rscript -e 'stopifnot(as.character(packageVersion("VLMCX")) == "1.0"); sessionInfo()'

      - name: Run pre-2025 COVLMC validation
        run: |
          rm -rf covlmc_pre2025
          mkdir -p covlmc_pre2025
          Rscript gold_axis_2026/tools/direction_covlmc_x3_v1_reference.R \
            gold_axis_2026/research_inputs/XAU_COVLMC_PIT_X3_WEEKLY_2022_2025.csv \
            gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_BS_FAMILY_V2_PRE2025_FORECASTS_2026-09-18.csv \
            pre2025 \
            covlmc_pre2025 \
            104

      - name: Freeze pre-2025 COVLMC evidence before 2025 replay
        run: |
          cp covlmc_pre2025/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_PRE2025_FORECASTS_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_PRE2025_COMPARISON_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_PRE2025_SUMMARY_2026-09-18.R \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_PRE2025_SUMMARY_2026-09-18.txt
          git commit -m 'Freeze COVLMC X3 pre-2025 validation'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Run unchanged post-diagnostic 2025 replay
        run: |
          rm -rf covlmc_2025
          mkdir -p covlmc_2025
          Rscript gold_axis_2026/tools/direction_covlmc_x3_v1_reference.R \
            gold_axis_2026/research_inputs/XAU_COVLMC_PIT_X3_WEEKLY_2022_2025.csv \
            gold_axis_2026/GOLD_CONTROL_DIRECTION_VLMC_BS_FAMILY_V2_2025_FORECASTS_2026-09-18.csv \
            2025 \
            covlmc_2025 \
            104

      - name: Freeze 2025 COVLMC forecasts before event overlay
        run: |
          cp covlmc_2025/* gold_axis_2026/
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_2025_FORECASTS_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_2025_COMPARISON_2026-09-18.csv \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_2025_SUMMARY_2026-09-18.R \
                  gold_axis_2026/GOLD_CONTROL_DIRECTION_COVLMC_X3_V1_2025_SUMMARY_2026-09-18.txt
          git commit -m 'Freeze COVLMC X3 2025 forecasts before overlay'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-covlmc-x3-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            covlmc_pre2025/
            covlmc_2025/
