name: Gold Monthly Direct External Store V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_direct_external_store_v1.py
      - .github/workflows/gold-monthly-direct-external-store-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  NEON_DATABASE_URL: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_direct_external_store_v1.py
      - name: Build direct external store
        run: |
          python gold_axis_2026/tools/gold_monthly_direct_external_store_v1.py             --core5 gold_axis_2026/core5_monthly.csv.gz.b64             --output gold_monthly_direct_external_store_v1.json
      - name: Scientific/data gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('gold_monthly_direct_external_store_v1.json'))
          assert d['authority']['neon_reads']==0
          r=d['readiness']
          for k in ['nasdaq100','rates_nominal_real','fedfunds','fx','vix','inflation_realized','commodity_oil']:
              assert r[k].startswith('READY'), (k,r[k])
          assert d['nasdaq_meta']['first'] <= '2010-01-05'
          assert d['nasdaq_meta']['last'] >= '2026-09-20'
          assert d['h15_meta']['last'] >= '2026-09-20'
          assert d['h10_meta']['last'] >= '2026-09-20'
          assert d['vix_meta']['last'] >= '2026-09-20'
          assert d['cpi_meta']['last'] >= '2026-08'
          assert d['commodity_meta']['last'] >= '2026-08'
          print('DIRECT_EXTERNAL_DATA_GATE=PASS')
          print(json.dumps({
            'readiness':r,
            'nasdaq':d['nasdaq_meta'],
            'h15':d['h15_meta'],
            'h10':d['h10_meta'],
            'vix':d['vix_meta'],
            'cpi':d['cpi_meta'],
            'commodity':d['commodity_meta'],
            'nasdaq_core5_parity':d['nasdaq_core5_parity'],
            'payload_sha256':d['payload_sha256']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-direct-external-store-v1-${{ github.sha }}
          path: gold_monthly_direct_external_store_v1.json
          if-no-files-found: error
          retention-days: 90
