name: GC-BREAK WP4C Structural Health Dual Lane V1

on:
  workflow_dispatch:
  push:
    branches: [gc-break-wp1-formation-backfill]
    paths:
      - 'gold_axis_2026/gc_break_v0/gc_break_wp4c_structural_health_dual_lane_freeze_v1.json'
      - 'gold_axis_2026/tools/gc_break_wp4c_structural_health_dual_lane_v1.py'
      - '.github/workflows/gc-break-wp4c-structural-health-dual-lane-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gc-break-wp4c-structural-health-dual-lane-v1
  cancel-in-progress: false

jobs:
  reproduce-formation-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      WP2_RUN_ID: '34828001360'
      WP3_RUN_ID: '34829522473'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet numpy pandas
      - name: Require canonical manifest v1.53 and challenge lock
        run: |
          git fetch --no-tags --depth=1 origin gold-r4-direction-engine:refs/remotes/origin/gold-r4-direction-engine
          git show origin/gold-r4-direction-engine:gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md | grep -q 'Manifest version:.*1.53'
          git show origin/gold-r4-direction-engine:gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md | grep -q '2025 remains locked'
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('gold_axis_2026/gc_break_v0/gc_break_wp4c_structural_health_dual_lane_freeze_v1.json').read_text())
          assert c['status']=='FORMATION_INFORMED_DEVELOPMENT_LOCK_BEFORE_CHALLENGE'
          assert c['challenge_gate']['architecture_or_threshold_change_after_opening_challenge'] is False
          PY
      - name: Download frozen WP2 and WP3 evidence
        run: |
          mkdir -p /tmp/wp2 /tmp/wp3
          gh run download "$WP2_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gc-break-wp2-ground-truth-v1 --dir /tmp/wp2
          gh run download "$WP3_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gc-break-wp3-current-formation-baselines-v1 --dir /tmp/wp3
      - name: Compile and reproduce formation development evidence
        run: |
          python -m py_compile gold_axis_2026/tools/gc_break_wp4c_structural_health_dual_lane_v1.py
          mkdir -p /tmp/wp4c
          python gold_axis_2026/tools/gc_break_wp4c_structural_health_dual_lane_v1.py \
            --panel /tmp/wp3/gc_break_wp3_current_formation_baseline_panel_v1.csv \
            --events /tmp/wp2/gc_break_wp2_break_events_k3_v1.csv \
            --output-dir /tmp/wp4c | tee /tmp/wp4c/run.log
          grep -q 'FORMATION_MONITORING_SIGNAL_REPRODUCED_CHALLENGE_REQUIRED' /tmp/wp4c/run.log
      - name: Upload WP4C formation development evidence
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-wp4c-structural-health-dual-lane-formation-v1
          path: /tmp/wp4c/
          if-no-files-found: error
          retention-days: 90
