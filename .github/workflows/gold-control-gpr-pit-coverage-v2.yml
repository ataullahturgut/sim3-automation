name: Gold Control GPR PIT Coverage V2

on:
  push:
    branches:
      - gold-control-gpr-pit-ingestion-v1
    paths:
      - 'gold_axis_2026/tools/audit_gpr_pit_coverage_v2.py'
      - 'gold_axis_2026/data_pipeline/gpr_vintage_backfill_v2.py'
      - 'gold_axis_2026/data_pipeline/persist_gpr_pit_bundle_v2.py'
      - 'gold_axis_2026/data_pipeline/source_contract_gpr_pit_v2.json'
      - 'gold_axis_2026/tests/test_audit_gpr_pit_coverage_v2.py'
      - '.github/workflows/gold-control-gpr-pit-coverage-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Gold Control feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit dependencies
        run: pip install pytest pandas xlrd psycopg[binary]

      - name: Unit and compile tests
        run: |
          pytest -q gold_axis_2026/tests/test_audit_gpr_pit_coverage_v2.py
          python -m py_compile gold_axis_2026/tools/audit_gpr_pit_coverage_v2.py
          python -m py_compile gold_axis_2026/data_pipeline/gpr_vintage_backfill_v2.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_gpr_pit_bundle_v2.py
          python -m json.tool gold_axis_2026/data_pipeline/source_contract_gpr_pit_v2.json >/dev/null

      - name: Clone official Caldara-Iacoviello archive with history
        run: git clone --quiet https://github.com/iacoviel/iacoviel.github.io.git /tmp/iacoviel-gpr

      - name: Audit all 72 frozen VW V1 GPR origins
        run: |
          python gold_axis_2026/tools/audit_gpr_pit_coverage_v2.py \
            --upstream-repo /tmp/iacoviel-gpr \
            --start 2020-09 \
            --end 2026-08 \
            --json-out gpr_pit_coverage_v2.json \
            --md-out gpr_pit_coverage_v2.md
          cat gpr_pit_coverage_v2.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build clean 54-origin V2 replay bundle
        run: |
          python gold_axis_2026/data_pipeline/gpr_vintage_backfill_v2.py \
            --upstream-repo /tmp/iacoviel-gpr \
            --coverage-json gpr_pit_coverage_v2.json \
            --start-origin 2022-03 \
            --end-origin 2026-08 \
            --require-all-proven \
            --bundle-out gpr_vintage_bundle_v2.json \
            --summary-out gpr_vintage_bundle_v2_summary.json
          python - <<'PY'
          import json
          d=json.load(open('gpr_vintage_bundle_v2_summary.json', encoding='utf-8'))
          assert d['series_id'] == 'GPR_OFFICIAL_GIT_PIT', d
          assert d['required_vintages'] == 54, d
          assert d['proven_vintages_built'] == 54, d
          assert d['quality_errors'] == 0, d
          assert d['all_required_proven'] is True, d
          PY
          echo '## GPR vintage bundle' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat gpr_vintage_bundle_v2_summary.json | python -c 'import json,sys; d=json.load(sys.stdin); d.pop("origins",None); print(json.dumps(d,indent=2,sort_keys=True))' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gpr-pit-coverage-v2
          path: |
            gpr_pit_coverage_v2.json
            gpr_pit_coverage_v2.md
            gpr_vintage_bundle_v2.json
            gpr_vintage_bundle_v2_summary.json
          if-no-files-found: error
