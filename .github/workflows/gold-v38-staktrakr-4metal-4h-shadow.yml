name: Gold V38 StakTrakr Four Metal Synchronous 4h V22 Research Only
on:
  push:
    branches: [research/gold-v38-staktrakr-synchronous-fourmetal-20261030]
    paths:
      - '.github/workflows/gold-v38-staktrakr-4metal-4h-shadow.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v38_staktrakr_synchronous_fourmetal_shadow_v1.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v38_staktrakr_synchronous_fourmetal_shadow_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run leakage and chronology tests
        run: |
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v38_staktrakr_synchronous_fourmetal_shadow_v1.py
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v38_staktrakr_synchronous_fourmetal_shadow_v1.py -v
      - name: Install read-only DB client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Fail closed if Neon source is not accessible
        run: test -n "$NEON_DATABASE_URL"
      - name: Compare original V22 to same-hour four-metal stress
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v38_staktrakr_synchronous_fourmetal_shadow_v1 \
            --out gold-v38-staktrakr-fourmetal-hourly-risk-results.json
      - name: Preserve complete retrospective test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v38-synchronous-fourmetal-research
          path: gold-v38-staktrakr-fourmetal-hourly-risk-results.json
          retention-days: 30
          if-no-files-found: warn
