name: TEMP V1.30 Current-Month Replay Context Fix

on:
  push:
    branches:
      - gold-control-v130-current-month-replay-context-fix
    paths:
      - '.github/workflows/_tmp_v130_current_month_replay_fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v130-current-month-replay-context-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply current-month replay context fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/apps/gold_control_mobile_v1.py')
          s=p.read_text(encoding='utf-8')
          old='''        hero_sub=f"3M Momentum / Random Walk · Hedef: {replay_target} · 31 Ağustos bilgi kesiti"\n        badge="REPLAY · PROSPECTIVE DEĞİL"\n        direction_text="31 AĞUSTOS REPLAY"\n        origin_text=fmt_time(replay_primary.get("forecast_origin"))\n        hero_kicker="EYLÜL 2026 H=1 REPLAY"\n        direction_label="STATE BAĞLAMI"\n        origin_label="REPLAY ORIGIN"'''
          new='''        hero_sub=f"3M Momentum / Random Walk · Hedef: {replay_target} · Eylül kapanana kadar ay-içi referans · 31 Ağustos bilgi kesiti"\n        badge="REPLAY · PROSPECTIVE ISSUED DEĞİL"\n        replay_monthly=None if not aug31_state_replay else aug31_state_replay.get("monthly_direction_3m")\n        replay_fast=None if not aug31_state_replay else aug31_state_replay.get("fast_state")\n        replay_slow=None if not aug31_state_replay else aug31_state_replay.get("slow_state")\n        rma,_=arrow_state(replay_monthly); rfa,_=arrow_state(replay_fast); rsa,_=arrow_state(replay_slow)\n        direction_text=f"M {rma} {display_state(replay_monthly,'—')} · F {rfa} {display_state(replay_fast,'—')} · S {rsa} {display_state(replay_slow,'—')}"\n        origin_text=fmt_time(replay_primary.get("forecast_origin"))\n        hero_kicker="EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE"\n        direction_label="31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT"\n        origin_label="REPLAY ORIGIN"'''
          if old not in s:
              raise SystemExit('hero patch anchor not found')
          s=s.replace(old,new,1)
          old2='''<b>Resmî prospective durum:</b> NOT_ISSUED_MISSED_2026_08_31_ORIGIN. H=1 replay ile 31 Ağustos EOD state replay birbirinden ayrıdır; hiçbiri canonical forecast, selector, ensemble, current yön oyu veya karar değildir.'''
          new2='''<b>Resmî prospective issuance durumu:</b> NOT_ISSUED_MISSED_2026_08_31_ORIGIN. H=1 replay ile 31 Ağustos EOD state replay ayrı evidence katmanlarıdır; canonical forecast, selector, ensemble veya karar otoritesi yaratmazlar. Ancak her ikisinin target context'i 2026-09 olduğu için Eylül kapanana kadar mevcut ay için referans/context olarak görünür kalırlar. Provenance HISTORICAL_REPLAY olarak korunur.'''
          if old2 not in s:
              raise SystemExit('footnote patch anchor not found')
          s=s.replace(old2,new2,1)
          old3='''page_head("TAHMİN","Gelecek ay için kanonik sonuç ve ayrı Multi-Expert kanıt katmanı.",updated)'''
          new3='''page_head("TAHMİN","Mevcut hedef ay için geçerli replay/reference ve gelecek H=1 kanonik sonuçları ayrı evidence katmanlarında gösterilir.",updated)'''
          if old3 not in s:
              raise SystemExit('page head patch anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')

          q=Path('gold_axis_2026/apps/mobile_viewport_qa.py')
          t=q.read_text(encoding='utf-8')
          anchor='''        markers(page, "TAHMIN", [forecast_hero_marker,"MULTI-EXPERT MONTHLY FORECAST ENGINE","CAUSAL PATCH","VW-MIDAS-MSVR","3M MOMENTUM","RANDOM WALK","GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI","EARLY INDICATIVE","SENARYOLAR","MEVCUT FİYATA GÖRE FARK","MODEL PERFORMANSI","NOT_PROVEN_EXPERT_SELECTION_RULE","AUTO SELECTOR","AUTO ENSEMBLE","HISTORICAL_REPLAY","REPLAY · PROSPECTIVE DEĞİL","EYLÜL 2026 HISTORICAL REPLAY","NOT_ISSUED_MISSED_2026_08_31_ORIGIN","WAITING_ELIGIBLE_MONTH_END_ORIGIN"])'''
          repl='''        markers(page, "TAHMIN", [forecast_hero_marker,"MULTI-EXPERT MONTHLY FORECAST ENGINE","CAUSAL PATCH","VW-MIDAS-MSVR","3M MOMENTUM","RANDOM WALK","GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI","EARLY INDICATIVE","SENARYOLAR","MEVCUT FİYATA GÖRE FARK","MODEL PERFORMANSI","NOT_PROVEN_EXPERT_SELECTION_RULE","AUTO SELECTOR","AUTO ENSEMBLE","HISTORICAL_REPLAY","REPLAY · PROSPECTIVE ISSUED DEĞİL","EYLÜL 2026 HISTORICAL REPLAY","NOT_ISSUED_MISSED_2026_08_31_ORIGIN","WAITING_ELIGIBLE_MONTH_END_ORIGIN","CURRENT-MONTH REFERENCE","31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT","DOWN","ROBUST_UP"])'''
          if anchor not in t:
              raise SystemExit('qa patch anchor not found')
          t=t.replace(anchor,repl,1)
          q.write_text(t,encoding='utf-8')
          PY
      - name: Compile and deterministic tests
        run: |
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py gold_axis_2026/apps/mobile_viewport_qa.py
          pip install -q -r gold_axis_2026/apps/requirements.txt pytest
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_engine_observability_contract.py test_aug31_state_replay_source.py test_production_display_snapshot.py
      - name: Verify semantic locks
        run: |
          grep -Fq 'CURRENT-MONTH REFERENCE' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq '31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'Provenance HISTORICAL_REPLAY olarak korunur' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'NOT_ISSUED_MISSED_2026_08_31_ORIGIN' gold_axis_2026/apps/gold_control_mobile_v1.py
      - name: Commit fix and remove temp workflow
        run: |
          rm .github/workflows/_tmp_v130_current_month_replay_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/apps/gold_control_mobile_v1.py gold_axis_2026/apps/mobile_viewport_qa.py .github/workflows/_tmp_v130_current_month_replay_fix.yml
          git commit -m 'gold-control: keep September replay and direction context current-month visible'
          git push origin HEAD:gold-control-v130-current-month-replay-context-fix
