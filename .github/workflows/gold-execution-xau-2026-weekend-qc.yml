name: Gold Execution XAU 2026 Weekend QC
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_xau_2026_weekend_readonly_20261008.py'
      - '.github/workflows/gold-execution-xau-2026-weekend-qc.yml'
permissions:
  contents: write
jobs:
  qc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]
      - run: python gold_axis_2026/tools/gold_execution_xau_2026_weekend_readonly_20261008.py
      - name: Save QC
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_XAU15M_2026_WEEKEND_AUDIT_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record 2026 weekend bar QC'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
