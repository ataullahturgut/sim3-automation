name: PRAMV 2020-2022 Historical Macro PIT Source Inventory
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_pramv_pre2023_macro_inventory_20261008.py'
      - '.github/workflows/gold-pramv-pre2023-macro-inventory-20261008.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_pramv_pre2023_macro_inventory_20261008.py
      - name: Publish provenance and counts only
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_PRAMV_PRE2023_MACRO_SOURCE_AVAILABILITY_AUDIT_20261008.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_PRAMV_PRE2023_MACRO_SOURCE_AVAILABILITY_AUDIT_20261008.json
          git diff --cached --quiet || git commit -m 'Record whether 2020-2022 native PIT first print macro observations can legitimately seed original PRAMV'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
