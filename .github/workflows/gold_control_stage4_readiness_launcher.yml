name: Gold Control Stage 4 Readiness Audit Launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold_control_stage4_readiness_launcher.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database dependency
        run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Run Stage 4 readiness audit read-only
        run: python gold_axis_2026/data_pipeline/stage4_input_readiness_audit.py
