name: Gold Overnight RFR Rescue Gate 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_overnight_rfr_rescue_gate_20261007.py'
      - '.github/workflows/gold-overnight-rfr-rescue-gate-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.6,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_overnight_rfr_rescue_gate_20261007.py
      - name: Run rescue-gate audit
        run: python gold_axis_2026/tools/gold_overnight_rfr_rescue_gate_20261007.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_OVERNIGHT_RFR_RESCUE_GATE_*
          if ! git diff --cached --quiet; then
            git commit -m "Record overnight RFR rescue-gate results"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
