name: Gold Monthly ADPRR V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_monthly_adprr_v1_corrected.py'
      - '.github/workflows/gold-monthly-adprr-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Run ADPRR v1
        run: python gold_axis_2026/tools/gold_monthly_adprr_v1_corrected.py
      - name: Commit evidence
        run: |
          mv GOLD_MONTHLY_ADPRR_V1_RESULT_2026-10-02.md gold_axis_2026/
          mv GOLD_MONTHLY_ADPRR_V1_RESULT_2026-10-02.json gold_axis_2026/
          mv GOLD_MONTHLY_ADPRR_V1_PREDICTIONS_2026-10-02.csv gold_axis_2026/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_MONTHLY_ADPRR_V1_RESULT_2026-10-02.md                   gold_axis_2026/GOLD_MONTHLY_ADPRR_V1_RESULT_2026-10-02.json                   gold_axis_2026/GOLD_MONTHLY_ADPRR_V1_PREDICTIONS_2026-10-02.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ADPRR v1 monthly model results"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-adprr-v1
          path: |
            gold_axis_2026/GOLD_MONTHLY_ADPRR_V1_RESULT_2026-10-02.md
            gold_axis_2026/GOLD_MONTHLY_ADPRR_V1_RESULT_2026-10-02.json
            gold_axis_2026/GOLD_MONTHLY_ADPRR_V1_PREDICTIONS_2026-10-02.csv
          if-no-files-found: warn
          retention-days: 90
