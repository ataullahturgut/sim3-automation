name: Gold Control Daily MIDAS Clean Core V2
on:
  workflow_dispatch:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - gold_axis_2026/tools/daily_midas_clean_core_v2.py
      - .github/workflows/gold-control-daily-midas-clean-core-v2.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require DB
        run: test -n "$NEON_DATABASE_URL"
      - name: Install
        run: python -m pip install "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.5.2" "psycopg[binary]>=3.2,<4"
      - name: Run
        working-directory: gold_axis_2026/tools
        run: python daily_midas_clean_core_v2.py --out ../../GOLD_CONTROL_DAILY_MIDAS_CLEAN_CORE_V2_RESULT_2026-09-25.json
      - name: Freeze result
        run: |
          cp GOLD_CONTROL_DAILY_MIDAS_CLEAN_CORE_V2_RESULT_2026-09-25.json gold_axis_2026/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_DAILY_MIDAS_CLEAN_CORE_V2_RESULT_2026-09-25.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze clean daily MIDAS core V2 result"
            git push origin HEAD:gold-direction-history-robustness-v1-20260924
          fi
