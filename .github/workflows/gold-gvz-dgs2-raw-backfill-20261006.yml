name: Gold GVZ DGS2 Raw Backfill 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_gvz_dgs2_raw_backfill_20261006.py'
      - '.github/workflows/gold-gvz-dgs2-raw-backfill-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --disable-pip-version-check 'pandas>=2.2,<3' 'requests>=2.31,<3'

      - name: Fetch raw GVZ and DGS2
        run: python gold_axis_2026/tools/gold_gvz_dgs2_raw_backfill_20261006.py

      - name: Record raw sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp gold_axis_2026/GVZ_DGS2_RAW_BACKFILL_OUT/gvzcls_raw.csv gold_axis_2026/GOLD_GVZCLS_RAW_2021_2025.csv
          cp gold_axis_2026/GVZ_DGS2_RAW_BACKFILL_OUT/dgs2_raw.csv gold_axis_2026/GOLD_DGS2_RAW_2022_2025.csv
          cp gold_axis_2026/GVZ_DGS2_RAW_BACKFILL_OUT/summary.json gold_axis_2026/GOLD_GVZ_DGS2_RAW_BACKFILL_SUMMARY_2026-10-06.json

          git add gold_axis_2026/GOLD_GVZCLS_RAW_2021_2025.csv                   gold_axis_2026/GOLD_DGS2_RAW_2022_2025.csv                   gold_axis_2026/GOLD_GVZ_DGS2_RAW_BACKFILL_SUMMARY_2026-10-06.json

          if ! git diff --cached --quiet; then
            git commit -m "Record raw GVZ and DGS2 through 2025"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
