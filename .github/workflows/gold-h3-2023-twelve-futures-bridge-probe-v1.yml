name: Gold H3 2023 Twelve Futures Bridge Probe V1

on:
  push:
    branches: [gold-h3-oct5-diagnostic-nowcast-20261005]
    paths:
      - 'gold_axis_2026/tools/gold_h3_2023_twelve_futures_bridge_probe_v1.py'
      - '.github/workflows/gold-h3-2023-twelve-futures-bridge-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-oct5-diagnostic-nowcast-20261005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check requests
      - run: python gold_axis_2026/tools/gold_h3_2023_twelve_futures_bridge_probe_v1.py
      - name: Record probe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             gold_axis_2026/GOLD_H3_2023_TWELVE_FUTURES_BRIDGE_PROBE_2026-10-05.json             gold_axis_2026/GOLD_H3_2023_TWELVE_FUTURES_BRIDGE_PROBE_2026-10-05.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Twelve Data 2023 futures bridge probe"
            git pull --rebase origin gold-h3-oct5-diagnostic-nowcast-20261005
            git push origin HEAD:gold-h3-oct5-diagnostic-nowcast-20261005
          fi
