name: Gold Monthly IDMA Stage 4-6 V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_idma_stage4_6_v1.py
      - .github/workflows/gold-monthly-idma-stage4-6-v1.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  idma:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary]
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_idma_stage4_6_v1.py
      - name: Run IDMA Stage 4-6
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_idma_stage4_6_v1.py
      - name: Result gate
        run: python -c "import json; r=json.load(open('vw_midas_idma_stage4_6_v1_result.json')); assert r['scope']=='STAGE_4_TO_6'; assert len(r['models'])==12; assert r['authority_invariants_before']==r['authority_invariants_after']; assert all(m['external_freeze']['frozen_at']=='2024-12' for m in r['models']); print('RESULT_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-idma-stage4-6-v1
          path: vw_midas_idma_stage4_6_v1_result.json
          if-no-files-found: error
