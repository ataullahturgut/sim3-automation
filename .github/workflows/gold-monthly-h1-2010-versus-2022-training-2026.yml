name: GOLD H1 2010 vs 2022 Training Start A-B 2026
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-h1-2010-versus-2022-training-2026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reforecast:
    name: 2022 Start / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [CHHHO, DE_ABC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original unchanged dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.4,<2'
      - name: Run same original solver starting education in April 2022
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          test -n "$NEON_DATABASE_URL" || (echo MISSING_NEON_SECRET && exit 1)
          python gold_axis_2026/tools/gold_monthly_h1_train_start_ablation_2022_v1.py \
            --model ${{ matrix.model }} \
            --targets 2026-01,2026-02,2026-03,2026-04,2026-05,2026-06,2026-07,2026-08,2026-09 \
            --output /tmp/h1-2022-start.json
      - name: Verify comparison holds origin features and solver settings fixed
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json,math,os
          r=json.load(open('/tmp/h1-2022-start.json'))
          assert r['status']=='RESEARCH_ONLY_2022_TRAINING_WINDOW'
          assert r['source_contract']=='NEON_STAKTRAKR_GPR_V2'
          assert r['model']==os.environ['MODEL']
          assert len(r['rows'])==9
          assert r['training_start']=='2022-04'
          assert r['model_changes']==r['source_changes']==r['origin_input_changes']=='NONE'
          assert r['database_writes']=='NONE'
          for x in r['rows']:
            assert x['training_start']=='2022-04'
            assert x['training_rows'] >= 45
            assert x['baseline_2010_training_rows'] > x['training_rows']
            assert len(x['origin_feature_sha256'])==64
            assert len(x['gpr_source_commit_sha'])==40
            assert math.isfinite(x['forecast_xau_average'])
            assert x['actual_xau_average']>0
          print('2022_WINDOW_2026_NINE_FORECASTS_PASS',os.environ['MODEL'])
          PY
      - name: Store 2022-start exact 2026 outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-h1-2022start-${{ matrix.model }}-2026
          path: /tmp/h1-2022-start.json
          retention-days: 90
  aggregate:
    needs: reforecast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gold-h1-2022start-*-2026
          path: /tmp/abl
      - name: Print 9-month 2026 year metrics for 2022-start models
        run: |
          python - <<'PY'
          import json, pathlib
          z=list(pathlib.Path('/tmp/abl').glob('*/h1-2022-start.json'))
          assert len(z)==2, z
          data={x['model']:x for x in [json.loads(p.read_text()) for p in z]}
          assert set(data)=={'CHHHO','DE_ABC'}
          for model in ('CHHHO','DE_ABC'):
            rows=data[model]['rows']
            assert len(rows)==9
            ae=sum(x['absolute_error'] for x in rows)
            mape=sum(x['absolute_percentage_error'] for x in rows)/9
            dr=sum(x['direction_correct'] for x in rows)
            print('GOLD_H1_2022_START_SUMMARY',model,'sumAE=',format(ae,'.8f'),
              'mape_pct=',format(mape,'.8f'),'direction=',f'{dr}/9')
            for x in rows:
              print('GOLD_H1_ABLATION_2026',model,x['target_month'],
                'forecast=',format(x['forecast_xau_average'],'.8f'),
                'actual=',format(x['actual_xau_average'],'.8f'),
                'pct_error=',format(x['absolute_percentage_error'],'.8f'),
                'train=',x['training_rows'])
          pathlib.Path('/tmp/gold-h1-2022-training-2026-joined.json').write_text(
            json.dumps({'status':'SUCCESS','data':data},indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-h1-2022-start-2026-both-solver-results
          path: /tmp/gold-h1-2022-training-2026-joined.json
          retention-days: 90
