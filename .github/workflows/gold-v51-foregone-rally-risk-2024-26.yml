name: Gold V51 Learned Foregone-Rally Regret vs Waiting Risk 2024-26
on:
  workflow_dispatch:
  push:
    branches: [research/gold-v50-regime-fitted-stopping-20261031]
    paths:
      - '.github/workflows/gold-v51-foregone-rally-risk-2024-26.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v51_learned_foregone_rally_regret.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v51_learned_foregone_rally_regret.py'
      - 'gold_axis_2026/research/case_control_v13/risk_v52_physical_decline_episode_recall.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v52_physical_decline_episode_recall.py'
permissions:
  contents: read
jobs:
  twenty-day-upside-vs-five-day-downside-regime-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Neon and statistical learning dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'
      - name: Test label maturation, direct future rally and downside cost
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v51_learned_foregone_rally_regret.py gold_axis_2026/research/case_control_v13/test_risk_v52_physical_decline_episode_recall.py gold_axis_2026/research/case_control_v13/test_risk_v50_regime_fitted_optimal_stopping.py -v
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v51_learned_foregone_rally_regret.py
      - name: Require real research dataset
        run: test -n "$NEON_DATABASE_URL"
      - name: Learn monthly past-only 2024 2025 2026 V22 risk-gated EXIT policies
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v51_learned_foregone_rally_regret \
            --out gold-v51-regime-missed-rally-and-risk-2024-2026.json
      - name: Independent physical 4pct drawdown crossings vs prior V22 warnings and exits
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v52_physical_decline_episode_recall \
            --research-json gold-v51-regime-missed-rally-and-risk-2024-2026.json \
            --out gold-v52-physical-decline-recall-2024-2026.json
      - name: Keep all month-cohort fits and event-level outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v51-missed-rally-cost-aware-exit-2024-26
          path: |
            gold-v51-regime-missed-rally-and-risk-2024-2026.json
            gold-v52-physical-decline-recall-2024-2026.json
          retention-days: 30
          if-no-files-found: warn
