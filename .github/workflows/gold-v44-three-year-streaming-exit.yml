name: Gold V44 2024-2026 True V22 Research Streaming SELL-Only Long Audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/gold-v44-three-year-streaming-exit-validation-20261031
    paths:
      - '.github/workflows/gold-v44-three-year-streaming-exit.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v44_three_year_v22_streaming_sell_only.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v44_three_year_v22_streaming_sell_only.py'
permissions:
  contents: read
jobs:
  three-year-v22-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Long-horizon streaming chronology and no-buy tests
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v44_three_year_v22_streaming_sell_only.py -v
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v44_three_year_v22_streaming_sell_only.py
      - name: Install read-only database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Require research database
        run: test -n "$NEON_DATABASE_URL"
      - name: Stream all 2024 2025 2026 real retrospective V22 original research decision days
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v44_three_year_v22_streaming_sell_only \
            --out gold-v44-three-year-v22-full-stream-audit.json
      - name: Preserve complete 3-year event journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v44-2024-2026-real-V22-stream-research
          path: gold-v44-three-year-v22-full-stream-audit.json
          retention-days: 30
          if-no-files-found: warn
