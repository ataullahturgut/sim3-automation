name: GPR Stage 3C Two-component LMC V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gpr_lmc_experiment_v1.py
      - .github/workflows/gpr-stage3c-v1.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  literature:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        method: [LMC2_RBF_M32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 psycopg[binary] scikit-learn
      - name: Verify exact LMC posterior and chronology
        run: python gold_axis_2026/tools/test_gpr_lmc_core_v1.py
      - name: Run predeclared two-component LMC
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gpr_lmc_experiment_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-stage3c-${{ matrix.method }}
          path: gpr_*_result.json
          if-no-files-found: error
