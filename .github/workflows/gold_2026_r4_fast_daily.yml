name: Gold 2026 R4 Fast Daily Verification
on:
  push:
    paths:
      - '.github/workflows/gold_2026_r4_fast_daily.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python projects/gold_h1_r1/run_2026_full_engine_r4.py
      - name: Commit daily verification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/gold_h1_r1/FULL_ENGINE_2026_R4_* projects/gold_h1_r1/GVZ_2026_R4_SNAPSHOT.csv projects/gold_h1_r1/MACRO_EVENT_2026_R4_SNAPSHOT.csv
          git diff --cached --quiet || git commit -m 'Run fast daily verification for 2026 R4'
          git push
