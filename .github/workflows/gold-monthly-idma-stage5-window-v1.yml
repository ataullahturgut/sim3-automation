name: Gold Monthly IDMA Stage 5 Window V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_idma_stage5_window_v1.py
      - .github/workflows/gold-monthly-idma-stage5-window-v1.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  stage5:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary]
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_idma_stage5_window_v1.py
      - name: Run Stage 5 adaptive selector windows only
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_idma_stage5_window_v1.py
      - name: Stage 5 scientific gate
        run: python -c "import json; r=json.load(open('vw_midas_idma_stage5_window_v1_result.json')); assert r['scope']=='STAGE_5_ONLY'; assert len(r['models'])==6; assert r['authority']['stage6_not_run'] is True; assert r['authority_invariants_before']==r['authority_invariants_after']; print('STAGE5_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-idma-stage5-window-v1
          path: vw_midas_idma_stage5_window_v1_result.json
          if-no-files-found: error
