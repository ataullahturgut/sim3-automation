name: Gold H3 OAR-CRED V2
on:
  push:
    branches: [gold-h3-oar-cred-v2-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_oar_cred_v2.py'
      - '.github/workflows/gold-h3-oar-cred-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-oar-cred-v2-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_oar_cred_v2.py
      - name: Record OAR-CRED evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gold_axis_2026/GOLD_H3_OAR_CRED_V2_DEV_PREDICTIONS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_OAR_CRED_V2_BLOCK_METRICS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_OAR_CRED_V2_SUMMARY_2026-10-04.json \
            gold_axis_2026/GOLD_H3_OAR_CRED_V2_RESULT_2026-10-04.md
          if [ -f gold_axis_2026/GOLD_H3_OAR_CRED_V2_2026_HOLDOUT_2026-10-04.csv ]; then
            git add gold_axis_2026/GOLD_H3_OAR_CRED_V2_2026_HOLDOUT_2026-10-04.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record OAR-CRED-H3 V2 evidence"
            git pull --rebase origin gold-h3-oar-cred-v2-20261004
            git push origin HEAD:gold-h3-oar-cred-v2-20261004
          fi
