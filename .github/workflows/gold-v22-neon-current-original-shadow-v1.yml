name: Gold original BASE14 CFTC21 V22 latest Neon shadow 2026-10-29
on:
  push:
    branches: [research/gold-v22-neon-current-risk-20261030]
    paths:
      - 'gold_axis_2026/research/case_control_v13/risk_v35_neon_current_base14_v22_shadow.py'
      - '.github/workflows/gold-v22-neon-current-original-shadow-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward-v22-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore strictly frozen, checksummed risk input archive
        run: |
          cd gold_axis_2026/research/case_control_v13
          mkdir -p inputs
          unzip -oq frozen_inputs.zip -d inputs
          test -f inputs/source.zip
          test -f inputs/CFTC_GC_SI_2023_2026_QUALITY_GATED.csv
      - name: Install exact original risk model numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Compile model scorer
        run: python -m py_compile gold_axis_2026/research/case_control_v13/risk_v35_neon_current_base14_v22_shadow.py
      - name: Score October 29 from actual Neon research references
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -u risk_v35_neon_current_base14_v22_shadow.py --write-shadow --out v35_neon_v22_current_result.json
      - name: Preserve exact latest research-only original scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-base14-cftc21-v22-actual-neon-shadow
          path: gold_axis_2026/research/case_control_v13/v35_neon_v22_current_result.json
          retention-days: 30
          if-no-files-found: warn
