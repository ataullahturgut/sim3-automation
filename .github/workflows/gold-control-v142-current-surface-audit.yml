name: Gold Control v1.42 Current Surface Audit

on:
  push:
    branches:
      - gold-r4-direction-engine
      - gold-control-current-surface-v142
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current test runtime
        run: python -m pip install -q pytest pandas numpy psycopg[binary]
      - name: Compile retained Python surface
        run: python -m compileall -q gold_axis_2026/apps gold_axis_2026/data_pipeline gold_axis_2026/tools gold_axis_2026/r4_1 gold_axis_2026/r4_2
      - name: Inventory full current tree
        run: python gold_axis_2026/tools/inventory_full_current_tree_v142.py
      - name: Run current-surface unit tests
        run: |
          pytest -q \
            gold_axis_2026/apps/test_engine_observability_contract.py \
            gold_axis_2026/apps/test_production_display_snapshot.py \
            gold_axis_2026/data_pipeline/test_multi_expert_forecast.py \
            gold_axis_2026/data_pipeline/test_data_evidence_spine_runtime_bootstrap.py
      - name: Audit current surface for stale semantics, legacy paths and broken workflow references
        run: python gold_axis_2026/tools/audit_current_surface_v142.py
      - name: Upload current-tree reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-current-surface-audit-v142
          path: |
            current_surface_audit_v142.json
            full_current_tree_inventory_v142.json
          if-no-files-found: ignore
