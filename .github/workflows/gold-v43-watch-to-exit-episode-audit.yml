name: Gold V43 V22 Risk-Watch Causal Exit Signal Episode Audit
on:
  workflow_dispatch:
  push:
    branches: [research/gold-v43-v22-watch-causal-exit-event-audit-20261031]
    paths:
      - '.github/workflows/gold-v43-watch-to-exit-episode-audit.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v43_watch_exit_event_audit.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v43_watch_exit_event_audit.py'
permissions:
  contents: read
jobs:
  replay-v22-watch-exit:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict future labeling, one EXIT signal, no buys
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v43_watch_exit_event_audit.py -v
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v43_watch_exit_event_audit.py
      - name: Install read-only Neon driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Require research database
        run: test -n "$NEON_DATABASE_URL"
      - name: Evaluate all retrospective 2026 V22 episodes without entering market
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v43_watch_exit_event_audit \
            --out gold-v43-risk-watch-to-exit-2026-episodes.json
      - name: Archive full episode timing and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v43-watch-vs-exit-no-reentry-audit
          path: gold-v43-risk-watch-to-exit-2026-episodes.json
          retention-days: 30
          if-no-files-found: warn
