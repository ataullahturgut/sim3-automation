name: Gold R3 Preregistered Block-Gate Audit
on:
  push:
    branches: ['research-gold-v20-r3-*']
  pull_request:
    branches: ['research-gold-v20-r2-shadow-prereg-20261016']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-r3-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse R3 source and new tests
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --check v20_atlas_r3_gate.js
          node --check v20_atlas_r3_gate.test.js
          node --check v20_r3_500_null_calibration.js
          node --check v20_r3_heldout_200_6families.js
          node --check v20_r3_128_old_parity.js
      - name: Execute new R3 prereg contract
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: node --test v20_atlas_r3_gate.test.js
      - name: Preserve R2 prior regressions and V15-20 contracts
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --test v20_atlas_r2_shadow.test.js
          npm run test:kavis-research
      - name: 500 null paths prereg threshold calibration
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v20_r3_500_null_calibration.js > r3_calibration_500_results.json
          node -e "const a=require('./r3_calibration_500_results.json');console.log(JSON.stringify({kind:a.kind,threshold:a.threshold,passes:a.calibrationPassed,opens:a.nullPairOpens,max:a.maxOfMax,min:a.minOfMax,worlds:a.worldCount},null,2));if(!a.calibrationPassed)process.exitCode=1"
      - name: Frozen 128 old-world exact-V18 parity diagnostic
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v20_r3_128_old_parity.js > r3_old_128_parity.json
          node -e "const x=require('./r3_old_128_parity.json'); console.log(JSON.stringify(x,null,2));if(!x.passed)process.exitCode=1"
      - name: Locked threshold heldout 200 NULL + balanced six families
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v20_r3_heldout_200_6families.js > r3_heldout_results.json
          node -e "const x=require('./r3_heldout_results.json');console.log(JSON.stringify({calibrationT:x.calibrationT,zero:x.zero,families:x.family,concentration:x.concentration,gates:x.gates,allPass:x.allPass,economics:x.economics},null,2))"
      - name: Formal frozen R3 scientific acceptance with NO retuning
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node -e "const x=require('./r3_heldout_results.json');if(!x.allPass){console.error('R3 REJECTED by frozen PREREG gates, no threshold sweep allowed');process.exit(1)}"
      - name: Check for prohibited live trade connection
        run: |
          if grep -E 'function liveOrder|function placeOrder|2026_FEB_SEP|loadFullRows' gold_axis_2026/apps/portfolio_guard_v1/v20_atlas_r3_gate.js; then exit 1; fi
      - name: Preserve calibration seed results (never optimize on evaluation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-500-null-calibration
          path: gold_axis_2026/apps/portfolio_guard_v1/r3_calibration_500_results.json
          if-no-files-found: ignore
      - name: Preserve all R3 negative trials and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-prereg-locked-evaluation-and-negative-cases
          path: |
            gold_axis_2026/apps/portfolio_guard_v1/r3_calibration_500_results.json
            gold_axis_2026/apps/portfolio_guard_v1/r3_old_128_parity.json
            gold_axis_2026/apps/portfolio_guard_v1/r3_heldout_results.json
          if-no-files-found: ignore
