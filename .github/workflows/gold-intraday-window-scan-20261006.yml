name: Gold Intraday Window Scan 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_intraday_window_scan_20261006.py'
      - '.github/workflows/gold-intraday-window-scan-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - run: python gold_axis_2026/tools/gold_intraday_window_scan_20261006.py
      - name: Record scan evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/INTRADAY_WINDOW_SCAN_OUT/summary.json gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_2026-10-06.json
          cp gold_axis_2026/INTRADAY_WINDOW_SCAN_OUT/all_windows.csv gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_ALL_2026-10-06.csv
          cp gold_axis_2026/INTRADAY_WINDOW_SCAN_OUT/robust_windows.csv gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_ROBUST_2026-10-06.csv
          cp gold_axis_2026/INTRADAY_WINDOW_SCAN_OUT/gldtr_overlap_windows.csv gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_GLDTR_OVERLAP_2026-10-06.csv
          cp gold_axis_2026/INTRADAY_WINDOW_SCAN_OUT/fixed_0800_exit_scan.csv gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_FIXED08_2026-10-06.csv
          cp gold_axis_2026/INTRADAY_WINDOW_SCAN_OUT/selected_window_daily_details.csv gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_SELECTED_DETAILS_2026-10-06.csv
          git add gold_axis_2026/GOLD_INTRADAY_WINDOW_SCAN_*
          if ! git diff --cached --quiet; then
            git commit -m "Record causal intraday window scan"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
