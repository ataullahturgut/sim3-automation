          s=s.replace('assert sum(v == "ACTIVE" for v in statuses.values()) == 1', 'assert sum(v == "ACTIVE" for v in statuses.values()) == 6')
          s=s.replace('assert sum(v == "WAITING" for v in statuses.values()) == 5', 'assert sum(v == "WAITING" for v in statuses.values()) == 0')
          s,n=re.subn(r'def test_runtime_bootstrap_exact_waiting_identities\(\):.*?\n\n\ndef test_runtime_bootstrap_vw_current_reference_is_active_and_nonprospective',
                      'def test_runtime_bootstrap_exact_waiting_identities():\n    waiting = {engine_id for engine_id, spec in STATUS_SPECS.items() if spec[0] == "WAITING"}\n    assert waiting == set()\n\n\ndef test_runtime_bootstrap_vw_current_reference_is_active_and_nonprospective',s,flags=re.S)
          if n!=1: raise SystemExit('RUNTIME_TEST_WAITING_PATCH_FAILED')
