          marker='def test_runtime_bootstrap_emergency_status_codes_are_current():'
          insert='''def test_runtime_bootstrap_all_aug31_september_references_are_active_and_nonprospective():
    assert set(CURRENT_MONTH_REFERENCES) == {
        "CAUSAL_PATCH", "VW_MIDAS_MSVR_SUCCESSOR_V1", "MOMENTUM_3M", "RANDOM_WALK", "EMERGENCY_LEVEL", "EMERGENCY_REVERSAL"
    }
    for engine_id, ref in CURRENT_MONTH_REFERENCES.items():
        assert STATUS_SPECS[engine_id][0] == "ACTIVE"
        assert ref["evidence_class"] == "HISTORICAL_REPLAY"
        assert ref["target_month"] == "2026-09"
        assert ref["forecast_origin"] == "2026-08-31T21:00:00Z"
        assert ref["prospective_claim"] is False
        assert ref["canonical_authority"] is False
        assert ref["auto_selector"] == "OFF"
        assert ref["auto_ensemble"] == "OFF"


'''
          if marker not in s: raise SystemExit('RUNTIME_TEST_MARKER_MISSING')
          s=s.replace(marker,insert+marker,1)
          # Emergency codes are now active replay states.
          s=s.replace('assert STATUS_SPECS["EMERGENCY_LEVEL"][1] == "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE"',
                      'assert STATUS_SPECS["EMERGENCY_LEVEL"][1] == "ACTIVE_HISTORICAL_REPLAY_MONTH_OPEN_STATE_AVAILABLE"')
          s=s.replace('assert STATUS_SPECS["EMERGENCY_REVERSAL"][1] == "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE"',
                      'assert STATUS_SPECS["EMERGENCY_REVERSAL"][1] == "ACTIVE_HISTORICAL_REPLAY_MONTH_OPEN_STATE_AVAILABLE"')
          p.write_text(s,encoding='utf-8')

          # ---- multi-expert manifest version ----
          p=Path('gold_axis_2026/data_pipeline/multi_expert_forecast.py')
          s=p.read_text(encoding='utf-8').replace('MANIFEST_VERSION = "1.39"','MANIFEST_VERSION = "1.40"',1)
          p.write_text(s,encoding='utf-8')
          p=Path('gold_axis_2026/data_pipeline/test_multi_expert_forecast.py')
          s=p.read_text(encoding='utf-8').replace('test_manifest_v139_expert_set_is_exact_and_ordered','test_manifest_v140_expert_set_is_exact_and_ordered',1)
          p.write_text(s,encoding='utf-8')

          # ---- observability current references ----
          p=Path('gold_axis_2026/apps/engine_observability_contract.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('ALL_GOVERNED_FORECAST_DIRECTION_ENGINES_VISIBLE_V6_VW_MSVR_SUCCESSOR_V1_SEPTEMBER_REFERENCE_ACTIVE',
                      'ALL_GOVERNED_FORECAST_DIRECTION_ENGINES_VISIBLE_V7_ALL_AUG31_SEPTEMBER_REFERENCES_ACTIVE',1)
          for old,new in {
              '"default_status": "WAITING_ELIGIBLE_MONTH_END_ORIGIN",\n        "direction_vote": False,\n        "expert_id": "CAUSAL_PATCH",':'"default_status": "ACTIVE_HISTORICAL_REPLAY_CURRENT_MONTH_REFERENCE_AVAILABLE",\n        "direction_vote": False,\n        "expert_id": "CAUSAL_PATCH",',
              '"default_status": "WAITING_ELIGIBLE_MONTH_END_ORIGIN",\n        "direction_vote": False,\n        "expert_id": "MOMENTUM_3M",':'"default_status": "ACTIVE_HISTORICAL_REPLAY_CURRENT_MONTH_REFERENCE_AVAILABLE",\n        "direction_vote": False,\n        "expert_id": "MOMENTUM_3M",',
              '"default_status": "WAITING_ELIGIBLE_MONTH_END_ORIGIN",\n        "direction_vote": False,\n        "expert_id": "RANDOM_WALK",':'"default_status": "ACTIVE_HISTORICAL_REPLAY_CURRENT_MONTH_REFERENCE_AVAILABLE",\n        "direction_vote": False,\n        "expert_id": "RANDOM_WALK",',
              '"default_status": "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE",\n        "direction_vote": False,\n        "decision_key": "level_emergency",':'"default_status": "ACTIVE_HISTORICAL_REPLAY_MONTH_OPEN_STATE_AVAILABLE",\n        "direction_vote": False,\n        "decision_key": "level_emergency",',
              '"default_status": "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE",\n        "direction_vote": False,\n        "decision_key": "reversal_emergency",':'"default_status": "ACTIVE_HISTORICAL_REPLAY_MONTH_OPEN_STATE_AVAILABLE",\n        "direction_vote": False,\n        "decision_key": "reversal_emergency",',
          }.items():
              if old not in s: raise SystemExit('OBSERVABILITY_DEFAULT_PATCH_MISSING')
              s=s.replace(old,new,1)
          s=s.replace('if ref.get("forecast_value") is None:\n        return None',
                      'if ref.get("forecast_value") is None and ref.get("state_value") is None:\n        return None',1)
          s=s.replace('row["output"] = ref.get("forecast_value")',
                      'row["output"] = ref.get("forecast_value") if ref.get("forecast_value") is not None else ref.get("state_value")',1)
          p.write_text(s,encoding='utf-8')

