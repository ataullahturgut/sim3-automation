name: Gold Control v1.40 Activate Aug31 September References Once

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - '.github/workflows/gold-control-v140-activate-aug31-september-references-once.yml'

permissions:
  contents: write

jobs:
  activate-current-month-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Patch v1.40 runtime, UI contract, tests and manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---- runtime bootstrap ----
          p=Path('gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py')
          s=p.read_text(encoding='utf-8')
