          s=s.replace('Target v1.39 runtime inventory after September-reference activation:\n\n`ACTIVE 7 / WAITING 5 / BLOCKED 0 / TOTAL 12`',
                      'Target v1.40 runtime inventory after Aug31-to-September current-reference activation:\n\n`ACTIVE 12 / WAITING 0 / BLOCKED 0 / TOTAL 12`',1)
          p.write_text(s,encoding='utf-8')

          print('V140_PATCH_PASS')
          PY
