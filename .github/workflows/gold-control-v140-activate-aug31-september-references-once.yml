        "reference_kind": "HISTORICAL_REPLAY_CURRENT_MONTH_REFERENCE", "evidence_class": "HISTORICAL_REPLAY",
        "target_month": "2026-09", "forecast_origin": "2026-08-31T21:00:00Z", "information_cutoff": "2026-08-31T21:00:00Z",
        "source_origin_boundary": "2026-08-31", "replay_executed_at": "2026-09-06T19:18:23Z",
