          old='''        if engine_id == "VW_MIDAS_MSVR_SUCCESSOR_V1":
            metadata.update(
                {
                    "model_status": "ACTIVE_RESEARCH_SHADOW_HISTORICAL_REPLAY_CURRENT_MONTH_REFERENCE",
