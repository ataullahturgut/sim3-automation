        "replay_executed_at": "2026-09-03T19:21:35Z", "forecast_value": 4397.305673870967, "unit": "USD/oz",
        "input_fingerprint": "1ab3d6a747d191d44476cec1d772766eb2e801c566213223c8d95a88aaf6fca7",
        "canonical_authority": False, "prospective_claim": False, "auto_selector": "OFF", "auto_ensemble": "OFF",
