          s=s.replace(old,new,1)
          s=s.replace('{"active": 7, "waiting": 5, "blocked": 0}', '{"active": 12, "waiting": 0, "blocked": 0}')
          s=s.replace('RUNTIME_BOOTSTRAP_V139_COUNTS_INVALID', 'RUNTIME_BOOTSTRAP_V140_COUNTS_INVALID')
