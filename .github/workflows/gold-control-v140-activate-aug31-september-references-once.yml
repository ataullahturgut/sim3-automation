name: Gold Control v1.40 Activate Aug31 September References Once

on:
  push:
    branches:
      - gold-r4-direction-engine
    paths:
      - '.github/workflows/gold-control-v140-activate-aug31-september-references-once.yml'
      - 'gold_axis_2026/tools/apply_manifest_v1_40_current_references.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate-current-month-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply deterministic v1.40 patch
        run: python gold_axis_2026/tools/apply_manifest_v1_40_current_references.py
      - name: Install test runtime
        run: python -m pip install 'psycopg[binary]==3.3.5' pytest
      - name: Compile changed Python
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py
          python -m py_compile gold_axis_2026/data_pipeline/multi_expert_forecast.py
          python -m py_compile gold_axis_2026/apps/engine_observability_contract.py
      - name: Run deterministic governance tests
        run: |
          cd gold_axis_2026/data_pipeline
          pytest -q test_data_evidence_spine.py test_data_evidence_spine_preflight.py test_data_evidence_spine_runtime_bootstrap.py test_multi_expert_forecast.py test_multi_expert_early_indicative.py
      - name: Assert v1.40 state
        run: |
          grep -q 'Manifest version:.*1.40' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'ACTIVE 12 / WAITING 0 / BLOCKED 0 / TOTAL 12' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'ACTIVE_HISTORICAL_REPLAY_CURRENT_MONTH_REFERENCE_AVAILABLE' gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py
          grep -q 'ACTIVE_HISTORICAL_REPLAY_MONTH_OPEN_STATE_AVAILABLE' gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py
      - name: Commit canonical v1.40
        run: |
          git config user.name 'gold-control-governance-bot'
          git config user.email 'gold-control-governance-bot@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py gold_axis_2026/data_pipeline/test_data_evidence_spine_runtime_bootstrap.py gold_axis_2026/data_pipeline/multi_expert_forecast.py gold_axis_2026/data_pipeline/test_multi_expert_forecast.py gold_axis_2026/apps/engine_observability_contract.py
          git commit -m 'Gold Control v1.40: activate Aug31 September references'
          git push origin HEAD:gold-r4-direction-engine
