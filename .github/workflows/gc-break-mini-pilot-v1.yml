name: GC-BREAK Mini Pilot V1

on:
  push:
    branches:
      - gc-break-wp1-formation-backfill
    paths:
      - '.github/workflows/gc-break-mini-pilot-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mini-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      FULL_RUN_ID: '34774218686'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research-only dependencies
        run: python -m pip install --quiet numpy pandas scipy

      - name: Compile frozen mini-pilot tools
        run: |
          test -n "$TWELVE_DATA_API_KEY"
          python -m py_compile gold_axis_2026/tools/gc_break_wp1_resume_exact_ny17_batch_v3.py
          python -m py_compile gold_axis_2026/tools/gc_break_mini_pilot_v1.py

      - name: Wait for active full backfill to release provider quota
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            status="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FULL_RUN_ID" --jq '.status')"
            conclusion="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FULL_RUN_ID" --jq '.conclusion // ""')"
            echo "full_run_status=$status conclusion=$conclusion check=$i"
            if [ "$status" != "in_progress" ] && [ "$status" != "queued" ] && [ "$status" != "waiting" ] && [ "$status" != "pending" ]; then
              echo "FULL_BACKFILL_RELEASED_PROVIDER_QUOTA"
              exit 0
            fi
            sleep 60
          done
          echo "BLOCKED_DATA:FULL_BACKFILL_STILL_ACTIVE_AFTER_WAIT"
          exit 1

      - name: Download immutable 2024 Jan-Aug source probe
        run: |
          mkdir -p /tmp/pilot_source
          gh run download 34772568656 --repo "$GITHUB_REPOSITORY" --name gc-break-wp1-formation-ny17-v1 --dir /tmp/pilot_source
          test -f /tmp/pilot_source/2024_JAN_AUG_probe.csv

      - name: Mini WP1 fill only 2024 Jan-Aug exact NY17 gaps
        run: |
          python gold_axis_2026/tools/gc_break_wp1_resume_exact_ny17_batch_v3.py \
            --probe-csv /tmp/pilot_source/2024_JAN_AUG_probe.csv \
            --window-days 3 \
            --pacing-seconds 8.5 \
            --backoff-seconds 70 \
            --checkpoint-every-windows 5 \
            --output-dir /tmp/gc_break_mini_pilot/wp1_exact

      - name: Mini WP1-WP3 state break and baseline pilot
        run: |
          python gold_axis_2026/tools/gc_break_mini_pilot_v1.py \
            --probe-csv /tmp/gc_break_mini_pilot/wp1_exact/gc_break_wp1_exact_ny17_consolidated_batch_v3.csv \
            --output-dir /tmp/gc_break_mini_pilot/results

      - name: Assert research-only no database-write boundary
        run: |
          ! grep -Eiq 'psycopg|NEON_DATABASE_URL|\b(insert|update|delete|truncate|alter|drop|create)[[:space:]]' \
            gold_axis_2026/tools/gc_break_wp1_resume_exact_ny17_batch_v3.py \
            gold_axis_2026/tools/gc_break_mini_pilot_v1.py
          echo 'GC_BREAK_MINI_PILOT_READ_ONLY_PASS'

      - name: Upload immutable mini-pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-mini-pilot-v1
          if-no-files-found: warn
          retention-days: 90
          path: /tmp/gc_break_mini_pilot/
