name: Gold MIDAS MOGP ICM Empirical V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_mogp_icm_empirical_v1.py
      - .github/workflows/gold-midas-mogp-icm-empirical-v1.yml

permissions:
  contents: read

jobs:
  mogp-icm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_mogp_icm_empirical_v1.py gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_mogp_icm_empirical_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_mogp_icm_empirical_v1_result.json'))
          print('OUTPUT_GATE=PASS')
          print(json.dumps({'selected_spec':r['selected_spec'],'dev':r['dev']['metrics'],'transport_2025':r['transport_2025']['metrics'],'stress_2026':r['stress_2026']['metrics']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-mogp-icm-empirical-v1-${{ github.sha }}
          path: vw_midas_mogp_icm_empirical_v1_result.json
          retention-days: 30
