name: Gold Monthly Market Regime Prototype Alignment V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_market_regime_prototype_alignment_v1.py
      - .github/workflows/gold-monthly-market-regime-prototype-alignment-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install             'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scipy>=1.13,<2'             'scikit-learn>=1.5,<2' 'hmmlearn>=0.3.3,<0.4'             'ruptures>=1.1.9,<2' 'requests>=2.32,<3'             'openpyxl>=3.1,<4' 'lxml>=5,<7'

      - name: Download frozen regime artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/discovery inputs/comparison
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11097041821/zip" > discovery.zip
          unzip -q discovery.zip -d inputs/discovery
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11104223104/zip" > comparison.zip
          unzip -q comparison.zip -d inputs/comparison
          test -f inputs/discovery/GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json
          test -f inputs/comparison/GOLD_MONTHLY_MARKET_REGIME_ANCHORED_COMPARISON_V1_2026-09-30.json

      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_market_regime_prototype_alignment_v1.py

      - name: Run prototype alignment
        run: |
          cd gold_axis_2026/tools
          python gold_monthly_market_regime_prototype_alignment_v1.py             --regime-discovery-json ../../inputs/discovery/GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json             --prior-comparison-json ../../inputs/comparison/GOLD_MONTHLY_MARKET_REGIME_ANCHORED_COMPARISON_V1_2026-09-30.json             --output ../../GOLD_MONTHLY_MARKET_REGIME_PROTOTYPE_ALIGNMENT_V1_2026-09-30.json

      - name: Scientific governance gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_MARKET_REGIME_PROTOTYPE_ALIGNMENT_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scientific_gate']=='PASS'
          assert r['underlying_fit_reproduction']['EXPANDING_REFIT']['pass'] is True
          assert r['underlying_fit_reproduction']['ANNUAL_ANCHORED']['pass'] is True
          assert r['underlying_fit_reproduction']['predictive_log_score_changed_by_alignment'] is False
          assert r['period_results']['core_2022_01_2026_08']['EXPANDING_REFIT']['old_gold_r1_mapping']['n_months']==56
          assert r['period_results']['core_2022_01_2026_08']['ANNUAL_ANCHORED']['prototype_alignment']['n_months']==56
          assert r['period_results']['transport_2025_01_2026_08']['EXPANDING_REFIT']['prototype_alignment']['n_months']==20
          g=r['governance']
          assert g['prototype_reference_period_ends_2024_12'] is True
          assert g['prototype_used_only_for_semantic_mapping'] is True
          assert g['hmm_parameters_changed_by_alignment'] is False
          assert g['posterior_probabilities_changed_by_alignment'] is False
          assert g['predictive_log_score_changed_by_alignment'] is False
          assert g['alarm_selection_tested'] is False
          assert g['alarm_weighting_tested'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'core':r['period_results']['core_2022_01_2026_08'],
            'transport':r['period_results']['transport_2025_01_2026_08'],
            'key_checkpoints':r['key_checkpoints'],
            'transitions':r['transitions'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-market-regime-prototype-alignment-v1-${{ github.sha }}
          path: GOLD_MONTHLY_MARKET_REGIME_PROTOTYPE_ALIGNMENT_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
