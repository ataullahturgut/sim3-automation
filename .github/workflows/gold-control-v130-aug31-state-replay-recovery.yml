name: Gold Control V1.30 Aug31 State Replay Recovery

on:
  workflow_dispatch:
  push:
    branches: [gold-control-aug31-state-replay-v130]
    paths:
      - 'gold_axis_2026/tools/export_production_display_snapshot.py'
      - 'gold_axis_2026/tools/export_aug31_state_replay_snapshot.py'
      - '.github/workflows/gold-control-v130-aug31-state-replay-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-aug31-state-replay-v130
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked snapshot runtime
        run: pip install 'psycopg[binary]==3.3.5'
      - name: Verify frozen v1.30 authority locks
        run: |
          test -n "$NEON_DATABASE_URL"
          grep -Fq '**Manifest version:** 1.30' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_DATA_EVIDENCE_SPINE_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_AUG31_EOD_STATE_REPLAY_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_AUG31_STATE_REPLAY_DISPLAY_SNAPSHOT_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_EXPERT_SELECTION_RULE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'AUTO_SELECTOR=OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'AUTO_ENSEMBLE=OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_POSITION_MAPPING' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
      - name: Export fresh production snapshots twice and prove determinism
        run: |
          python gold_axis_2026/tools/export_production_display_snapshot.py --out /tmp/production_a.json
          python gold_axis_2026/tools/export_production_display_snapshot.py --out /tmp/production_b.json
          cmp /tmp/production_a.json /tmp/production_b.json
          python gold_axis_2026/tools/export_aug31_state_replay_snapshot.py --out /tmp/aug31_a.json
          python gold_axis_2026/tools/export_aug31_state_replay_snapshot.py --out /tmp/aug31_b.json
          cmp /tmp/aug31_a.json /tmp/aug31_b.json
          echo 'V130_SNAPSHOT_EXPORT_DETERMINISM_PASS'
      - name: Validate fresh production authority state
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/production_a.json',encoding='utf-8'))
          a=json.load(open('/tmp/aug31_a.json',encoding='utf-8'))
          assert p['source']=='NEON_PRODUCTION_READ_ONLY_EXPORT'
          assert p['database_writes']=='NONE'
          assert len(p['runtime'])==12
          assert len(p['features'])==7
          assert len(p['historical_replay_experts'])==2
          assert p['context_exactly_one_link']==7
          assert p['health']['engine_runs']==18,p['health']
          assert p['health']['derived_features']==14,p['health']
          assert p['health']['canonical_forecasts']==0,p['health']
          assert p['health']['decision_snapshots']==0,p['health']
          experts={r['expert_id']:r for r in p['historical_replay_experts']}
          assert set(experts)=={'MOMENTUM_3M','RANDOM_WALK'}
          assert experts['MOMENTUM_3M']['forecast_value']==4345.814584037808
          assert experts['RANDOM_WALK']['forecast_value']==4397.305673870967
          assert all(r['auto_selector']=='OFF' and r['auto_ensemble']=='OFF' and not r['canonical_authority'] for r in experts.values())
          assert a['source']=='NEON_PRODUCTION_READ_ONLY_EXPORT'
          assert a['database_writes']=='NONE'
          assert len(a['features'])==7
          vals={r['feature_name']:r['value_text'] for r in a['features']}
          assert vals=={
            'AUG31_REPLAY_MONTHLY_DIRECTION_3M':'DOWN',
            'AUG31_REPLAY_FAST_STATE':'ROBUST_UP',
            'AUG31_REPLAY_SLOW_STATE':'ROBUST_UP',
            'AUG31_REPLAY_GVZ_VALUE':'24.40',
            'AUG31_REPLAY_GVZ_CAP':'1.0',
            'AUG31_REPLAY_GVZ_PANIC':'false',
            'AUG31_REPLAY_GVZ_REGIME':'NORMAL',
          },vals
          print('V130_FRESH_PRODUCTION_SNAPSHOT_AUTHORITY_PASS health=18/14 replay=2 features=7 decision=0 writes=NONE')
          PY
      - name: Replace only committed deployment snapshots
        run: |
          cp /tmp/production_a.json gold_axis_2026/apps/production_display_snapshot.json
          cp /tmp/aug31_a.json gold_axis_2026/apps/aug31_state_replay_snapshot.json
          git diff --check -- gold_axis_2026/apps/production_display_snapshot.json gold_axis_2026/apps/aug31_state_replay_snapshot.json
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(gold_axis_2026/apps/production_display_snapshot\.json|gold_axis_2026/apps/aug31_state_replay_snapshot\.json)$'; then
            echo 'UNEXPECTED_FILE_CHANGE'; exit 1
          fi
      - name: Commit exact fresh production snapshots
        run: |
          git add gold_axis_2026/apps/production_display_snapshot.json gold_axis_2026/apps/aug31_state_replay_snapshot.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'gold-control: refresh v1.30 production deployment snapshots'
          git push origin HEAD:gold-control-aug31-state-replay-v130
