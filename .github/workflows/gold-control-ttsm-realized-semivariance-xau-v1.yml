name: Gold Control TTSM Realized Semivariance XAU V1

on:
  push:
    branches:
      - gold-direction-ttsm-semivariance-v1-20260921
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_PREREG_2026-09-21.md'
      - 'gold_axis_2026/tools/direction_ttsm_realized_semivariance_xau_v1.py'
      - '.github/workflows/gold-control-ttsm-realized-semivariance-xau-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-ttsm-realized-semivariance-xau-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-ttsm-semivariance-v1-20260921
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'psycopg[binary]>=3.2,<4'

      - name: Compile implementation
        run: python -m py_compile gold_axis_2026/tools/direction_ttsm_realized_semivariance_xau_v1.py

      - name: Assert read-only implementation
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table'             gold_axis_2026/tools/direction_ttsm_realized_semivariance_xau_v1.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/direction_ttsm_realized_semivariance_xau_v1.py
          echo 'TTSM_READ_ONLY_PASS'

      - name: Run pre-2025 freeze
        run: |
          rm -rf ttsm_pre2025
          mkdir -p ttsm_pre2025
          python gold_axis_2026/tools/direction_ttsm_realized_semivariance_xau_v1.py             --stage pre2025             --outdir ttsm_pre2025

      - name: Freeze pre-2025 evidence before 2025 replay
        run: |
          cp ttsm_pre2025/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_SOURCE_AUDIT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_FROZEN_CONFIG_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_PRE2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_2022_SIGNALS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_2023_SIGNALS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_2024_SIGNALS_2026-09-21.csv
          git commit -m 'Freeze TTSM pre-2025 evidence'
          git push origin HEAD:gold-direction-ttsm-semivariance-v1-20260921

      - name: Run unchanged locked 2025 replay
        run: |
          rm -rf ttsm_2025
          mkdir -p ttsm_2025
          python gold_axis_2026/tools/direction_ttsm_realized_semivariance_xau_v1.py             --stage 2025             --outdir ttsm_2025             --config gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_FROZEN_CONFIG_2026-09-21.json             --pre-result gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_PRE2025_RESULT_2026-09-21.json

      - name: Freeze challenge outputs
        run: |
          cp ttsm_2025/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_2025_SIGNALS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_TTSM_REALIZED_SEMIVARIANCE_XAU_V1_RESULT_2026-09-21.md
          git commit -m 'Freeze TTSM 2025 challenge'
          git push origin HEAD:gold-direction-ttsm-semivariance-v1-20260921

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-ttsm-realized-semivariance-xau-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            ttsm_pre2025/
            ttsm_2025/
