name: Gold August 2026 Selector R5
on:
  push:
    paths:
      - 'projects/gold_h1_r1/run_august_2026_selector_r5.py'
      - '.github/workflows/gold_august_2026_selector_r5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn
      - run: python projects/gold_h1_r1/run_august_2026_selector_r5.py
      - name: Commit selector result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/gold_h1_r1/AUGUST_2026_SELECTOR_R5.json projects/gold_h1_r1/AUGUST_2026_SELECTOR_R5.csv
          git diff --cached --quiet || git commit -m 'Run August 2026 selector R5'
          git push
