name: Gold Session Stage1 Global Controls 2025 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_stage1_global_controls_2025_20261007.py'
      - '.github/workflows/gold-session-stage1-global-controls-2025-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - run: python -m py_compile gold_axis_2026/tools/gold_session_stage1_global_controls_2025_20261007.py
      - run: python gold_axis_2026/tools/gold_session_stage1_global_controls_2025_20261007.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_STAGE1_GLOBAL_CONTROLS_2025_OUT/summary.json gold_axis_2026/GOLD_SESSION_STAGE1_GLOBAL_CONTROLS_2025_SUMMARY_2026-10-07.json
          cp gold_axis_2026/SESSION_STAGE1_GLOBAL_CONTROLS_2025_OUT/metrics.csv gold_axis_2026/GOLD_SESSION_STAGE1_GLOBAL_CONTROLS_2025_METRICS_2026-10-07.csv
          cp gold_axis_2026/SESSION_STAGE1_GLOBAL_CONTROLS_2025_OUT/predictions.csv gold_axis_2026/GOLD_SESSION_STAGE1_GLOBAL_CONTROLS_2025_PREDICTIONS_2026-10-07.csv
          git add gold_axis_2026/GOLD_SESSION_STAGE1_GLOBAL_CONTROLS_2025_*
          if ! git diff --cached --quiet; then
            git commit -m "Record Stage-1 global controls 2025 transport"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
