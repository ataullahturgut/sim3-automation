name: Gold Control V1.30 NY17 Gap Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-v130-ny17-gap-repair-once.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen pipeline dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require protected credentials
        run: |
          test -n "$NEON_DATABASE_URL"
          test -n "$TWELVE_DATA_API_KEY"
      - name: Compile frozen NY17 backfill path
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/twelve_xau_ny17.py
          python -m py_compile gold_axis_2026/data_pipeline/twelve_xau_ny17_backfill.py
          python gold_axis_2026/data_pipeline/twelve_xau_ny17.py --self-test
      - name: Backfill only under governed historical-retrieval semantics
        run: |
          python gold_axis_2026/data_pipeline/twelve_xau_ny17_backfill.py \
            --start 2026-07-01 \
            --end 2026-08-31 \
            --anchor 2026-09-01 \
            --anchor 2026-09-02 \
            --persist
