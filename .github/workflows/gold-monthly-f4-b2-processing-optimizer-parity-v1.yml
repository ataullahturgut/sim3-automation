name: Gold Monthly F4 B2 Processing Optimizer Parity V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_f4_b2_processing_optimizer_parity_v1.py
      - .github/workflows/gold-monthly-f4-b2-processing-optimizer-parity-v1.yml

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "\${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh api "/repos/\${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev.zip
          unzip -q dev.zip -d dev
          test -s dev/gold_monthly_dev_snapshot_v1.json
      - name: Download External Authority V2
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh api "/repos/\${GITHUB_REPOSITORY}/actions/artifacts/11028494060/zip" > ext.zip
          unzip -q ext.zip -d ext
          test -s ext/gold_monthly_external_authority_v2.json
      - name: Download authoritative B1 audit
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh api "/repos/\${GITHUB_REPOSITORY}/actions/artifacts/11028839840/zip" > b1.zip
          unzip -q b1.zip -d b1
          test -s b1/gold_monthly_f4_b1_transform_parity_v1.json
      - name: Compile B2 audit
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_f4_b2_processing_optimizer_parity_v1.py
      - name: Run B1 revalidation plus B2-A and B2-B
        run: |
          python gold_axis_2026/tools/gold_monthly_f4_b2_processing_optimizer_parity_v1.py \
            --snapshot dev/gold_monthly_dev_snapshot_v1.json \
            --external-v2 ext/gold_monthly_external_authority_v2.json \
            --b1-audit b1/gold_monthly_f4_b1_transform_parity_v1.json \
            --output gold_monthly_f4_b2_processing_optimizer_parity_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-f4-b2-processing-optimizer-parity-\${{ github.sha }}
          path: gold_monthly_f4_b2_processing_optimizer_parity_v1.json
          if-no-files-found: error
          retention-days: 90
