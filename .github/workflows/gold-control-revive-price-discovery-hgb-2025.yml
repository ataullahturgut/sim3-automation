name: Gold Control Revive PRICE_DISCOVERY_HGB 2025

on:
  workflow_dispatch:
  push:
    branches: [gold-control-revive-price-discovery-hgb-2025]
    paths:
      - 'gold_axis_2026/research_revival/price_discovery_hgb_reconstruction_v1_contract.json'
      - 'gold_axis_2026/tools/price_discovery_hgb_reconstruction_v1_2025.py'
      - '.github/workflows/gold-control-revive-price-discovery-hgb-2025.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay-2025:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FORMATION_ARTIFACT_ID: '10338387444'
      CHALLENGE_ARTIFACT_ID: '10343971259'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: python -m pip install --quiet numpy pandas scikit-learn 'psycopg[binary]'
      - name: Require frozen contract
        run: |
          test -n "$NEON_DATABASE_URL"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('gold_axis_2026/research_revival/price_discovery_hgb_reconstruction_v1_contract.json').read_text())
          assert c['status']=='FROZEN_BEFORE_2025_REPLAY'
          assert c['split']['challenge_refit'] is False
          assert c['split']['challenge_hyperparameter_search'] is False
          assert c['split']['challenge_threshold_search'] is False
          print('CONTRACT_FREEZE_OK')
          PY
      - name: Download exact NY17 artifacts
        run: |
          mkdir -p /tmp/pd/wp1 /tmp/pd/ch2025 /tmp/pd/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FORMATION_ARTIFACT_ID}/zip" > /tmp/pd/wp1.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHALLENGE_ARTIFACT_ID}/zip" > /tmp/pd/ch2025.zip
          unzip -q /tmp/pd/wp1.zip -d /tmp/pd/wp1
          unzip -q /tmp/pd/ch2025.zip -d /tmp/pd/ch2025
          HIST=$(find /tmp/pd/wp1 -type f -name 'gc_break_wp1_exact_ny17_consolidated_batch_v3.csv' | head -n1)
          CH=$(find /tmp/pd/ch2025 -type f -name 'gc_break_wp1_exact_ny17_consolidated_batch_v3.csv' | head -n1)
          test -n "$HIST" && test -f "$HIST" && test -n "$CH" && test -f "$CH"
          echo "HIST=$HIST" >> "$GITHUB_ENV"
          echo "CH=$CH" >> "$GITHUB_ENV"
      - name: Extract retrospective cross-metal research series
        run: |
          python - <<'PY'
          import csv, os, psycopg
          sids=['XAG_STAKTRAKR_RESEARCH_DAILY_R1','XPT_STAKTRAKR_RESEARCH_DAILY_R1','XPD_STAKTRAKR_RESEARCH_DAILY_R1']
          out='/tmp/pd/cross_metals.csv'
          with psycopg.connect(os.environ['NEON_DATABASE_URL']) as conn:
              with conn.cursor() as cur, open(out,'w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(['series_id','observation_ts','value'])
                  cur.execute("""SELECT series_id, observation_ts, value FROM public.observations WHERE series_id=ANY(%s) AND observation_ts >= %s AND observation_ts < %s ORDER BY series_id, observation_ts""", (sids,'2021-01-01','2026-01-02'))
                  n=0
                  while True:
                      rows=cur.fetchmany(10000)
                      if not rows: break
                      w.writerows(rows); n += len(rows)
          print({'cross_rows':n,'path':out})
          assert n > 3000
          PY
          echo "CROSS_SHA256=$(sha256sum /tmp/pd/cross_metals.csv | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Compile runner
        run: python -m py_compile gold_axis_2026/tools/price_discovery_hgb_reconstruction_v1_2025.py
      - name: Fit 2022-2024 and score 2025
        run: |
          python gold_axis_2026/tools/price_discovery_hgb_reconstruction_v1_2025.py \
            --historical-exact "$HIST" \
            --challenge-exact "$CH" \
            --cross-csv /tmp/pd/cross_metals.csv \
            --contract gold_axis_2026/research_revival/price_discovery_hgb_reconstruction_v1_contract.json \
            --output-dir /tmp/pd/out | tee /tmp/pd/out/run.log
      - name: Audit output
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/pd/out/price_discovery_hgb_reconstruction_v1_2025_summary.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS'
          assert d['original_identity_recovered'] is False
          assert d['challenge_refit'] is False and d['hyperparameter_search'] is False and d['threshold_search'] is False
          assert d['post_challenge_tuning'] is False
          assert d['challenge_feature_complete_rows'] >= 180
          d['cross_input_sha256']=os.environ['CROSS_SHA256']
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print('PRICE_DISCOVERY_HGB_RECONSTRUCTION_2025_PASS')
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: price-discovery-hgb-reconstruction-v1-2025
          path: /tmp/pd/out/
          if-no-files-found: error
          retention-days: 90
