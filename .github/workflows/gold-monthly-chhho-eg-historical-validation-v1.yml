name: Gold Monthly ChHHO E/G Historical Validation V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_eg_historical_validation_v1.py
      - .github/workflows/gold-monthly-chhho-eg-historical-validation-v1.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'xlrd>=2.0,<3' 'requests>=2.32,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_eg_historical_validation_v1.py
      - name: Run historical validation
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: python gold_axis_2026/tools/gold_monthly_chhho_eg_historical_validation_v1.py
      - name: Gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_CHHHO_EG_HISTORICAL_VALIDATION_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['governance']['database_read_only'] is True
          assert r['governance']['pit_validation_claim_allowed'] is False
          assert r['market_state']['signals']['G']['events']==5
          assert r['market_state']['signals']['E_level']['events']==3
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps(r['model_replay_summary'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-eg-historical-validation-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_EG_HISTORICAL_VALIDATION_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
