name: Gold Control V1.64 adaptive error-memory forecaster research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v164_research/**"
      - "gold_axis_2026/tests/test_v164_adaptive_error_memory.py"
      - ".github/workflows/gold-control-v164-adaptive-error-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-error-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 requests==2.32.5 pytest==8.4.2
      - name: Test V1.64 chronology, error-memory and governance locks
        run: python -m pytest -q gold_axis_2026/tests/test_v164_adaptive_error_memory.py
      - name: Run V1.64 frozen retrospective adaptive forecaster audit
        run: python -m gold_axis_2026.v164_research.run_v164_adaptive_error_memory
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v164-adaptive-error-memory-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v164_research/
