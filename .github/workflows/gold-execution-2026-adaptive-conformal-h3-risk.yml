name: Gold 2026 Adaptive Conformal Safe Selective Two Session Research
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_adaptive_conformal_selective_20261009.py
      - .github/workflows/gold-execution-2026-adaptive-conformal-h3-risk.yml
permissions:
  contents: write
concurrency:
  group: gold-conformal-singleton-CBR-HGB-frozen-calibration
  cancel-in-progress: false
jobs:
  causal-conformal:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4' 'requests>=2.32,<3'
      - name: Run true previous-matured score conformal risk-control 2023-2026 two windows and two price sources
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_adaptive_conformal_selective_20261009.py
          python gold_axis_2026/tools/gold_execution_2026_adaptive_conformal_selective_20261009.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-conformal-2026-dated-source-private
          path: gold_axis_2026/GOLD_EXECUTION_2026_ADAPTIVE_CONFORMAL_SELECTIVE_20261009_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Commit only aggregate results or explicit fail-closed QC
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_ADAPTIVE_CONFORMAL_SELECTIVE_20261009_{SUMMARY.json,YEAR_METRICS.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Audit actual conformal ACI distribution-shift aware 09 17 clock abstention on CBR and HGB 2023-26'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
