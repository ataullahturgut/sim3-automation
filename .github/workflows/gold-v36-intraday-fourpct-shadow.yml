name: Gold V36 Intraday Four-Pct Early-Warning Research (no live alerts)
on:
  workflow_dispatch:
  push:
    branches: [research/gold-intraday-fourpct-shadow-20261030]
    paths:
      - '.github/workflows/gold-v36-intraday-fourpct-shadow.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v36_intraday_anomaly_shadow_v1.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v36_intraday_anomaly_shadow_v1.py'
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and leakage tests (no Neon writes)
        run: |
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v36_intraday_anomaly_shadow_v1.py
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v36_intraday_anomaly_shadow_v1.py -v
      - name: Install read-only Neon client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify database connection configured
        run: test -n "$NEON_DATABASE_URL"
      - name: Original historical prices, training-only thresholds, 2026 research audit
        run: |
          python gold_axis_2026/research/case_control_v13/risk_v36_intraday_anomaly_shadow_v1.py --out gold-intraday-research-shadow-v1.json
      - name: Archive results even if research computation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v36-intraday-fourpct-research-only
          path: gold-intraday-research-shadow-v1.json
          if-no-files-found: warn
          retention-days: 30
