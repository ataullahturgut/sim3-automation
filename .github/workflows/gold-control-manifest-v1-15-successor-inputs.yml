name: Gold Control Manifest v1.15 Successor Inputs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold-control-manifest-v1-15-successor-inputs.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v1.15 reconciliation
        run: python gold_axis_2026/tools/reconcile_manifest_v1_15_successor_inputs.py
      - name: Verify scoped manifest change
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sed '/^$/d' | wc -l)" -eq 1
          git diff --name-only | grep -Fx 'gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md'
          grep -F '**Manifest version:** 1.15' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'XAU_MONTHLY_WB_PINKSHEET' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'GOLD_CONTROL_H1_SUCCESSOR_VALIDATION_CONTRACT_R2.md' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F '33538748716' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'RUN THE FROZEN SUCCESSOR R2 HISTORICAL REPLAY' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
      - name: Commit manifest v1.15 to canonical branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git commit -m 'gold-control: reconcile successor inputs manifest v1.15'
          git push origin HEAD:gold-r4-direction-engine
