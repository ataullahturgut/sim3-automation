name: Gold Session VEGA V1 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_vega_v1_20261007.py'
      - '.github/workflows/gold-session-vega-v1-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - run: python -m py_compile gold_axis_2026/tools/gold_session_vega_v1_20261007.py
      - run: python gold_axis_2026/tools/gold_session_vega_v1_20261007.py
      - name: Record VEGA evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_VEGA_V1_OUT/summary.json gold_axis_2026/GOLD_SESSION_VEGA_V1_SUMMARY_2026-10-07.json
          cp gold_axis_2026/SESSION_VEGA_V1_OUT/result.md gold_axis_2026/GOLD_SESSION_VEGA_V1_RESULT_2026-10-07.md
          cp gold_axis_2026/SESSION_VEGA_V1_OUT/metrics.csv gold_axis_2026/GOLD_SESSION_VEGA_V1_METRICS_2026-10-07.csv
          cp gold_axis_2026/SESSION_VEGA_V1_OUT/transport_eligibility.csv gold_axis_2026/GOLD_SESSION_VEGA_V1_TRANSPORT_ELIGIBILITY_2026-10-07.csv
          cp gold_axis_2026/SESSION_VEGA_V1_OUT/vega_predictions.csv gold_axis_2026/GOLD_SESSION_VEGA_V1_PREDICTIONS_2026-10-07.csv
          if [ -f gold_axis_2026/SESSION_VEGA_V1_OUT/changed_calls.csv ]; then
            cp gold_axis_2026/SESSION_VEGA_V1_OUT/changed_calls.csv gold_axis_2026/GOLD_SESSION_VEGA_V1_CHANGED_CALLS_2026-10-07.csv
          fi
          git add gold_axis_2026/GOLD_SESSION_VEGA_V1_*
          if ! git diff --cached --quiet; then
            git commit -m "Record session VEGA V1 development result"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
