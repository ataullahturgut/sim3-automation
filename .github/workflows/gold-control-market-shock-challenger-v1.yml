name: Gold Control Market Shock Challenger V1

on:
  push:
    branches:
      - gold-control-market-shock-challenger-v1
    paths:
      - '.github/workflows/gold-control-market-shock-challenger-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-control-market-shock-challenger-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TWELVE_MIN_REQUEST_INTERVAL_SECONDS: '9.0'
      GOLD_CODE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-market-shock-challenger-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation runtime
        run: pip install -q pandas numpy scipy requests
      - name: Require protected Twelve credential
        run: test -n "$TWELVE_DATA_API_KEY"
      - name: Compile challenger
        run: python -m py_compile gold_axis_2026/tools/market_shock_challenger_v1.py
      - name: Run walk-forward historical and synthetic-injection validation
        run: |
          python gold_axis_2026/tools/market_shock_challenger_v1.py \
            --start '2020-04-06 00:00:00' \
            --end '2026-08-31 23:59:59' \
            --output market_shock_challenger_v1_report.json
      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-market-shock-challenger-v1-report
          path: market_shock_challenger_v1_report.json
          if-no-files-found: error
