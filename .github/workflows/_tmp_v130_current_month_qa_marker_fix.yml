name: TEMP V1.30 Current-Month QA Marker Fix

on:
  push:
    branches:
      - gold-control-v130-current-month-replay-context-fix
    paths:
      - '.github/workflows/_tmp_v130_current_month_qa_marker_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v130-current-month-replay-context-fix
          fetch-depth: 0
      - name: Patch QA marker and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/apps/mobile_viewport_qa.py')
          s=p.read_text(encoding='utf-8')
          old='''        forecast_hero_marker="EYLÜL 2026 H=1 REPLAY" if "EYLÜL 2026 H=1 REPLAY" in tahmin_body else "GELECEK AY TAHMİNİ"'''
          new='''        if "EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE" in tahmin_body:\n            forecast_hero_marker="EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE"\n        elif "EYLÜL 2026 H=1 REPLAY" in tahmin_body:\n            forecast_hero_marker="EYLÜL 2026 H=1 REPLAY"\n        else:\n            forecast_hero_marker="GELECEK AY TAHMİNİ"'''
          if old not in s:
              raise SystemExit('QA marker anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile gold_axis_2026/apps/mobile_viewport_qa.py
          grep -Fq 'CURRENT-MONTH REFERENCE' gold_axis_2026/apps/mobile_viewport_qa.py
      - name: Commit and self-remove
        run: |
          rm .github/workflows/_tmp_v130_current_month_qa_marker_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/apps/mobile_viewport_qa.py .github/workflows/_tmp_v130_current_month_qa_marker_fix.yml
          git commit -m 'test: recognize current-month replay hero semantics'
          git push origin HEAD:gold-control-v130-current-month-replay-context-fix
