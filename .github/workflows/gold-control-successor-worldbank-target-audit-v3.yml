name: Gold Control Successor World Bank Target Audit V3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold-control-successor-worldbank-target-audit-v3.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit runtime
        run: pip install pandas numpy openpyxl requests
      - name: Audit World Bank historical target identity and NY17 overlap
        run: python gold_axis_2026/tools/audit_successor_worldbank_target.py
