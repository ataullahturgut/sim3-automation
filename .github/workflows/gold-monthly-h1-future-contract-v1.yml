name: GOLD MONTHLY H1 future source and Neon publish contract
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-h1-future-contract-v1.yml
      - .github/workflows/gold-monthly-h1-prospective-neon-v1.yml
      - gold_axis_2026/tools/gold_monthly_h1_origin_public_bundle_v1.py
      - gold_axis_2026/tools/gold_monthly_h1_forward_monthly_v1.py
      - gold_axis_2026/tools/gold_monthly_h1_publish_neon_v1.py
      - gold_axis_2026/tools/test_gold_monthly_h1_future_pipeline_v1.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-scientific-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ''
      GOLD_MONTHLY_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'pandas>=2.2,<3' 'scipy==1.17.0' 'xlrd==2.0.2' 'psycopg[binary]>=3.2,<4'
      - name: Compile 3 independent new model pipeline modules
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_origin_public_bundle_v1.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_forward_monthly_v1.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_publish_neon_v1.py
      - name: Run no-network/no-Neon behavioral tests
        run: python gold_axis_2026/tools/test_gold_monthly_h1_future_pipeline_v1.py -v
