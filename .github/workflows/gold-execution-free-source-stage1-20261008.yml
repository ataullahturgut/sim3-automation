name: Gold Execution Free Source Stage 1 20261008

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_free_history_stage1_20261008.py'
      - '.github/workflows/gold-execution-free-source-stage1-20261008.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-execution-free-source-stage1-20261008
  cancel-in-progress: false

jobs:
  free-sources-and-access-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source clients
        run: pip install --disable-pip-version-check 'pandas>=2.2,<3' 'requests>=2.31,<3' 'databento>=0.60,<1'

      - name: Compile and fetch FREE official candidates, PROBE existing APIs
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/tools/gold_execution_free_history_stage1_20261008.py
          python gold_axis_2026/tools/gold_execution_free_history_stage1_20261008.py

      - name: Upload source and access audit (available even on partial source failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-free-stage1-20261008
          retention-days: 30
          if-no-files-found: warn
          path: |
            gold_axis_2026/GOLD_EXECUTION_FREE_SOURCE_STAGE1_2026-10-08.json
            gold_axis_2026/GOLD_EXECUTION_*_FREE_CANDIDATE_2020_20261007.csv

      - name: Preserve official free data and auditable source status on current branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_EXECUTION_FREE_SOURCE_STAGE1_2026-10-08.json
          for file in gold_axis_2026/GOLD_EXECUTION_*_FREE_CANDIDATE_2020_20261007.csv; do
            test ! -f "$file" || git add "$file"
          done
          if git diff --cached --quiet; then
            echo "No changed source evidence to record"
            exit 0
          fi
          git commit -m "Record free 2020-2026 daily candidates and no-charge vendor preflight"
          git fetch origin gold-execution-channel-audit-20261006
          git rebase origin/gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
