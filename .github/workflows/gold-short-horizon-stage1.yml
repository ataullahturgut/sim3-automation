name: Gold Short Horizon Stage1 Model Screen

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_stage1.py'
      - 'gold_axis_2026/tools/gold_short_horizon_stage1_aggregate.py'
      - '.github/workflows/gold-short-horizon-stage1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        horizon: [1, 3, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests scikit-learn lightgbm xgboost
      - name: Run horizon screen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON: ${{ matrix.horizon }}
          OUT_DIR: stage1_h${{ matrix.horizon }}
        run: python gold_axis_2026/tools/gold_short_horizon_stage1.py
      - name: Upload horizon result
        uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-stage1-h${{ matrix.horizon }}
          path: stage1_h${{ matrix.horizon }}/
          retention-days: 90

  aggregate:
    needs: screen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gold-short-horizon-stage1-h*
          path: downloaded
      - name: Arrange horizon artifacts
        run: |
          mkdir -p h1 h3 h5
          cp downloaded/gold-short-horizon-stage1-h1/* h1/
          cp downloaded/gold-short-horizon-stage1-h3/* h3/
          cp downloaded/gold-short-horizon-stage1-h5/* h5/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate dependencies
        run: pip install --disable-pip-version-check numpy pandas
      - name: Aggregate and score
        run: python gold_axis_2026/tools/gold_short_horizon_stage1_aggregate.py
      - name: Upload aggregate result
        uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-stage1-aggregate
          path: stage1_all/
          retention-days: 90
