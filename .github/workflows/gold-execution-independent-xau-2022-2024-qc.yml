name: Gold Execution Independent XAU 2022-2024 QC
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2022_2024_independent_source_qc_20261008.py'
      - '.github/workflows/gold-execution-independent-xau-2022-2024-qc.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-independent-xau-2022-2024-qc
  cancel-in-progress: false
jobs:
  audit-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free source and database tooling
        run: pip install 'histdata-fetcher>=0.1' 'pandas>=2.2,<3' 'numpy>=2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Independent yearly XAU 15-minute audit
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2022_2024_independent_source_qc_20261008.py
          python gold_axis_2026/tools/gold_execution_2022_2024_independent_source_qc_20261008.py
      - name: Save aggregate QC receipt, not licensed prices
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2022_2024_INDEPENDENT_SOURCE_QC_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2022_2024_INDEPENDENT_SOURCE_QC_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record independent source quality audit for 2022-2024 XAU USD'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
