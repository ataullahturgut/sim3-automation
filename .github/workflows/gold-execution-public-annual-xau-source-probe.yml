name: Gold Execution Public Annual XAU Data Source Probe 20261008
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_evtradelabs_public_source_probe_20261008.py'
      - '.github/workflows/gold-execution-public-annual-xau-source-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2,<3'
      - run: python gold_axis_2026/tools/gold_execution_evtradelabs_public_source_probe_20261008.py
      - name: Commit public annual-source discovery receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_EV_DATA_PUBLIC_ANNUAL_SOURCE_PROBE_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record independent full-year BID ASK gold source discovery'
          for i in 1 2 3; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 1
          done
          exit 1
