name: Gold 2026 Causal Session Absolute Move and Crash Alarm Test
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_absolute_move_risk_20261008.py
      - .github/workflows/gold-execution-2026-causal-absolute-move-risk.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-absolute-move-risk-alarm-regime
  cancel-in-progress: false
jobs:
  risk-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Test fixed 2023–2026 pre-origin overnight absolute-move regression and downside risk
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_absolute_move_risk_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_absolute_move_risk_20261008.py
      - name: Preserve dated risk details in Actions only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-absolute-move-risk-private-per-date
          path: gold_axis_2026/GOLD_EXECUTION_2026_ABSOLUTE_SESSION_RISK_TEST_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Publish aggregate experiment only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2026_ABSOLUTE_SESSION_RISK_TEST_20261008_{METRICS.csv,SUMMARY.json}
          git diff --cached --quiet || git commit -m 'Record actual gold 2026 absolute session risk, conditional severe downside and naive-MAE comparison'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
