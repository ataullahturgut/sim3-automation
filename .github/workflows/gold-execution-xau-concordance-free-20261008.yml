name: Gold Execution Free XAU Historical Concordance
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_xau15m_vendor_concordance_20261008.py'
      - '.github/workflows/gold-execution-xau-concordance-free-20261008.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_xau15m_vendor_concordance_20261008.py
      - name: Publish QC evidence without raw vendor prices
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_XAU15M_HISTDATA_TWELVE_CONCORDANCE_20261008.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_XAU15M_HISTDATA_TWELVE_CONCORDANCE_20261008.json
          git diff --cached --quiet || git commit -m 'Record free cross-vendor XAU quarter-week source comparison'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
