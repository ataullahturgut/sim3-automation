name: Gold Control V1.31 Aug31 Replay UI Patch Once

on:
  push:
    branches: [gold-control-v131-aug31-replay-expansion-v2]
    paths:
      - '.github/workflows/gold-control-v131-aug31-replay-ui-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v131-aug31-replay-expansion-v2
          fetch-depth: 1
      - name: Patch mobile UI with governed replay evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('gold_axis_2026/apps/gold_control_mobile_v1.py')
          s = p.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}_COUNT_{n}')
              s = s.replace(old, new, 1)

          replace_once(
              'from aug31_state_replay_source import fetch_aug31_state_replay\n',
              'from aug31_state_replay_source import fetch_aug31_state_replay\n'
              'from aug31_replay_expansion_source import fetch_aug31_replay_expansion\n'
              'from aug31_replay_expansion_display import attach_aug31_replay_expansion\n',
              'IMPORT_PATCH',
          )

          replace_once(
              '@st.cache_data(ttl=30, show_spinner=False)\ndef get_aug31_state_replay_cached(database_url: str): return fetch_aug31_state_replay(database_url)\n',
              '@st.cache_data(ttl=30, show_spinner=False)\n'
              'def get_aug31_state_replay_cached(database_url: str): return fetch_aug31_state_replay(database_url)\n'
              '@st.cache_data(ttl=30, show_spinner=False)\n'
              'def get_aug31_replay_expansion_cached(database_url: str): return fetch_aug31_replay_expansion(database_url)\n',
              'CACHE_PATCH',
          )

          replay_functions = '''def aug31_state_replay_html(state: dict[str, Any] | None, expansion: dict[str, Any] | None = None) -> str:
              if not state:
                  return empty_html("31 AĞUSTOS STATE REPLAY OKUNAMADI","Production Evidence Spine ve deployment replay snapshot kullanılamıyor.")
              ma,mt=arrow_state(state.get("monthly_direction_3m")); fa,ft=arrow_state(state.get("fast_state")); sa,stn=arrow_state(state.get("slow_state"))
              source="DB READ-ONLY" if state.get("source_mode")=="NEON_DB_READ_ONLY" else "SNAPSHOT FALLBACK"
              rows=(
                  html_row("Monthly Direction 3M",f"{ma} {display_state(state.get('monthly_direction_3m'),'—')}",tone_class(mt))
                  +html_row("FAST",f"{fa} {display_state(state.get('fast_state'),'—')}",tone_class(ft))
                  +html_row("SLOW",f"{sa} {display_state(state.get('slow_state'),'—')}",tone_class(stn))
                  +html_row("GVZ",f"{fmt_num(state.get('gvz_value'),2)} · {display_state(state.get('gvz_regime'),'—')}")
                  +html_row("GVZ risk cap",fmt_num(state.get("gvz_cap"),1))
              )
              if expansion:
                  blockers={
                      "VW-MIDAS-MSVR":"BLOCKED_EXACT_REPLICATION_AND_PIT_SOURCE_CONTRACT_NOT_PROVEN",
                      "Macro Event":"BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED",
                      "BOCPD · archived":display_state(expansion.get("bocpd_archived_engine_status"),"BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED"),
                  }
              else:
                  blockers=dict(state.get("blocked_components") or {})
              blocker_rows="".join(html_row(k,v,"gc-warning") for k,v in blockers.items())
              return (
                  "<div class='gc-card' style='margin-top:.7rem'><div class='gc-section-title'>31 AĞUSTOS 2026 YÖN / RİSK STATE REPLAY</div>"
                  +f"<div class='gc-footnote'><b>HISTORICAL REPLAY · PROSPECTIVE DEĞİL</b> · state boundary 31.08.2026 17:00 ET · kaynak: {esc(source)}. Bu durumlar H=1 fiyat tahmini değildir ve current yön oyu/kararı değiştirmez.</div>"
                  +rows
                  +"<div class='gc-track-head'><b>REPLAY'DE HALEN BLOCKED / ARCHIVED</b><span class='gc-track-pill'>FAIL-CLOSED</span></div>"
                  +blocker_rows
                  +"</div>"
              )

          def aug31_replay_expansion_html(replay: dict[str, Any] | None) -> str:
              if not replay:
                  return empty_html("31 AĞUSTOS GENİŞLETİLMİŞ REPLAY OKUNAMADI","Causal Patch / Emergency / BOCPD successor immutable replay evidence kullanılamıyor.")
              source="DB READ-ONLY" if replay.get("source_mode")=="NEON_DB_READ_ONLY" else "SNAPSHOT FALLBACK"
              rows=(
                  html_row("Causal Patch · Eylül H=1",fmt_num(replay.get("causal_patch_forecast"),2," USD"))
                  +html_row("Emergency · Level",display_state(replay.get("emergency_level"),"—"))
                  +html_row("Emergency · Reversal",display_state(replay.get("emergency_reversal"),"—"))
                  +html_row("BOCPD successor V1",display_state(replay.get("bocpd_successor_state"),"—"))
              )
              return (
                  "<div class='gc-card' style='margin-top:.7rem;border-color:#f0d8a7'>"
                  +"<div class='gc-section-title'>31 AĞUSTOS REPLAY · RECOVERED / SUCCESSOR CONTEXT</div>"
                  +f"<div class='gc-footnote'><b>HISTORICAL_REPLAY · PROSPECTIVE ISSUED DEĞİL</b> · information boundary 31.08.2026 17:00 ET · kaynak: {esc(source)}.</div>"
                  +rows
                  +f"<div class='gc-footnote' style='margin-top:.55rem'>Patch günlük feature son tarihi: {esc(display_state(replay.get('causal_patch_daily_max_date'),'—'))}. Emergency month-open başlangıcıdır; 31 Ağustos close Eylül close sayılmaz. Archived BOCPD: <b>{esc(display_state(replay.get('bocpd_archived_engine_status'),'BLOCKED'))}</b>. Successor <b>{esc(display_state(replay.get('bocpd_successor_id'),'BOCPD_RETURN_SUCCESSOR_V1'))}</b> yalnız research / out-of-lock historical replay context'tir. Selector OFF · Ensemble OFF · canonical authority false · direction vote false.</div>"
                  +"</div>"
              )

          def engine_status_label'''
          pattern = r'def aug31_state_replay_html\(state: dict\[str, Any\] \| None\) -> str:\n.*?\ndef engine_status_label'
          s, n = re.subn(pattern, replay_functions, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'REPLAY_FUNCTION_PATCH_COUNT_{n}')

          replace_once(
              'return "Uygun ay-sonu originini bekliyor. v1.30 planında ilk meşru aday: Eylül sonu → Ekim 2026 H=1; yalnız issuer/PIT gate\'leri geçerse."',
              'return "Uygun ay-sonu originini bekliyor. İlk meşru prospective aday: Eylül sonu → Ekim 2026 H=1; yalnız issuer/PIT gate\'leri geçerse. 31 Ağustos replay referansı ayrı HISTORICAL_REPLAY evidence katmanıdır."',
              'PATCH_ACTIVATION_NOTE',
          )
          replace_once(
              'return "İlk governed CAUSAL_PATCH expert referansını bekliyor. İlk meşru aday: Eylül sonu → Ekim 2026 H=1."',
              'return "İlk governed prospective CAUSAL_PATCH expert referansını bekliyor. İlk meşru aday: Eylül sonu → Ekim 2026 H=1. 31 Ağustos historical replay Emergency state\'i bu forward requirement\'ı karşılamaz."',
              'EMERGENCY_ACTIVATION_NOTE',
          )
          replace_once(
              'return "Takvime bağlı değil; L=36 ve frozen threshold recover edildi, ancak exact prior/init ve reset-score implementation recover edilmeden çalışmaz."',
              'return "Archived BOCPD takvime bağlı değil; exact prior/init ve reset-score implementation recover edilmeden çalışmaz. BOCPD_RETURN_SUCCESSOR_V1 ayrı research/HISTORICAL_REPLAY context olarak gösterilebilir; archived motoru ACTIVE yapmaz."',
              'BOCPD_ACTIVATION_NOTE',
          )

          engine_cards = '''def engine_inventory_cards(rows: list[dict[str, Any]]) -> str:
              cards=[]
              for row in rows:
                  output=engine_output_display(row); raw_status=display_state(row.get("status"),"UNRESOLVED"); status=engine_status_label(raw_status)
                  evidence=display_state(row.get("evidence_class"),"NO_CURRENT_EVIDENCE")
                  version=display_state(row.get("version"),"VERSION_NOT_PROVEN")
                  updated=fmt_time(row.get("as_of"))
                  vote="YÖN OYU" if row.get("direction_vote") is True else "YÖN OYU DEĞİL"
                  activation=engine_activation_note(raw_status)
                  detail=f"{row.get('category')} · {vote} · {evidence} · {version} · Son: {updated}"
                  ref=row.get("replay_reference") if isinstance(row.get("replay_reference"),dict) else None
                  replay_html=""
                  if ref:
                      ref_output=fmt_num(ref.get("output"),2," USD") if ref.get("unit")=="USD/oz" else display_state(ref.get("output"),"—")
                      archived=ref.get("archived_engine_status")
                      archived_html=(f"<div style='font-size:.57rem;color:var(--gc-warning);line-height:1.34;margin-top:.22rem'><b>Archived runtime:</b> {esc(archived)}</div>" if archived else "")
                      replay_html=(
                          "<div style='margin-top:.52rem;padding:.48rem .52rem;border:1px solid #f0d8a7;border-radius:10px;background:#fffaf0'>"
                          +f"<div style='font-size:.58rem;font-weight:900;color:#8a5b00'>{esc(ref.get('label'))} · REPLAY · PROSPECTIVE DEĞİL</div>"
                          +f"<div style='font-size:.88rem;font-weight:900;color:var(--gc-ink);margin:.22rem 0'>{esc(ref_output)}</div>"
                          +f"<div style='font-size:.56rem;color:var(--gc-muted);line-height:1.34'>{esc(ref.get('evidence_class'))} · {esc(ref.get('version'))}</div>"
                          +archived_html
                          +f"<div style='font-size:.57rem;color:var(--gc-muted);line-height:1.34;margin-top:.22rem'>{esc(ref.get('note'))}</div>"
                          +"</div>"
                      )
                  cards.append("<div class='gc-expert'>"+f"<div class='name'>{esc(row.get('label'))}</div><div class='role'>{esc(row.get('role'))}</div><div class='forecast'>{esc(output)}</div><div class='state'>{esc(status)}</div><div class='note' style='font-size:.60rem;color:var(--gc-muted);line-height:1.35;margin-top:.34rem'>Operasyonel teknik durum: {esc(raw_status)}</div>"+replay_html+f"<div class='note' style='font-size:.60rem;color:var(--gc-muted);line-height:1.35;margin-top:.26rem'>{esc(detail)}</div><div class='note' style='font-size:.62rem;color:var(--gc-ink);line-height:1.38;margin-top:.34rem'><b>Ne zaman:</b> {esc(activation)}</div></div>")
              return "<div class='gc-expert-grid gc-engine-grid'>"+"".join(cards)+"</div>"

          def selector_lock_html'''
          pattern = r'def engine_inventory_cards\(rows: list\[dict\[str, Any\]\]\) -> str:\n.*?\ndef selector_lock_html'
          s, n = re.subn(pattern, engine_cards, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'ENGINE_CARD_PATCH_COUNT_{n}')

          replace_once(
              'historical_replay_history=[]\nspot=safe_call(get_spot,None); hist,hist_meta=safe_call(get_xau_history,(pd.DataFrame(),{})); gvz=safe_call(get_gvz,None); replay=load_replay(); rmetrics=replay_metrics(replay); _=classification_label\nruntime_rows=[] if not runtime_obs else list(runtime_obs.get("runtime") or [])\nengine_rows=build_engine_inventory(decision,month_end_experts,early_experts,runtime_rows); engine_counts=engine_inventory_counts(engine_rows)\n',
              'historical_replay_history=[]\naug31_state_replay=safe_call(lambda:get_aug31_state_replay_cached(url),None) if url else None\naug31_replay_expansion=safe_call(lambda:get_aug31_replay_expansion_cached(url),None) if url else None\nspot=safe_call(get_spot,None); hist,hist_meta=safe_call(get_xau_history,(pd.DataFrame(),{})); gvz=safe_call(get_gvz,None); replay=load_replay(); rmetrics=replay_metrics(replay); _=classification_label\nruntime_rows=[] if not runtime_obs else list(runtime_obs.get("runtime") or [])\nengine_rows=attach_aug31_replay_expansion(build_engine_inventory(decision,month_end_experts,early_experts,runtime_rows),aug31_replay_expansion); engine_counts=engine_inventory_counts(engine_rows)\n',
              'GLOBAL_REPLAY_LOAD_PATCH',
          )

          replace_once(
              '    aug31_state_replay=safe_call(lambda:get_aug31_state_replay_cached(url),None)\n',
              '',
              'REMOVE_LOCAL_STATE_REPLAY',
          )

          replace_once(
              'replay_db_body+aug31_state_replay_html(aug31_state_replay)+"<div class=\'gc-footnote\'',
              'replay_db_body+aug31_state_replay_html(aug31_state_replay,aug31_replay_expansion)+aug31_replay_expansion_html(aug31_replay_expansion)+"<div class=\'gc-footnote\'',
              'TAHMIN_REPLAY_RENDER_PATCH',
          )

          replace_once(
              '        emergency_rows=html_row("Macro Event",MACRO_EVENT_STATUS,"gc-warning")+html_row("Emergency","YAYIMLANMADI","gc-muted")+html_row("BOCPD","YAYIMLANMADI","gc-muted")\n',
              '        if aug31_replay_expansion:\n'
              '            emergency_rows=html_row("Macro Event",MACRO_EVENT_STATUS,"gc-warning")+html_row("Emergency · Level",f"{display_state(aug31_replay_expansion.get(\'emergency_level\'),\'—\')} · 31 AĞUSTOS REPLAY","gc-warning")+html_row("Emergency · Reversal",f"{display_state(aug31_replay_expansion.get(\'emergency_reversal\'),\'—\')} · 31 AĞUSTOS REPLAY","gc-warning")+html_row("BOCPD",f"Archived BLOCKED · Successor: {display_state(aug31_replay_expansion.get(\'bocpd_successor_state\'),\'—\')}","gc-warning")\n'
              '        else:\n'
              '            emergency_rows=html_row("Macro Event",MACRO_EVENT_STATUS,"gc-warning")+html_row("Emergency","YAYIMLANMADI","gc-muted")+html_row("BOCPD","YAYIMLANMADI","gc-muted")\n',
              'GORUNUM_EMERGENCY_REPLAY_PATCH',
          )

          required = [
              'fetch_aug31_replay_expansion',
              'attach_aug31_replay_expansion',
              '31 AĞUSTOS REPLAY · RECOVERED / SUCCESSOR CONTEXT',
              'REPLAY · PROSPECTIVE DEĞİL',
              'BOCPD_RETURN_SUCCESSOR_V1',
              'Operasyonel teknik durum',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise RuntimeError(f'POST_PATCH_REQUIRED_TEXT_MISSING:{missing}')
          p.write_text(s,encoding='utf-8')
          print('AUG31_REPLAY_UI_PATCH_PASS')
          PY
      - name: Compile patched UI
        run: |
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py gold_axis_2026/apps/aug31_replay_expansion_source.py gold_axis_2026/apps/aug31_replay_expansion_display.py
      - name: Commit patched UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/apps/gold_control_mobile_v1.py
          git diff --cached --quiet && { echo 'NO_UI_DIFF'; exit 1; }
          git commit -m 'ui: show governed Aug31 replay expansion'
          git push origin HEAD:gold-control-v131-aug31-replay-expansion-v2
