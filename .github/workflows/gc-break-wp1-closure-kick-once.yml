name: GC-BREAK WP1 Closure Kick Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gc-break-wp1-closure-kick-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing WP1 closure resume workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gc-break-wp1-closure-resume-v1.yml --repo "$GITHUB_REPOSITORY" --ref main
