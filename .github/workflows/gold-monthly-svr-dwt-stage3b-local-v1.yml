name: Gold Monthly SVR DWT Stage3B Local V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-svr-dwt-stage3b-local-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_svr_dwt_stage3b_local_v1.py
      - name: Run Stage 3B
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_svr_dwt_stage3b_local_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gold_monthly_svr_dwt_stage3b_local_v1_result.json'))
          assert r['scope']=='STAGE3B_LOCAL_REFINEMENT_DEV_ONLY_V1'
          assert r['contract']['parent']=='EPSILON_RBF_DAILY12'
          assert r['contract']['representation']=='DAILY_SUMMARY12'
          assert r['contract']['kernel']=='rbf'
          assert r['contract']['2025_role']=='LOCKED_NOT_OPENED'
          assert r['contract']['2026_role']=='QUARANTINED_NOT_USED'
          assert r['contract']['random_split']=='NONE'
          assert r['contract']['database']=='READ_ONLY'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert r['determinism']['status']=='PASS'
          assert r['parent']['metrics']['n']==33
          assert r['coarse']['metrics']['n']==33
          assert r['local']['metrics']['n']==33
          assert len(r['local']['rows'])==33
          assert r['decision']['final_deterministic_reference'] in {
              'STAGE3B_LOCAL_TUNED','EPSILON_RBF_DAILY12_STAGE2_PARENT'
          }
          for x in r['local']['rows']:
              assert x['train_last'] < x['target']
              assert x['selected']['inner_valid_n'] >= 12
          print('SVR_DWT_STAGE3B_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-svr-dwt-stage3b-local-v1
          path: |
            gold_monthly_svr_dwt_stage3b_local_v1_result.json
            gold_axis_2026/GOLD_MONTHLY_SVR_DWT_STAGE3B_LOCAL_RESULT_2026-09-28.md
          if-no-files-found: error
      - name: Commit Stage 3B report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_MONTHLY_SVR_DWT_STAGE3B_LOCAL_RESULT_2026-09-28.md
          if git diff --cached --quiet; then
            echo "No report change"
          else
            git commit -m "Record SVR Stage 3B local result"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
