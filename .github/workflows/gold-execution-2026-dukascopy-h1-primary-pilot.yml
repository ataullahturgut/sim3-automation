name: Gold 2026 Dukascopy Monthly Hourly Primary Source Pilot
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_dukascopy_h1_monthly_source_pilot_20261008.py
      - .github/workflows/gold-execution-2026-dukascopy-h1-primary-pilot.yml
permissions:
  contents: write
concurrency:
  group: gold-dukascopy-h1-2026-source-pilot
  cancel-in-progress: false
jobs:
  direct-monthly:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'psycopg[binary]>=3.2,<4'
      - name: Pull monthly primary BID ASK in 2025 overlap and 2026 horizon
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_dukascopy_h1_monthly_source_pilot_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_dukascopy_h1_monthly_source_pilot_20261008.py
      - name: Commit source-only H1 coverage and raw data QC
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          file=gold_axis_2026/GOLD_EXECUTION_2026_DUKASCOPY_DIRECT_H1_MONTHLY_SOURCE_PILOT_20261008.json
          if test -f "$file"; then git add "$file"; fi
          git diff --cached --quiet || git commit -m 'Record direct 2026 Dukascopy monthly H1 source availability, not M15 model success'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
