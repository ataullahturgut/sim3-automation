name: Gold Data FRED Indices

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - '.github/workflows/gold-data-fred-indices.yml'
      - 'gold_axis_2026/data_pipeline/fred_indices_api.py'
      - 'gold_axis_2026/data_pipeline/source_job.py'
      - 'gold_axis_2026/data_pipeline/persist_neon.py'
      - 'gold_axis_2026/data_pipeline/verify_fred_indices.py'
      - 'gold_axis_2026/data_pipeline/source_contracts.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily or backfill'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
  schedule:
    - cron: '15 1 * * 2-6'     # after US session, Tue-Sat UTC for prior business day
    - cron: '30 12 * * 2-6'    # independent retry pass

concurrency:
  group: gold-data-fred-indices
  cancel-in-progress: true

jobs:
  ingest-fred-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'push' && contains(github.event.head_commit.message, '[backfill]') && 'backfill' || 'daily') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require protected secrets
        shell: bash
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL missing"; exit 1; }
          test -n "$FRED_API_KEY" || { echo "FRED_API_KEY missing"; exit 1; }
          echo "Required secrets are configured."
      - name: Compile private index pipeline
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/fred_indices_api.py
          python -m py_compile gold_axis_2026/data_pipeline/source_job.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_neon.py
          python -m py_compile gold_axis_2026/data_pipeline/verify_fred_indices.py
      - name: First private index ingestion
        run: python gold_axis_2026/data_pipeline/source_job.py --source fred_indices --mode "$INGEST_MODE" --persist
      - name: Repeat ingestion to exercise dedupe
        run: python gold_axis_2026/data_pipeline/source_job.py --source fred_indices --mode "$INGEST_MODE" --persist
      - name: Verify Neon persistence and point-in-time contract
        run: python gold_axis_2026/data_pipeline/verify_fred_indices.py
