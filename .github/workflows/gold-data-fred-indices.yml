name: Gold Data FRED Indices

on:
  workflow_call:
    inputs:
      mode:
        description: 'daily or backfill'
        required: false
        default: 'daily'
        type: string
    secrets:
      NEON_DATABASE_URL:
        required: true
      FRED_API_KEY:
        required: true

concurrency:
  group: gold-data-fred-indices-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  ingest-fred-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      INGEST_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require protected secrets
        shell: bash
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL missing"; exit 1; }
          test -n "$FRED_API_KEY" || { echo "FRED_API_KEY missing"; exit 1; }
          test "$INGEST_MODE" = 'daily' -o "$INGEST_MODE" = 'backfill'
      - name: Compile private index pipeline
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/fred_indices_api.py
          python -m py_compile gold_axis_2026/data_pipeline/source_job.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_neon.py
          python -m py_compile gold_axis_2026/data_pipeline/verify_fred_indices.py
      - name: First private index ingestion
        run: python gold_axis_2026/data_pipeline/source_job.py --source fred_indices --mode "$INGEST_MODE" --persist
      - name: Repeat ingestion to exercise dedupe
        run: python gold_axis_2026/data_pipeline/source_job.py --source fred_indices --mode "$INGEST_MODE" --persist
      - name: Verify Neon persistence and point-in-time contract
        run: python gold_axis_2026/data_pipeline/verify_fred_indices.py
