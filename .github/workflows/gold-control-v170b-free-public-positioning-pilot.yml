name: Gold Control V1.70B free public positioning pilot research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v170_research/**"
      - "gold_axis_2026/tests/test_v170b_free_public_positioning_pilot.py"
      - ".github/workflows/gold-control-v170b-free-public-positioning-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  free-public-positioning-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      V164_ARTIFACT_DIR: /tmp/v164_artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen V1.70B dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pytest==8.4.2
      - name: Test V1.70B governance PIT clock and feature locks
        run: python -m pytest -q gold_axis_2026/tests/test_v170b_free_public_positioning_pilot.py
      - name: Download and verify immutable V1.64 source artifact
        run: |
          mkdir -p /tmp/v164_artifact
          gh api repos/ataullahturgut/sim3-automation/actions/artifacts/10316352769/zip > /tmp/v164_artifact.zip
          echo "23901808b5b8db4b2065797865f7ac4269bf544953fe1ce38b37964e19ab78da  /tmp/v164_artifact.zip" | sha256sum -c -
          unzip -q /tmp/v164_artifact.zip -d /tmp/v164_artifact
      - name: Run frozen V1.70B free public positioning pilot
        run: python -m gold_axis_2026.v170_research.run_v170b_free_public_positioning_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v170b-free-public-positioning-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v170b_research/
