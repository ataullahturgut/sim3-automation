name: Gold Monthly Adaptive Alarm Reliability V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_adaptive_alarm_reliability_v1.py
      - .github/workflows/gold-monthly-adaptive-alarm-reliability-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/audit
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11120035621/zip" > audit.zip
          unzip -q audit.zip -d inputs/audit
          test -f inputs/audit/GOLD_MONTHLY_ALARM_REGIME_V2_RELIABILITY_AUDIT_V1_2026-09-30.json

      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_adaptive_alarm_reliability_v1.py

      - name: Run audit
        run: |
          python gold_axis_2026/tools/gold_monthly_adaptive_alarm_reliability_v1.py             --audit-json inputs/audit/GOLD_MONTHLY_ALARM_REGIME_V2_RELIABILITY_AUDIT_V1_2026-09-30.json             --output GOLD_MONTHLY_ADAPTIVE_ALARM_RELIABILITY_V1_2026-09-30.json

      - name: Scientific governance gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_ADAPTIVE_ALARM_RELIABILITY_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scientific_gate']=='PASS'
          assert r['dev_contract']['rows']==33
          assert r['opened_contract']['rows']==20
          assert r['dev_contract']['selection_uses_2025_2026'] is False
          assert r['opened_contract']['mechanism_frozen_from_pre2025'] is True
          assert r['opened_contract']['opened_used_for_mechanism_selection'] is False
          g=r['governance']
          assert g['new_candidate_added_after_results'] is False
          assert g['2025_2026_used_to_choose_memory'] is False
          assert g['prior_strength_tuned'] is False
          assert g['gate_threshold_tuned'] is False
          assert g['alarm_definitions_changed'] is False
          assert g['regime_or_v2_changed'] is False
          assert g['forecast_modified'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'selected_candidate':r['selected_candidate'],
            'selection_order':r['selection_order'],
            'dev_evidence_gate':r['dev_evidence_gate'],
            'dev_candidate_results':r['dev_candidate_results'],
            'opened_selected':r['opened_selected'],
            'opened_expanding':r['opened_expanding'],
            'adaptation_path':r['adaptation_path'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-adaptive-alarm-reliability-v1-${{ github.sha }}
          path: GOLD_MONTHLY_ADAPTIVE_ALARM_RELIABILITY_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
