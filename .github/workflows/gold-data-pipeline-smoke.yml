name: Gold Data Pipeline Smoke

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/data_pipeline/**'
      - '.github/workflows/gold-data-pipeline-smoke.yml'
  workflow_dispatch:

jobs:
  collector-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Compile production R2 pipeline
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/collector_r2.py
          python -m py_compile gold_axis_2026/data_pipeline/fed_direct.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_neon.py
          python -m py_compile gold_axis_2026/data_pipeline/source_job.py
      - name: Run production-source smoke without DB writes
        working-directory: gold_axis_2026/data_pipeline
        run: |
          python - <<'PY'
          from source_job import collect_source

          expected = {
              'xau': {'XAU_SPOT_XAUS', 'XAU_DAILY_XAUS'},
              'cboe': {'GVZ_CBOE', 'VIX_CBOE'},
              'fed': {'DGS10_FRB_H15', 'DEXCHUS_FRB_H10', 'DTWEXBGS_FRB_H10', 'EFFR_NYFED'},
              'gpr': {'GPR_OFFICIAL', 'GPRT_OFFICIAL', 'GPRA_OFFICIAL'},
          }

          total = 0
          for source, required in expected.items():
              bundle = collect_source(source, 'daily')
              errors = [x for x in bundle['quality_events'] if x.get('severity') == 'ERROR']
              found = {x['series_id'] for x in bundle['observations']}
              missing = sorted(required - found)
              assert not errors, f'{source} quality errors: {errors}'
              assert not missing, f'{source} missing series: {missing}'
              assert bundle['observations'], f'{source} returned no observations'
              total += len(bundle['observations'])
              print(source, 'PASS', len(bundle['observations']), 'rows', sorted(found))

          print('Gold Data production-source smoke: PASS', total, 'rows')
          PY
