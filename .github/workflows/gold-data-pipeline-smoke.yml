name: Gold Data Pipeline Smoke

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/data_pipeline/**'
      - '.github/workflows/gold-data-pipeline-smoke.yml'
  workflow_dispatch:

jobs:
  collector-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install collector dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Compile R2 pipeline
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/collector_r2.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_neon.py
      - name: Run authority-tier collector smoke
        run: python gold_axis_2026/data_pipeline/collector_r2.py --mode smoke
      - name: Validate R2 bundle
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('gold_axis_2026/data_pipeline/_out_r2')
          o=pd.read_csv(p/'observations.csv')
          m=json.loads((p/'manifest.json').read_text())
          q=json.loads((p/'quality_events.json').read_text())
          required={
            'XAU_SPOT_XAUS','GVZ_CBOE','VIX_CBOE','DGS10_FRED','DFF_FRED',
            'DEXCHUS_FRED','DTWEXBGS_FRED','SP500_FRED','DJIA_FRED','NASDAQ100_FRED',
            'GPR_OFFICIAL','GPRT_OFFICIAL','GPRA_OFFICIAL'
          }
          missing=sorted(required-set(o.series_id.unique()))
          assert not missing, f'missing required series: {missing}'
          assert len(o)>100, len(o)
          assert not any(x.get('severity')=='ERROR' for x in q), q
          assert m['n_errors']==0, m
          print('Gold Data R2 collector: PASS', m['n_observations'], 'rows', len(m['series']), 'series')
          PY
