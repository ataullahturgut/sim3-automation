name: GC-BREAK Three Month Integrated Prototype V1

on:
  push:
    branches:
      - gc-break-wp1-formation-backfill
    paths:
      - '.github/workflows/gc-break-three-month-integrated-prototype-v1.yml'
      - 'gold_axis_2026/tools/gc_break_three_month_integrated_prototype_v1.py'
      - 'gold_axis_2026/gc_break_v0/gc_break_three_month_integrated_prototype_contract_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependencies
        run: python -m pip install --quiet numpy pandas scipy 'psycopg[binary]'
      - name: Compile prototype
        run: |
          test -n "$NEON_DATABASE_URL"
          python -m py_compile gold_axis_2026/tools/gc_break_three_month_integrated_prototype_v1.py
      - name: Run coverage-selected all-runtime prototype
        run: |
          rm -rf /tmp/gc_break_three_month_integrated
          python gold_axis_2026/tools/gc_break_three_month_integrated_prototype_v1.py \
            --output-dir /tmp/gc_break_three_month_integrated
      - name: Assert no database mutation SQL in prototype
        run: |
          ! grep -Eiq '\b(insert|update|delete|truncate|alter|drop|create)[[:space:]]' \
            gold_axis_2026/tools/gc_break_three_month_integrated_prototype_v1.py
          echo 'GC_BREAK_THREE_MONTH_RESEARCH_READ_ONLY_PASS'
      - name: Upload immutable prototype evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-three-month-integrated-prototype-v1
          if-no-files-found: warn
          retention-days: 90
          path: /tmp/gc_break_three_month_integrated/
