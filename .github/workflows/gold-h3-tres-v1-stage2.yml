name: Gold H3 TRES V1 Stage2
on:
  push:
    branches: [gold-h3-tres-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_tres_v1_stage2.py'
      - '.github/workflows/gold-h3-tres-v1-stage2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-tres-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas scikit-learn
      - run: python gold_axis_2026/tools/gold_h3_tres_v1_stage2.py
      - name: Record Stage2 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gold_axis_2026/GOLD_H3_TRES_V1_STAGE2_PREDICTIONS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_TRES_V1_STAGE2_BLOCK_METRICS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_TRES_V1_STAGE2_SURVIVAL_COEFFICIENTS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_TRES_V1_STAGE2_SUMMARY_2026-10-04.json \
            gold_axis_2026/GOLD_H3_TRES_V1_STAGE2_RESULT_2026-10-04.md
          if ! git diff --cached --quiet; then
            git commit -m "Record TRES-H3 V1 Stage2 error-risk evidence"
            git pull --rebase origin gold-h3-tres-v1-20261004
            git push origin HEAD:gold-h3-tres-v1-20261004
          fi
