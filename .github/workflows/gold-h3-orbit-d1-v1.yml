name: Gold H3 ORBIT D1 V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_orbit_d1_v1.py'
      - '.github/workflows/gold-h3-orbit-d1-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT_DIR: gold_h3_orbit_d1_v1_out

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'openpyxl>=3.1,<4' 'xlrd>=2,<3'
      - name: Run ORBIT D1 screen
        run: python gold_axis_2026/tools/gold_h3_orbit_d1_v1.py
      - name: Commit ORBIT evidence
        shell: bash
        run: |
          cp "$OUT_DIR/ORBIT_D1_RESULT.md" gold_axis_2026/GOLD_H3_ORBIT_D1_V1_RESULT_2026-10-02.md
          cp "$OUT_DIR/orbit_d1_summary.json" gold_axis_2026/GOLD_H3_ORBIT_D1_V1_SUMMARY_2026-10-02.json
          cp "$OUT_DIR/orbit_d1_metrics.csv" gold_axis_2026/GOLD_H3_ORBIT_D1_V1_METRICS_2026-10-02.csv
          cp "$OUT_DIR/orbit_d1_panel.csv" gold_axis_2026/GOLD_H3_ORBIT_D1_V1_PANEL_2026-10-02.csv

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_ORBIT_D1_V1_*_2026-10-02.*
          if git diff --cached --quiet; then
            echo "No ORBIT evidence changes"
          else
            git commit -m "Record ORBIT D1 daily screen results"
            git pull --rebase origin gold-midas-headswap-v1-20260925
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-orbit-d1-v1
          path: gold_h3_orbit_d1_v1_out/
          if-no-files-found: warn
          retention-days: 90
