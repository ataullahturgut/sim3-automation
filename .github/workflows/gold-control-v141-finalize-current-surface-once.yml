name: Gold Control v1.41 Finalize Current Surface Once

on:
  push:
    branches:
      - gold-control-clean-current-surface-v141
    paths:
      - '.github/workflows/gold-control-v141-finalize-current-surface-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-clean-current-surface-v141
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q 'psycopg[binary]>=3.2,<4' pytest pandas numpy
      - name: Export fresh production current snapshot read-only
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing' && exit 1)
          python gold_axis_2026/tools/export_production_display_snapshot.py --out gold_axis_2026/apps/production_display_snapshot.json
      - name: Verify v1.41 production snapshot and authority locks
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import json
          from pathlib import Path
          from production_display_snapshot import SNAPSHOT_CONTRACT, validate_production_display_snapshot

          path = Path('gold_axis_2026/apps/production_display_snapshot.json')
          snapshot = json.loads(path.read_text(encoding='utf-8'))
          validate_production_display_snapshot(snapshot)
          assert snapshot['snapshot_contract'] == SNAPSHOT_CONTRACT == 'GOLD_CONTROL_CURRENT_PRODUCTION_DISPLAY_SNAPSHOT_V141'
          assert len(snapshot['runtime']) == 12
          assert all(row['runtime_status'] == 'ACTIVE' for row in snapshot['runtime'])
          assert all((row.get('metadata') or {}).get('current_surface_contract') == 'GOLD_CONTROL_CURRENT_SURFACE_V141' for row in snapshot['runtime'])
          current_ids = {row['engine_id'] for row in snapshot['runtime']}
          assert not current_ids.intersection({'VW_MIDAS_MSVR','BOCPD','MACRO_EVENT'})
          assert snapshot['authority_store_counts'] == {
              'monthly_forecast_contracts': 0,
              'decision_signal_snapshots': 0,
              'decision_runs': 0,
              'decision_events': 0,
          }
          print('V141_PRODUCTION_CURRENT_SNAPSHOT_PASS runtime=12 active=12 authority=0/0/0/0')
          PY
      - name: Run clean-current-surface audit
        run: python gold_axis_2026/tools/audit_current_surface_v141.py
      - name: Remove one-shot finalizer and commit snapshot
        run: |
          git rm -f .github/workflows/gold-control-v141-finalize-current-surface-once.yml
          git config user.name gold-control-governance-bot
          git config user.email gold-control-governance-bot@users.noreply.github.com
          git add gold_axis_2026/apps/production_display_snapshot.json
          git commit -m 'Gold Control v1.41: bind production current snapshot'
          git push origin HEAD:gold-control-clean-current-surface-v141
