name: Gold Control v1.41 Finalize Current Surface Once

on:
  push:
    branches:
      - gold-control-clean-current-surface-v141-final
    paths:
      - '.github/workflows/gold-control-v141-finalize-current-surface-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-clean-current-surface-v141-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q 'psycopg[binary]>=3.2,<4' pytest pandas numpy requests streamlit
      - name: Export sanitized production snapshot read-only
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing' && exit 1)
          python gold_axis_2026/tools/export_production_display_snapshot.py --out gold_axis_2026/apps/production_display_snapshot.json
      - name: Verify production current surfaces
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import json, os
          from pathlib import Path
          from production_display_snapshot import SNAPSHOT_CONTRACT, validate_production_display_snapshot
          from runtime_source import fetch_runtime_observability

          snap=json.loads(Path('gold_axis_2026/apps/production_display_snapshot.json').read_text(encoding='utf-8'))
          validate_production_display_snapshot(snap)
          assert snap['snapshot_contract'] == SNAPSHOT_CONTRACT == 'GOLD_CONTROL_CURRENT_PRODUCTION_DISPLAY_SNAPSHOT_V141'
          assert len(snap['runtime']) == 12
          assert len(snap['features']) == 7
          assert all(r['runtime_status'] == 'ACTIVE' for r in snap['runtime'])
          assert all((r.get('metadata') or {}).get('current_surface_contract') == 'GOLD_CONTROL_CURRENT_SURFACE_V141' for r in snap['runtime'])
          assert all(f['quality_status'] == 'HISTORICAL_REPLAY_CONTEXT' for f in snap['features'])
          assert all((f.get('metadata') or {}).get('current_surface_contract') == 'GOLD_CONTROL_CURRENT_SURFACE_V141' for f in snap['features'])
          assert snap['authority_store_counts'] == {
              'monthly_forecast_contracts': 0,
              'decision_signal_snapshots': 0,
              'decision_runs': 0,
              'decision_events': 0,
          }
          state=fetch_runtime_observability(os.environ['NEON_DATABASE_URL'])
          assert state['runtime_complete'] is True
          assert state['integrity_ok'] is True
          assert state['runtime_engine_count'] == 12
          assert state['context_feature_count'] == 7
          print('V141_PRODUCTION_CURRENT_SURFACE_PASS')
          PY
      - name: Compile current executable surface
        run: |
          python -m py_compile \
            gold_axis_2026/apps/gold_control.py \
            gold_axis_2026/apps/gold_control_mobile.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/runtime_source.py \
            gold_axis_2026/apps/production_display_snapshot.py \
            gold_axis_2026/apps/live_sources.py \
            gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py \
            gold_axis_2026/data_pipeline/multi_expert_forecast.py \
            gold_axis_2026/tools/export_production_display_snapshot.py \
            gold_axis_2026/tools/audit_current_surface_v141.py \
            gold_axis_2026/tools/inventory_full_current_tree_v141.py
      - name: Run current-surface tests
        run: |
          pytest -q \
            gold_axis_2026/apps/test_engine_observability_contract.py \
            gold_axis_2026/apps/test_production_display_snapshot.py \
            gold_axis_2026/data_pipeline/test_multi_expert_forecast.py \
            gold_axis_2026/data_pipeline/test_data_evidence_spine_runtime_bootstrap.py
      - name: Run full current-tree inventory and audit
        run: |
          python gold_axis_2026/tools/inventory_full_current_tree_v141.py
          python gold_axis_2026/tools/audit_current_surface_v141.py
      - name: Remove one-shot finalizer and commit final current snapshot
        run: |
          git rm -f .github/workflows/gold-control-v141-finalize-current-surface-once.yml
          git config user.name gold-control-governance-bot
          git config user.email gold-control-governance-bot@users.noreply.github.com
          git add -A
          git diff --check
          git commit -m 'Gold Control v1.41: finalize clean current surface'
          git push origin HEAD:gold-control-clean-current-surface-v141-final
