name: Gold Control Frozen UP Cascade 2026 Replay

on:
  push:
    branches:
      - gold-r4-direction-engine
    paths:
      - 'gold_axis_2026/tools/gold_control_frozen_up_cascade_2026_replay.py'
      - '.github/workflows/gold-control-frozen-up-cascade-2026-replay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-frozen-up-cascade-2026-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: /tmp/frozen/gold_axis_2026:/tmp/frozen/gold_axis_2026/tools

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'psycopg[binary]>=3.2,<4'

      - name: Materialize frozen authorities
        run: |
          mkdir -p /tmp/frozen/gold_axis_2026/tools /tmp/frozen/gold_axis_2026/regime_dampener_v1

          git show b22235f04dc48b173a93a98cc2ce22081bb0054e:gold_axis_2026/tools/cbr_cascade_route_consistent_extension_v1_run.py > /tmp/frozen/route_authority.py
          git show f187f89c166a75cefa8cf60709dcd4ce1027663d:gold_axis_2026/tools/downside_cbr_dtw_path_v1.py > /tmp/frozen/downside_cbr_dtw_path_v1.py
          git show ad0fc4dcbe1687833bd9a153cd4bc6a754523464:gold_axis_2026/tools/regime_v1_router_sqrt.py > /tmp/frozen/regime_v1_router_sqrt.py

          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py > /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_data.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_data.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_experts.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_experts.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py

          git show e7db0333b1a7b13635e5df4142c0be9c11bd6558:gold_axis_2026/tools/residual_one_sided_up2_logit_v1_run.py > /tmp/frozen/up2_authority.py
          git show eb928b2d5be6250227d8e14dea2d58abe494f762:gold_axis_2026/GOLD_CONTROL_RESIDUAL_ONE_SIDED_UP2_LOGIT_V1_LEDGER_2026-09-23.csv > /tmp/frozen/up2_frozen_ledger.csv
          git show 509c5ffa762f4ea49644b8ffe723ed2591ba52bf:gold_axis_2026/external_data/v2/dukascopy_xauusd_govsession_mid_5m_daily_features_2018_2021.csv > /tmp/frozen/external_daily.csv

      - name: Fetch pinned transient Dukascopy minute mirror
        run: |
          rm -rf /tmp/mdl
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git /tmp/mdl
          git -C /tmp/mdl sparse-checkout init --no-cone
          printf '%s\n'             '/xauusd/ask/m1/xauusd_ask_m1_2020_*.csv'             '/xauusd/ask/m1/xauusd_ask_m1_2021_*.csv'             '/xauusd/ask/m1/xauusd_ask_m1_2022_01.csv'             '/xauusd/bid/m1/xauusd_bid_m1_2020_*.csv'             '/xauusd/bid/m1/xauusd_bid_m1_2021_*.csv'             '/xauusd/bid/m1/xauusd_bid_m1_2022_01.csv'             > /tmp/mdl/.git/info/sparse-checkout
          git -C /tmp/mdl checkout 922f83a60cc574e7395fb27397077288055a1ef6

      - name: Run 2026 replay
        run: |
          rm -rf up_2026_out
          python gold_axis_2026/tools/gold_control_frozen_up_cascade_2026_replay.py             --raw-root /tmp/mdl             --external-spine /tmp/frozen/external_daily.csv             --sqrt-code /tmp/frozen/regime_v1_router_sqrt.py             --route-module /tmp/frozen/route_authority.py             --base-module /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py             --cbr-module /tmp/frozen/downside_cbr_dtw_path_v1.py             --up2-module /tmp/frozen/up2_authority.py             --frozen-up2-ledger /tmp/frozen/up2_frozen_ledger.csv             --out up_2026_out

      - name: Commit replay evidence
        run: |
          cp up_2026_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_FROZEN_UP_CASCADE_2026_REPLAY_RESULT_2026-10-02.json                   gold_axis_2026/GOLD_CONTROL_PRIMARY_UP_V2_2026_LEDGER_2026-10-02.csv                   gold_axis_2026/GOLD_CONTROL_FROZEN_UP2_2026_LEDGER_2026-10-02.csv
          git commit -m 'Record frozen UP cascade 2026 replay'
          git pull --rebase origin gold-r4-direction-engine
          git push origin HEAD:gold-r4-direction-engine

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-control-frozen-up-cascade-2026-replay
          retention-days: 30
          if-no-files-found: warn
          path: up_2026_out/
