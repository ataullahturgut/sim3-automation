name: Gold Execution Dukascopy Independent BID ASK Pilot 20261008
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_dukascopy_independent_xau_pilot_20261008.py'
      - '.github/workflows/gold-execution-dukascopy-pilot-20261008.yml'
permissions:
  contents: write
concurrency:
  group: dukascopy-xau-pilot-20261008
  cancel-in-progress: false
jobs:
  independent-quote:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Verify old missing date and current October with independent BID ASK
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_dukascopy_independent_xau_pilot_20261008.py
          python gold_axis_2026/tools/gold_execution_dukascopy_independent_xau_pilot_20261008.py
      - name: Retain diagnostic receipt even if quality blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-xau-20261008-private-source-pilot-evidence
          path: gold_axis_2026/GOLD_EXECUTION_DUKASCOPY_XAU_BIDASK_PILOT_2026-10-08.json
          if-no-files-found: warn
      - name: Commit aggregate evidence with concurrent commit safety
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_DUKASCOPY_XAU_BIDASK_PILOT_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_DUKASCOPY_XAU_BIDASK_PILOT_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record independent Dukascopy BID ASK gold source feasibility'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
