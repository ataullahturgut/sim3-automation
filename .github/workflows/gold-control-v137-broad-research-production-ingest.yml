name: Gold Control v1.37 Broad Research Production Ingest

on:
  push:
    branches:
      - gold-r4-direction-engine
    paths:
      - .github/workflows/gold-control-v137-broad-research-production-ingest.yml

permissions:
  contents: write

concurrency:
  group: gold-control-v137-broad-research-production-ingest
  cancel-in-progress: false

jobs:
  migrate-and-ingest:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      BROAD_RESEARCH_PRODUCTION_WRITE_AUTHORIZED: MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1
      GOLD_CONTROL_MANIFEST_VERSION: "1.37"
      BROAD_RESEARCH_PREFLIGHT_HEAD_SHA: a0a06bbce8249f8e7ac4cc0f482f1f68c711657b
      BROAD_RESEARCH_PREFLIGHT_ARTIFACT_DIGEST: sha256:ba4300d3501211ce7deaeea61627042f066ec45e679f672deb1741e26e102f1a
      EXPECTED_CANONICAL_PARENT: e8569f7aa38620e85f8ecfc3e72345487d2d82bf
      SOURCE_PREFLIGHT_SHA: a0a06bbce8249f8e7ac4cc0f482f1f68c711657b
      TESTED_WRITER_SHA: 671ca6ef84dcc4ffbbf6a6f216b8352897a1ff95
      FEATURE_EVIDENCE_SHA: e35bc951e7d49f29add2bf5b737b16200709d1a7
      EXPECTED_WRITER_BLOB: 3bb80b42961e0a16fbbf40eb14ab5340d169e797
      EXPECTED_CORE5_BLOB: bd7c1df860cc2975f123e300be597e9dec42e5c3
      ENGINEERING_RUN_ID: "33991644883"
      ENGINEERING_ARTIFACT_DIGEST: sha256:b1ae7a83d321372061d950c5f1cc8fad8262b570215f9a09ae22a4452fa355b5

    steps:
      - name: Checkout canonical bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert exact pre-migration canonical parent and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gold-r4-direction-engine"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANONICAL_PARENT"
          test -n "$NEON_DATABASE_URL"
          test -n "$TWELVE_DATA_API_KEY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install governed data dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt

      - name: Fetch exact frozen research commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_PREFLIGHT_SHA" "$TESTED_WRITER_SHA" "$FEATURE_EVIDENCE_SHA"
          test "$(git rev-parse "$TESTED_WRITER_SHA:gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py")" = "$EXPECTED_WRITER_BLOB"
          test "$(git rev-parse "$SOURCE_PREFLIGHT_SHA:gold_axis_2026/core5_monthly.csv.gz.b64")" = "$EXPECTED_CORE5_BLOB"

      - name: Promote frozen Broad R1 implementation into canonical working tree
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_PREFLIGHT_SHA:gold_axis_2026/core5_monthly.csv.gz.b64" > gold_axis_2026/core5_monthly.csv.gz.b64
          git show "$SOURCE_PREFLIGHT_SHA:gold_axis_2026/data_pipeline/source_contracts_research_broad.json" > gold_axis_2026/data_pipeline/source_contracts_research_broad.json
          git show "$SOURCE_PREFLIGHT_SHA:gold_axis_2026/tools/audit_broad_research_data_spine_r1.py" > gold_axis_2026/tools/audit_broad_research_data_spine_r1.py
          git show "$SOURCE_PREFLIGHT_SHA:gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_CHANGE_CONTROL_2026-09-05.md" > gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_CHANGE_CONTROL_2026-09-05.md
          git show "$TESTED_WRITER_SHA:gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py" > gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py
          git show "$FEATURE_EVIDENCE_SHA:gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_CHANGE_CONTROL_2026-09-05.md" > gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_CHANGE_CONTROL_2026-09-05.md
          git show "$FEATURE_EVIDENCE_SHA:gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_ENGINEERING_EVIDENCE_2026-09-05.md" > gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_ENGINEERING_EVIDENCE_2026-09-05.md
          test "$(git hash-object gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py)" = "$EXPECTED_WRITER_BLOB"
          test "$(git hash-object gold_axis_2026/core5_monthly.csv.gz.b64)" = "$EXPECTED_CORE5_BLOB"

      - name: Amend sole canonical manifest to v1.37
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md')
          s = p.read_text(encoding='utf-8')
          assert '**Manifest version:** 1.36' in s
          assert 'MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1' not in s
          s = s.replace('**Manifest version:** 1.36', '**Manifest version:** 1.37', 1)
          s = s.replace('**Freeze / issue date:** 2026-09-05', '**Freeze / issue date:** 2026-09-06', 1)
          s = s.replace('If an older document conflicts with this file, this v1.36 manifest governs unless a newer audited manifest version explicitly supersedes it.', 'If an older document conflicts with this file, this v1.37 manifest governs unless a newer audited manifest version explicitly supersedes it.', 1)
          s = s.replace('# 11. CURRENT PRODUCTION RUNTIME AUTHORITY — v1.36', '# 11. CURRENT PRODUCTION RUNTIME AUTHORITY — v1.37', 1)
          s = s.replace('Under v1.36, the current governed application inventory is:', 'Under v1.37, the current governed application inventory is:', 1)
          s = s.replace('# 13. UI CONTRACT — v1.36', '# 13. UI CONTRACT — v1.37', 1)
          s = s.replace('The v1.33 GPR source-data ingestion authorization below also does **not** change these four authority-store counts and does not grant forecast/decision authority.', 'The v1.33 GPR source-data ingestion authorization and the v1.37 Broad Research Data Spine R1 source-data authorization below also do **not** change these four authority-store counts and do not grant forecast/decision authority.', 1)
          s = s.replace('this v1.34 manifest controls current product/runtime behavior', 'this v1.37 manifest controls current product/runtime behavior', 1)

          section = r'''
## 14.2 v1.37 Broad Research Data Spine R1 production source-data authorization

Binding authorization token:

`MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1`

This authorization is strictly a **research source-data/audit-plane** authorization. It does not promote, score, select, ensemble, vote, forecast, issue a position/action, or alter any engine runtime state.

Frozen source-only preflight evidence:

- feature/source-preflight head: `a0a06bbce8249f8e7ac4cc0f482f1f68c711657b`;
- source-preflight workflow run: `33989608218`;
- source-preflight artifact digest: `sha256:ba4300d3501211ce7deaeea61627042f066ec45e679f672deb1741e26e102f1a`;
- conclusion: `SUCCESS`.

Frozen ingestion-engineering evidence:

- tested writer commit: `671ca6ef84dcc4ffbbf6a6f216b8352897a1ff95`;
- tested writer blob: `3bb80b42961e0a16fbbf40eb14ab5340d169e797`;
- ingestion-engineering workflow run: `33991644883`;
- ingestion-engineering artifact digest: `sha256:b1ae7a83d321372061d950c5f1cc8fad8262b570215f9a09ae22a4452fa355b5`;
- corrected locked CORE5 blob: `bd7c1df860cc2975f123e300be597e9dec42e5c3`;
- conclusion: `ENGINEERING_PREFLIGHT_PASS`.

Authorized research identities are exactly:

- `CORE5_GOLD_USD_OZ_RESEARCH_R1`;
- `CORE5_FEDFUNDS_RESEARCH_R1`;
- `CORE5_NASDAQ_AVG_RESEARCH_R1`;
- `CORE5_USDCNY_AVG_RESEARCH_R1`;
- `CORE5_GPR_ROUNDED_RESEARCH_R1`;
- `XAU_STAKTRAKR_RESEARCH_DAILY_R1`;
- `XAG_STAKTRAKR_RESEARCH_DAILY_R1`;
- `XPT_STAKTRAKR_RESEARCH_DAILY_R1`;
- `XPD_STAKTRAKR_RESEARCH_DAILY_R1`;
- `XAU_NY17_HOURLY_DERIVED_DAILY_RESEARCH_V1`;
- `GPRT_OFFICIAL_GIT_PIT`;
- `GPRA_OFFICIAL_GIT_PIT`.

The first production persistence is authorized only if the canonical execution rebuilds and proves the frozen engineering shape **before opening the persistence transaction**:

- series count = `12`;
- total observation rows = `71,075`;
- source-vintage rows = `126`;
- quality events = `0`;
- all five CORE5 series = `390` observations each;
- StakTrakr XAU/XAG/XPT/XPD = `4,230 / 4,230 / 4,229 / 4,229`;
- Twelve hourly-derived XAU = `1,177` selected daily observations across `54/54` required months with minimum monthly selected-day count `>=15`;
- GPRT/GPRA = `25,515 / 25,515` vintage-specific observation rows with `54/54` origins each;
- the twelve reserved series identities have no pre-existing observation rows before this first persistence;
- their reserved source-vintage identities have no pre-existing rows before this first persistence;
- the four forecast/decision authority stores are all exactly zero;
- the current 12-engine runtime count remains exactly `ACTIVE=6 / WAITING=5 / BLOCKED=1`.

Production Neon write scope is restricted to the existing source-data/audit plane:

- `source_registry` — insert new Broad R1 identities only; an existing identity mismatch is a hard failure;
- `retrieval_runs`;
- `observations` — append-only lineage rows;
- `source_vintages` — append-safe `(source_id, content_sha256)` persistence;
- `quality_events` only if applicable, but this first authorized run requires `quality_events=0` before persistence.

This authorization explicitly forbids writes to:

- `monthly_forecast_contracts`;
- `decision_signal_snapshots`;
- `decision_runs`;
- `decision_events`;
- engine runtime authority/ledger;
- model validation/promotion state;
- selector or ensemble state;
- action/position mappings.

Evidence semantics remain binding:

- CORE5 is a locked local research snapshot and is **not** historical PIT;
- StakTrakr is a pinned historical research reconstruction and makes **no** origin-PIT claim;
- Twelve Data `1h` / `America/New_York` / selected `16:00` bar is historical research retrieval and is **not equivalent** to canonical `XAU_EOD_TWELVE_NY17`;
- GPRT/GPRA use separate official-Git vintage reconstruction identities with truthful current retrieval timestamps and archive-add commit floors as availability evidence;
- retrieval/first-seen timestamps must not be backdated;
- no silent provider substitution;
- raw vendor values must not be emitted to CI evidence/log summaries.

`AUTO_SELECTOR=OFF` and `AUTO_ENSEMBLE=OFF` remain binding throughout this persistence.
'''.strip()

          anchor = '\n---\n\n# 15. CURRENT EVIDENCE FILES REFERENCED BY THIS MANIFEST'
          assert anchor in s
          s = s.replace(anchor, '\n\n' + section + anchor, 1)

          evidence_anchor = '- `GOLD_CONTROL_GPR_PIT_DATA_PLANE_CHANGE_CONTROL_2026-09-05.md`'
          assert evidence_anchor in s
          broad_evidence = '\n'.join([
              '- `GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_CHANGE_CONTROL_2026-09-05.md`',
              '- `GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_CHANGE_CONTROL_2026-09-05.md`',
              '- `GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_ENGINEERING_EVIDENCE_2026-09-05.md`',
          ])
          s = s.replace(evidence_anchor, evidence_anchor + '\n' + broad_evidence, 1)

          final_anchor = 'The v1.33 `GPR_OFFICIAL_GIT_PIT` source-data authorization remains valid independently.\n\nIf an origin was reconstructed later'
          assert final_anchor in s
          s = s.replace(final_anchor, 'The v1.33 `GPR_OFFICIAL_GIT_PIT` source-data authorization remains valid independently.\n\nv1.37 additionally authorizes the frozen Broad Research Data Spine R1 first production persistence under section 14.2 and only under its exact source-data/audit-plane gates.\n\nIf an origin was reconstructed later', 1)

          assert s.count('MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1') == 1
          p.write_text(s, encoding='utf-8')
          PY
          grep -q '^\*\*Manifest version:\*\* 1.37' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md

      - name: Compile exact writer and commit canonical v1.37 governance package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py
          test "$(git hash-object gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py)" = "$EXPECTED_WRITER_BLOB"
          test "$(git hash-object gold_axis_2026/core5_monthly.csv.gz.b64)" = "$EXPECTED_CORE5_BLOB"
          git config user.name "gold-control-governance-bot"
          git config user.email "gold-control-governance-bot@users.noreply.github.com"
          git add \
            gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
            gold_axis_2026/core5_monthly.csv.gz.b64 \
            gold_axis_2026/data_pipeline/broad_research_data_spine_r1_ingest.py \
            gold_axis_2026/data_pipeline/source_contracts_research_broad.json \
            gold_axis_2026/tools/audit_broad_research_data_spine_r1.py \
            gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_CHANGE_CONTROL_2026-09-05.md \
            gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_CHANGE_CONTROL_2026-09-05.md \
            gold_axis_2026/GOLD_CONTROL_BROAD_RESEARCH_DATA_SPINE_R1_NEON_INGESTION_ENGINEERING_EVIDENCE_2026-09-05.md
          git commit -m "Gold Control: authorize Broad Research R1 production data plane v1.37"
          git push origin HEAD:gold-r4-direction-engine
          echo "GOLD_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Clone official Caldara-Iacoviello archive with full history
        shell: bash
        run: git clone --quiet https://github.com/iacoviel/iacoviel.github.io.git /tmp/iacoviel-gpr

      - name: Rebuild exact 54-origin base GPR PIT coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          python gold_axis_2026/tools/audit_gpr_pit_coverage_v2.py \
            --upstream-repo /tmp/iacoviel-gpr \
            --start 2022-03 \
            --end 2026-08 \
            --skip-http \
            --json-out gpr_pit_coverage_v137.json \
            --md-out gpr_pit_coverage_v137.md
          python - <<'PY'
          import json
          d=json.load(open('gpr_pit_coverage_v137.json', encoding='utf-8'))
          rows=d['rows']
          assert len(rows)==54
          assert all(r['repo_git_pit_proven'] for r in rows)
          PY

      - name: Build once, hard-assert frozen shape, then persist transactionally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from argparse import Namespace
          from pathlib import Path
          import json
          import psycopg
          import sys

          sys.path.insert(0, 'gold_axis_2026/data_pipeline')
          import broad_research_data_spine_r1_ingest as m

          expected = {
              'CORE5_FEDFUNDS_RESEARCH_R1': 390,
              'CORE5_GOLD_USD_OZ_RESEARCH_R1': 390,
              'CORE5_GPR_ROUNDED_RESEARCH_R1': 390,
              'CORE5_NASDAQ_AVG_RESEARCH_R1': 390,
              'CORE5_USDCNY_AVG_RESEARCH_R1': 390,
              'GPRA_OFFICIAL_GIT_PIT': 25515,
              'GPRT_OFFICIAL_GIT_PIT': 25515,
              'XAG_STAKTRAKR_RESEARCH_DAILY_R1': 4230,
              'XAU_NY17_HOURLY_DERIVED_DAILY_RESEARCH_V1': 1177,
              'XAU_STAKTRAKR_RESEARCH_DAILY_R1': 4230,
              'XPD_STAKTRAKR_RESEARCH_DAILY_R1': 4229,
              'XPT_STAKTRAKR_RESEARCH_DAILY_R1': 4229,
          }

          m.require_production_authority()
          args = Namespace(
              gpr_upstream_repo=Path('/tmp/iacoviel-gpr'),
              gpr_coverage_json=Path('gpr_pit_coverage_v137.json'),
              twelve_pacing=0.0,
          )
          bundle, summary = m.build_all(args)
          assert summary['status'] == 'PASS'
          assert summary['series_count'] == 12
          assert summary['series_row_counts'] == expected
          assert summary['total_observation_rows_built'] == 71075
          assert summary['source_vintage_rows_built'] == 126
          assert summary['quality_events'] == 0
          assert summary['sources']['twelve_xau_hourly']['months'] == 54
          assert summary['sources']['twelve_xau_hourly']['selected_daily_rows'] == 1177
          assert summary['sources']['twelve_xau_hourly']['min_days_per_month'] >= 15
          assert summary['sources']['gpr_companions']['vintages'] == 54
          assert summary['sources']['gpr_companions']['origins_by_series'] == {
              'GPRT_OFFICIAL_GIT_PIT': 54,
              'GPRA_OFFICIAL_GIT_PIT': 54,
          }

          pre = m.verify_neon_read_only()
          assert pre['decision_counts'] == {
              'monthly_forecast_contracts': 0,
              'decision_signal_snapshots': 0,
              'decision_runs': 0,
              'decision_events': 0,
          }
          assert pre['runtime_counts'] == {'ACTIVE': 6, 'BLOCKED': 1, 'WAITING': 5}

          series_ids = sorted(expected)
          vintage_ids = sorted({v['source_id'] for v in bundle['vintages']})
          assert len(vintage_ids) == 126
          with psycopg.connect(m.db_url()) as conn:
              with conn.cursor() as cur:
                  cur.execute('select count(*)::bigint from observations where series_id=any(%s)', (series_ids,))
                  assert int(cur.fetchone()[0]) == 0
                  cur.execute('select count(*)::bigint from source_registry where series_id=any(%s)', (series_ids,))
                  assert int(cur.fetchone()[0]) == 0
                  cur.execute('select count(*)::bigint from source_vintages where source_id=any(%s)', (vintage_ids,))
                  assert int(cur.fetchone()[0]) == 0

          result = m.persist_bundle(bundle)
          assert result['status'] == 'SUCCESS'
          assert result['series_count'] == 12
          assert result['observations_read'] == 71075
          assert result['observations_written'] == 71075
          assert result['revised_observations'] == 0
          assert result['registry_rows_inserted'] == 12
          assert result['decision_counts_after'] == pre['decision_counts']
          assert result['runtime_counts_after'] == pre['runtime_counts']

          with psycopg.connect(m.db_url()) as conn:
              with conn.cursor() as cur:
                  cur.execute('select series_id, count(*)::bigint from observations where series_id=any(%s) group by series_id order by series_id', (series_ids,))
                  post_counts = {sid: int(n) for sid, n in cur.fetchall()}
                  assert post_counts == expected
                  cur.execute('select count(*)::bigint from source_registry where series_id=any(%s)', (series_ids,))
                  assert int(cur.fetchone()[0]) == 12
                  cur.execute('select count(*)::bigint from source_vintages where source_id=any(%s)', (vintage_ids,))
                  assert int(cur.fetchone()[0]) == 126
                  cur.execute('select status, observations_read, observations_written from retrieval_runs where run_id=%s', (result['run_id'],))
                  rr = cur.fetchone()
                  assert rr is not None and rr[0] == 'SUCCESS' and int(rr[1]) == 71075 and int(rr[2]) == 71075

          post = m.verify_neon_read_only()
          assert post == pre

          evidence = {
              'status': 'SUCCESS',
              'canonical_code_sha': __import__('os').environ['GOLD_CODE_SHA'],
              'manifest_version': '1.37',
              'authorization_token': 'MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1',
              'engineering_run_id': 33991644883,
              'engineering_artifact_digest': 'sha256:b1ae7a83d321372061d950c5f1cc8fad8262b570215f9a09ae22a4452fa355b5',
              'production_retrieval_run_id': result['run_id'],
              'series_row_counts': expected,
              'total_observations_written': 71075,
              'source_vintages_present': 126,
              'source_registry_rows_present': 12,
              'decision_counts_before': pre['decision_counts'],
              'decision_counts_after': post['decision_counts'],
              'runtime_counts_before': pre['runtime_counts'],
              'runtime_counts_after': post['runtime_counts'],
              'forecast_or_decision_write': False,
              'engine_runtime_write': False,
              'auto_selector': 'OFF',
              'auto_ensemble': 'OFF',
          }
          Path('broad_research_v137_production_ingestion_result.json').write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'status': evidence['status'],
              'production_retrieval_run_id': evidence['production_retrieval_run_id'],
              'total_observations_written': evidence['total_observations_written'],
              'source_vintages_present': evidence['source_vintages_present'],
              'source_registry_rows_present': evidence['source_registry_rows_present'],
              'decision_counts_after': evidence['decision_counts_after'],
              'runtime_counts_after': evidence['runtime_counts_after'],
          }, indent=2, sort_keys=True))
          PY

      - name: Freeze production evidence in canonical and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('broad_research_v137_production_ingestion_result.json', encoding='utf-8'))
          lines = [
              '# Gold Control — Broad Research Data Spine R1 Production Ingestion Evidence',
              '',
              '**Evidence date:** 2026-09-06  ',
              '**Manifest:** `GOLD_CONTROL_PROJECT_MANIFEST.md` v1.37  ',
              f"**Canonical ingestion code SHA:** `{d['canonical_code_sha']}`  ",
              '**Binding result:** `SUCCESS_BROAD_RESEARCH_R1_PRODUCTION_SOURCE_DATA_INGESTION`',
              '',
              '## Frozen authority',
              '',
              '- token: `MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1`',
              '- engineering preflight run: `33991644883`',
              '- engineering artifact digest: `sha256:b1ae7a83d321372061d950c5f1cc8fad8262b570215f9a09ae22a4452fa355b5`',
              '- tested writer blob: `3bb80b42961e0a16fbbf40eb14ab5340d169e797`',
              '- corrected CORE5 blob: `bd7c1df860cc2975f123e300be597e9dec42e5c3`',
              '',
              '## Production persistence result',
              '',
              f"- retrieval run: `{d['production_retrieval_run_id']}`",
              '- research series inserted: `12`',
              '- observations written: `71,075`',
              '- source-vintage rows present for the frozen bundle identities: `126`',
              '- source-registry rows present: `12`',
              '- revised observations: `0`',
              '',
              '### Per-series rows',
              '',
          ]
          for sid, n in sorted(d['series_row_counts'].items()):
              lines.append(f'- `{sid}`: `{n:,}`')
          lines += [
              '',
              '## Authority-store and runtime invariants',
              '',
              '- `monthly_forecast_contracts = 0`',
              '- `decision_signal_snapshots = 0`',
              '- `decision_runs = 0`',
              '- `decision_events = 0`',
              '- governed runtime remained `ACTIVE=6 / WAITING=5 / BLOCKED=1`',
              '- forecast/decision write: `false`',
              '- engine-runtime write: `false`',
              '- `AUTO_SELECTOR=OFF`',
