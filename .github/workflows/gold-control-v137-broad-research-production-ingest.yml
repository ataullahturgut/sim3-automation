name: Gold Control v1.37 Broad Research Production Ingest

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - gold_axis_2026/tools/v137_broad_research_bootstrap.py
      - .github/workflows/gold-control-v137-broad-research-production-ingest.yml

permissions:
  contents: write

concurrency:
  group: gold-control-v137-broad-research-production-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Authorize v1.37 and persist Broad R1 source data
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BROAD_RESEARCH_PRODUCTION_WRITE_AUTHORIZED: MANIFEST_V1_37_BROAD_RESEARCH_DATA_SPINE_R1
          GOLD_CONTROL_MANIFEST_VERSION: "1.37"
          BROAD_RESEARCH_PREFLIGHT_HEAD_SHA: a0a06bbce8249f8e7ac4cc0f482f1f68c711657b
          BROAD_RESEARCH_PREFLIGHT_ARTIFACT_DIGEST: sha256:ba4300d3501211ce7deaeea61627042f066ec45e679f672deb1741e26e102f1a
        run: python gold_axis_2026/tools/v137_broad_research_bootstrap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-research-v137-production-${{ github.run_id }}
          path: broad_research_v137_production_ingestion_result.json
          if-no-files-found: ignore
          retention-days: 90
