name: Gold Control to GOLD GUARD research bridge read-only smoke
on:
  push:
    branches: [feature/gold-guard-model-research-bridge-v1-20261030]
    paths:
      - .github/workflows/gold-guard-research-bridge-smoke-v1.yml
      - gold_axis_2026/data_pipeline/schema_gold_guard_research_view_v1.sql
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-neon-view:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Read research view and ensure no official live issuance
        run: |
          python - <<'PY'
          import os,psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['NEON_DATABASE_URL'],
                 options='-c default_transaction_read_only=on',
                 row_factory=dict_row) as db:
              with db.cursor() as cur:
                  cur.execute("SELECT model_group,reference_date,evidence_class,production_live,scenario_count FROM gold_weekly_live.gold_research_model_panel_v1 ORDER BY reference_date DESC LIMIT 8")
                  rows=cur.fetchall()
          assert rows and all(not x['production_live'] for x in rows)
          assert all(x['model_group'] in ('WEEKLY_ANN_V34','RISK_BASE14_CFTC21_V22') for x in rows)
          for x in rows:
              if x['model_group']=='RISK_BASE14_CFTC21_V22':
                  assert x['scenario_count']==2
          print('GOLD_GUARD_RESEARCH_VIEW_PIT_NOT_CERTIFIED_READ_ONLY_PASS')
          print('rows_checked',len(rows))
          PY
