name: Gold Session Crossmetal V3 Exactclock 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_crossmetal_v3_exactclock_20261006.py'
      - '.github/workflows/gold-session-crossmetal-v3-exactclock-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4' 'databento>=0.60,<1'
      - name: Require source keys
        run: |
          test -n "$NEON_DATABASE_URL"
          test -n "$DATABENTO_API_KEY"
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_session_crossmetal_v3_exactclock_20261006.py
      - name: Run exact-clock diagnostic
        run: python gold_axis_2026/tools/gold_session_crossmetal_v3_exactclock_20261006.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/summary.json gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_SUMMARY_2026-10-06.json
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/result.md gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_RESULT_2026-10-06.md
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/metrics_2023_2024.csv gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_METRICS_2023_2024.csv
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/predictions_2023_2024.csv gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_PREDICTIONS_2023_2024.csv
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/coverage_2023_2024.csv gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_COVERAGE_2023_2024.csv
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/clock_quality.csv gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_CLOCK_QUALITY_2026-10-06.csv
          cp gold_axis_2026/SESSION_CROSSMETAL_V3_EXACTCLOCK_OUT/clock_samples.csv gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_CLOCK_SAMPLES_2026-10-06.csv
          git add gold_axis_2026/GOLD_SESSION_CROSSMETAL_V3_EXACTCLOCK_*
          if ! git diff --cached --quiet; then
            git commit -m "Record exact-clock cross-metal session diagnostic"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
