name: Gold H3 FLOW Public Daily Volume OI Probe V2
on:
  push:
    branches: [gold-h3-flow-oi-salvage-v1-20261003]
    paths:
      - 'gold_axis_2026/tools/gold_h3_flow_public_daily_volume_oi_probe_v2.py'
      - '.github/workflows/gold-h3-flow-public-daily-volume-oi-probe-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-flow-oi-salvage-v1-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check requests openpyxl
      - run: python gold_axis_2026/tools/gold_h3_flow_public_daily_volume_oi_probe_v2.py
      - name: Record evidence
        run: |
          cp gold_h3_flow_daily_volume_probe_out/RESULT.md gold_axis_2026/GOLD_H3_FLOW_PUBLIC_DAILY_VOLUME_OI_PROBE_V2_RESULT_2026-10-03.md
          cp gold_h3_flow_daily_volume_probe_out/probe.json gold_axis_2026/GOLD_H3_FLOW_PUBLIC_DAILY_VOLUME_OI_PROBE_V2_2026-10-03.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_FLOW_PUBLIC_DAILY_VOLUME_OI_PROBE_V2_RESULT_2026-10-03.md gold_axis_2026/GOLD_H3_FLOW_PUBLIC_DAILY_VOLUME_OI_PROBE_V2_2026-10-03.json
          if ! git diff --cached --quiet; then
            git commit -m "Record CME public daily-volume GC OI probe"
            git pull --rebase origin gold-h3-flow-oi-salvage-v1-20261003
            git push origin HEAD:gold-h3-flow-oi-salvage-v1-20261003
          fi
