name: Gold V34 daily conditional weekly mean research (no trading)
on:
  schedule:
    # Origin spot UTC day must finish before it may update a weekly estimate.
    # Tue-Sat, two source-publication attempts per day.
    - cron: '25 6 * * 2-6'
    - cron: '25 14 * * 2-6'
  workflow_dispatch:
  push:
    branches: [feature/gold-v34-weekly-daily-conditioned-20261030]
    paths:
      - '.github/workflows/gold-v34-daily-conditioned-research-v1.yml'
      - 'gold_axis_2026/data_pipeline/gold_v34_weekday_conditioned_shadow_v1.py'
      - 'gold_axis_2026/data_pipeline/test_gold_v34_weekday_conditioned_shadow_v1.py'
permissions:
  contents: read
concurrency:
  group: gold-v34-daily-conditioning-shadow-not-production
  cancel-in-progress: false
jobs:
  day-by-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Unit test strict price completion and first issue integrity
        run: python -m unittest gold_axis_2026/data_pipeline/test_gold_v34_weekday_conditioned_shadow_v1.py -v
      - name: Compute research-only conditioned week mean from actual as-of inputs
        run: |
          python gold_axis_2026/data_pipeline/gold_v34_weekday_conditioned_shadow_v1.py \
            --write --out gold_v34_daily_conditioning_report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v34-conditioned-week-research
          path: gold_v34_daily_conditioning_report.json
          retention-days: 30
          if-no-files-found: warn
