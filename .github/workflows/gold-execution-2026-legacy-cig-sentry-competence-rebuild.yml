name: Gold 2026 Authenticated H3 CIG SENTRY DART Decision Method Transfer
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_legacy_cig_sentry_rebuild_20261008.py
      - .github/workflows/gold-execution-2026-legacy-cig-sentry-competence-rebuild.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-legacy-h3-execution-clock-competence
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Execute reconstructed four-root expert consensus and H3-derived prior-matured competence under audited execution labels
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_legacy_cig_sentry_rebuild_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_legacy_cig_sentry_rebuild_20261008.py
      - name: Preserve private decisions and quotes outside published Git history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-legacy-cig-sentry-dated-expert-audit
          path: |
            gold_axis_2026/GOLD_EXECUTION_2026_LEGACY_CIG_SENTRY_REBUILD_20261008_PRIVATE_DATED_EXPERTS.csv
            gold_axis_2026/GOLD_EXECUTION_2026_LEGACY_CIG_SENTRY_REBUILD_20261008_PRIVATE_DATED_POLICIES.csv
          if-no-files-found: warn
      - name: Commit source-safe actual all-horizon outputs or explicit failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_LEGACY_CIG_SENTRY_REBUILD_20261008_{SUMMARY.json,YEAR_METRICS.csv,DIVERSITY.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Audit old H3 legacy competence/selective forecast architecture on actual 2023-26 09TR/17TR execution target'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
