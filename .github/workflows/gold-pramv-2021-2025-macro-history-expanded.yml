name: PRAMV Original M4 RFR Macro Full 2021-2025 History Expanded
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_pramv_2021_2025_history_expansion_20261008.py'
      - '.github/workflows/gold-pramv-2021-2025-macro-history-expanded.yml'
permissions:
  contents: write
concurrency:
  group: gold-2021-2025-pramv-expand-prior-2021-2022-source-v1
  cancel-in-progress: false
jobs:
  full-source-original-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Audit 2021-22 pre-release events and actually refit full frozen PRAMV architecture 2023-25
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_pramv_2021_2025_history_expansion_20261008.py
          python gold_axis_2026/tools/gold_execution_pramv_2021_2025_history_expansion_20261008.py
      - name: Preserve versioned dated forecasts without public macro consensus dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-pramv-macro-source-2021-2025-dated-evidence-private-artifact
          path: |
            gold_axis_2026/GOLD_EXECUTION_PRAMV_ORIGINAL_FULLER_HISTORY_2021_2025_SOURCE_MACRO_RETEST_20261008_DATED_PREDICTIONS.csv
            gold_axis_2026/GOLD_EXECUTION_PRAMV_ORIGINAL_FULLER_HISTORY_2021_2025_SOURCE_MACRO_RETEST_20261008_FOMC_ABLATION.csv
          if-no-files-found: warn
      - name: Commit only public reproducible counts and performance aggregates, no macro provider prices
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_PRAMV_ORIGINAL_FULLER_HISTORY_2021_2025_SOURCE_MACRO_RETEST_20261008_SUMMARY.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_PRAMV_ORIGINAL_FULLER_HISTORY_2021_2025_SOURCE_MACRO_RETEST_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_PRAMV_ORIGINAL_FULLER_HISTORY_2021_2025_SOURCE_MACRO_RETEST_20261008_YEARLY_METRICS.csv
          git add gold_axis_2026/GOLD_EXECUTION_PRAMV_ORIGINAL_FULLER_HISTORY_2021_2025_SOURCE_MACRO_RETEST_20261008_MACRO_PRE2023_QC.json
          git diff --cached --quiet || git commit -m 'Record strict 2021-24 historical macro-extended original PRAMV full retest with 2023-25 targets'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
