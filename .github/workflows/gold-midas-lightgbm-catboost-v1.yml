name: Gold MIDAS LightGBM CatBoost V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_lightgbm_catboost_v1.py
      - .github/workflows/gold-midas-lightgbm-catboost-v1.yml

permissions:
  contents: read

jobs:
  lgbm-cat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2' 'lightgbm>=4.5,<5' 'catboost>=1.2,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_lightgbm_catboost_v1.py
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_lightgbm_catboost_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-lightgbm-catboost-v1-${{ github.sha }}
          path: vw_midas_lightgbm_catboost_v1_result.json
          retention-days: 30
