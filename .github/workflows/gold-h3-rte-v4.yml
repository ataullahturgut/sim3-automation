name: Gold H3 RTE V4
on:
  push:
    branches: [gold-h3-rte-v4-material-20261003]
    paths:
      - 'gold_axis_2026/tools/gold_h3_rte_v4.py'
      - '.github/workflows/gold-h3-rte-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-rte-v4-material-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas scikit-learn
      - run: python gold_axis_2026/tools/gold_h3_rte_v4.py
      - name: Record RTE V4 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_RTE_V4_PREDICTIONS_2026-10-03.csv gold_axis_2026/GOLD_H3_RTE_V4_DEV_GRID_2026-10-03.csv gold_axis_2026/GOLD_H3_RTE_V4_BLOCK_METRICS_2026-10-03.csv gold_axis_2026/GOLD_H3_RTE_V4_SUMMARY_2026-10-03.json gold_axis_2026/GOLD_H3_RTE_V4_RESULT_2026-10-03.md
          if ! git diff --cached --quiet; then
            git commit -m "Record RTE-H3 V4 evidence"
            git pull --rebase origin gold-h3-rte-v4-material-20261003
            git push origin HEAD:gold-h3-rte-v4-material-20261003
          fi
