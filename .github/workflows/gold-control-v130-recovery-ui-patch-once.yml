name: Gold Control V1.30 Recovery UI Semantics Patch Once

on:
  push:
    branches: [gold-control-v130-recovery-ui-finalize]
    paths:
      - '.github/workflows/gold-control-v130-recovery-ui-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v130-recovery-ui-finalize
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply exact recovery UI replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/apps/gold_control_mobile_v1.py')
          text=p.read_text()
          old='MACRO_EVENT_STATUS = "BLOCKED_NOT_FULLY_RECOVERED"'
          new='MACRO_EVENT_STATUS = "BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED"'
          if text.count(old)!=1: raise SystemExit(f'MACRO_STATUS_COUNT:{text.count(old)}')
          text=text.replace(old,new)
          old_block='''    if raw=="BLOCKED_NOT_PROVEN_EXECUTABLE":\n        return "Takvime bağlı değil; exact executable runner ve provenance kanıtlanmadan çalışmaz."\n    if raw=="BLOCKED_NOT_FULLY_RECOVERED":\n        return "Takvime bağlı değil; frozen event kuralı/uygulaması tam recovery ve validation olmadan çalışmaz."\n    if raw=="BLOCKED_NO_PERSISTED_MONTHLY_PRICE_REFERENCE":\n        return "Takvime bağlı değil; authorized persisted monthly price reference üretilmeden çalışmaz."\n    if raw=="BLOCKED_EXACT_FORWARD_BOCPD_RULE_NOT_RECOVERED":\n        return "Takvime bağlı değil; exact forward BOCPD kuralı recover/freeze/test edilmeden çalışmaz."'''
          new_block='''    if raw=="BLOCKED_EXACT_REPLICATION_AND_PIT_SOURCE_CONTRACT_NOT_PROVEN":\n        return "Takvime bağlı değil; exact archived VW replication ve PIT/revision-safe source-vintage contract kanıtlanmadan çalışmaz."\n    if raw=="BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED":\n        return "Takvime bağlı değil; exact macro score, consensus ve release-vintage/timestamp contract recover edilmeden çalışmaz."\n    if raw=="WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE":\n        return "İlk governed CAUSAL_PATCH expert referansını bekliyor. İlk meşru aday: Eylül sonu → Ekim 2026 H=1."\n    if raw=="BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED":\n        return "Takvime bağlı değil; L=36 ve frozen threshold recover edildi, ancak exact prior/init ve reset-score implementation recover edilmeden çalışmaz."'''
          if text.count(old_block)!=1: raise SystemExit(f'ACTIVATION_BLOCK_COUNT:{text.count(old_block)}')
          text=text.replace(old_block,new_block)
          p.write_text(text)
          PY
      - name: Verify exact UI recovery semantics
        shell: bash
        run: |
          set -euo pipefail
          f=gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'BLOCKED_EXACT_REPLICATION_AND_PIT_SOURCE_CONTRACT_NOT_PROVEN' "$f"
          grep -Fq 'BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED' "$f"
          grep -Fq 'WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE' "$f"
          grep -Fq 'BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED' "$f"
          grep -Fq 'L=36 ve frozen threshold recover edildi' "$f"
          ! grep -Fq 'authorized persisted monthly price reference üretilmeden' "$f"
          python -m py_compile "$f"
      - name: Run app contract regressions
        run: |
          python -m pip install -q -r gold_axis_2026/apps/requirements.txt pytest
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_engine_observability_contract.py
      - name: Commit tested UI semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gold-control-ops'
          git config user.email 'gold-control-ops@users.noreply.github.com'
          git add gold_axis_2026/apps/gold_control_mobile_v1.py
          git diff --cached --quiet && { echo NO_UI_PATCH_CHANGES; exit 1; }
          git commit -m 'fix: align motor activation notes with recovery audit'
          git push origin HEAD:gold-control-v130-recovery-ui-finalize
