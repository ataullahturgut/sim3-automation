name: Gold PRAMV V1 Full Macro Repaired Clean-Source Backtest 2023-2025
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_pramv_repaired_full_retrain_20261008.py'
      - '.github/workflows/gold-pramv-v1-full-macro-repaired-20261008.yml'
permissions:
  contents: write
concurrency:
  group: gold-pramv-original-macro-repaired-newsource-20261008
  cancel-in-progress: false
jobs:
  actually-retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original PRAMV research numerical dependencies
        run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Replay original PRAMV M4 RFR and macro-veto using repaired official PIT calendar and source BID
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_pramv_repaired_full_retrain_20261008.py
          python gold_axis_2026/tools/gold_execution_pramv_repaired_full_retrain_20261008.py
      - name: Preserve dated PRAMV decisions and FOMC ablation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pramv-original-m4-rfr-macro-repaired-verified-bid-2023-2025-dated-evidence
          path: |
            gold_axis_2026/GOLD_EXECUTION_PRAMV_V1_MACRO_REPAIRED_CLEAN_SOURCE_FULL_RERUN_20261008_DATED_PREDICTIONS.csv
            gold_axis_2026/GOLD_EXECUTION_PRAMV_V1_MACRO_REPAIRED_CLEAN_SOURCE_FULL_RERUN_20261008_FOMC_ABLATION.csv
          if-no-files-found: warn
      - name: Commit aggregate reproducible result and grouped metrics, preserve original frozen PRAMV
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_PRAMV_V1_MACRO_REPAIRED_CLEAN_SOURCE_FULL_RERUN_20261008_SUMMARY.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_PRAMV_V1_MACRO_REPAIRED_CLEAN_SOURCE_FULL_RERUN_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_PRAMV_V1_MACRO_REPAIRED_CLEAN_SOURCE_FULL_RERUN_20261008_YEARLY_METRICS.csv
          git diff --cached --quiet || git commit -m 'Record entire PRAMV M4+RFR+FOMC macro veto source-retrained results with honest 2025 limits'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
