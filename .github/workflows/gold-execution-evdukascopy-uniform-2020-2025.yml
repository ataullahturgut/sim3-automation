name: Gold Execution EV Dukascopy Uniform 2020-2025 XAU BID ASK
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_evdukascopy_uniform_2020_2025_20261008.py'
      - '.github/workflows/gold-execution-evdukascopy-uniform-2020-2025.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-evdukascopy-uniform-2020-2025
  cancel-in-progress: false
jobs:
  uniform-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Free full-year gold BID and ASK capture and exact same-UTC pilot validation
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_evdukascopy_uniform_2020_2025_20261008.py
          python gold_axis_2026/tools/gold_execution_evdukascopy_uniform_2020_2025_20261008.py
      - name: Preserve aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-evdukascopy-uniform-2020-2025-aggregate-receipt
          path: gold_axis_2026/GOLD_EXECUTION_EV_DUKASCOPY_XAU_2020_2025_UNIFORM_CANDIDATE_20261008.json
          if-no-files-found: warn
      - name: Publish only aggregate provenance evidence
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_EV_DUKASCOPY_XAU_2020_2025_UNIFORM_CANDIDATE_20261008.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_EV_DUKASCOPY_XAU_2020_2025_UNIFORM_CANDIDATE_20261008.json
          git diff --cached --quiet || git commit -m 'Record independent same-source 2020-2025 XAU BID ASK quality and recovery evidence'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
