name: Gold H3 ARCR V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_asymmetric_recall_router_v1.py'
      - '.github/workflows/gold-h3-arcr-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      READINESS_ARTIFACT: 11217361007
      OUT_DIR: gold_h3_arcr_v1_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'lightgbm>=4,<5' 'xgboost>=3,<4' requests
      - name: Run ARCR H3 v1
        run: python gold_axis_2026/tools/gold_h3_asymmetric_recall_router_v1.py
      - name: Commit evidence
        run: |
          cp "$OUT_DIR/ARCR_V1_RESULT.md" gold_axis_2026/GOLD_H3_ARCR_V1_RESULT_2026-10-02.md
          cp "$OUT_DIR/arcr_v1_result.json" gold_axis_2026/GOLD_H3_ARCR_V1_RESULT_2026-10-02.json
          cp "$OUT_DIR/arcr_v1_metrics.csv" gold_axis_2026/GOLD_H3_ARCR_V1_METRICS_2026-10-02.csv
          cp "$OUT_DIR/arcr_v1_baseline_metrics.csv" gold_axis_2026/GOLD_H3_ARCR_V1_BASELINE_METRICS_2026-10-02.csv
          cp "$OUT_DIR/arcr_v1_selection_grid_2019_2021.csv" gold_axis_2026/GOLD_H3_ARCR_V1_SELECTION_GRID_2026-10-02.csv
          cp "$OUT_DIR/arcr_v1_2026_monthly.csv" gold_axis_2026/GOLD_H3_ARCR_V1_2026_MONTHLY_2026-10-02.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_ARCR_V1_*_2026-10-02.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ARCR H3 v1 results"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-arcr-v1
          path: gold_h3_arcr_v1_out/
          if-no-files-found: warn
          retention-days: 90
