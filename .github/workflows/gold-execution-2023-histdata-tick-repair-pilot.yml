name: GOLD 2023 Raw Tick BID ASK Repair Pilot
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_histdata_tick_2023_april_pilot_20261008.py'
      - '.github/workflows/gold-execution-2023-histdata-tick-repair-pilot.yml'
permissions:
  contents: write
jobs:
  tick-repair-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'histdata-fetcher>=0.1' 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Download independent tick zip and compare to 2023 missing 1m record times
        run: python gold_axis_2026/tools/gold_execution_histdata_tick_2023_april_pilot_20261008.py
      - name: Store aggregate receipt only
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2023_HISTDATA_TICK_BIDASK_REPAIR_PILOT_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2023_HISTDATA_TICK_BIDASK_REPAIR_PILOT_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record source-consistent tick repair feasibility for missing 2023 bars'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
