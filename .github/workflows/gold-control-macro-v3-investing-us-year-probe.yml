name: Gold Control Macro V3 Investing US Year Probe

on:
  push:
    branches: [gold-control-macro-event-successor-v3]
    paths: ['.github/workflows/gold-control-macro-v3-investing-us-year-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Probe Investing pagination
        run: |
          python - <<'PY'
          import json,requests
          from bs4 import BeautifulSoup
          base='https://www.investing.com/economic-calendar/'; filt=base+'Service/getCalendarFilteredData'
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9','X-Requested-With':'XMLHttpRequest','Referer':base,'Origin':'https://www.investing.com'}
          s=requests.Session(); r=s.get(base,headers=h,timeout=60); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser'); tz='55'; tf='timeRemain'
          sel=soup.find('select',{'id':'timeZone'}); opt=sel.find('option',selected=True) if sel else None
          if opt and opt.get('value'): tz=str(opt['value'])
          chk=soup.find('input',{'name':'timeFilter','checked':True})
          if chk and chk.get('value'): tf=str(chk['value'])
          all_cpi=[]
          for off in (0,200,400,600,800,1000):
            payload=[('dateFrom','2016-01-01'),('dateTo','2016-12-31'),('timeZone',tz),('timeFilter',tf),('currentTab','custom'),('submitFilters','1'),('limit_from',str(off)),('country[]','5')]
            rr=s.post(filt,data=payload,headers=h,timeout=60); print('offset',off,'status',rr.status_code,'len',len(rr.text)); rr.raise_for_status(); html=str(rr.json().get('data') or '')
            sp=BeautifulSoup('<table>'+html+'</table>','html.parser'); rows=[]; total=0
            for tr in sp.find_all('tr'):
              cell=tr.select_one('td.event')
              if not cell: continue
              flag=tr.select_one('td.flagCur span'); country=str(flag.get('title') or '') if flag else ''
              if country!='United States': continue
              total += 1
              attr=str(tr.get('event_attr_id') or tr.get('event_attr_ID') or '')
              if attr not in {'69','56'}: continue
              fore=tr.select_one('td.fore')
              rows.append({'attr':attr,'name':' '.join(cell.get_text(' ',strip=True).split()),'forecast':fore.get_text(' ',strip=True) if fore else None,'datetime':tr.get('data-event-datetime')})
            all_cpi.extend(rows)
            print(json.dumps({'offset':off,'us_rows':total,'cpi_rows':len(rows),'first':rows[:2],'last':rows[-2:]},indent=2))
          print(json.dumps({'all_cpi_count':len(all_cpi),'unique_datetimes':sorted(set(x['datetime'] for x in all_cpi))},indent=2))
          PY
