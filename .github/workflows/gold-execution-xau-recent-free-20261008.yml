name: Gold Execution Recent XAU Free 15m Gap
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_twelve_recent_xau_free_20261008.py'
      - '.github/workflows/gold-execution-xau-recent-free-20261008.yml'
permissions:
  contents: write
jobs:
  recent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_twelve_recent_xau_free_20261008.py
      - name: Record metadata receipt only
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_TWELVE_RECENT_XAU15M_GAP_20261008.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_TWELVE_RECENT_XAU15M_GAP_20261008.json
          git diff --cached --quiet || git commit -m 'Record private XAU recent backfill QC receipt'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
