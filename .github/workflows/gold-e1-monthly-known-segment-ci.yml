name: Gold E1 monthly known-segment audit reproducibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gold_axis_2026/GOLD_E1_20261012_MONTHLY_KNOWN_SEGMENT_INPUT_ROWS.csv"
      - "gold_axis_2026/tools/gold_e1_20261012_monthly_known_segment_audit.py"
      - ".github/workflows/gold-e1-monthly-known-segment-ci.yml"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install "numpy>=1.24,<3"
      - run: python3 gold_axis_2026/tools/gold_e1_20261012_monthly_known_segment_audit.py
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("gold_axis_2026/GOLD_E1_20261012_MONTHLY_KNOWN_SEGMENT_RECALC.json").read_text())
          d=j["groups"]["DEV"]
          assert d["n"]==33
          assert abs(d["sum_absolute_error"]["frozen_ChHHO"]-1413.0297794084559)<1e-6
          assert abs(d["sum_absolute_error"]["STAK_origin_last"]-1513.32)<1e-3
          assert 0>=d["paired_LAST_minus_CHHHO"]["moving_block3_bootstrap_mean_CI95"][0]
          assert 0<=d["paired_LAST_minus_CHHHO"]["moving_block3_bootstrap_mean_CI95"][1]
          print("E1 independent replay PASS")
          PY
