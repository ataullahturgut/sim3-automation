name: Gold Monthly DEV Snapshot V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_dev_snapshot_v1.py
      - gold_axis_2026/tools/gold_monthly_dev_snapshot_parity_v1.py
      - .github/workflows/gold-monthly-dev-snapshot-v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: '0'
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: Export-DEV-Snapshot-Once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install export dependencies
        run: python -m pip install "numpy>=2.0,<3" "psycopg[binary]>=3.2,<4"
      - name: Compile snapshot exporter
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_dev_snapshot_v1.py gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
      - name: Export exactly one READ_ONLY DEV snapshot
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python gold_axis_2026/tools/gold_monthly_dev_snapshot_v1.py \
            --mode export \
            --output gold_monthly_dev_snapshot_v1.json \
            --manifest-output gold_monthly_dev_snapshot_v1_manifest.json
      - name: Verify snapshot locally
        run: |
          unset NEON_DATABASE_URL
          python gold_axis_2026/tools/gold_monthly_dev_snapshot_v1.py \
            --mode verify \
            --input gold_monthly_dev_snapshot_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-dev-snapshot-v1-${{ github.sha }}
          path: |
            gold_monthly_dev_snapshot_v1.json
            gold_monthly_dev_snapshot_v1_manifest.json
          if-no-files-found: error
          retention-days: 90

  parity:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: Offline-CNN-LSTM-Parity
    env:
      TF_DETERMINISTIC_OPS: '1'
      TF_ENABLE_ONEDNN_OPTS: '0'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      NEON_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: gold-monthly-dev-snapshot-v1-${{ github.sha }}
          path: snapshot_artifact
      - name: Install frozen parity dependencies
        run: python -m pip install "tensorflow-cpu==2.20.0" "numpy>=2.0,<3" "psycopg[binary]>=3.2,<4" "scikit-learn>=1.5,<2"
      - name: Compile offline parity runner
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_dev_snapshot_parity_v1.py gold_axis_2026/tools/gold_monthly_dev_snapshot_v1.py gold_axis_2026/tools/gold_monthly_cnn_lstm_stage0_v1.py
      - name: Run offline parity with DB disabled
        run: |
          unset NEON_DATABASE_URL
          python gold_axis_2026/tools/gold_monthly_dev_snapshot_parity_v1.py \
            --snapshot snapshot_artifact/gold_monthly_dev_snapshot_v1.json \
            --output gold_monthly_dev_snapshot_v1_parity_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-dev-snapshot-v1-parity-${{ github.sha }}
          path: gold_monthly_dev_snapshot_v1_parity_result.json
          if-no-files-found: error
          retention-days: 90
