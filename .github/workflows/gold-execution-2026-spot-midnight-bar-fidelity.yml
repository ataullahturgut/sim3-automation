name: Gold 2026 Native Quote Midnight Source Repeated-Bar Audit
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_spot_midnight_quote_fidelity_20261009.py
      - .github/workflows/gold-execution-2026-spot-midnight-bar-fidelity.yml
permissions:
  contents: write
concurrency:
  group: gold-dukas-spotsource-midnight-ohlc-price-staleness
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Quantify native same-Dukascopy broker midnight 15m repeated prices 2023-26 without price-filling or target leakage
        run: |
          python gold_axis_2026/tools/gold_execution_2026_spot_midnight_quote_fidelity_20261009.py
      - name: Preserve source-safe hourly-midnight aggregates only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_SPOT_M15_MIDNIGHT_SOURCE_FIDELITY_20261009_{SUMMARY.json,NIGHT_AGGREGATE.csv,BAR_LEVEL_AGGREGATE.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Report 2026 XAU native broker spot 00TR and 01TR candle microprice staleness vs 2023–25 missing intervals'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
