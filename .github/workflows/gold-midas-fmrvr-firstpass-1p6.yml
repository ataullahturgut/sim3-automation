name: Gold MIDAS FMRVR Firstpass 1p6

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_fmrvr_firstpass_1p6.py
      - .github/workflows/gold-midas-fmrvr-firstpass-1p6.yml

permissions:
  contents: read

jobs:
  firstpass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4'
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_fmrvr_firstpass_1p6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-fmrvr-firstpass-1p6-${{ github.sha }}
          path: vw_midas_fmrvr_firstpass_1p6.json
          retention-days: 30
