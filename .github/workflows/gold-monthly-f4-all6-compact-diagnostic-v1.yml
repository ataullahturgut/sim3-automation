name: Gold Monthly F4 ALL6 Compact Diagnostic V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_f4_all6_compact_candidate_v1.py
      - gold_axis_2026/tools/gold_monthly_f4_all6_compact_summarize_v1.py
      - .github/workflows/gold-monthly-f4-all6-compact-diagnostic-v1.yml

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [BASE, ALL6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev.zip
          unzip -q dev.zip -d dev
          test -s dev/gold_monthly_dev_snapshot_v1.json
      - name: Download External Authority V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11028494060/zip" > ext.zip
          unzip -q ext.zip -d ext
          test -s ext/gold_monthly_external_authority_v2.json
      - name: Download B2 authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11031577274/zip" > b2.zip
          unzip -q b2.zip -d b2
          test -s b2/gold_monthly_f4_b2_processing_optimizer_parity_v1.json
      - name: Compile candidate runner
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_f4_all6_compact_candidate_v1.py
      - name: Run candidate
        run: |
          python gold_axis_2026/tools/gold_monthly_f4_all6_compact_candidate_v1.py \
            --snapshot dev/gold_monthly_dev_snapshot_v1.json \
            --external-v2 ext/gold_monthly_external_authority_v2.json \
            --b2-audit b2/gold_monthly_f4_b2_processing_optimizer_parity_v1.json \
            --variant "${{ matrix.variant }}" \
            --output "all6_${{ matrix.variant }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-f4-all6-${{ matrix.variant }}-${{ github.sha }}
          path: all6_${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 90

  summarize:
    needs: candidate
    if: always() && needs.candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: gold-monthly-f4-all6-*-${{ github.sha }}
          path: all6_results
      - name: Summarize ALL6 diagnostic
        run: |
          python gold_axis_2026/tools/gold_monthly_f4_all6_compact_summarize_v1.py \
            --dir all6_results \
            --output GOLD_MONTHLY_F4_ALL6_COMPACT_RESULT_2026-09-29.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-f4-all6-summary-${{ github.sha }}
          path: GOLD_MONTHLY_F4_ALL6_COMPACT_RESULT_2026-09-29.json
          if-no-files-found: error
          retention-days: 90
