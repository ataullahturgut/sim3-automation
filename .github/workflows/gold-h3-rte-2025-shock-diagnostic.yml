name: Gold H3 RTE 2025 Shock Diagnostic
on:
  push:
    branches: [gold-h3-rte-v2-20261003]
    paths:
      - 'gold_axis_2026/tools/gold_h3_rte_2025_shock_diagnostic.py'
      - '.github/workflows/gold-h3-rte-2025-shock-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-rte-v2-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_rte_2025_shock_diagnostic.py
      - name: Record diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_RTE_2025_SHOCK_DIAGNOSTIC.json gold_axis_2026/GOLD_H3_RTE_2025_SHOCK_DIAGNOSTIC.md
          if ! git diff --cached --quiet; then
            git commit -m "Record RTE 2025 shock diagnostic"
            git pull --rebase origin gold-h3-rte-v2-20261003
            git push origin HEAD:gold-h3-rte-v2-20261003
          fi
