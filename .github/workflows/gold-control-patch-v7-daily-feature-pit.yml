name: Gold Control Patch V7 Daily Feature PIT

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_DAILY_FEATURE_PIT_CHANGE_CONTROL_V7_2026-09-02.md'
      - 'gold_axis_2026/tools/causal_patch_r1_repro_v7_daily_feature_pit.py'
      - '.github/workflows/gold-control-patch-v7-daily-feature-pit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locked-v7:
    runs-on: ubuntu-24.04
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked runtime
        run: |
          pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'requests>=2.31,<3'
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'

      - name: Require protected provider credentials
        run: |
          test -n "$TWELVE_DATA_API_KEY"
          test -n "$FRED_API_KEY"

      - name: Verify V7 pre-result freeze and parent evidence
        run: |
          grep -F 'FROZEN_BEFORE_V7_MODEL_RESULT' gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_DAILY_FEATURE_PIT_CHANGE_CONTROL_V7_2026-09-02.md
          grep -F 'CAUSAL_PATCH_R1_REPRO_V1_6_COMPLETED_SESSION_DAILY_FEATURE_ORIGIN_SAFE' gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_DAILY_FEATURE_PIT_CHANGE_CONTROL_V7_2026-09-02.md
          grep -F '"decision": "PATCH_R1_V6_MONTHLY_LEVEL_MODEL_IMPACT_PASS"' gold_axis_2026/patch_repro_v1/locked_replay_v6_monthly_level_evidence.json

      - name: Run frozen V7 PIT and locked model-impact gates
        run: python gold_axis_2026/tools/causal_patch_r1_repro_v7_daily_feature_pit.py

      - name: Verify evidence isolation
        if: always()
        run: |
          test -f gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"post_result_retune": false' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"raw_vendor_market_values_logged": false' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"database_write": "NONE"' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"forecast_ledger_write": "NONE"' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"decision_store_write": "NONE"' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json

      - name: Commit immutable V7 evidence before declaring result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          if test -f gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_43.csv; then
            git add gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_43.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'gold-control: record frozen Patch V7 completed-session PIT evidence'
            git push origin HEAD:gold-r4-direction-engine
          fi

      - name: Enforce V7 PASS for downstream eligibility
        run: |
          grep -F '"decision": "PATCH_R1_V7_COMPLETED_SESSION_DAILY_FEATURE_MODEL_IMPACT_PASS"' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"model_impact_pass": true' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
          grep -F '"same_origin_date_feature_uses": 0' gold_axis_2026/patch_repro_v1/locked_replay_v7_daily_feature_pit_evidence.json
