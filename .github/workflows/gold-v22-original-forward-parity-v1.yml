name: Gold V22 original seven-rule forward scoring parity (research only)
on:
  push:
    branches:
      - research/gold-v34-forward-parity-safe-20261030
    paths:
      - 'gold_axis_2026/research/case_control_v13/gold_v22_forward_rule_parity_v1.py'
      - '.github/workflows/gold-v22-original-forward-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-asof-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original V22 data dependencies
        run: python -m pip install numpy pandas
      - name: Compile forward rule scorer
        run: python -m py_compile gold_axis_2026/research/case_control_v13/gold_v22_forward_rule_parity_v1.py
      - name: Strictly compare all original V22 as-of records without target labels
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -u gold_v22_forward_rule_parity_v1.py --mode historical-parity --out outputs/v22_forward_rule_parity_research_only.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-v22-original-forward-parity-evidence
          path: gold_axis_2026/research/case_control_v13/outputs/v22_forward_rule_parity_research_only.json
          if-no-files-found: warn
          retention-days: 30
