name: Gold V20 Audit Repair R1
on:
  push:
    branches: ['research-gold-v20-audit-repair-*']
  pull_request:
    branches: ['research-gold-v20-atlas-regret-gated-20261016']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse repaired model + property tests
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --check v20_kavis_atlas_repaired.js
          node --check v20_kavis_atlas_repaired.test.js
          node --check v20_audit_128_economic.js
          node --check v20_audit_64_newworlds.js
      - name: Repaired model strict adversarial tests plus legacy core
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --test v16_kavis_siralama.test.js v16_kavis_counterfactual_audit.test.js v17_kavis_olay_doubleq.test.js v18_kavis_adversarial.test.js v20_kavis_atlas_repaired.test.js
      - name: Full npm research test contract V15 to V20 repaired
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: npm run test:kavis-research
      - name: Baseline and repaired 128 exposed + 24 budget stress worlds
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v20_audit_128_economic.js > v20_audit_128_economic_results.json
          node -e "const r=require('./v20_audit_128_economic_results.json');console.log(JSON.stringify({kind:r.label,summary:r.summary,explicit15pct:r.explicit15pct,byMode:r.byMode,worst:r.worstCases},null,2))"
      - name: 64 fresh fictional worlds outside the former 128 price generator
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v20_audit_64_newworlds.js > v20_audit_64_newworlds_results.json
          node -e "const r=require('./v20_audit_64_newworlds_results.json');console.log(JSON.stringify({contract:r.contract,summary:r.summary,worlds:r.summaryByWorld},null,2))"
      - name: Explicit refusal of historical-data simulation
        run: |
          if grep -E 'loadFullRows|v13_sentez_run|2026_FEB_SEP|function placeOrder' gold_axis_2026/apps/portfolio_guard_v1/v20_kavis_atlas_repaired.js gold_axis_2026/apps/portfolio_guard_v1/v20_kavis_atlas_repaired.test.js; then
            echo "Unexpected live-order or historical backtest dependency"
            exit 1
          fi
      - name: Preserve critical economic negative cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-audit-128-worlds-plus-24-budget
          path: |
            gold_axis_2026/apps/portfolio_guard_v1/v20_audit_128_economic_results.json
            gold_axis_2026/apps/portfolio_guard_v1/v20_audit_64_newworlds_results.json
          if-no-files-found: ignore
