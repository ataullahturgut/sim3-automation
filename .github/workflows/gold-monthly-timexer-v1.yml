name: Gold Monthly TimeXer V1

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - gold_axis_2026/tools/gold_monthly_timexer_v1.py
  workflow_dispatch:

jobs:
  timexer-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TIMEXER_SRC: "/tmp/TimeXer"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen packages and official TimeXer source
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.23.5' 'psycopg[binary]==3.3.6' 'scipy==1.10.1' 'einops==0.4.0' 'reformer-pytorch==1.4.4'
          python -m pip install 'torch==2.0.1' --index-url https://download.pytorch.org/whl/cpu
          git clone https://github.com/thuml/TimeXer.git /tmp/TimeXer
          cd /tmp/TimeXer
          git checkout 76011909357972bd55a27adba2e1be994d81b327
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_timexer_v1.py
      - name: Run TimeXer
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_timexer_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open("gold_monthly_timexer_v1_result.json"))
          assert p["scientific_gate"] == "PASS"
          assert p["authority_invariants_unchanged"] is True
          assert p["contract"]["random_split"] == "NONE"
          assert p["contract"]["future_exogenous"] == "NONE"
          assert p["contract"]["2025_role"] == "LOCKED_REPORT_ONLY"
          assert p["contract"]["2026_role"] == "QUARANTINED_REPORT_ONLY"
          assert p["dev"]["metrics"]["n"] == 33
          print("TIMEXER_V1_GATE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-timexer-v1
          path: gold_monthly_timexer_v1_result.json
