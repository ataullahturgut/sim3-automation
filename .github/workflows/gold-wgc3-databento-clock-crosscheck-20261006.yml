name: Gold WGC3 Databento Clock Crosscheck 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_wgc3_databento_clock_crosscheck_20261006.py'
      - '.github/workflows/gold-wgc3-databento-clock-crosscheck-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'databento>=0.60,<1' 'numpy>=2,<3' 'pandas>=2.2,<3'
      - run: python gold_axis_2026/tools/gold_wgc3_databento_clock_crosscheck_20261006.py
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/WGC3_DATABENTO_CLOCK_CROSSCHECK_OUT/summary.json gold_axis_2026/GOLD_WGC3_DATABENTO_CLOCK_CROSSCHECK_2026-10-06.json
          cp gold_axis_2026/WGC3_DATABENTO_CLOCK_CROSSCHECK_OUT/rows.csv gold_axis_2026/GOLD_WGC3_DATABENTO_CLOCK_CROSSCHECK_ROWS_2023_2025.csv
          git add gold_axis_2026/GOLD_WGC3_DATABENTO_CLOCK_CROSSCHECK_*
          if ! git diff --cached --quiet; then
            git commit -m "Record independent GC cross-check for WGC clocks"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
