name: Gold Control Macro Event Successor V2 Promotion Patch

on:
  push:
    branches:
      - gold-control-macro-event-successor-v2-promotion
    paths:
      - 'gold_axis_2026/tools/apply_macro_event_v2_promotion_patch.py'
      - '.github/workflows/gold-control-macro-event-successor-v2-promotion-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-macro-event-successor-v2-promotion-patch
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: gold-control-macro-event-successor-v2-promotion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic promotion patch
        run: python gold_axis_2026/tools/apply_macro_event_v2_promotion_patch.py

      - name: Validate manifest and runtime registry
        run: |
          python -m py_compile gold_axis_2026/apps/engine_observability_contract.py
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          from pathlib import Path
          from engine_observability_contract import ENGINE_DISPLAY_ORDER, ENGINE_REGISTRY
          manifest=Path('gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md').read_text(encoding='utf-8')
          assert '**Manifest version:** 1.35' in manifest
          assert 'MACRO_EVENT_SUCCESSOR_V2' in manifest
          assert 'ACTIVE = 6' in manifest
          assert 'BLOCKED = 1' in manifest
          assert len(ENGINE_DISPLAY_ORDER)==12
          assert 'MACRO_EVENT' not in ENGINE_DISPLAY_ORDER
          assert 'MACRO_EVENT_SUCCESSOR_V2' in ENGINE_DISPLAY_ORDER
          assert ENGINE_REGISTRY['MACRO_EVENT_SUCCESSOR_V2']['direction_vote'] is False
          assert ENGINE_REGISTRY['MACRO_EVENT_SUCCESSOR_V2']['version']=='MACRO_EVENT_SUCCESSOR_V2'
          print('MACRO_EVENT_V2_PROMOTION_STATIC_CONTRACT_PASS')
          PY

      - name: Run engine observability tests
        run: |
          pip install pytest
          PYTHONPATH=gold_axis_2026/apps pytest -q gold_axis_2026/apps/test_engine_observability_contract.py

      - name: Commit patched canonical-contract files
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
                  gold_axis_2026/apps/engine_observability_contract.py \
                  gold_axis_2026/apps/test_engine_observability_contract.py
          if git diff --cached --quiet; then
            echo 'PROMOTION_PATCH_NO_CHANGES'
            exit 0
          fi
          git commit -m 'gold-control: promote Macro Event Successor V2 contracts'
          git push origin HEAD:gold-control-macro-event-successor-v2-promotion
