name: Gold XAU Source Label Disagreement Anatomy
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_xau_label_disagreement_anatomy_20261008.py'
      - '.github/workflows/gold-execution-xau-label-disagreement-qc.yml'
permissions:
  contents: write
jobs:
  source-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_xau_label_disagreement_anatomy_20261008.py
      - name: Commit only source sensitivity aggregates
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_XAU_SOURCE_LABEL_DISAGREEMENT_ANATOMY_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_XAU_SOURCE_LABEL_DISAGREEMENT_ANATOMY_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record source-dependent XAU direction labels by return magnitude'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
