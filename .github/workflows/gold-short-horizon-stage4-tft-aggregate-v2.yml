name: Gold Short Horizon Stage4 TFT Aggregate V2

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - '.github/workflows/gold-short-horizon-stage4-tft-aggregate-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests
      - name: Download frozen TFT task artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os,requests,zipfile,io,pathlib
          repo="ataullahturgut/sim3-automation"
          items={"class":11176206620,"quant":11176830553}
          token=os.environ["GH_TOKEN"]
          for i,(name,aid) in enumerate(items.items()):
              u=f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip"
              r=requests.get(u,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"},timeout=120)
              r.raise_for_status()
              z=zipfile.ZipFile(io.BytesIO(r.content))
              dest=pathlib.Path(f"task{i}")
              dest.mkdir(exist_ok=True)
              for member in z.namelist():
                  if member.endswith("/"):
                      continue
                  base=pathlib.Path(member).name
                  if base.endswith(".json") or base.endswith(".csv"):
                      (dest/base).write_bytes(z.read(member))
          PY
      - name: Aggregate frozen TFT results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gold_axis_2026/tools/gold_short_horizon_stage4_aggregate.py
      - name: Upload aggregate V2
        uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-stage4-aggregate-v2
          path: stage4_all/
          retention-days: 90
