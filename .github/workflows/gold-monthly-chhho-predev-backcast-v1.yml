name: Gold Monthly ChHHO PreDEV Backcast V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_predev_backcast_v1.py
      - gold_axis_2026/GOLD_MONTHLY_CHHHO_PREDEV_GPR_WEB_LATEST_AUTHORITY_2026-09-30.md
      - .github/workflows/gold-monthly-chhho-predev-backcast-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  backcast:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install \
            'numpy>=2.0,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' \
            'openpyxl>=3.1,<4' 'psycopg[binary]>=3.2,<4' \
            'scikit-learn>=1.5,<2' 'scipy>=1.13,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_predev_backcast_v1.py
      - name: Run source audit and ChHHO backcast
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_predev_backcast_v1.py \
            --output GOLD_MONTHLY_CHHHO_PREDEV_BACKCAST_V1_2026-09-30.json
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json, math
          p='GOLD_MONTHLY_CHHHO_PREDEV_BACKCAST_V1_2026-09-30.json'
          r=json.load(open(p))
          assert r['status'] in ('COMPLETE','SOURCE_BLOCKED_NO_MODEL_RUN')
          if r['status']=='COMPLETE':
              rows=r['rows']
              assert rows
              assert all(math.isfinite(x['forecast']) and math.isfinite(x['actual']) and math.isfinite(x['ae']) for x in rows)
              assert all(x['source_commit_at'] for x in rows)
              assert r['governance']['current_final_gpr_substitution'] is False
              assert r['governance']['future_or_target_labels_used_in_features'] is False
          print('SCIENTIFIC_GATE=PASS', r['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-chhho-predev-backcast-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_PREDEV_BACKCAST_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
