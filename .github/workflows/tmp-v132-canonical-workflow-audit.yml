name: TMP Gold Control V1.32 Canonical Workflow Audit
on:
  push:
    branches: [gold-control-v132-monthly-origin-contract]
    paths: ['.github/workflows/tmp-v132-canonical-workflow-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: List canonical-triggered workflow manifest coupling
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do
            if grep -q 'gold-r4-direction-engine' "$f"; then
              echo "=== $f ==="
              grep -n -E 'name:|branches:|gold-r4-direction-engine|GOLD_CONTROL_PROJECT_MANIFEST|Manifest version|git commit|git push|apply_manifest|reconcile_manifest' "$f" || true
            fi
          done
