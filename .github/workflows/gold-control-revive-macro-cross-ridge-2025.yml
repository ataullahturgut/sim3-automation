name: Gold Control Revive MACRO_CROSS_RIDGE 2025
on:
  workflow_dispatch:
  push:
    branches: [gold-control-revive-macro-cross-ridge-2025]
    paths:
      - 'gold_axis_2026/research_revival/macro_cross_ridge_reconstruction_v1_contract.json'
      - 'gold_axis_2026/tools/macro_cross_ridge_reconstruction_v1_2025.py'
      - '.github/workflows/gold-control-revive-macro-cross-ridge-2025.yml'
permissions:
  contents: read
  actions: read
jobs:
  replay-2025:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FORMATION_ARTIFACT_ID: '10338387444'
      CHALLENGE_ARTIFACT_ID: '10343971259'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet numpy pandas scikit-learn 'psycopg[binary]'
      - name: Require frozen contract
        run: |
          test -n "$NEON_DATABASE_URL"
          python - <<'PY'
          import json; from pathlib import Path
          c=json.loads(Path('gold_axis_2026/research_revival/macro_cross_ridge_reconstruction_v1_contract.json').read_text())
          assert c['status']=='FROZEN_BEFORE_2025_REPLAY' and not c['split']['challenge_refit'] and not c['split']['challenge_hyperparameter_search'] and not c['split']['challenge_threshold_search']
          print('CONTRACT_FREEZE_OK')
          PY
      - name: Download exact NY17 artifacts
        run: |
          mkdir -p /tmp/mc/wp1 /tmp/mc/ch /tmp/mc/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FORMATION_ARTIFACT_ID}/zip" > /tmp/mc/wp1.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHALLENGE_ARTIFACT_ID}/zip" > /tmp/mc/ch.zip
          unzip -q /tmp/mc/wp1.zip -d /tmp/mc/wp1; unzip -q /tmp/mc/ch.zip -d /tmp/mc/ch
          HIST=$(find /tmp/mc/wp1 -type f -name 'gc_break_wp1_exact_ny17_consolidated_batch_v3.csv' | head -n1); CH=$(find /tmp/mc/ch -type f -name 'gc_break_wp1_exact_ny17_consolidated_batch_v3.csv' | head -n1)
          test -f "$HIST" && test -f "$CH"; echo "HIST=$HIST" >> "$GITHUB_ENV"; echo "CH=$CH" >> "$GITHUB_ENV"
      - name: Extract macro and cross-market research series
        run: |
          python - <<'PY'
          import csv,os,psycopg
          sids=['XAG_STAKTRAKR_RESEARCH_DAILY_R1','XPT_STAKTRAKR_RESEARCH_DAILY_R1','XPD_STAKTRAKR_RESEARCH_DAILY_R1','NASDAQ100_FRED','SP500_FRED','DJIA_FRED','DGS10_ALFRED_PIT_ME','DFF_ALFRED_PIT_ME','DEXCHUS_ALFRED_PIT_ME','MACRO_EVENT_V3_EMPLOYMENT_SCORE','MACRO_EVENT_V3_INFLATION_SCORE']
          out='/tmp/mc/external.csv'
          with psycopg.connect(os.environ['NEON_DATABASE_URL']) as conn:
            with conn.cursor() as cur,open(out,'w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['series_id','observation_ts','value','available_as_of']); cur.execute("SELECT series_id,observation_ts,value,available_as_of FROM public.observations WHERE series_id=ANY(%s) AND observation_ts>=%s AND observation_ts<%s ORDER BY series_id,observation_ts",(sids,'2021-01-01','2026-01-02')); n=0
              while True:
                rows=cur.fetchmany(10000)
                if not rows: break
                w.writerows(rows); n+=len(rows)
          print({'external_rows':n}); assert n>5000
          PY
          echo "EXTERNAL_SHA256=$(sha256sum /tmp/mc/external.csv | awk '{print $1}')" >> "$GITHUB_ENV"
      - run: python -m py_compile gold_axis_2026/tools/macro_cross_ridge_reconstruction_v1_2025.py
      - name: Fit 2022-2024 and score 2025
        run: |
          python gold_axis_2026/tools/macro_cross_ridge_reconstruction_v1_2025.py --historical-exact "$HIST" --challenge-exact "$CH" --external-csv /tmp/mc/external.csv --contract gold_axis_2026/research_revival/macro_cross_ridge_reconstruction_v1_contract.json --output-dir /tmp/mc/out | tee /tmp/mc/out/run.log
      - name: Audit output
        run: |
          python - <<'PY'
          import json,os; from pathlib import Path
          p=Path('/tmp/mc/out/macro_cross_ridge_reconstruction_v1_2025_summary.json'); d=json.loads(p.read_text()); assert d['status']=='PASS' and not d['original_identity_recovered'] and not d['challenge_refit'] and not d['hyperparameter_search'] and not d['threshold_search'] and not d['post_challenge_tuning']; assert d['challenge_feature_complete_rows']>=180; d['external_input_sha256']=os.environ['EXTERNAL_SHA256']; p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); print('MACRO_CROSS_RIDGE_RECONSTRUCTION_2025_PASS'); print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: macro-cross-ridge-reconstruction-v1-2025, path: /tmp/mc/out/, if-no-files-found: error, retention-days: 90}
