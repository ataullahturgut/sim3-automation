name: Gold BOCPD Hourly B2 Pre-2025 Calibration

on:
  push:
    branches: [gold-bocpd-hourly-b2-authority-20260916]
    paths:
      - '.github/workflows/gold-bocpd-hourly-b2-calibration-20260916.yml'
  workflow_dispatch:

concurrency:
  group: gold-bocpd-hourly-b2-calibration-20260916
  cancel-in-progress: true

jobs:
  calibrate-b2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OUTPUT_DIR: candidate_b2_calibration_output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r gold_axis_2026/data_pipeline/requirements.txt
          pip install 'scipy>=1.13,<2'
      - name: Require protected database secret
        run: test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL missing"; exit 1; }
      - name: Compile calibration runner
        run: |
          python -m py_compile gold_axis_2026/tools/bocpd_hourly_candidate_b_v1_r1.py
          python -m py_compile gold_axis_2026/tools/bocpd_hourly_candidate_b2_calibration_v1.py
          python -m py_compile gold_axis_2026/tools/bocpd_hourly_candidate_b2_calibration_v1_r1.py
      - name: Run pre-2025 calibration only
        run: python gold_axis_2026/tools/bocpd_hourly_candidate_b2_calibration_v1_r1.py
      - name: Upload calibration outputs
        uses: actions/upload-artifact@v4
        with:
          name: bocpd-hourly-b2-pre2025-calibration-r1
          path: candidate_b2_calibration_output/
          if-no-files-found: error
          retention-days: 90
