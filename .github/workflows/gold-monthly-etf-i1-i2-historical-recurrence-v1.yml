name: Gold Monthly ETF I1 I2 Historical Recurrence V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_etf_i1_i2_historical_recurrence_v1.py
      - .github/workflows/gold-monthly-etf-i1-i2-historical-recurrence-v1.yml

permissions:
  contents: read

jobs:
  recurrence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4' 'requests>=2.32,<3' 'lxml>=5,<7'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_etf_i1_i2_historical_recurrence_v1.py
      - name: Run recurrence test
        run: |
          python gold_axis_2026/tools/gold_monthly_etf_i1_i2_historical_recurrence_v1.py \
            --output GOLD_MONTHLY_ETF_I1_I2_HISTORICAL_RECURRENCE_V1_2026-09-30.json
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_ETF_I1_I2_HISTORICAL_RECURRENCE_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['governance']['model_free'] is True
          assert r['governance']['target_month_etf_used_in_signal'] is False
          assert r['governance']['mechanism_thresholds_retuned'] is False
          assert r['stats']['HISTORICAL_2010_2020']['I1']['events'] >= 2
          assert r['stats']['HISTORICAL_2010_2020']['I2']['events'] >= 2
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps(r['stats']['HISTORICAL_2010_2020'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-etf-i1-i2-historical-recurrence-v1-${{ github.sha }}
          path: GOLD_MONTHLY_ETF_I1_I2_HISTORICAL_RECURRENCE_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
