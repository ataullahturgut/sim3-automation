name: Gold Monthly F4 B1 Transform Parity V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_f4_b1_transform_parity_v1.py
      - .github/workflows/gold-monthly-f4-b1-transform-parity-v1.yml

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev.zip
          unzip -q dev.zip -d dev
          find dev -maxdepth 2 -type f -print
      - name: Download External Authority V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11028494060/zip" > ext.zip
          unzip -q ext.zip -d ext
          test -s ext/gold_monthly_external_authority_v2.json
      - name: Compile audit
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_f4_b1_transform_parity_v1.py
      - name: Run B1 transform parity audit
        run: |
          SNAP=dev/gold_monthly_dev_snapshot_v1.json
          python gold_axis_2026/tools/gold_monthly_f4_b1_transform_parity_v1.py             --snapshot "$SNAP"             --external-v2 ext/gold_monthly_external_authority_v2.json             --output gold_monthly_f4_b1_transform_parity_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-f4-b1-transform-parity-${{ github.sha }}
          path: gold_monthly_f4_b1_transform_parity_v1.json
          if-no-files-found: error
          retention-days: 90
