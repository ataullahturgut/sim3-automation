# Trigger-ready workflow for the frozen Parisi V2 contract.
name: Gold Control Parisi Rolling Ward Recon V2

on:
  push:
    branches:
      - gold-direction-vlmc-bs-family-v2-20260918
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_PREREG_2026-09-21.md'
      - 'gold_axis_2026/tools/direction_parisi_rolling_ward_recon_v2.py'
      - '.github/workflows/gold-control-parisi-rolling-ward-recon-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-parisi-rolling-ward-recon-v2
  cancel-in-progress: false

jobs:
  parisi-ward-recon-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-vlmc-bs-family-v2-20260918
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require protected research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'psycopg[binary]>=3.2,<4' 'statsmodels>=0.14,<0.15'

      - name: Compile corrected Parisi V2 implementation
        run: python -m py_compile gold_axis_2026/tools/direction_parisi_rolling_ward_recon_v2.py

      - name: Assert read-only research implementation
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table'             gold_axis_2026/tools/direction_parisi_rolling_ward_recon_v2.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/direction_parisi_rolling_ward_recon_v2.py
          echo 'PARISI_RECON_V2_READ_ONLY_PASS'

      - name: Run pre-2025 selection and unchanged 2024 validation
        run: |
          rm -rf parisi_v2_pre2025
          mkdir -p parisi_v2_pre2025
          python gold_axis_2026/tools/direction_parisi_rolling_ward_recon_v2.py             --stage pre2025             --outdir parisi_v2_pre2025

      - name: Freeze pre-2025 evidence before any 2025 scoring
        run: |
          cp parisi_v2_pre2025/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_SOURCE_AUDIT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_FROZEN_CONFIG_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_PRE2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_2023_SELECTED_FORECASTS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_2024_FORECASTS_2026-09-21.csv
          git commit -m 'Freeze Parisi Ward reconstruction V2 pre-2025 evidence'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Run unchanged locked 2025 retrospective challenge
        run: |
          rm -rf parisi_v2_2025
          mkdir -p parisi_v2_2025
          python gold_axis_2026/tools/direction_parisi_rolling_ward_recon_v2.py             --stage 2025             --outdir parisi_v2_2025             --config gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_FROZEN_CONFIG_2026-09-21.json             --pre-result gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_PRE2025_RESULT_2026-09-21.json

      - name: Freeze 2025 challenge and final result
        run: |
          cp parisi_v2_2025/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_2025_FORECASTS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_RECON_V2_RESULT_2026-09-21.md
          git commit -m 'Freeze Parisi Ward reconstruction V2 2025 challenge'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-parisi-rolling-ward-recon-v2
          retention-days: 30
          if-no-files-found: error
          path: |
            parisi_v2_pre2025/
            parisi_v2_2025/
