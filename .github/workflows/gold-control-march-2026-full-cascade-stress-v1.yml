name: Gold Control March 2026 Full Cascade Stress V1
on:
  workflow_dispatch:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - gold_axis_2026/tools/march_2026_full_cascade_stress_v1.py
      - .github/workflows/gold-control-march-2026-full-cascade-stress-v1.yml

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: /tmp/frozen/gold_axis_2026:/tmp/frozen/gold_axis_2026/tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require DB
        run: test -n "$NEON_DATABASE_URL"

      - name: Install dependencies
        run: python -m pip install "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1" "scikit-learn==1.5.2" "psycopg[binary]>=3.2,<4"

      - name: Materialize pinned authorities
        run: |
          mkdir -p /tmp/frozen/gold_axis_2026/tools
          mkdir -p /tmp/frozen/gold_axis_2026/regime_dampener_v1
          git show eb928b2d5be6250227d8e14dea2d58abe494f762:gold_axis_2026/tools/residual_one_sided_up2_logit_v1_run.py > /tmp/frozen/up2.py
          git show b22235f04dc48b173a93a98cc2ce22081bb0054e:gold_axis_2026/tools/cbr_cascade_route_consistent_extension_v1_run.py > /tmp/frozen/route.py
          git show f187f89c166a75cefa8cf60709dcd4ce1027663d:gold_axis_2026/tools/downside_cbr_dtw_path_v1.py > /tmp/frozen/cbr.py
          git show 2926796b6a7e9048d2c091c9c571cb928b773e02:gold_axis_2026/tools/downside_raw_vs_sqrt_har_dr_multiorigin_v1.py > /tmp/frozen/sqrt_auth.py\n          git show ad0fc4dcbe1687833bd9a153cd4bc6a754523464:gold_axis_2026/tools/regime_v1_router_sqrt.py > /tmp/frozen/sqrt_route_auth.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py > /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_data.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_data.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_experts.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_experts.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/GOLD_CONTROL_DOWN_VERIFIER_CANDIDATE_AUDIT_V1_PRE2025_LEDGER_2026-09-23.csv > /tmp/pre.csv
          git show 2926796b6a7e9048d2c091c9c571cb928b773e02:gold_axis_2026/GOLD_CONTROL_DOWNSIDE_RAW_VS_SQRT_HAR_DR_MULTIORIGIN_V1_FORECASTS_2026-09-22.csv > /tmp/sqrt_parent.csv
          git show 509c5ffa762f4ea49644b8ffe723ed2591ba52bf:gold_axis_2026/external_data/v2/dukascopy_xauusd_govsession_mid_5m_daily_features_2018_2021.csv > /tmp/external_daily.csv

      - name: Fetch pinned Dukascopy mirror
        run: |
          rm -rf /tmp/mdl
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git /tmp/mdl
          git -C /tmp/mdl sparse-checkout init --no-cone
          printf "%s\n"             "/xauusd/ask/m1/xauusd_ask_m1_2020_*.csv"             "/xauusd/ask/m1/xauusd_ask_m1_2021_*.csv"             "/xauusd/ask/m1/xauusd_ask_m1_2022_01.csv"             "/xauusd/bid/m1/xauusd_bid_m1_2020_*.csv"             "/xauusd/bid/m1/xauusd_bid_m1_2021_*.csv"             "/xauusd/bid/m1/xauusd_bid_m1_2022_01.csv"             > /tmp/mdl/.git/info/sparse-checkout
          git -C /tmp/mdl checkout 922f83a60cc574e7395fb27397077288055a1ef6

      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/march_2026_full_cascade_stress_v1.py

      - name: Run
        run: |
          rm -rf march_full_out
          python gold_axis_2026/tools/march_2026_full_cascade_stress_v1.py             --up2 /tmp/frozen/up2.py             --route /tmp/frozen/route.py             --cbr /tmp/frozen/cbr.py             --base /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py             --sqrt-auth /tmp/frozen/sqrt_auth.py             --sqrt-parent /tmp/sqrt_parent.csv             --pre-ledger /tmp/pre.csv             --external-spine /tmp/external_daily.csv             --raw-root /tmp/mdl             --out march_full_out

      - name: Freeze result
        run: |
          cp march_full_out/* gold_axis_2026/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_2026_MARCH_FULL_CASCADE_STRESS_V1_RESULT_2026-09-24.json
          git commit -m "Freeze March 2026 full cascade stress V1"
          git push origin HEAD:gold-direction-history-robustness-v1-20260924
