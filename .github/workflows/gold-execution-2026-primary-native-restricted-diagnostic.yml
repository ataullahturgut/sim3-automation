name: Gold 2026 Direct Primary Native Restricted Model Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_primary_native_restricted_diagnostic_20261008.py
      - .github/workflows/gold-execution-2026-primary-native-restricted-diagnostic.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-first-party-primary-native-restricted-research
  cancel-in-progress: false
jobs:
  run-restricted-primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Evaluate all six frozen models on native direct-first-party 2026 subset
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_primary_native_restricted_diagnostic_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_primary_native_restricted_diagnostic_20261008.py
      - name: Keep dated original first-party research predictions private
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-first-party-direct-restricted-private-dated-predictions
          path: gold_axis_2026/GOLD_EXECUTION_2026_PRIMARY_DUKASCOPY_RESTRICTED_NATIVE_SUBSET_20261008_DATED_PRIVATE.csv
          if-no-files-found: warn
      - name: Record explicit low-N first-party score and no-promotion evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_PRIMARY_DUKASCOPY_RESTRICTED_NATIVE_SUBSET_20261008_{SUMMARY.json,YEAR_METRICS.csv,PAIRED_HISTORY.csv}; do
            if test -f "$f"; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m 'Record explicit native Dukascopy 2026 restricted-period score without model promotion'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
