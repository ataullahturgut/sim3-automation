name: Gold Short Horizon Stage5 Head Reconciliation

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_stage5_reconcile.py'
      - '.github/workflows/gold-short-horizon-stage5.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests
      - name: Reconcile frozen H3 heads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: stage5_reconcile_out
        run: python gold_axis_2026/tools/gold_short_horizon_stage5_reconcile.py
      - name: Upload Stage5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-stage5-reconciliation
          path: stage5_reconcile_out/
          retention-days: 90
