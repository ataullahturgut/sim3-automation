name: Gold R4 Direction Engine Tests

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/r4_1/**'
      - '.github/workflows/gold-r4-direction-engine-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gold_axis_2026/r4_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest
