name: Gold Execution Spot Calendar Hard Gate 20261008
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_xau_source_calendar_gate_20261008.py'
      - '.github/workflows/gold-execution-xau-calendar-gate-20261008.yml'
permissions:
  contents: write
jobs:
  audit-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_xau_source_calendar_gate_20261008.py
      - name: Store aggregate-only evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_XAU_SOURCE_CALENDAR_GATE_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record source calendar quarantine evidence'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
