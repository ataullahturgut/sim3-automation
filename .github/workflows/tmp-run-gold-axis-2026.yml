name: temporary gold axis 2026 runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-run-gold-axis-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  run-models:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated model branch
        uses: actions/checkout@v4
        with:
          ref: tmp-gold-2026-model-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn requests
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Jan-Jul 2026 leakage-safe replay
        run: |
          sed -i 's|lbruton/StakTrakr/master|lbruton/StakTrakr/main|g' gold_axis_2026/run_models.py
          python gold_axis_2026/run_models.py

      - name: Upload numerical results
        uses: actions/upload-artifact@v4
        with:
          name: gold-axis-2026-results
          path: |
            gold_axis_2026/results_2026.csv
            gold_axis_2026/summary_2026.json
          if-no-files-found: error
