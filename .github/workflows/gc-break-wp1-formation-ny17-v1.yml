name: GC-BREAK WP1 Formation NY17 Backfill V1

on:
  push:
    branches:
      - gc-break-wp1-formation-backfill
    paths:
      - '.github/workflows/gc-break-wp1-formation-ny17-v1.yml'
      - 'gold_axis_2026/tools/gc_break_wp1_formation_backfill_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  formation-backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen implementation and secret
        run: |
          test -n "$TWELVE_DATA_API_KEY"
          python -m py_compile gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py
          python -m py_compile gold_axis_2026/tools/gc_break_wp1_formation_backfill_v1.py
      - name: Run exact-NY17 formation backfill
        run: |
          python gold_axis_2026/tools/gc_break_wp1_formation_backfill_v1.py \
            --pacing-seconds 8.5 \
            --output-dir formation_ny17_v1
      - name: Verify read-only boundary
        run: |
          ! grep -Ei 'psycopg|NEON_DATABASE_URL|insert[[:space:]]+into|delete[[:space:]]+from|update[[:space:]]+observations' \
            gold_axis_2026/tools/gc_break_wp1_formation_backfill_v1.py \
            gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py
          echo 'GC_BREAK_WP1_FORMATION_BACKFILL_READ_ONLY_PASS'
      - name: Upload immutable formation reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-wp1-formation-ny17-v1
          if-no-files-found: error
          path: formation_ny17_v1/
