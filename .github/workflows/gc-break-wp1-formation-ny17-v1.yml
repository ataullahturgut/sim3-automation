name: GC-BREAK WP1 Formation NY17 Backfill V1

on:
  push:
    branches:
      - gc-break-wp1-formation-backfill
    paths:
      - '.github/workflows/gc-break-wp1-formation-ny17-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  formation-backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret and frozen probe implementation
        run: |
          test -n "$TWELVE_DATA_API_KEY"
          python -m py_compile gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py
      - name: Build and probe formation tranches under frozen NY17 semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p formation_ny17_v1

          probe_tranche() {
            local name="$1"
            local start="$2"
            local end="$3"
            local inv="formation_ny17_v1/${name}_inventory.csv"
            local out_json="formation_ny17_v1/${name}_probe.json"
            local out_csv="formation_ny17_v1/${name}_probe.csv"

            python - "$name" "$start" "$end" "$inv" <<'PY'
import csv, json, sys
from datetime import date, timedelta
name, start_s, end_s, out = sys.argv[1:]
start = date.fromisoformat(start_s)
end = date.fromisoformat(end_s)
rows=[]
d=start
while d <= end:
    rows.append({
        'trade_date': d.isoformat(),
        'gap_action': 'EXACT_DATE_PROVIDER_PROBE_REQUIRED',
        'impacted_readiness_cells': json.dumps([f'GC_BREAK_WP1_FORMATION:{d:%Y-%m}'], separators=(',', ':')),
    })
    d += timedelta(days=1)
with open(out,'w',encoding='utf-8',newline='') as fh:
    w=csv.DictWriter(fh,fieldnames=['trade_date','gap_action','impacted_readiness_cells'])
    w.writeheader(); w.writerows(rows)
print({'tranche':name,'start':start_s,'end':end_s,'candidate_dates':len(rows)})
PY

            python gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py \
              --inventory "$inv" \
              --pacing-seconds 8.5 \
              --out-json "$out_json" \
              --out-csv "$out_csv"

            python - "$name" "$out_json" <<'PY'
import json, sys
from collections import Counter
name, path = sys.argv[1:]
p=json.load(open(path,encoding='utf-8'))
c=Counter(r['acquisition_status'] for r in p['rows'])
print({'tranche':name,'row_count':p['row_count'],'status_counts':dict(c),'production_write':p['production_write'],'performance_scoring':p['performance_scoring']})
PY
          }

          # Order gives the nearest pre-2025 formation evidence first.
          probe_tranche 2024_JAN_AUG 2024-01-01 2024-08-31
          probe_tranche 2023_FULL    2023-01-01 2023-12-31
          probe_tranche 2022_FULL    2022-01-01 2022-12-31
          probe_tranche 2021_NOV_DEC 2021-11-01 2021-12-31

      - name: Build immutable summary and verify no production-write path
        run: |
          python - <<'PY'
import hashlib, json
from collections import Counter
from pathlib import Path
root=Path('formation_ny17_v1')
summary={
  'audit_id':'GC_BREAK_WP1_FORMATION_NY17_BACKFILL_V1',
  'source_semantic':'Twelve Data XAU/USD 1min exact 16:59:00 America/New_York; close after OHLC validation',
  'evidence_class':'HISTORICAL_REPLAY_RECONSTRUCTION',
  'prospective_claim':False,
  'production_database_write':'NONE',
  'performance_scoring':False,
  'tranches':{},
}
for p in sorted(root.glob('*_probe.json')):
    payload=json.loads(p.read_text(encoding='utf-8'))
    counts=Counter(r['acquisition_status'] for r in payload['rows'])
    summary['tranches'][p.stem]={
      'rows':payload['row_count'],
      'status_counts':dict(counts),
      'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
    }
(root/'gc_break_wp1_formation_ny17_backfill_v1_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
print(json.dumps(summary,sort_keys=True))
PY
          ! grep -Ei 'psycopg|NEON_DATABASE_URL|insert[[:space:]]+into|delete[[:space:]]+from|update[[:space:]]+observations' \
            .github/workflows/gc-break-wp1-formation-ny17-v1.yml \
            gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py
          echo 'GC_BREAK_WP1_FORMATION_BACKFILL_READ_ONLY_PASS'
      - name: Upload immutable formation reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-wp1-formation-ny17-v1
          if-no-files-found: error
          path: formation_ny17_v1/
