name: Gold Session Model02 Shallow CART Variable Selection 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_model02_shallow_cart_varsel_20261007.py'
      - '.github/workflows/gold-session-model02-shallow-cart-varsel-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'

      - name: Run session Model-02 Shallow CART variable selection
        run: python gold_axis_2026/tools/gold_session_model02_shallow_cart_varsel_20261007.py

      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          O=gold_axis_2026/SESSION_MODEL02_SHALLOW_CART_VARSEL_OUT
          cp "$O/summary.json" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_SUMMARY_2026-10-07.json
          cp "$O/result.md" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_RESULT_2026-10-07.md
          cp "$O/dev_metrics.csv" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_DEV_METRICS_2026-10-07.csv
          cp "$O/dev_variable_selection.csv" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_FEATURE_STABILITY_2026-10-07.csv
          cp "$O/frozen_features.json" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_FROZEN_FEATURES_2026-10-07.json
          cp "$O/transport_2025_metrics.csv" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_2025_METRICS_2026-10-07.csv
          cp "$O/transport_2025_predictions.csv" gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_2025_PREDICTIONS_2026-10-07.csv

          git add gold_axis_2026/GOLD_SESSION_MODEL02_SHALLOW_CART_VARSEL_*
          if ! git diff --cached --quiet; then
            git commit -m "Record session Model-02 Shallow CART variable-selection result"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-session-model02-shallow-cart-varsel-20261007
          path: gold_axis_2026/SESSION_MODEL02_SHALLOW_CART_VARSEL_OUT/
          if-no-files-found: warn
          retention-days: 90
