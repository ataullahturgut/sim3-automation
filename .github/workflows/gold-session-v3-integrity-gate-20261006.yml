name: Gold Session V3 Integrity Gate 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_v3_integrity_gate_20261006.py'
      - '.github/workflows/gold-session-v3-integrity-gate-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3'
      - run: python gold_axis_2026/tools/gold_session_v3_integrity_gate_20261006.py
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_V3_INTEGRITY_GATE_OUT/summary.json gold_axis_2026/GOLD_SESSION_V3_INTEGRITY_GATE_2026-10-06.json
          cp gold_axis_2026/SESSION_V3_INTEGRITY_GATE_OUT/row_audit.csv gold_axis_2026/GOLD_SESSION_V3_INTEGRITY_ROWS_2023_2025.csv
          cp gold_axis_2026/SESSION_V3_INTEGRITY_GATE_OUT/trainable_low_internal_coverage.csv gold_axis_2026/GOLD_SESSION_V3_LOW_INTERNAL_COVERAGE_2023_2025.csv
          git add gold_axis_2026/GOLD_SESSION_V3_*
          if ! git diff --cached --quiet; then
            git commit -m "Record frozen V3 session integrity gate"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
