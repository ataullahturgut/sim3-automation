name: Gold Monthly ANFIS Stage 1.1 V2
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_anfis_meta_screen_v2.py
      - .github/workflows/gold-monthly-anfis-stage11-v2.yml
permissions:
  contents: read
jobs:
  hybrid:
    strategy:
      fail-fast: false
      matrix:
        method: [PSO, GA, DE]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy psycopg[binary] scikit-learn scipy
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_anfis_meta_screen_v2.py
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_anfis_meta_screen_v2.py --method ${{ matrix.method }}
      - name: Scientific gate
        run: python -c "import json,glob,math; r=json.load(open(glob.glob('anfis_hybrid_*_result.json')[0])); rows=r['dev']['rows']; assert len(rows)==33 and len(r['transport_2025']['rows'])==12 and len(r['stress_2026']['rows'])==7; assert all(math.isfinite(x['forecast']) and math.isfinite(x['pred_log_return_gold']) and abs(x['pred_log_return_gold'])<1 for x in rows+r['transport_2025']['rows']+r['stress_2026']['rows']); assert r['authority']['random_split']=='NONE'; print('SCIENTIFIC_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anfis-stage11-v2-${{ matrix.method }}
          path: anfis_hybrid_*_result.json
          if-no-files-found: error
