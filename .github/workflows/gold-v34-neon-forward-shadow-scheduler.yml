name: Gold V34 StakTrakr research forward shadow weekly (not production)
on:
  schedule:
    # Target ISO week starts Monday 00 UTC. Wait for last Friday complete.
    # Four attempts make room for public source publication delays.
    - cron: '15 6 * * 6'
    - cron: '15 14 * * 6'
    - cron: '15 6 * * 0'
    - cron: '15 14 * * 0'
  workflow_dispatch:
  push:
    branches: [feature/gold-v34-research-pin-hardened-20261030]
    paths:
      - .github/workflows/gold-v34-neon-forward-shadow-scheduler.yml

permissions:
  contents: read

concurrency:
  group: gold-v34-staktrakr-shadow-live-weekly
  cancel-in-progress: false

jobs:
  four-metal-weekly-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # immutable exact V34 research source, not floating branch and not main.
          ref: bad69b5c6fa8e0865fcf0a6a7562c7e57002eb6c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned original source commit
        run: test "$(git rev-parse HEAD)" = bad69b5c6fa8e0865fcf0a6a7562c7e57002eb6c
      - name: Install frozen V34 model runtime
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Model original historical numerical parity
        run: python gold_axis_2026/research/case_control_v13/gold_v34_forward_parity_v1.py --mode historical-parity --out gold_v34_original_parity.json
      - name: Check actual four-metal week and compute only if fully completed
        run: |
          python gold_axis_2026/research/case_control_v13/gold_v34_neon_staktrakr_forward_shadow_v1.py \
            --mode forward --apply-shadow --out gold_v34_staktrakr_shadow_weekly.json
      - name: Archive output even on source unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v34-original-shadow-weekly-report
          path: |
            gold_v34_original_parity.json
            gold_v34_staktrakr_shadow_weekly.json
          if-no-files-found: warn
          retention-days: 30
