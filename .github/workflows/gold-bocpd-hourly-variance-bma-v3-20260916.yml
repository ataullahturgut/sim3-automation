name: Gold BOCPD Hourly Variance BMA V3

on:
  push:
    branches: [gold-bocpd-authority-successor-v3-20260916]
    paths:
      - '.github/workflows/gold-bocpd-hourly-variance-bma-v3-20260916.yml'
  workflow_dispatch:

concurrency:
  group: gold-bocpd-hourly-variance-bma-v3-20260916
  cancel-in-progress: true

jobs:
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      OUTPUT_DIR: bocpd_v3_output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r gold_axis_2026/data_pipeline/requirements.txt
          pip install 'scipy>=1.13,<2'
      - name: Require protected secrets
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL missing"; exit 1; }
          test -n "$TWELVE_DATA_API_KEY" || { echo "TWELVE_DATA_API_KEY missing"; exit 1; }
      - name: Compile V3
        run: python -m py_compile gold_axis_2026/tools/bocpd_hourly_variance_bma_v3.py
      - name: Run frozen V3 protocol
        run: python gold_axis_2026/tools/bocpd_hourly_variance_bma_v3.py
      - name: Upload V3 outputs
        uses: actions/upload-artifact@v4
        with:
          name: bocpd-hourly-variance-bma-v3-2025
          path: bocpd_v3_output/
          if-no-files-found: error
          retention-days: 90
