name: GPT6 R74 weekday-corrected economic replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gold_axis_2026/tools/gold_gpt6_r74_weekday_corrected_replay.py"
      - "gold_axis_2026/GOLD_GPT6_R74_WEEKEND_HARCAL_FOLLOWUP_PREREG_20261013.md"
      - ".github/workflows/gpt6-r74-weekday-replay.yml"
permissions:
  contents: read
jobs:
  r74-weekday:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested libraries
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2'
      - name: Run four weekday-only untouched specifications
        run: python -u gold_axis_2026/tools/gold_gpt6_r74_weekday_corrected_replay.py
      - name: Save corrected scores
        uses: actions/upload-artifact@v4
        with:
          name: r74-gpt6-weekday-corrected
          path: |
            gold_axis_2026/GOLD_GPT6_R74_WEEKDAY_20261013_SUMMARY.json
            gold_axis_2026/GOLD_GPT6_R74_WEEKDAY_20261013_PERIOD_ROWS.csv
          retention-days: 30
