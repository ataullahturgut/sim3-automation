name: Gold Forensic XAU 2020-2025 Price and Label Audit
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2020_2025_price_label_forensic_20261008.py'
      - '.github/workflows/gold-forensic-xau-price-label-audit-20261008.yml'
permissions:
  contents: write
concurrency:
  group: gold-forensic-xau-price-label-audit-20261008
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'requests>=2.31,<3' 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Source values, official XAU venue breaks, stored label independent replay
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2020_2025_price_label_forensic_20261008.py
          python gold_axis_2026/tools/gold_execution_2020_2025_price_label_forensic_20261008.py
      - name: Commit aggregate quality statistics, preserve vendor quotes private
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2020_2025_PRICE_LABEL_FORENSIC_AUDIT_20261008.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_PRICE_LABEL_FORENSIC_AUDIT_20261008.json
          git diff --cached --quiet || git commit -m 'Record 2020-2025 deep XAU price integrity, trading hours and independent label audit'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
