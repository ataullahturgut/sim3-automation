name: Gold Control Mobile UI V1.31 Compatibility Final

on:
  workflow_dispatch:
  push:
    branches: [gold-r4-direction-engine, gold-control-v131-postmerge-ci-reconcile]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md'
      - 'gold_axis_2026/GOLD_CONTROL_V131_POSTMERGE_CI_RECONCILIATION_2026-09-04.md'
      - 'gold_axis_2026/GOLD_CONTROL_DATA_EVIDENCE_SPINE_CONTRACT_2026-09-03.md'
      - 'gold_axis_2026/GOLD_CONTROL_ENGINE_OBSERVABILITY_CONTRACT_2026-09-03.md'
      - 'gold_axis_2026/GOLD_CONTROL_DEPLOYMENT_DISPLAY_SNAPSHOT_CONTRACT_V2_2026-09-03.md'
      - 'gold_axis_2026/GOLD_CONTROL_AUG31_EOD_STATE_REPLAY_CONTRACT_2026-09-03.md'
      - 'gold_axis_2026/GOLD_CONTROL_AUG31_STATE_REPLAY_DISPLAY_SNAPSHOT_CONTRACT_2026-09-03.md'
      - 'gold_axis_2026/apps/**'
      - 'gold_axis_2026/data_pipeline/data_evidence_spine.py'
      - 'gold_axis_2026/data_pipeline/data_evidence_spine_audit.py'
      - 'gold_axis_2026/data_pipeline/multi_expert_forecast.py'
      - 'gold_axis_2026/data_pipeline/decision_store.py'
      - 'gold_axis_2026/data_pipeline/decision_store_reader.py'
      - 'gold_axis_2026/data_pipeline/aug31_eod_state_historical_replay.py'
      - 'gold_axis_2026/data_pipeline/aug31_eod_state_historical_replay_v2.py'
      - '.github/workflows/gold-control-mobile-ui-v125-final.yml'

permissions:
  contents: read

jobs:
  production-browser-acceptance:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked app and browser runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Verify manifest v1.31 governance and frozen locks
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing' && exit 1)
          grep -Fq '**Manifest version:** 1.31' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_PRODUCTION_DISPLAY_SNAPSHOT_V2' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_AUG31_EOD_STATE_REPLAY_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_AUG31_STATE_REPLAY_DISPLAY_SNAPSHOT_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_DATA_EVIDENCE_SPINE_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_ALL_GOVERNED_ENGINES_VISIBLE_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'BOCPD_RETURN_SUCCESSOR_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_EXPERT_SELECTION_RULE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'auto selector = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'auto ensemble = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_POSITION_MAPPING' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          echo 'V131_MOBILE_GOVERNANCE_PASS'

      - name: Compile complete DB snapshot replay to UI graph
        run: |
          python -m py_compile \
            gold_axis_2026/data_pipeline/data_evidence_spine.py \
            gold_axis_2026/data_pipeline/data_evidence_spine_audit.py \
            gold_axis_2026/data_pipeline/decision_store.py \
            gold_axis_2026/data_pipeline/decision_store_reader.py \
            gold_axis_2026/data_pipeline/multi_expert_forecast.py \
            gold_axis_2026/data_pipeline/aug31_eod_state_historical_replay.py \
            gold_axis_2026/data_pipeline/aug31_eod_state_historical_replay_v2.py \
            gold_axis_2026/apps/production_display_snapshot.py \
            gold_axis_2026/apps/aug31_state_replay_source.py \
            gold_axis_2026/apps/runtime_source.py \
            gold_axis_2026/apps/decision_source.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/forecast_source.py \
            gold_axis_2026/apps/live_sources.py \
            gold_axis_2026/apps/mobile_ui_contract.py \
            gold_axis_2026/apps/piyasa_contract.py \
            gold_axis_2026/apps/mobile_viewport_qa.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py \
            gold_axis_2026/apps/gold_control.py

      - name: Run deterministic v1.31 contracts
        run: |
          cd gold_axis_2026/apps
          pytest -q \
            test_mobile_ui_contract.py \
            test_piyasa_contract.py \
            test_engine_observability_contract.py \
            test_ui_manifest_consistency_v126.py \
            test_production_display_snapshot.py \
            test_replay_snapshot_fallback_v129.py \
            test_aug31_state_replay_source.py
          cd ../data_pipeline
          pytest -q test_multi_expert_forecast.py test_data_evidence_spine.py test_historical_replay_contract.py

      - name: Prove production DB evidence and both replay layers read-only
        run: |
          PYTHONPATH=gold_axis_2026/apps:gold_axis_2026/data_pipeline python - <<'PY'
          import os, psycopg
          from psycopg.rows import dict_row
          from runtime_source import fetch_runtime_observability
          from decision_source import fetch_current_decision_state
          from forecast_source import TRACK_HISTORICAL_REPLAY, fetch_latest_expert_forecasts
          from aug31_state_replay_source import fetch_aug31_state_replay
          url=os.environ['NEON_DATABASE_URL']
          runtime=fetch_runtime_observability(url)
          assert runtime['source_mode']=='NEON_DB_READ_ONLY'
          assert runtime['runtime_engine_count']==12 and runtime['context_exactly_one_link']==7 and runtime['integrity_ok'] is True
          states={r['engine_id']:r for r in runtime['runtime']}
          assert sum(1 for r in states.values() if r['runtime_status']=='ACTIVE')==4
          assert sum(1 for r in states.values() if r['runtime_status']=='WAITING')==5
          assert sum(1 for r in states.values() if r['runtime_status']=='BLOCKED')==3
          assert sum(1 for r in states.values() if r.get('direction_vote_permitted') is True)==3
          assert {k for k,v in states.items() if v['runtime_status']=='BLOCKED'}=={'VW_MIDAS_MSVR','MACRO_EVENT','BOCPD'}
          assert {k for k,v in states.items() if v['runtime_status']=='WAITING'}=={'CAUSAL_PATCH','MOMENTUM_3M','RANDOM_WALK','EMERGENCY_LEVEL','EMERGENCY_REVERSAL'}
          assert states['EMERGENCY_LEVEL']['status_code']=='WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE'
          assert states['EMERGENCY_REVERSAL']['status_code']=='WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE'
          current=fetch_current_decision_state(url)
          assert current['monthly_direction_3m']=='DOWN'
          assert current['fast_state']=='ROBUST_UP'
          assert current['slow_state']=='ROBUST_UP'
          replay=fetch_latest_expert_forecasts(url,TRACK_HISTORICAL_REPLAY)
          assert {r['expert_id'] for r in replay}=={'MOMENTUM_3M','RANDOM_WALK'}
          assert all(r['canonical_authority'] is False for r in replay)
          assert all(r['provenance']['prospective_claim'] is False for r in replay)
          aug=fetch_aug31_state_replay(url)
          assert aug['source_mode']=='NEON_DB_READ_ONLY'
          assert aug['monthly_direction_3m']=='DOWN'
          assert aug['fast_state']=='ROBUST_UP' and aug['slow_state']=='ROBUST_UP'
          assert aug['gvz_value']==24.4 and aug['gvz_cap']==1.0 and aug['gvz_regime']=='NORMAL'
          assert aug['prospective_h1_claim'] is False and aug['current_runtime_authority'] is False and aug['canonical_authority'] is False
          with psycopg.connect(url,autocommit=False,row_factory=dict_row) as c:
            with c.cursor() as cur:
              cur.execute('SET TRANSACTION READ ONLY')
              cur.execute("select count(*) n from derived_feature_snapshots where feature_name like 'AUG31_REPLAY_%' and metadata->>'evidence_class'='HISTORICAL_REPLAY'"); assert cur.fetchone()['n']==7
              cur.execute("select count(*) n from engine_execution_runs where evidence_class='HISTORICAL_REPLAY' and metadata->>'contract'='GOLD_CONTROL_AUG31_EOD_STATE_REPLAY_CONTRACT_2026-09-03.md'"); assert cur.fetchone()['n']==4
              cur.execute("select count(*) n from engine_execution_derived_outputs o join engine_execution_runs r on r.run_id=o.run_id where r.evidence_class='HISTORICAL_REPLAY' and r.metadata->>'contract'='GOLD_CONTROL_AUG31_EOD_STATE_REPLAY_CONTRACT_2026-09-03.md'"); assert cur.fetchone()['n']==7
              cur.execute('select count(*) n from monthly_forecast_contracts'); assert cur.fetchone()['n']==0
              cur.execute('select count(*) n from decision_signal_snapshots'); assert cur.fetchone()['n']==0
              cur.execute('select count(*) n from decision_runs'); assert cur.fetchone()['n']==0
              cur.execute('select count(*) n from decision_events'); assert cur.fetchone()['n']==0
            c.rollback()
          print('V131_PRODUCTION_DB_TO_UI_PASS runtime=12/12 distribution=4/5/3 expert_replay=2 state_replay=7 runs=4 links=7 canonical=0 decision=0 writes=NONE')
          PY

      - name: Prove DB-less deployment fallback including both replay layers
        run: |
          env -u NEON_DATABASE_URL PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          from decision_source import fetch_current_decision_state
          from runtime_source import fetch_runtime_observability
          from forecast_source import TRACK_HISTORICAL_REPLAY, TRACK_MONTH_END, TRACK_EARLY_INDICATIVE, fetch_latest_expert_forecasts
          from aug31_state_replay_source import fetch_aug31_state_replay
          state=fetch_current_decision_state('')
          runtime=fetch_runtime_observability('')
          replay=fetch_latest_expert_forecasts('',TRACK_HISTORICAL_REPLAY)
          aug=fetch_aug31_state_replay('')
          assert state['source_mode']=='PRODUCTION_SNAPSHOT_FALLBACK'
          assert runtime['source_mode']=='PRODUCTION_SNAPSHOT_FALLBACK'
          assert {r['expert_id'] for r in replay}=={'MOMENTUM_3M','RANDOM_WALK'}
          assert aug['source_mode']=='PRODUCTION_SNAPSHOT_FALLBACK'
          assert aug['monthly_direction_3m']=='DOWN'
          assert aug['fast_state']=='ROBUST_UP' and aug['slow_state']=='ROBUST_UP'
          assert aug['gvz_value']==24.4 and aug['gvz_regime']=='NORMAL' and aug['gvz_cap']==1.0
          assert fetch_latest_expert_forecasts('',TRACK_MONTH_END)==[]
          assert fetch_latest_expert_forecasts('',TRACK_EARLY_INDICATIVE)==[]
          assert state.get('classification') is None and state.get('action_state') is None
          print('V131_DEPLOYMENT_FALLBACK_SOURCE_PASS expert_replay=2 state_replay=7')
          PY

      - name: Verify selector ensemble and action remain locked
        run: |
          grep -R -Fq 'NOT_PROVEN_EXPERT_SELECTION_RULE' gold_axis_2026/apps
          grep -R -Fq 'AUTO_SELECTOR' gold_axis_2026/apps
          grep -R -Fq 'AUTO_ENSEMBLE' gold_axis_2026/apps
          python - <<'PY'
          from pathlib import Path
          import re
          text='\n'.join(p.read_text(encoding='utf-8') for p in Path('gold_axis_2026/apps').glob('*.py'))
          if re.search(r"action_state\s*=\s*['\"](?:BUY|SELL|HOLD|EXIT|REDUCE)['\"]",text): raise SystemExit('UNPROVEN_POSITION_MAPPING_FOUND')
          print('SELECTOR_ENSEMBLE_POSITION_LOCKS_PASS')
          PY

      - name: Canonical production-backed 390x844 browser QA
        run: |
          rm -rf /tmp/gold_mobile_v131_qa
          streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8501 --server.address 127.0.0.1 >/tmp/gold_mobile_v131_browser.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null && break; sleep 1; done
          python gold_axis_2026/apps/mobile_viewport_qa.py --url http://127.0.0.1:8501 --out /tmp/gold_mobile_v131_qa
          kill $APP_PID || true; wait $APP_PID || true
          if grep -Eq 'ImportError|ModuleNotFoundError|Traceback \(most recent call last\)' /tmp/gold_mobile_v131_browser.log; then cat /tmp/gold_mobile_v131_browser.log; exit 1; fi
          echo 'MOBILE_V131_PRODUCTION_BACKED_BROWSER_PASS'

      - name: Upload production-backed screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v131-compatibility-production-backed-390x844-screenshots
          path: /tmp/gold_mobile_v131_qa/*.png
          if-no-files-found: error
          retention-days: 30
