name: Gold Data Neon Ingest

on:
  workflow_call:
    inputs:
      mode:
        description: 'hourly, daily, or backfill'
        required: true
        type: string
    secrets:
      NEON_DATABASE_URL:
        required: true

concurrency:
  group: gold-data-neon-ingest-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  hourly-xau:
    if: inputs.mode == 'hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Persist XAU snapshot
        run: python gold_axis_2026/data_pipeline/source_job.py --source xau --mode hourly --persist

  schema-guard:
    if: inputs.mode == 'daily' || inputs.mode == 'backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Apply idempotent point-in-time schema contract
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/apply_schema_patch.py
          python gold_axis_2026/data_pipeline/apply_schema_patch.py

  daily-sources:
    needs: schema-guard
    if: needs.schema-guard.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        source: [xau, cboe, fed, gpr]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      INGEST_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Compile source job
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/collector_r2.py
          python -m py_compile gold_axis_2026/data_pipeline/fed_direct.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_neon.py
          python -m py_compile gold_axis_2026/data_pipeline/source_job.py
      - name: Collect and persist ${{ matrix.source }}
        run: python gold_axis_2026/data_pipeline/source_job.py --source "${{ matrix.source }}" --mode "$INGEST_MODE" --persist

  verify-neon:
    needs: daily-sources
    if: needs.daily-sources.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Verify persisted data plane and point-in-time contract
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/verify_neon.py
          python gold_axis_2026/data_pipeline/verify_neon.py
