name: Gold Data Neon Ingest

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - '.github/workflows/gold-data-neon-ingest.yml'
      - 'gold_axis_2026/data_pipeline/source_job.py'
      - 'gold_axis_2026/data_pipeline/fed_direct.py'
      - 'gold_axis_2026/data_pipeline/persist_neon.py'
      - 'gold_axis_2026/data_pipeline/verify_neon.py'
      - 'gold_axis_2026/data_pipeline/source_contracts.json'
      - 'gold_axis_2026/data_pipeline/source_contracts_direct.json'
  schedule:
    - cron: '17 * * * *'       # hourly XAU snapshot; deliberately away from top of hour
    - cron: '45 23 * * *'      # daily authority ingest after US session
    - cron: '25 6 * * *'       # independent verification/retry pass
  workflow_dispatch:
    inputs:
      mode:
        description: 'hourly, daily, or backfill'
        required: true
        default: 'daily'
        type: choice
        options:
          - hourly
          - daily
          - backfill

concurrency:
  group: gold-data-neon-ingest
  cancel-in-progress: true

jobs:
  hourly-xau:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'hourly')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Persist XAU snapshot
        run: python gold_axis_2026/data_pipeline/source_job.py --source xau --mode hourly --persist

  daily-sources:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'schedule' && github.event.schedule != '17 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'hourly')
    strategy:
      fail-fast: false
      matrix:
        source: [xau, cboe, fed, gpr]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Compile source job
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/collector_r2.py
          python -m py_compile gold_axis_2026/data_pipeline/fed_direct.py
          python -m py_compile gold_axis_2026/data_pipeline/persist_neon.py
          python -m py_compile gold_axis_2026/data_pipeline/source_job.py
      - name: Collect and persist ${{ matrix.source }}
        run: python gold_axis_2026/data_pipeline/source_job.py --source "${{ matrix.source }}" --mode "$INGEST_MODE" --persist

  verify-neon:
    needs: daily-sources
    if: needs.daily-sources.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require Neon secret
        run: test -n "$NEON_DATABASE_URL"
      - name: Verify persisted data plane
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/verify_neon.py
          python gold_axis_2026/data_pipeline/verify_neon.py
