name: Gold Session BOCPD V1 Stage2 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_bocpd_v1_stage2_20261007.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific stack
        run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3,<4' 'openpyxl>=3.1,<4'

      - name: Run BOCPD Stage-2
        run: python gold_axis_2026/tools/gold_session_bocpd_v1_stage2_20261007.py

      - name: Record Stage-2 evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp gold_axis_2026/SESSION_BOCPD_V1_STAGE2_OUT/result.md gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_RESULT_2026-10-07.md
          cp gold_axis_2026/SESSION_BOCPD_V1_STAGE2_OUT/summary.json gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_SUMMARY_2026-10-07.json
          cp gold_axis_2026/SESSION_BOCPD_V1_STAGE2_OUT/metrics.csv gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_METRICS_2026-10-07.csv
          cp gold_axis_2026/SESSION_BOCPD_V1_STAGE2_OUT/actions.csv gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_ACTIONS_2026-10-07.csv
          cp gold_axis_2026/SESSION_BOCPD_V1_STAGE2_OUT/source_sensitivity.csv gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_SOURCE_SENSITIVITY_2026-10-07.csv
          cp gold_axis_2026/SESSION_BOCPD_V1_STAGE2_OUT/gate.csv gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_GATE_2026-10-07.csv

          git add             gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_RESULT_2026-10-07.md             gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_SUMMARY_2026-10-07.json             gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_METRICS_2026-10-07.csv             gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_ACTIONS_2026-10-07.csv             gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_SOURCE_SENSITIVITY_2026-10-07.csv             gold_axis_2026/GOLD_SESSION_BOCPD_V1_STAGE2_GATE_2026-10-07.csv

          if ! git diff --cached --quiet; then
            git commit -m "Record session BOCPD V1 stage2 development replay"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
