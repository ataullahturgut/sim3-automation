name: Gold MIDAS TLBO Tuned PSO ELM V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/tlbo_pso_core_v1.py
      - gold_axis_2026/tools/vw_midas_tlbo_tuned_pso_elm_v1.py
      - .github/workflows/gold-midas-tlbo-tuned-pso-elm-v1.yml
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4'
      - run: python -m py_compile gold_axis_2026/tools/tlbo_pso_core_v1.py gold_axis_2026/tools/vw_midas_tlbo_tuned_pso_elm_v1.py
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_tlbo_tuned_pso_elm_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_tlbo_tuned_pso_elm_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['inner_validation']=='CHRONOLOGICAL_TAIL_ONLY_NO_RANDOM_SPLIT'
          print('OUTPUT_GATE=PASS')
          for k in ['dev','transport_2025','stress_2026']:
              print(k,json.dumps(r[k]['metrics'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-tlbo-tuned-pso-elm-v1-${{ github.sha }}
          path: vw_midas_tlbo_tuned_pso_elm_v1_result.json
          retention-days: 30
