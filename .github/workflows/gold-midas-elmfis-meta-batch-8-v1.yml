name: Gold MIDAS ELMFIS Meta Batch 8 V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_elmfis_meta_batch_8_v1.py
      - .github/workflows/gold-midas-elmfis-meta-batch-8-v1.yml

permissions:
  contents: read

jobs:
  baseline-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2'
      - name: Run Vanilla ELMFIS anchor
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_elmfis_baseline_v1.py
      - name: Inspect baseline
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_elmfis_baseline_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['random_split']=='NONE'
          assert r['authority']['2025_role']=='LOCKED_TRANSPORT_NOT_SELECTION'
          assert r['authority']['2026_role']=='RETROSPECTIVE_STRESS_NOT_SELECTION'
          assert r['authority']['target_month_in_training'] is False
          assert r['authority']['authority_invariants_before']==r['authority']['authority_invariants_after']
          print('BASELINE_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-midas-elmfis-meta-batch-8-baseline-${{ github.sha }}
          path: vw_midas_elmfis_baseline_v1_result.json
          retention-days: 30

  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        method: [CPA, KRILL, CROW]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_msvr_successor_v1.py gold_axis_2026/tools/vw_midas_elmfis_baseline_v1.py gold_axis_2026/tools/vw_midas_elmfis_meta_batch_1_v1.py gold_axis_2026/tools/vw_midas_elmfis_meta_batch_8_v1.py
      - name: Run ${{ matrix.method }}-ELMFIS
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_elmfis_meta_batch_8_v1.py --method ${{ matrix.method }}
      - name: Inspect ${{ matrix.method }}
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import json, os
          method=os.environ['METHOD']
          p=f"vw_midas_elmfis_meta_batch_8_v1_{method.lower()}_result.json"
          r=json.load(open(p))
          assert r['method']==method
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['random_validation']=='NONE'
          assert r['authority']['2025_role']=='LOCKED_TRANSPORT_NOT_SELECTION'
          assert r['authority']['2026_role']=='RETROSPECTIVE_STRESS_NOT_SELECTION'
          assert r['authority']['authority_invariants_before']==r['authority']['authority_invariants_after']
          assert r['optimization_contract']['scope']=='antecedent_centers_and_log_spreads_only'
          assert r['optimization_contract']['optimized_parameters']==80
          assert r['optimization_contract']['target_month_in_fitness'] is False
          assert 'sum_abs_error' in r['dev']['metrics']
          assert 'direction_accuracy_pct' in r['dev']['metrics']
          print('METHOD_GATE=PASS',method)
          print(json.dumps({'method':method,'dev':r['dev']['metrics'],'transport_2025':r['transport_2025']['metrics'],'stress_2026':r['stress_2026']['metrics']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-elmfis-meta-batch-8-${{ matrix.method }}-${{ github.sha }}
          path: vw_midas_elmfis_meta_batch_8_v1_*_result.json
          retention-days: 30

  batch-gate:
    needs: [baseline-anchor, optimize]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gold-midas-elmfis-meta-batch-8-*
          merge-multiple: true
      - name: Combined output gate
        run: |
          python - <<'PY'
          import json
          baseline=json.load(open('vw_midas_elmfis_baseline_v1_result.json'))
          models={}
          for method in ('CPA','KRILL','CROW'):
              p=f"vw_midas_elmfis_meta_batch_8_v1_{method.lower()}_result.json"
              r=json.load(open(p))
              assert r['method']==method
              assert r['authority']['database_access']=='READ_ONLY'
              assert r['authority']['random_validation']=='NONE'
              assert r['authority']['2025_role']=='LOCKED_TRANSPORT_NOT_SELECTION'
              assert r['authority']['2026_role']=='RETROSPECTIVE_STRESS_NOT_SELECTION'
              assert r['authority']['authority_invariants_before']==r['authority']['authority_invariants_after']
              models[method]=r
          out={
              'batch_id':'VW_MIDAS_ELMFIS_META_BATCH_8_V1',
              'baseline':baseline,
              'models':models,
              'selection_authority':'DEV_2022-04_2024-12_ONLY',
              'primary_metrics':['sum_abs_error','direction_accuracy_pct']
          }
          with open('vw_midas_elmfis_meta_batch_8_v1_combined.json','w') as f:
              json.dump(out,f,indent=2,sort_keys=True); f.write('\n')
          summary={'Vanilla':baseline['dev']['metrics'],**{k:v['dev']['metrics'] for k,v in models.items()}}
          print('OUTPUT_GATE=PASS')
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-midas-elmfis-meta-batch-8-v1-${{ github.sha }}
          path: |
            vw_midas_elmfis_baseline_v1_result.json
            vw_midas_elmfis_meta_batch_8_v1_*_result.json
            vw_midas_elmfis_meta_batch_8_v1_combined.json
          retention-days: 30
