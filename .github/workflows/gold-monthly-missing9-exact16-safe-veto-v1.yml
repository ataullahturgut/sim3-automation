name: Gold Monthly Missing9 Exact16 Safe Veto V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py
      - gold_axis_2026/tools/gold_monthly_exact16_safe_veto_transport_v1.py
      - .github/workflows/gold-monthly-missing9-exact16-safe-veto-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  boost:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen boosting dependencies
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Download original frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10929616178/zip" > original.zip
          mkdir original
          unzip -q original.zip -d original
          test -f original/gold_monthly_boosting_stage1_canonical_v1_result.json
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py
      - name: Reproduce DEV and generate transport
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py             --family BOOST             --original-json original/gold_monthly_boosting_stage1_canonical_v1_result.json             --output missing9_boost_transport_v1.json
      - name: Gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('missing9_boost_transport_v1.json'))
          assert r['status']=='COMPLETE'
          assert set(r['models'])=={'CATBOOST_ORDERED','RANDOM_FOREST_ANCHOR'}
          assert all(x['status']=='PASS' for x in r['reproduction'].values())
          assert all(len(v)==19 for v in r['transport'].values())
          assert r['governance']['frozen_contract_changed'] is False
          print('BOOST_TRANSPORT_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: missing9-boost
          path: missing9_boost_transport_v1.json
          if-no-files-found: error
          retention-days: 90

  svr:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact frozen SVR dependencies
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Download original frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10958140025/zip" > original.zip
          mkdir original
          unzip -q original.zip -d original
          test -f original/gold_monthly_svr_dwt_stage2b_representation_v1_result.json
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py
      - name: Reproduce DEV and generate transport
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py             --family SVR             --original-json original/gold_monthly_svr_dwt_stage2b_representation_v1_result.json             --output missing9_svr_transport_v1.json
      - name: Gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('missing9_svr_transport_v1.json'))
          assert r['status']=='COMPLETE'
          assert set(r['representations'])=={'CURRENT8','DAILY_SUMMARY12','MIXED20'}
          assert all(x['status']=='PASS' for x in r['reproduction'].values())
          assert all(len(v)==19 for v in r['transport'].values())
          assert r['governance']['frozen_contract_changed'] is False
          print('SVR_TRANSPORT_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: missing9-svr
          path: missing9_svr_transport_v1.json
          if-no-files-found: error
          retention-days: 90

  seq:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - model: LSTM
            lookback: 3
            artifact_id: 10978271647
            original_file: gold_monthly_cnn_lstm_stage1a_LSTM_lb3_v1_result.json
          - model: LSTM
            lookback: 6
            artifact_id: 10978391582
            original_file: gold_monthly_cnn_lstm_stage1a_LSTM_lb6_v1_result.json
          - model: CNN_LSTM
            lookback: 3
            artifact_id: 10978660065
            original_file: gold_monthly_cnn_lstm_stage1a_CNN_LSTM_lb3_v1_result.json
          - model: CNN_LSTM
            lookback: 6
            artifact_id: 10979300075
            original_file: gold_monthly_cnn_lstm_stage1a_CNN_LSTM_lb6_v1_result.json
    name: seq-${{ matrix.model }}-lb${{ matrix.lookback }}
    env:
      TF_DETERMINISTIC_OPS: '1'
      TF_ENABLE_ONEDNN_OPTS: '0'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact frozen sequence dependencies
        run: python -m pip install "tensorflow-cpu==2.20.0" "psycopg[binary]>=3.2,<4" "scikit-learn>=1.5,<2"
      - name: Download original frozen artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ matrix.artifact_id }}/zip" > original.zip
          mkdir original
          unzip -q original.zip -d original
          test -f "original/${{ matrix.original_file }}"
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py gold_axis_2026/tools/gold_monthly_cnn_lstm_stage1a_v1.py
      - name: Reproduce DEV and generate transport
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python gold_axis_2026/tools/gold_monthly_missing9_frozen_transport_v1.py             --family SEQ             --model "${{ matrix.model }}"             --lookback "${{ matrix.lookback }}"             --original-json "original/${{ matrix.original_file }}"             --output "missing9_seq_${{ matrix.model }}_lb${{ matrix.lookback }}_transport_v1.json"
      - name: Gate
        env:
          MODEL: ${{ matrix.model }}
          LB: ${{ matrix.lookback }}
        run: |
          python - <<'PY'
          import json,os
          p=f"missing9_seq_{os.environ['MODEL']}_lb{os.environ['LB']}_transport_v1.json"
          r=json.load(open(p))
          assert r['status']=='COMPLETE'
          assert r['reproduction']['status']=='PASS'
          assert len(r['transport'])==19
          assert r['governance']['frozen_contract_changed'] is False
          print('SEQ_TRANSPORT_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: missing9-seq-${{ matrix.model }}-lb${{ matrix.lookback }}
          path: missing9_seq_${{ matrix.model }}_lb${{ matrix.lookback }}_transport_v1.json
          if-no-files-found: error
          retention-days: 90

  exact16:
    needs: [boost, svr, seq]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=2.0,<3'
      - name: Download reconstructed missing-9 outputs
        uses: actions/download-artifact@v4
        with:
          pattern: missing9-*
          path: inputs/missing9
          merge-multiple: true
      - name: Download frozen router/suppressor/existing-seven artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/router inputs/suppressor inputs/deabc inputs/gpr inputs/pls
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11124892942/zip" > router.zip
          unzip -q router.zip -d inputs/router
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11095060918/zip" > suppressor.zip
          unzip -q suppressor.zip -d inputs/suppressor
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10911447422/zip" > deabc.zip
          unzip -q deabc.zip -d inputs/deabc
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10915270480/zip" > gpr.zip
          unzip -q gpr.zip -d inputs/gpr
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10974037676/zip" > pls.zip
          unzip -q pls.zip -d inputs/pls
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_exact16_safe_veto_transport_v1.py
      - name: Run exact-16 transport
        run: |
          python gold_axis_2026/tools/gold_monthly_exact16_safe_veto_transport_v1.py             --router-json inputs/router/GOLD_MONTHLY_SPECIALIST_FIXED_SHARE_ALARM_ROUTER_V1_2026-09-30.json             --suppressor-json inputs/suppressor/GOLD_MONTHLY_ALARM_FALSE_CALL_SUPPRESSOR_SCREEN_V1_2026-09-30.json             --reference-rows gold_axis_2026/evidence/rbfnn_cross_family/reference_rows.json             --deabc-json inputs/deabc/rbfnn_stage1_de_abc_result.json             --gpr-json inputs/gpr/gpr_lmc2_rbf_m32_result.json             --pls-json inputs/pls/gold_monthly_challenger_b_pls1_v1_result.json             --boost-transport-json inputs/missing9/missing9_boost_transport_v1.json             --svr-transport-json inputs/missing9/missing9_svr_transport_v1.json             --seq-transport-json               inputs/missing9/missing9_seq_LSTM_lb3_transport_v1.json               inputs/missing9/missing9_seq_LSTM_lb6_transport_v1.json               inputs/missing9/missing9_seq_CNN_LSTM_lb3_transport_v1.json               inputs/missing9/missing9_seq_CNN_LSTM_lb6_transport_v1.json             --output GOLD_MONTHLY_EXACT16_SAFE_VETO_TRANSPORT_V1_2026-09-30.json
      - name: Scientific governance gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_EXACT16_SAFE_VETO_TRANSPORT_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scientific_gate']=='PASS'
          assert len(r['competitive_models'])==16
          assert r['transport_feature_period']==['2025-01','2026-07']
          assert r['governance']['missing_model_contracts_changed'] is False
          assert r['governance']['competitive_pool_changed'] is False
          assert r['governance']['safe_veto_threshold_changed'] is False
          assert r['governance']['dispersion_rule_changed'] is False
          assert r['governance']['router_retuned'] is False
          assert r['governance']['2025_2026_used_for_selection'] is False
          assert r['governance']['target_actual_used_in_veto_features'] is False
          assert r['critical_checks']['2026-08']['exact16_feature_available'] is False
          print('EXACT16_TRANSPORT_GATE=PASS')
          print(json.dumps({
            'transport_interpretation':r['transport_interpretation'],
            'opened_2025':r['periods']['OPENED_2025'],
            'opened_2026_jan_jul':r['periods']['OPENED_2026_JAN_JUL'],
            'opened_2025_2026_jul':r['periods']['OPENED_2025_2026_JUL'],
            'critical_checks':r['critical_checks'],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-exact16-safe-veto-transport-v1-${{ github.sha }}
          path: GOLD_MONTHLY_EXACT16_SAFE_VETO_TRANSPORT_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
