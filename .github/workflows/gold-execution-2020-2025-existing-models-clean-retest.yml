name: Gold Execution Existing Models Clean Price Retest 2020-2025
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2020_2025_all_existing_model_replay_20261008.py'
      - '.github/workflows/gold-execution-2020-2025-existing-models-clean-retest.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-clean-source-existing-models-v1
  cancel-in-progress: false
jobs:
  clean-horizon-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model computational dependencies
        run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Refit same LIT model specifications on accepted historical BID source
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2020_2025_all_existing_model_replay_20261008.py
          python gold_axis_2026/tools/gold_execution_2020_2025_all_existing_model_replay_20261008.py
      - name: Preserve origin-dated predictions for independent inspect
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-clean-source-all-single-models-2020-2025-prediction-evidence
          path: gold_axis_2026/GOLD_EXECUTION_2020_2025_SINGLE_MODELS_CLEAN_SOURCE_REPLAY_20261008_EXACT_PREDICTIONS.csv
          if-no-files-found: warn
      - name: Publish only aggregate model evidence and coverage/target blocker inventory
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2020_2025_SINGLE_MODELS_CLEAN_SOURCE_REPLAY_20261008_SUMMARY.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_SINGLE_MODELS_CLEAN_SOURCE_REPLAY_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_SINGLE_MODELS_CLEAN_SOURCE_REPLAY_20261008_METRICS.csv
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_SINGLE_MODELS_CLEAN_SOURCE_REPLAY_20261008_INVENTORY.csv
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_SINGLE_MODELS_CLEAN_SOURCE_REPLAY_20261008_SOURCE_TRANSPORT_METRICS.csv
          git diff --cached --quiet || git commit -m 'Record new-source refit LIT standalone and explicit non-retrained legacy model transport classifications'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
