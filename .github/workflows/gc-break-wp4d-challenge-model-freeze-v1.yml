name: GC-BREAK WP4D Challenge Model Freeze V1

on:
  workflow_dispatch:
  push:
    branches: [gc-break-wp1-formation-backfill]
    paths:
      - 'gold_axis_2026/tools/gc_break_wp4d_challenge_model_freeze_v1.py'
      - 'gold_axis_2026/gc_break_v0/gc_break_wp4d_2025_challenge_protocol_v1.json'
      - '.github/workflows/gc-break-wp4d-challenge-model-freeze-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gc-break-wp4d-challenge-model-freeze-v1
  cancel-in-progress: false

jobs:
  freeze-formation-only-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FORMATION_RUN_ID: '34838395381'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gc-break-wp1-formation-backfill
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed research dependencies
        run: python -m pip install --quiet numpy pandas scikit-learn

      - name: Require canonical manifest and frozen challenge protocol
        run: |
          git fetch --no-tags --depth=1 origin gold-r4-direction-engine:refs/remotes/origin/gold-r4-direction-engine
          git show origin/gold-r4-direction-engine:gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md | grep -q 'Manifest version:.*1.53'
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('gold_axis_2026/gc_break_v0/gc_break_wp4d_2025_challenge_protocol_v1.json').read_text())
          assert c['status']=='FROZEN_BEFORE_2025_CHALLENGE_SCORING'
          assert c['formation_evidence']['workflow_run_id']==34838395381
          assert c['governance']['single_challenge_score'] is True
          assert c['governance']['no_post_challenge_tuning'] is True
          PY

      - name: Download immutable passed formation evidence
        run: |
          mkdir -p /tmp/wp4d_formation
          gh run download "$FORMATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gc-break-wp4d-integrated-role-transition-formation-v1 --dir /tmp/wp4d_formation
          test -f /tmp/wp4d_formation/gc_break_wp4d_formation_episodes_v1.csv
          test -f /tmp/wp4d_formation/gc_break_wp4d_formation_summary_v1.json

      - name: Compile freeze tool
        run: python -m py_compile gold_axis_2026/tools/gc_break_wp4d_challenge_model_freeze_v1.py

      - name: Freeze final model parameters from formation only
        run: |
          mkdir -p /tmp/wp4d_freeze
          python gold_axis_2026/tools/gc_break_wp4d_challenge_model_freeze_v1.py \
            --episodes /tmp/wp4d_formation/gc_break_wp4d_formation_episodes_v1.csv \
            --formation-summary /tmp/wp4d_formation/gc_break_wp4d_formation_summary_v1.json \
            --output-dir /tmp/wp4d_freeze | tee /tmp/wp4d_freeze/run.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/wp4d_freeze/gc_break_wp4d_challenge_model_freeze_v1.json').read_text())
          assert d['status']=='FROZEN_BEFORE_2025_CHALLENGE_SCORING'
          assert d['formation_only'] is True
          assert d['challenge_data_accessed'] is False
          assert d['M0_EPISODE_EMPIRICAL_PRIOR']['probability']==0.375
          assert d['fit_support']=={'terminal_core_eligible_episodes':35,'break_conversions':13,'recoveries':22}
          PY

      - name: Upload immutable challenge model freeze
        uses: actions/upload-artifact@v4
        with:
          name: gc-break-wp4d-challenge-model-freeze-v1
          path: /tmp/wp4d_freeze/
          if-no-files-found: error
          retention-days: 90
