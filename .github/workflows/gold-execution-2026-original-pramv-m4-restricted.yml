name: Gold 2026 Jan-Aug Source-Locked Original PRAMV Full M4 Macro Rule
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_restricted_original_pramv_m4_20261008.py
      - .github/workflows/gold-execution-2026-original-pramv-m4-restricted.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-original-pramv-m4-restricted-source-authority
  cancel-in-progress: false
jobs:
  original-pramv-restricted:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Execute authentic original M4 signature FPCA fixed 2021-25 PIT-restricted macro and RFR agreement on Jan-Aug20 2026
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_restricted_original_pramv_m4_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_restricted_original_pramv_m4_20261008.py
      - name: Keep original 2026 PRAMV per-day macros and forecasts private
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-full-original-pramv-M4-rfr-macro-private-sample
          path: gold_axis_2026/GOLD_EXECUTION_2026_RESTRICTED_ORIGINAL_PRAMV_M4_RETEST_20261008_DATED_PRIVATE.csv
          if-no-files-found: warn
      - name: Save genuine source-qualified M4 result or fail-closed macro proof
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_RESTRICTED_ORIGINAL_PRAMV_M4_RETEST_20261008_{SUMMARY.json,METRICS.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Report authentic original PRAMV M4 full macro time-restricted 2026 Jan-Aug result or blocker'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
