name: Gold H3 Daily Average Semantic Audit

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_daily_average_semantic_audit_v1.py'
      - '.github/workflows/gold-h3-daily-average-semantic-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OUT_DIR: gold_h3_daily_average_semantic_audit_out
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - run: test -n "$TWELVE_DATA_API_KEY"
      - run: python gold_axis_2026/tools/gold_h3_daily_average_semantic_audit_v1.py
      - name: Commit evidence
        shell: bash
        run: |
          cp "$OUT_DIR/DAILY_AVERAGE_SEMANTIC_AUDIT.md" gold_axis_2026/GOLD_H3_DAILY_AVERAGE_SEMANTIC_AUDIT_2026-10-03.md
          cp "$OUT_DIR/daily_average_semantic_summary.json" gold_axis_2026/GOLD_H3_DAILY_AVERAGE_SEMANTIC_SUMMARY_2026-10-03.json
          cp "$OUT_DIR/stak_vs_twelve_daily_average.csv" gold_axis_2026/GOLD_H3_STAK_VS_TWELVE_DAILY_AVERAGE_2026-10-03.csv
          cp "$OUT_DIR/stak_vs_twelve_daily_average_flags.csv" gold_axis_2026/GOLD_H3_STAK_VS_TWELVE_DAILY_AVERAGE_FLAGS_2026-10-03.csv
          cp "$OUT_DIR/h3_daily_average_target_comparison.csv" gold_axis_2026/GOLD_H3_DAILY_AVERAGE_TARGET_COMPARISON_2026-10-03.csv
          cp "$OUT_DIR/h3_daily_average_target_disagreements.csv" gold_axis_2026/GOLD_H3_DAILY_AVERAGE_TARGET_DISAGREEMENTS_2026-10-03.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_DAILY_AVERAGE_*_2026-10-03.* gold_axis_2026/GOLD_H3_STAK_VS_TWELVE_DAILY_AVERAGE*_2026-10-03.csv
          if ! git diff --cached --quiet; then
            git commit -m "Audit H3 daily-average target semantics"
            git pull --rebase origin gold-midas-headswap-v1-20260925
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-daily-average-semantic-audit
          path: gold_h3_daily_average_semantic_audit_out/
          retention-days: 90
