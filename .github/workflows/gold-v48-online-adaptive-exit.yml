name: Gold V48 Online Adaptive 2025-26 Exit-Only Walk-forward Research
on:
  workflow_dispatch:
  push:
    branches: [research/gold-v48-online-adaptive-exit-watch-20261031]
    paths:
      - '.github/workflows/gold-v48-online-adaptive-exit.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v48_online_adaptive_sell_only.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v48_online_adaptive_sell_only.py'
permissions:
  contents: read
jobs:
  true-matured-label-online-adaptive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML and read-only database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'
      - name: Test chronological cutoffs, risk gating, no future feature use
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v48_online_adaptive_sell_only.py -v
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v48_online_adaptive_sell_only.py
      - name: Require read-only research database access
        run: test -n "$NEON_DATABASE_URL"
      - name: Train only matured past, monthly update 2025 and 2026, score every V22 episode
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v48_online_adaptive_sell_only \
            --out gold-v48-rolling-adaptive-2025-2026.json
      - name: Archive complete monthly model journal and every exit episode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v48-online-adaptive-exit-research-only
          path: gold-v48-rolling-adaptive-2025-2026.json
          retention-days: 30
          if-no-files-found: warn
