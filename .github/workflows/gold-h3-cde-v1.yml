name: Gold H3 CDE V1
on:
  push:
    branches: [gold-h3-cde-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_cde_v1.py'
      - '.github/workflows/gold-h3-cde-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-cde-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_cde_v1.py
      - name: Record CDE evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gold_axis_2026/GOLD_H3_CDE_V1_PREDICTIONS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_CDE_V1_BLOCK_METRICS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_CDE_V1_SUMMARY_2026-10-04.json \
            gold_axis_2026/GOLD_H3_CDE_V1_RESULT_2026-10-04.md
          if ! git diff --cached --quiet; then
            git commit -m "Record CDE-H3 V1 evidence"
            git pull --rebase origin gold-h3-cde-v1-20261004
            git push origin HEAD:gold-h3-cde-v1-20261004
          fi
