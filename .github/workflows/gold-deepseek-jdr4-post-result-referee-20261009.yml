name: Gold JDR4 Post-result Hostile Referee
on:
  push:
    branches:
      - gold-execution-channel-audit-20261006
    paths:
      - .github/workflows/gold-deepseek-jdr4-post-result-referee-20261009.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-jdr4-post-hostile-once
  cancel-in-progress: false
jobs:
  critique-observed-small-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: External reviewer attacks reported JDR4 retrospective effect
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/tools/gold_deepseek_jdr4_postresult_hostile_referee_20261009.py
          python gold_axis_2026/tools/gold_deepseek_jdr4_postresult_hostile_referee_20261009.py
      - name: Persist limited-cost peer-review opinion and receipt
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_DEEPSEEK_JDR4_POST_RESULT_REFEREE_20261009_{REVIEW.md,RESULT.json,FAILURE_QC.json}; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Save DeepSeek post-result hostile review of tentative JDR4 DAY signal'
            for i in 1 2 3; do
              git pull --rebase origin gold-execution-channel-audit-20261006
              if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
