name: Gold Control Current Governance

on:
  pull_request:
    paths:
      - 'gold_axis_2026/**'
      - '.github/workflows/gold-control-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q gold_axis_2026/tests/test_project_governance.py
