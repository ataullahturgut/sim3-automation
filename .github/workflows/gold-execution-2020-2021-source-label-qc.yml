name: Gold Execution XAU 2020-2021 Source Label Agreement
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2020_2021_vendor_target_qc_20261008.py'
      - '.github/workflows/gold-execution-2020-2021-source-label-qc.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'histdata-fetcher>=0.1' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_2020_2021_vendor_target_qc_20261008.py
      - name: Commit no-raw target concordance aggregate
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2020_2021_SOURCE_TARGET_CONCORDANCE_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2020_2021_SOURCE_TARGET_CONCORDANCE_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record 2020-2021 independent gold direction label agreement'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
