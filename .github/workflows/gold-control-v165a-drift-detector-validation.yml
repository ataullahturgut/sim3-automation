name: Gold Control V1.65A drift detector validation research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v165a_research/**"
      - "gold_axis_2026/tests/test_v165a_drift_detector_validation.py"
      - ".github/workflows/gold-control-v165a-drift-detector-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-detector-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 requests==2.32.5 pytest==8.4.2 river==0.26.1
      - name: Test V1.65A detector and governance locks
        run: python -m pytest -q gold_axis_2026/tests/test_v165a_drift_detector_validation.py
      - name: Run V1.65A formation-only detector validation
        run: python -m gold_axis_2026.v165a_research.run_v165a_drift_detector_validation
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v165a-drift-detector-validation-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v165a_research/
