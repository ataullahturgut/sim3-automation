name: Gold Control Manifest Reconcile - Stage 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold_control_manifest_reconcile_stage4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0

      - name: Run canonical reconciler
        run: python gold_axis_2026/tools/reconcile_manifest_stage4.py

      - name: Verify exact reconciliation scope
        run: |
          grep -Fq '**Manifest version:** 1.3' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'PASS_DECISION_STORE_AND_READ_PATH' gold_axis_2026/GOLD_CONTROL_STAGE3_STATUS_2026-09-01.md
          grep -Fq 'IN_PROGRESS_BLOCKED_INPUT_CONTRACTS' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          grep -Fq 'FORECAST_CONTRACT_NOT_ISSUED' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          grep -Fq 'IMMUTABLE_FORECAST_INPUT_SNAPSHOT_NOT_ISSUED' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          grep -Fq 'LATEST_DAILY_XAU_PIPELINE_NOT_SUCCESS' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          grep -Fq 'NO_APPROVED_CANONICAL_XAU_EOD_DECISION_SOURCE' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          git diff --check
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md gold_axis_2026/GOLD_CONTROL_STAGE3_STATUS_2026-09-01.md gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md "

      - name: Commit reconciled contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
                  gold_axis_2026/GOLD_CONTROL_STAGE3_STATUS_2026-09-01.md \
                  gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          git commit -m "gold-control: close Stage 3 and freeze Stage 4 blockers"
          git push origin HEAD:gold-r4-direction-engine
