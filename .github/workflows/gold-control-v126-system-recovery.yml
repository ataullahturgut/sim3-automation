name: Gold Control V1.26 System Recovery

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/tools/apply_v126_system_recovery.py'
      - '.github/workflows/gold-control-v126-system-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-and-prove:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Persist QA normalization correction in recovery source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gold_axis_2026/tools/apply_v126_system_recovery.py')
          text = p.read_text(encoding='utf-8')
          marker = '# Final QA semantic migration guard: run after every other QA rewrite.'
          head, sep, tail = text.partition(marker)
          if not sep:
              raise RuntimeError('FINAL_QA_MIGRATION_GUARD_NOT_FOUND')
          before = tail.count('AKTİF · STORED CONTEXT')
          if before != 2:
              raise RuntimeError(f'EXPECTED_TWO_NORMALIZATION_GUARD_MATCHES:{before}')
          tail = tail.replace('AKTİF · STORED CONTEXT', 'AKTIF · STORED CONTEXT')
          corrected = head + sep + tail
          if 'AKTİF · STORED CONTEXT' in corrected.split(marker, 1)[1]:
              raise RuntimeError('UNNORMALIZED_QA_ACCEPTANCE_REMAINS')
          p.write_text(corrected, encoding='utf-8')
          PY
          python -m py_compile gold_axis_2026/tools/apply_v126_system_recovery.py

      - name: Apply frozen v1.26 recovery patch
        run: |
          python gold_axis_2026/tools/apply_v126_system_recovery.py
          grep -Fq '**Manifest version:** 1.26' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_SYSTEM_RECOVERY_UI_CONSISTENCY_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'if status not in {"STORED_CONTEXT_AVAILABLE", "AKTIF · STORED CONTEXT"}:' gold_axis_2026/apps/mobile_viewport_qa.py
          ! grep -Fq 'if status != "STORED_CONTEXT_AVAILABLE":' gold_axis_2026/apps/mobile_viewport_qa.py

      - name: Install app and QA runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Compile recovered graph
        run: |
          python -m py_compile \
            gold_axis_2026/apps/gold_control.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py \
            gold_axis_2026/apps/mobile_ui_contract.py \
            gold_axis_2026/apps/piyasa_contract.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/mobile_viewport_qa.py \
            gold_axis_2026/apps/runtime_source.py \
            gold_axis_2026/apps/live_sources.py \
            gold_axis_2026/data_pipeline/multi_expert_forecast.py

      - name: Run deterministic and cross-contract tests
        run: |
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_piyasa_contract.py test_engine_observability_contract.py test_ui_manifest_consistency_v126.py
          cd ../data_pipeline
          pytest -q test_multi_expert_forecast.py test_data_evidence_spine.py

      - name: Prove production DB state and live display dependencies
        run: |
          PYTHONPATH=gold_axis_2026/apps:gold_axis_2026/data_pipeline python - <<'PY'
          import os
          from runtime_source import fetch_runtime_observability
          from decision_source import fetch_current_decision_state
          from live_sources import fetch_xau_spot, fetch_gvz_latest
          from piyasa_contract import gvz_regime

          url = os.environ['NEON_DATABASE_URL']
          runtime = fetch_runtime_observability(url)
          assert runtime['status'] == 'DATA_EVIDENCE_SPINE_RUNTIME_HEALTH_PASS', runtime
          assert runtime['runtime_engine_count'] == 12, runtime
          assert runtime['context_exactly_one_link'] == 7, runtime
          assert runtime['integrity_ok'] is True, runtime
          assert runtime['database_writes'] == 'NONE', runtime
          states = {r['engine_id']: r for r in runtime['runtime']}
          assert sum(r['runtime_status'] == 'ACTIVE' for r in states.values()) == 4
          assert sum(r['runtime_status'] == 'WAITING' for r in states.values()) == 3
          assert sum(r['runtime_status'] == 'BLOCKED' for r in states.values()) == 5
          assert sum(r.get('direction_vote_permitted') is True for r in states.values()) == 3

          decision = fetch_current_decision_state(url)
          if decision is not None:
              assert decision.get('action_state') is None

          spot = fetch_xau_spot()
          assert spot['price'] > 0
          assert spot['stale'] is False, {'status': spot['status'], 'provider_age_seconds': spot['provider_age_seconds']}
          assert spot['provider_age_seconds'] is not None and spot['provider_age_seconds'] <= 300

          gvz = fetch_gvz_latest()
          assert gvz['close'] > 0
          regime = gvz_regime(gvz['close'], full_max=25.9795, half_max=30.5238)
          assert regime in {'NORMAL','ELEVATED','PANIC'}
          print('V126_PRODUCTION_RUNTIME_AND_LIVE_SOURCE_PASS runtime=12/12 active=4 waiting=3 blocked=5 context=7/7 writes=NONE spot=fresh gvz_regime='+regime)
          PY

      - name: Prove recovered production-backed mobile UI
        run: |
          rm -rf /tmp/gold_mobile_v126_qa
          streamlit run gold_axis_2026/apps/gold_control.py \
            --server.headless true --server.port 8501 --server.address 127.0.0.1 \
            > /tmp/gold_mobile_v126_browser.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then break; fi
            sleep 1
          done
          set +e
          python gold_axis_2026/apps/mobile_viewport_qa.py --url http://127.0.0.1:8501 --out /tmp/gold_mobile_v126_qa
          QA_RC=$?
          set -e
          kill $APP_PID || true
          wait $APP_PID || true
          if [ $QA_RC -ne 0 ]; then
            cat /tmp/gold_mobile_v126_browser.log
            exit $QA_RC
          fi
          if grep -Eq 'ImportError|ModuleNotFoundError|Traceback \(most recent call last\)' /tmp/gold_mobile_v126_browser.log; then
            cat /tmp/gold_mobile_v126_browser.log
            exit 1
          fi
          for s in bugun gorunum tahmin gecmis; do
            test -s /tmp/gold_mobile_v126_qa/gold_control_v126_${s}_390x844.png
          done
          echo 'V126_PRODUCTION_BACKED_BROWSER_RECOVERY_PASS'

      - name: Assert stale UI contracts are gone and governance remains locked
        run: |
          ! grep -R -F 'BLOCKED_FORWARD_MONTHLY_LEVEL_SOURCE_NOT_BOUND' gold_axis_2026/apps/mobile_ui_contract.py gold_axis_2026/apps/gold_control_mobile_v1.py
          ! grep -R -F 'MOMENTUM_3M_R1' gold_axis_2026/apps/mobile_ui_contract.py
          ! grep -R -F 'RW_R1' gold_axis_2026/apps/mobile_ui_contract.py
          ! grep -R -F 'MANIFEST_V1_23' gold_axis_2026/apps/gold_control.py gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq '**Manifest version:** 1.26' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_SYSTEM_RECOVERY_UI_CONSISTENCY_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_EXPERT_SELECTION_RULE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'auto selector = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'auto ensemble = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_POSITION_MAPPING' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          echo 'V126_STALE_CONTRACT_AND_GOVERNANCE_SCAN_PASS'

      - name: Commit recovered non-workflow files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gold_axis_2026/tools/apply_v126_system_recovery.py \
            gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
            gold_axis_2026/apps/gold_control.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py \
            gold_axis_2026/apps/mobile_ui_contract.py \
            gold_axis_2026/apps/mobile_viewport_qa.py \
            gold_axis_2026/apps/test_mobile_ui_contract.py \
            gold_axis_2026/apps/test_ui_manifest_consistency_v126.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'NO_RECOVERY_DIFF'; exit 1; }
          git commit -m 'gold-control: close v1.26 UI runtime consistency defects'
          git push origin HEAD:gold-r4-direction-engine

      - name: Upload pre-commit recovery screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v126-recovery-precommit-390x844
          path: /tmp/gold_mobile_v126_qa/*.png
          if-no-files-found: error
          retention-days: 30