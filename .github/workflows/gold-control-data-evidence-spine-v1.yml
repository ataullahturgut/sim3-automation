name: Gold Control Data Evidence Spine

on:
  push:
    branches:
      - gold-r4-direction-engine
      - gold-control-clean-current-surface-v141-final
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DATA_EVIDENCE_SPINE_CONTRACT_2026-09-03.md'
      - 'gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md'
      - 'gold_axis_2026/data_pipeline/data_evidence_spine.py'
      - 'gold_axis_2026/data_pipeline/data_evidence_spine_preflight.py'
      - 'gold_axis_2026/data_pipeline/data_evidence_spine_audit.py'
      - 'gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py'
      - 'gold_axis_2026/data_pipeline/multi_expert_forecast.py'
      - 'gold_axis_2026/data_pipeline/multi_expert_forecast_store.py'
      - 'gold_axis_2026/data_pipeline/schema_patch_data_evidence_spine_neon_v1.sql'
      - 'gold_axis_2026/data_pipeline/test_data_evidence_spine.py'
      - 'gold_axis_2026/data_pipeline/test_data_evidence_spine_preflight.py'
      - 'gold_axis_2026/data_pipeline/test_data_evidence_spine_runtime_bootstrap.py'
      - '.github/workflows/gold-control-data-evidence-spine-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-spine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install 'psycopg[binary]>=3.2,<4' pytest
      - name: Compile current evidence-spine graph
        run: |
          python -m py_compile \
            gold_axis_2026/data_pipeline/data_evidence_spine.py \
            gold_axis_2026/data_pipeline/data_evidence_spine_preflight.py \
            gold_axis_2026/data_pipeline/data_evidence_spine_audit.py \
            gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py \
            gold_axis_2026/data_pipeline/multi_expert_forecast.py \
            gold_axis_2026/data_pipeline/multi_expert_forecast_store.py
      - name: Run deterministic evidence-spine tests
        run: |
          cd gold_axis_2026/data_pipeline
          pytest -q test_data_evidence_spine.py test_data_evidence_spine_preflight.py test_data_evidence_spine_runtime_bootstrap.py test_multi_expert_forecast.py test_multi_expert_early_indicative.py
      - name: Verify immutable production schema contract
        run: |
          grep -q 'monthly_expert_forecasts_input_set_identity_fkey' gold_axis_2026/data_pipeline/schema_patch_data_evidence_spine_neon_v1.sql
          grep -q 'trg_engine_execution_runs_immutable' gold_axis_2026/data_pipeline/schema_patch_data_evidence_spine_neon_v1.sql
          grep -q 'data_evidence_spine_health_v1' gold_axis_2026/data_pipeline/schema_patch_data_evidence_spine_neon_v1.sql
      - name: Read-only production preflight and integrity audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$NEON_DATABASE_URL"
          python gold_axis_2026/data_pipeline/data_evidence_spine_preflight.py
          python gold_axis_2026/data_pipeline/data_evidence_spine_audit.py
      - name: Dry-run current 12-engine runtime bootstrap
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py
