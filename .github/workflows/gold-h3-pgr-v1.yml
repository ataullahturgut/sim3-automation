name: Gold H3 PGR V1
on:
  push:
    branches: [gold-h3-pgr-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_pgr_v1.py'
      - '.github/workflows/gold-h3-pgr-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-pgr-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_pgr_v1.py
      - name: Record PGR evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gold_axis_2026/GOLD_H3_PGR_V1_CROSS_YEAR_FOLDS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_PGR_V1_SUMMARY_2026-10-04.json \
            gold_axis_2026/GOLD_H3_PGR_V1_RESULT_2026-10-04.md
          if [ -f gold_axis_2026/GOLD_H3_PGR_V1_FROZEN_PROTOTYPES_2026-10-04.json ]; then
            git add gold_axis_2026/GOLD_H3_PGR_V1_FROZEN_PROTOTYPES_2026-10-04.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record PGR-H3 V1 evidence and prospective freeze"
            git pull --rebase origin gold-h3-pgr-v1-20261004
            git push origin HEAD:gold-h3-pgr-v1-20261004
          fi
