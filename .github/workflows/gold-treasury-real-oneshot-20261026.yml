name: Gold Treasury Real Source V4 - One Shot
on:
  push:
    branches: [gold-risk-official-download-retry-v4-20261026]
    paths: ['gold_axis_2026/launchers/gold_treasury_real_once_20261026.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire-real-yields:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-risk-official-download-retry-v4-20261026
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - run: python gold_axis_2026/tools/retrieve_treasury_real_curve_20261026.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-treasury-real-official-20261026
          path: /tmp/gold_treasury_real_20261026
          retention-days: 30
          if-no-files-found: error
