name: Gold Monthly Boosting Stage 6A Metaheuristic Screen V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_boosting_stage6a_meta_screen_v1.py
      - .github/workflows/gold-monthly-boosting-stage6a-meta-screen-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  screen:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [CATBOOST, GBRT, XGBOOST, LIGHTGBM]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_stage6a_meta_screen_v1.py
      - name: Run Stage 6A lane
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_stage6a_meta_screen_v1.py --lane ${{ matrix.lane }}
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json, os
          lane=os.environ['LANE'].lower()
          p=f'gold_monthly_boosting_stage6a_{lane}_result.json'
          r=json.load(open(p))
          assert r['scope']=='BOOSTING_STAGE6A_METAHEURISTIC_BROAD_SCREEN_V1'
          assert len(r['methods'])==34
          assert len(r['anchors'])==6
          assert len(r['summary'])==34
          assert len(r['rows'])==34*6
          assert r['authority']['random_split']=='NONE'
          assert r['authority']['2025_role']=='NOT_OPENED_NOT_EVALUATED'
          assert r['authority']['2026_role']=='NOT_OPENED_NOT_EVALUATED'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert all(x['anchors']==6 for x in r['summary'])
          print('STAGE6A_GATE=PASS', r['lane'])
          PY
        env:
          LANE: ${{ matrix.lane }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-stage6a-${{ matrix.lane }}
          path: gold_monthly_boosting_stage6a_${{ matrix.lane }}_result.json
          if-no-files-found: error
