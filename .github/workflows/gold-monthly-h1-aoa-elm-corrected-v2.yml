name: GOLD H1 AOA ELM Defect Audit and Corrected V2 Replay
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-h1-aoa-elm-corrected-v2.yml
      - gold_axis_2026/tools/gold_monthly_h1_aoa_elm_bugfix_replay_v2.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  audit:
    name: Frozen legacy zero-factor bug plus 54 monthly target-future proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn' 'psycopg[binary]'
      - uses: actions/download-artifact@v4
        with:
          name: h1-ann-54-canonical-input-snapshot-v2
          run-id: 39986747259
          github-token: ${{ github.token }}
          path: /tmp/model-source
      - name: Original algebra defect and 54-origin target Y/future poisoned matrices
        run: |
          unset NEON_DATABASE_URL
          python gold_axis_2026/tools/gold_monthly_h1_aoa_elm_bugfix_replay_v2.py \
            --mode audit --snapshot /tmp/model-source/h1-ann-single-source-snapshot.json \
            --output /tmp/aoa-original-bug-and-v2-leak-audit.json
      - name: Require all source scientific control gates PASS and original defect disclosed
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/aoa-original-bug-and-v2-leak-audit.json'))
          assert a['status']=='AOA_ELM_54_ORIGINS_PROVENANCE_AND_POISON_PASS_WITH_LEGACY_BUG_FOUND'
          assert a['algorithm']['legacy_AOA_multiplier']==0
          assert a['algorithm']['legacy_AOA_compromised'] is True
          assert a['algorithm']['legacy_score_must_not_be_certified_as_valid_AOA'] is True
          assert a['algorithm']['corrected_multiplier']>0
          assert a['algorithm']['inner_validation_scaler_train_only'] is True
          assert len(a['rows'])==54
          assert a['rows'][0]['training_rows']==145
          assert a['rows'][-1]['training_rows']==198
          assert all(not z['target_future_poison_changed_feature_matrices'] for z in a['rows'])
          assert len(set(z['source_snapshot_sha256'] for z in a['rows']))==1
          print('AOA_ELM_ZERO_FACTOR_DEFECT_CERTIFIED_ORIGIN_54_LEAK_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-h1-aoa-elm-v1-defect-v2-54-origin-preflight
          path: /tmp/aoa-original-bug-and-v2-leak-audit.json
          retention-days: 90
  pilot:
    name: Corrected AOA-ELM real data 2022 April first fit
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn' 'psycopg[binary]'
      - uses: actions/download-artifact@v4
        with:
          name: h1-ann-54-canonical-input-snapshot-v2
          run-id: 39986747259
          github-token: ${{ github.token }}
          path: /tmp/model-source
      - name: Run normalized-unit-cube AOA search, do two target Y poison replays
        run: |
          unset NEON_DATABASE_URL
          python gold_axis_2026/tools/gold_monthly_h1_aoa_elm_bugfix_replay_v2.py \
            --mode pilot --snapshot /tmp/model-source/h1-ann-single-source-snapshot.json \
            --output /tmp/aoa-elm-v2-realdata-pilot.json
      - name: Hard-assert AOA actual nonzero search, train-only inner scaler and leakproof output
        run: |
          python - <<'PY'
          import json,math
          a=json.load(open('/tmp/aoa-elm-v2-realdata-pilot.json'))
          assert a['status']=='AOA_ELM_FIXED_V2_ONE_MONTH_PILOT_PASS'
          assert len(a['rows'])==1
          r=a['rows'][0]
          assert r['target_month']=='2022-04' and r['training_rows']==145
          assert r['algorithm_diagnostics']['nonzero_search_moves']>0
          assert r['algorithm_diagnostics']['distinct_candidate_hashes']>=10
          assert r['algorithm_diagnostics']['validation_scaler_train_only']
          assert r['algorithm_diagnostics']['training_last']=='2022-03'
          assert math.isfinite(r['forecast_xau_average'])
          print('AOA_ELM_NEW_TRUE_SEARCH_AND_CHRONOLOGICAL_SCALING_PILOT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-h1-aoa-elm-fixed-v2-first-real-model-pilot
          path: /tmp/aoa-elm-v2-realdata-pilot.json
          retention-days: 90
  frozen_legacy:
    name: Reproduce BUGGY old AOA-ELM 54 months as quarantined diagnostic only
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn' 'psycopg[binary]'
      - uses: actions/download-artifact@v4
        with:
          name: h1-ann-54-canonical-input-snapshot-v2
          run-id: 39986747259
          github-token: ${{ github.token }}
          path: /tmp/model-source
      - name: Legacy frozen model, identical source, trace as INVALID original method
        run: |
          unset NEON_DATABASE_URL
          python gold_axis_2026/tools/gold_monthly_h1_aoa_elm_bugfix_replay_v2.py \
            --mode legacy --snapshot /tmp/model-source/h1-ann-single-source-snapshot.json \
            --output /tmp/aoa-elm-legacy-zero-search-54.json
      - name: Scientific fail-as-valid guard
        run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/aoa-elm-legacy-zero-search-54.json'))
          assert a['status']=='AOA_ELM_LEGACY_ZERO_FACTOR_54_REPLAY_QUARANTINED'
          assert a['analysis_role']=='QUARANTINED_ORIGINAL_BUG_REPRODUCTION'
          assert a['algorithm']['legacy_AOA_multiplier']==0
          assert len(a['rows'])==54
          for phase,n in [('DEV_2022_2024',33),('TEST_2025',12),('STRESS_2026_01_09',9)]:
              m=a['metrics'][phase]
              assert m['n']==n
              print('AOA_ELM_INVALID_LEGACY_ONLY',phase,m)
          print('AOA_ELM_V1_QUARANTINED_NOT_PROMOTED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-h1-aoa-elm-original-degenerate-quarantined-54
          path: /tmp/aoa-elm-legacy-zero-search-54.json
          retention-days: 90
  correct_54:
    name: CORRECTED AOA ELM V2 54-month new valid optimizer model
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn' 'psycopg[binary]'
      - uses: actions/download-artifact@v4
        with:
          name: h1-ann-54-canonical-input-snapshot-v2
          run-id: 39986747259
          github-token: ${{ github.token }}
          path: /tmp/model-source
      - name: Model research fresh 54 months with corrected math and inner-fold time safety
        run: |
          unset NEON_DATABASE_URL
          python gold_axis_2026/tools/gold_monthly_h1_aoa_elm_bugfix_replay_v2.py \
            --mode full --snapshot /tmp/model-source/h1-ann-single-source-snapshot.json \
            --output /tmp/aoa-elm-fixed-v2-full-54.json
      - name: Count 54/54, 2010 train start, true optimizer search, metrics
        run: |
          python - <<'PY'
          import json,math
          a=json.load(open('/tmp/aoa-elm-fixed-v2-full-54.json'))
          assert a['status']=='AOA_ELM_FIXED_V2_FULL_54_PASS'
          assert a['analysis_role']=='NEW_CORRECTED_CHALLENGER'
          assert a['source_firstprint_certified'] is False
          assert a['database_access']=='NONE'
          assert len(a['rows'])==54
          assert a['rows'][0]['target_month']=='2022-04'
          assert a['rows'][-1]['target_month']=='2026-09'
          assert len(set(r['target_month'] for r in a['rows']))==54
          assert len(set(r['source_snapshot_sha256'] for r in a['rows']))==1
          assert all(r['algorithm_diagnostics']['training_first']=='2010-03'
                     and r['algorithm_diagnostics']['training_last']==r['origin_month']
                     and r['algorithm_diagnostics']['nonzero_search_moves']>=24
                     and r['algorithm_diagnostics']['validation_scaler_train_only']
                     and math.isfinite(r['forecast_xau_average'])
                     for r in a['rows'])
          assert [a['metrics'][k]['n'] for k in ['DEV_2022_2024','TEST_2025','STRESS_2026_01_09']]==[33,12,9]
          for period,mm in a['metrics'].items():
             print('AOA_ELM_FIXED_V2_VERIFIED_PERIOD',period,json.dumps(mm,sort_keys=True))
          print('AOA_ELM_V2_TRUE_AOA_ALL_54_SCIENTIFIC_GATES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-h1-aoa-elm-fixed-v2-54-valid-replay
          path: /tmp/aoa-elm-fixed-v2-full-54.json
          retention-days: 90
  comparison:
    name: Legacy bug quarantined and valid AOA V2 comparison report
    needs: [frozen_legacy,correct_54]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gold-h1-aoa-elm-original-degenerate-quarantined-54
          path: /tmp/legacy
      - uses: actions/download-artifact@v4
        with:
          name: gold-h1-aoa-elm-fixed-v2-54-valid-replay
          path: /tmp/v2
      - name: Verify same source; report exact improvement/no retrospective selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/legacy/aoa-elm-legacy-zero-search-54.json').read_text())
          b=json.loads(Path('/tmp/v2/aoa-elm-fixed-v2-full-54.json').read_text())
          assert a['source_snapshot_sha256']==b['source_snapshot_sha256']
          assert a['status']=='AOA_ELM_LEGACY_ZERO_FACTOR_54_REPLAY_QUARANTINED'
          assert b['status']=='AOA_ELM_FIXED_V2_FULL_54_PASS'
          print('AOA_LEGACY_ALGORITHM_INVALID_V2_CORRECTED_54_PASS')
          for phase in ('DEV_2022_2024','TEST_2025','STRESS_2026_01_09'):
            print('AOA_LEGACY_V2_SCORE_COMPARISON',phase,'legacy',json.dumps(a['metrics'][phase],sort_keys=True),'corrected',json.dumps(b['metrics'][phase],sort_keys=True))
          PY
