name: Gold risk V29 unchanged models price repair sensitivity
on:
  push:
    branches:
      - research/gold-risk-v29-price-replay-fixed-20261027
    paths:
      - 'gold_axis_2026/research/case_control_v13/risk_v29_fourmetal_price_replay.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v29_fourmetal_price_replay.py'
      - '.github/workflows/gold-risk-v29-feb2026-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price-aware-original-risk-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen original anomaly model dependencies
        run: python -m pip install numpy pandas scipy scikit-learn tabulate
      - name: Validate scenario implementation syntax
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -m py_compile risk_v29_fourmetal_price_replay.py
      - name: Re-run original BASE14 CFTC21 and V22 rules with Feb27 AM PM sensitivity
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -u risk_v29_fourmetal_price_replay.py
      - name: Verify immutable red thresholds and missing March score status
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -m unittest -v test_risk_v29_fourmetal_price_replay.py
      - name: Save all research evidence and failed-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v29-BASE14-CFTC21-V22-original-replay
          path: |
            gold_axis_2026/research/case_control_v13/outputs/v29_*.csv
            gold_axis_2026/research/case_control_v13/outputs/v29_*.json
          retention-days: 90
