name: Gold Short Horizon Global XAU ANFIS Transport V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_global_xau_anfis_transport_v1.py'
      - '.github/workflows/gold-short-horizon-global-xau-anfis-transport-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: global_xau_anfis_transport_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' requests
      - name: Resolve R2 readiness artifact
        id: aid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gold-short-horizon-global-xau-readiness-r2&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$AID"
          echo "aid=$AID" >> "$GITHUB_OUTPUT"
      - name: Run ANFIS frozen transport
        env:
          READINESS_ARTIFACT: ${{ steps.aid.outputs.aid }}
        run: python gold_axis_2026/tools/gold_short_horizon_global_xau_anfis_transport_v1.py
      - name: Commit ANFIS transport evidence
        run: |
          cp "$OUT_DIR/ANFIS_TRANSPORT_RESULT.md" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_ANFIS_TRANSPORT_RESULT_2026-10-02.md
          cp "$OUT_DIR/anfis_transport_summary.json" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_ANFIS_TRANSPORT_SUMMARY_2026-10-02.json
          cp "$OUT_DIR/anfis_transport_metrics.csv" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_ANFIS_TRANSPORT_METRICS_2026-10-02.csv
          cp "$OUT_DIR/anfis_transport_predictions.csv" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_ANFIS_TRANSPORT_PREDICTIONS_2026-10-02.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_ANFIS_TRANSPORT_*_2026-10-02.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record daily ANFIS 2025 2026 transport"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-xau-anfis-transport-v1
          path: global_xau_anfis_transport_out/
          if-no-files-found: warn
          retention-days: 90
