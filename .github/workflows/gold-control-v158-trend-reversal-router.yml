name: Gold Control V1.58 trend-reversal router thesis research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v158_thesis/**"
      - "gold_axis_2026/tests/test_v158_trend_reversal_router.py"
      - "gold_axis_2026/GOLD_CONTROL_V158_TREND_REVERSAL_ROUTER_METHOD_MEMO_2026-09-12.md"
      - ".github/workflows/gold-control-v158-trend-reversal-router.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trend-reversal-router:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 pytest==8.4.2
      - name: Test V1.58 chronology, emergency context and router semantics
        run: python -m pytest -q gold_axis_2026/tests/test_v158_trend_reversal_router.py
      - name: Run V1.58 frozen retrospective successor audit
        run: python -m gold_axis_2026.v158_thesis.run_v158_entry
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v158-trend-reversal-router-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v158_thesis/
