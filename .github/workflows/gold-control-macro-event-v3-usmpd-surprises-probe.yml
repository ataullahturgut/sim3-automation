name: Gold Control Macro Event V3 USMPD Surprises Probe

on:
  push:
    branches: [gold-control-macro-event-successor-v3]
    paths:
      - '.github/workflows/gold-control-macro-event-v3-usmpd-surprises-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests openpyxl
      - name: Inspect official SF Fed surprise package
        run: |
          python - <<'PY'
          import io, zipfile, requests, json, hashlib, re
          url='https://www.frbsf.org/wp-content/uploads/monetary-policy-surprises.zip'
          r=requests.get(url,headers={'User-Agent':'Gold-Control-USMPD-Surprise-Probe/1.0'},timeout=60); r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          out={'url':url,'sha256':hashlib.sha256(r.content).hexdigest(),'files':z.namelist(),'text_samples':{}}
          for n in z.namelist():
              if n.lower().endswith(('.r','.txt','.csv','.md')):
                  raw=z.read(n)
                  try: text=raw.decode('utf-8')
                  except: text=raw.decode('latin-1','replace')
                  out['text_samples'][n]=text[:12000]
          open('usmpd_surprises_probe.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: usmpd-surprises-probe
          path: usmpd_surprises_probe.json
          if-no-files-found: error
