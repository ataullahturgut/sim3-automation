name: Gold Control V1.27 Deployment Snapshot Recovery

on:
  workflow_dispatch:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DEPLOYMENT_DISPLAY_SNAPSHOT_CONTRACT_2026-09-03.md'
      - 'gold_axis_2026/apps/production_display_snapshot.py'
      - 'gold_axis_2026/apps/test_production_display_snapshot.py'
      - 'gold_axis_2026/tools/export_production_display_snapshot.py'
      - 'gold_axis_2026/tools/apply_v127_deployment_snapshot_recovery.py'
      - '.github/workflows/gold-control-v127-deployment-snapshot-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gold-r4-direction-engine

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install locked app and browser runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Apply frozen v1.27 recovery patch
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing in trusted recovery runner' && exit 1)
          python gold_axis_2026/tools/apply_v127_deployment_snapshot_recovery.py
          grep -Fq '**Manifest version:** 1.27' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'FROZEN_PRODUCTION_DISPLAY_SNAPSHOT_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md

      - name: Export read-only production display snapshot
        run: |
          python gold_axis_2026/tools/export_production_display_snapshot.py
          test -s gold_axis_2026/apps/production_display_snapshot.json

      - name: Compile patched graph
        run: |
          python -m py_compile \
            gold_axis_2026/apps/production_display_snapshot.py \
            gold_axis_2026/apps/decision_source.py \
            gold_axis_2026/apps/runtime_source.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py \
            gold_axis_2026/apps/gold_control.py \
            gold_axis_2026/tools/export_production_display_snapshot.py

      - name: Run deterministic contracts including deployment fallback
        run: |
          cd gold_axis_2026/apps
          pytest -q \
            test_mobile_ui_contract.py \
            test_piyasa_contract.py \
            test_engine_observability_contract.py \
            test_ui_manifest_consistency_v126.py \
            test_production_display_snapshot.py
          cd ../data_pipeline
          pytest -q test_multi_expert_forecast.py test_data_evidence_spine.py

      - name: Prove production DB and snapshot are aligned
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import json, os
          from decision_source import fetch_current_decision_state
          from runtime_source import fetch_runtime_observability
          from production_display_snapshot import load_production_display_snapshot

          url=os.environ['NEON_DATABASE_URL']
          snap=load_production_display_snapshot()
          smap={r['feature_name']:r['value_text'] for r in snap['features']}
          db=fetch_current_decision_state(url)
          rt=fetch_runtime_observability(url)
          assert db and db['source_mode']=='NEON_DB_READ_ONLY', db
          assert db['monthly_direction_3m']==smap['MONTHLY_DIRECTION_3M']
          assert db['fast_state']==smap['FAST_STATE']
          assert db['slow_state']==smap['SLOW_STATE']
          assert float(db['gvz'])==float(smap['GVZ_VALUE'])
          assert db['gvz_regime']==smap['GVZ_REGIME']
          assert db.get('classification') is None and db.get('action_state') is None
          assert rt['source_mode']=='NEON_DB_READ_ONLY'
          assert rt['runtime_engine_count']==12 and rt['context_exactly_one_link']==7 and rt['integrity_ok'] is True
          print('V127_DB_SNAPSHOT_ALIGNMENT_PASS runtime=12/12 context=7/7 writes=NONE')
          PY

      - name: Browser acceptance with NEON_DATABASE_URL deliberately absent
        run: |
          rm -rf /tmp/gold_v127_snapshot_qa
          mkdir -p /tmp/gold_v127_snapshot_qa
          env -u NEON_DATABASE_URL streamlit run gold_axis_2026/apps/gold_control.py \
            --server.headless true --server.port 8502 --server.address 127.0.0.1 \
            > /tmp/gold_v127_snapshot_browser.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8502/_stcore/health >/dev/null; then break; fi
            sleep 1
          done
          env -u NEON_DATABASE_URL python - <<'PY'
          import json,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          snap=json.loads(Path('gold_axis_2026/apps/production_display_snapshot.json').read_text())
          values={r['feature_name']:r['value_text'] for r in snap['features']}
          out=Path('/tmp/gold_v127_snapshot_qa/gold_control_v127_snapshot_fallback_gorunum_390x844.png')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
              page.goto('http://127.0.0.1:8502',wait_until='domcontentloaded',timeout=60000)
              page.get_by_text('GOLD CONTROL',exact=False).first.wait_for(state='visible',timeout=45000)
              root=page.locator('.st-key-gc_main_nav')
              root.locator('label[data-testid="stRadioOption"]').filter(has_text=re.compile('Görünüm',re.I)).first.click()
              page.get_by_text('GÖRÜNÜM',exact=True).first.wait_for(state='visible',timeout=15000)
              body=page.locator('body').inner_text()
              assert 'Production Evidence Snapshot · FALLBACK' in body, body[:3000]
              assert 'runtime 12/12' in body and 'context link 7/7' in body and 'integrity PASS' in body
              assert values['MONTHLY_DIRECTION_3M'] in body
              assert values['FAST_STATE'] in body
              assert values['SLOW_STATE'] in body
              assert values['GVZ_VALUE'] in body
              assert values['GVZ_REGIME'] in body
              assert 'NO_CURRENT_EVIDENCE' not in '\n'.join(line for line in body.splitlines() if 'Monthly Direction' in line or line.strip() in {'FAST','SLOW','GVZ Risk Cap'})
              assert 'KANONİK KARAR YOK' in body
              assert 'BUY' not in body and 'SELL' not in body and 'HOLD' not in body
              evidence=page.get_by_text(re.compile(r'Production Evidence Snapshot.*runtime 12/12.*context link 7/7.*integrity PASS',re.I)).first
              evidence.scroll_into_view_if_needed()
              page.wait_for_timeout(500)
              page.screenshot(path=str(out),full_page=False)
              browser.close()
          assert out.is_file() and out.stat().st_size>0
          print('V127_SNAPSHOT_ONLY_BROWSER_PASS Monthly='+values['MONTHLY_DIRECTION_3M']+' FAST='+values['FAST_STATE']+' SLOW='+values['SLOW_STATE']+' GVZ='+values['GVZ_VALUE']+'/'+values['GVZ_REGIME'])
          PY
          kill $APP_PID || true
          wait $APP_PID || true
          if grep -Eq 'ImportError|ModuleNotFoundError|Traceback \(most recent call last\)' /tmp/gold_v127_snapshot_browser.log; then
            cat /tmp/gold_v127_snapshot_browser.log
            exit 1
          fi

      - name: Production DB-backed browser regression
        run: |
          rm -rf /tmp/gold_v127_db_qa
          streamlit run gold_axis_2026/apps/gold_control.py \
            --server.headless true --server.port 8503 --server.address 127.0.0.1 \
            > /tmp/gold_v127_db_browser.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8503/_stcore/health >/dev/null; then break; fi
            sleep 1
          done
          python gold_axis_2026/apps/mobile_viewport_qa.py --url http://127.0.0.1:8503 --out /tmp/gold_v127_db_qa
          kill $APP_PID || true
          wait $APP_PID || true
          grep -Eq 'ImportError|ModuleNotFoundError|Traceback \(most recent call last\)' /tmp/gold_v127_db_browser.log && (cat /tmp/gold_v127_db_browser.log; exit 1) || true

      - name: Verify locks and commit recovered canonical state
        run: |
          grep -Fq 'NOT_PROVEN_EXPERT_SELECTION_RULE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'auto selector = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'auto ensemble = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'NOT_PROVEN_POSITION_MAPPING' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git status --short
          git add \
            gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
            gold_axis_2026/apps/decision_source.py \
            gold_axis_2026/apps/runtime_source.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py \
            gold_axis_2026/apps/gold_control.py \
            gold_axis_2026/apps/production_display_snapshot.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'gold-control: activate v1.27 deployment snapshot fallback'
          git push origin HEAD:gold-r4-direction-engine

      - name: Upload recovery screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v127-deployment-recovery-screenshots
          path: |
            /tmp/gold_v127_snapshot_qa/*.png
            /tmp/gold_v127_db_qa/*.png
          if-no-files-found: error
          retention-days: 30
