name: Gold H3 Databento Bridge Cost Probe V1

on:
  push:
    branches: [gold-h3-oct5-diagnostic-nowcast-20261005]
    paths:
      - 'gold_axis_2026/tools/gold_h3_databento_bridge_cost_probe_v1.py'
      - '.github/workflows/gold-h3-databento-bridge-cost-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-oct5-diagnostic-nowcast-20261005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'databento>=0.60,<1'
      - run: python gold_axis_2026/tools/gold_h3_databento_bridge_cost_probe_v1.py
      - name: Record Databento probe evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gold_axis_2026/GOLD_H3_DATABENTO_BRIDGE_COST_PROBE_2026-10-05.json \
            gold_axis_2026/GOLD_H3_DATABENTO_BRIDGE_COST_PROBE_2026-10-05.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record Databento bridge cost probe'
            git pull --rebase origin gold-h3-oct5-diagnostic-nowcast-20261005
            git push origin HEAD:gold-h3-oct5-diagnostic-nowcast-20261005
          fi

# rerun after DATABENTO_API_KEY added: 2026-10-05T11:41Z
