name: Gold Control Current Snapshot Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: gold-control-current-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database runtime
        run: pip install 'psycopg[binary]>=3.2,<4'
      - name: Export sanitized current snapshot read-only
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing' && exit 1)
          python gold_axis_2026/tools/export_production_display_snapshot.py --out /tmp/production_display_snapshot.json
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import json
          from pathlib import Path
          from production_display_snapshot import SNAPSHOT_CONTRACT, validate_production_display_snapshot
          snap=json.loads(Path('/tmp/production_display_snapshot.json').read_text(encoding='utf-8'))
          validate_production_display_snapshot(snap)
          assert snap['snapshot_contract'] == SNAPSHOT_CONTRACT == 'GOLD_CONTROL_CURRENT_PRODUCTION_DISPLAY_SNAPSHOT_V141'
          assert len(snap['runtime']) == 12
          assert len(snap['features']) == 7
          assert all(r['runtime_status'] == 'ACTIVE' for r in snap['runtime'])
          assert all((r.get('metadata') or {}).get('current_surface_contract') == 'GOLD_CONTROL_CURRENT_SURFACE_V141' for r in snap['runtime'])
          assert all(f['quality_status'] == 'HISTORICAL_REPLAY_CONTEXT' for f in snap['features'])
          assert all((f.get('metadata') or {}).get('current_surface_contract') == 'GOLD_CONTROL_CURRENT_SURFACE_V141' for f in snap['features'])
          assert snap['database_writes'] == 'NONE'
          print('CURRENT_PRODUCTION_SNAPSHOT_VALIDATION_PASS')
          PY
      - name: Commit only when current state changed
        run: |
          cp /tmp/production_display_snapshot.json gold_axis_2026/apps/production_display_snapshot.json
          if git diff --quiet -- gold_axis_2026/apps/production_display_snapshot.json; then
            echo 'CURRENT_PRODUCTION_SNAPSHOT_UNCHANGED'
            exit 0
          fi
          git diff --check -- gold_axis_2026/apps/production_display_snapshot.json
          git config user.name 'gold-control-governance-bot'
          git config user.email 'gold-control-governance-bot@users.noreply.github.com'
          git add gold_axis_2026/apps/production_display_snapshot.json
          git commit -m 'Gold Control: refresh current production snapshot'
          git push origin HEAD:gold-r4-direction-engine
