name: Gold Monthly Boosting Ensemble E3 Shrinkage V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-boosting-ensemble-e3-shrinkage-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensemble-e3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'scipy>=1.13,<2'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'

      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_ensemble_e3_shrinkage_v1.py

      - name: Run E3
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_ensemble_e3_shrinkage_v1.py

      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          import math

          r=json.load(open('gold_monthly_boosting_ensemble_e3_shrinkage_v1_result.json'))
          c=r['contract']
          expected=[0.0,0.1,0.25,0.5,0.75,1.0]
          expected_keys={'0.00','0.10','0.25','0.50','0.75','1.00'}

          assert r['scope']=='BOOSTING_ENSEMBLE_E3_CONTROLLED_SHRINKAGE_V1'
          assert c['dev']=='2022-04..2024-12'
          assert c['dev_n']==33
          assert c['alpha_grid']==expected
          assert c['shrinkage_target']=='EQUAL_WEIGHTS'
          assert c['median_role']=='SEPARATE_FROZEN_COMPARATOR'
          assert c['simplex_state']=='E2_PRIOR_ONLY_EXPANDING_PREQUENTIAL_UNCHANGED'
          assert c['minimum_prior_dev_origins']==6
          assert c['subset_search']=='NONE'
          assert c['stacking']=='NONE'
          assert c['random_split']=='NONE'
          assert c['database']=='READ_ONLY'
          assert c['2025_role']=='NOT_OPENED_NOT_EVALUATED'
          assert c['2026_role']=='QUARANTINED_NOT_USED'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert set(r['results'])=={'FULL5','REDUCED4'}

          for pool,p in r['results'].items():
              assert set(p['variants'])==expected_keys
              assert len(p['ranking'])==6

              v0=p['variants']['0.00']
              v1=p['variants']['1.00']
              eq=p['references']['e1_equal']
              raw=p['references']['e2_raw_simplex']
              med=p['references']['e1_median']

              assert abs(v0['metrics']['sum_abs_error']-eq['sum_abs_error'])<1e-8
              assert v0['metrics']['direction_correct']==eq['direction_correct']
              assert abs(v1['metrics']['sum_abs_error']-raw['sum_abs_error'])<1e-8
              assert v1['metrics']['direction_correct']==raw['direction_correct']

              for key,v in p['variants'].items():
                  assert v['metrics']['n']==33
                  for i,row in enumerate(v['rows']):
                      w=list(row['weights'].values())
                      assert min(w)>=-1e-10
                      assert max(w)<=1+1e-10
                      assert abs(sum(w)-1)<1e-8
                      assert row['trained_on_prior_dev_origins']==i
                      assert row['simplex_fallback_equal']==(i<6)

              learned=[z for z in p['ranking'] if z['alpha']>0]
              best=min(learned,key=lambda z:(z['sum_abs_error'],-z['direction_correct'],z['rmse'],z['alpha']))
              assert abs(best['alpha']-p['best_learned_alpha'])<1e-12
              expected_promoted=best['sum_abs_error'] < med['sum_abs_error']-1e-8
              assert p['learned_shrinkage_promoted']==expected_promoted
              if expected_promoted:
                  assert p['decision']=='PROMOTED_LEARNED_SHRINKAGE'
              else:
                  assert p['decision']=='LEARNED_WEIGHTS_CLOSED_NOT_PROMOTED'

          print('BOOSTING_ENSEMBLE_E3_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-ensemble-e3-shrinkage-v1
          path: |
            gold_monthly_boosting_ensemble_e3_shrinkage_v1_result.json
            gold_axis_2026/GOLD_MONTHLY_BOOSTING_ENSEMBLE_E3_SHRINKAGE_RESULT_2026-09-28.md
          if-no-files-found: error

      - name: Commit result report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_MONTHLY_BOOSTING_ENSEMBLE_E3_SHRINKAGE_RESULT_2026-09-28.md
          if git diff --cached --quiet; then
            echo "No result report change to commit"
          else
            git commit -m "Record Boosting E3 controlled shrinkage result"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
