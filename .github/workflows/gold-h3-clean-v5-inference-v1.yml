name: Gold H3 Clean V5 Inference

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_h3_clean_v5_inference_v1.py'
      - '.github/workflows/gold-h3-clean-v5-inference-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OUT_DIR: gold_h3_clean_inference_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'
      - run: python gold_axis_2026/tools/gold_h3_clean_v5_inference_v1.py
      - name: Commit clean inference
        shell: bash
        run: |
          cp "$OUT_DIR/CLEAN_V5_INFERENCE_RESULT.md" gold_axis_2026/GOLD_H3_CLEAN_V5_INFERENCE_RESULT_2026-10-03.md
          cp "$OUT_DIR/clean_v5_inference_summary.json" gold_axis_2026/GOLD_H3_CLEAN_V5_INFERENCE_SUMMARY_2026-10-03.json
          cp "$OUT_DIR/clean_v5_inference.csv" gold_axis_2026/GOLD_H3_CLEAN_V5_INFERENCE_2026-10-03.csv
          cp "$OUT_DIR/clean_v5_cluster_inference.csv" gold_axis_2026/GOLD_H3_CLEAN_V5_CLUSTER_INFERENCE_2026-10-03.csv
          cp "$OUT_DIR/clean_v5_sensitivity.csv" gold_axis_2026/GOLD_H3_CLEAN_V5_SENSITIVITY_2026-10-03.csv
          cp "$OUT_DIR/clean_v5_metrics_detailed.csv" gold_axis_2026/GOLD_H3_CLEAN_V5_METRICS_DETAILED_2026-10-03.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_CLEAN_V5_*_2026-10-03.*
          if ! git diff --cached --quiet; then
            git commit -m "Record clean H3 V5 inference"
            git pull --rebase origin gold-midas-headswap-v1-20260925
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-h3-clean-v5-inference
          path: gold_h3_clean_inference_out/
          retention-days: 90
