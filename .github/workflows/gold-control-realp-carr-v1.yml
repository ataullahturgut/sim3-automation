name: Gold Control RealP-CARR V1

on:
  push:
    branches:
      - gold-direction-vlmc-bs-family-v2-20260918
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_PREREG_2026-09-20.md'
      - 'gold_axis_2026/data_pipeline/twelve_xau_realp_research_v1.py'
      - 'gold_axis_2026/tools/direction_realp_carr_v1_research.py'
      - '.github/workflows/gold-control-realp-carr-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-realp-carr-v1
  cancel-in-progress: false

jobs:
  realp-carr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-vlmc-bs-family-v2-20260918
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require protected Twelve Data credential
        run: test -n "$TWELVE_DATA_API_KEY"

      - name: Install frozen research dependencies
        run: python -m pip install 'requests>=2.31,<3' 'numpy==2.1.3' 'scipy>=1.13,<2'

      - name: Compile research code
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/twelve_xau_realp_research_v1.py
          python -m py_compile gold_axis_2026/tools/direction_realp_carr_v1_research.py

      - name: Fetch hourly XAU and derive source-faithful weekly RealP
        run: python gold_axis_2026/data_pipeline/twelve_xau_realp_research_v1.py

      - name: Assert research-only and immutable derived input
        run: |
          ! grep -Ei 'psycopg|NEON_DATABASE_URL|persist_bundle|insert[[:space:]]+into|update[[:space:]]+observations|delete[[:space:]]+from'             gold_axis_2026/data_pipeline/twelve_xau_realp_research_v1.py
          test -s realp_hourly_research_artifact_v1/xau_weekly_realp_2022_2025.csv
          test -s realp_hourly_research_artifact_v1/realp_hourly_backfill_summary.json
          echo 'REALP_RESEARCH_ONLY_NO_DB_WRITE_PASS'

      - name: Run pre-2025 RealP-CARR replay
        run: |
          rm -rf realp_pre2025
          mkdir -p realp_pre2025
          python gold_axis_2026/tools/direction_realp_carr_v1_research.py             realp_hourly_research_artifact_v1/xau_weekly_realp_2022_2025.csv             --stage pre2025             --outdir realp_pre2025

      - name: Freeze pre-2025 evidence before 2025 replay
        run: |
          cp realp_pre2025/* gold_axis_2026/
          cp realp_hourly_research_artifact_v1/realp_hourly_backfill_summary.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_DATA_AUDIT_2026-09-20.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_DATA_AUDIT_2026-09-20.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_PRE2025_FORECASTS_2026-09-20.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_PRE2025_RESULT_2026-09-20.json
          git commit -m 'Freeze RealP-CARR V1 pre-2025 evidence'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Run unchanged 2025 RealP-CARR replay
        run: |
          rm -rf realp_2025
          mkdir -p realp_2025
          python gold_axis_2026/tools/direction_realp_carr_v1_research.py             realp_hourly_research_artifact_v1/xau_weekly_realp_2022_2025.csv             --stage 2025             --outdir realp_2025             --pre-result gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_PRE2025_RESULT_2026-09-20.json

      - name: Freeze 2025 replay and final result
        run: |
          cp realp_2025/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_2025_FORECASTS_2026-09-20.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_2025_RESULT_2026-09-20.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_REALP_CARR_V1_RESULT_2026-09-20.md
          git commit -m 'Freeze RealP-CARR V1 2025 replay and result'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Upload immutable research input and outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-realp-carr-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            realp_hourly_research_artifact_v1/
            realp_pre2025/
            realp_2025/
