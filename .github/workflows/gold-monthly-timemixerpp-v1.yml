name: Gold Monthly TimeMixerPP V1

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - gold_axis_2026/tools/gold_monthly_timemixerpp_v1.py
  workflow_dispatch:

jobs:
  timemixerpp-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<3' 'psycopg[binary]==3.3.6'
          python -m pip install 'git+https://github.com/WenjieDu/PyPOTS.git@53b3eac34be9491ac3f28e65ee1993436e9318af'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_timemixerpp_v1.py
      - name: Run TimeMixerPP
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_timemixerpp_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open("gold_monthly_timemixerpp_v1_result.json"))
          assert p["scientific_gate"] == "PASS"
          assert p["authority_invariants_unchanged"] is True
          assert p["contract"]["random_split"] == "NONE"
          assert p["contract"]["lookback_months"] == 48
          assert p["contract"]["2025_role"] == "LOCKED_REPORT_ONLY"
          assert p["contract"]["2026_role"] == "QUARANTINED_REPORT_ONLY"
          assert p["dev"]["metrics"]["n"] == 33
          print("TIMEMIXERPP_V1_GATE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-timemixerpp-v1
          path: gold_monthly_timemixerpp_v1_result.json
