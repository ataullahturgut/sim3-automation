name: GOLD One Vendor XAU 2020-2026 Origin Quality Gate
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_histdata_one_vendor_origin_gate_20261008.py'
      - '.github/workflows/gold-execution-one-vendor-origin-quality-20261008.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-one-vendor-origin-quality-20261008
  cancel-in-progress: false
jobs:
  run-source-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Validate one-vendor bar archive and store separate quality candidates
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_histdata_one_vendor_origin_gate_20261008.py
          python gold_axis_2026/tools/gold_execution_histdata_one_vendor_origin_gate_20261008.py
      - name: Commit QC counts and evidence only
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_HISTDATA_ONE_VENDOR_GOVERNED_CANDIDATE_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_HISTDATA_ONE_VENDOR_GOVERNED_CANDIDATE_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record strict single-source XAU 2020-2026 eligible origin quality evidence'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
