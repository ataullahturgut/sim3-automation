name: Gold Monthly Boosting Stage 6A CatBoost Group 2 V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-boosting-stage6a-catboost-group2-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  method:
    name: catboost-${{ matrix.method }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        method: [SSA, GWO, WOA, HHO, ACO, BAT]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_stage6a_catboost_method_generic_v1.py
      - name: Run optimizer
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_stage6a_catboost_method_generic_v1.py --method ${{ matrix.method }}
      - name: Scientific gate
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import json, os
          m=os.environ['METHOD']
          p=f'gold_monthly_boosting_stage6a_catboost_{m.lower()}_result.json'
          r=json.load(open(p))
          assert r['scope']=='BOOSTING_STAGE6A_CATBOOST_METHOD_JOB_GENERIC_V1'
          assert r['lane']=='CATBOOST'
          assert r['method']==m
          assert len(r['anchors'])==6
          assert len(r['rows'])==12
          assert r['result']['anchors']==6
          assert r['vanilla']['anchors']==6
          assert r['authority']['random_split']=='NONE'
          assert r['authority']['2025_role']=='NOT_OPENED_NOT_EVALUATED'
          assert r['authority']['2026_role']=='NOT_OPENED_NOT_EVALUATED'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          print('CATBOOST_METHOD_GATE=PASS',m)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-stage6a-catboost-${{ matrix.method }}
          path: gold_monthly_boosting_stage6a_catboost_*_result.json
          if-no-files-found: warn
