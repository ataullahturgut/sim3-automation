name: Gold CFTC official GC SI current research ledger
on:
  push:
    branches: [research/gold-v22-neon-current-risk-20261030]
    paths:
      - 'gold_axis_2026/data_pipeline/gold_cftc_official_futuresonly_gc_si_ingest_v1.py'
      - '.github/workflows/gold-cftc-official-2026-ledger-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-cftc:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate public CFTC dates, contract codes and exact API fields
        run: python gold_axis_2026/data_pipeline/gold_cftc_official_futuresonly_gc_si_ingest_v1.py --out cftc_public_dryrun.json
      - name: Append only new or revised official CFTC reports
        run: python gold_axis_2026/data_pipeline/gold_cftc_official_futuresonly_gc_si_ingest_v1.py --write --out cftc_public_applied.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-official-CFTC-GC-SI-2026-ledger-evidence
          path: |
            cftc_public_dryrun.json
            cftc_public_applied.json
          retention-days: 30
