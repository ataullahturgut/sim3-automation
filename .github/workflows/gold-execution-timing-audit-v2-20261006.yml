name: Gold Execution Timing Audit V2 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_timing_audit_v2_20261006.py'
      - '.github/workflows/gold-execution-timing-audit-v2-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - run: python gold_axis_2026/tools/gold_execution_timing_audit_v2_20261006.py
      - name: Record v2 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/EXECUTION_TIMING_V2_OUT/summary.json gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_2026-10-06.json
          cp gold_axis_2026/EXECUTION_TIMING_V2_OUT/signal_panel_corrected.csv gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_SIGNAL_PANEL_2026-10-06.csv
          cp gold_axis_2026/EXECUTION_TIMING_V2_OUT/d2d_earliest_1h.csv gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_D2D_1H_2026-10-06.csv
          cp gold_axis_2026/EXECUTION_TIMING_V2_OUT/fixed_exit_scan_1h.csv gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_SCAN_1H_2026-10-06.csv
          cp gold_axis_2026/EXECUTION_TIMING_V2_OUT/d2d_earliest_15m_augsep.csv gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_D2D_15M_AUGSEP_2026-10-06.csv
          cp gold_axis_2026/EXECUTION_TIMING_V2_OUT/fixed_exit_scan_15m_augsep.csv gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_SCAN_15M_AUGSEP_2026-10-06.csv
          git add gold_axis_2026/GOLD_EXECUTION_TIMING_AUDIT_V2_*
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected causal execution timing audit v2"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
