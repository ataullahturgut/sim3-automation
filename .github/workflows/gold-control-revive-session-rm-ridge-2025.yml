name: Gold Control Revive SESSION_RM_RIDGE 2025

on:
  workflow_dispatch:
  push:
    branches: [gold-control-revive-session-rm-ridge-2025]
    paths:
      - 'gold_axis_2026/research_revival/session_rm_ridge_reconstruction_v1_contract.json'
      - 'gold_axis_2026/tools/session_rm_ridge_reconstruction_v1_2025.py'
      - '.github/workflows/gold-control-revive-session-rm-ridge-2025.yml'

permissions:
  contents: read
  actions: read

jobs:
  replay-2025:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FORMATION_ARTIFACT_ID: '10338387444'
      CHALLENGE_ARTIFACT_ID: '10343971259'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed dependencies
        run: python -m pip install --quiet numpy pandas scikit-learn 'psycopg[binary]'
      - name: Require frozen contract
        run: |
          test -n "$NEON_DATABASE_URL"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('gold_axis_2026/research_revival/session_rm_ridge_reconstruction_v1_contract.json').read_text())
          assert c['status']=='FROZEN_BEFORE_2025_REPLAY'
          assert c['split']['challenge_refit'] is False
          assert c['split']['challenge_hyperparameter_search'] is False
          assert c['split']['challenge_threshold_search'] is False
          print('CONTRACT_FREEZE_OK')
          PY
      - name: Download exact NY17 artifacts
        run: |
          mkdir -p /tmp/session/wp1 /tmp/session/ch2025 /tmp/session/out
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FORMATION_ARTIFACT_ID}/zip" > /tmp/session/wp1.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHALLENGE_ARTIFACT_ID}/zip" > /tmp/session/ch2025.zip
          unzip -q /tmp/session/wp1.zip -d /tmp/session/wp1
          unzip -q /tmp/session/ch2025.zip -d /tmp/session/ch2025
          HIST=$(find /tmp/session/wp1 -type f -name 'gc_break_wp1_exact_ny17_consolidated_batch_v3.csv' | head -n1)
          CH=$(find /tmp/session/ch2025 -type f -name 'gc_break_wp1_exact_ny17_consolidated_batch_v3.csv' | head -n1)
          test -n "$HIST" && test -f "$HIST" && test -n "$CH" && test -f "$CH"
          echo "HIST=$HIST" >> "$GITHUB_ENV"
          echo "CH=$CH" >> "$GITHUB_ENV"
      - name: Extract immutable retrospective 5m research cache slice
        run: |
          python - <<'PY'
          import csv, os, psycopg
          out='/tmp/session/xau_5m_2021_2025.csv'
          with psycopg.connect(os.environ['NEON_DATABASE_URL']) as conn:
              with conn.cursor() as cur, open(out,'w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(['observation_ts','close'])
                  cur.execute("""SELECT observation_ts, close FROM public.xau_intraday_research_cache_5m WHERE observation_ts >= %s AND observation_ts < %s ORDER BY observation_ts""", ('2021-12-31','2026-01-02'))
                  n=0
                  while True:
                      rows=cur.fetchmany(10000)
                      if not rows: break
                      w.writerows(rows); n += len(rows)
          print({'intraday_rows':n,'path':out})
          assert n > 250000
          PY
          echo "INTRADAY_SHA256=$(sha256sum /tmp/session/xau_5m_2021_2025.csv | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Compile runner
        run: python -m py_compile gold_axis_2026/tools/session_rm_ridge_reconstruction_v1_2025.py
      - name: Fit 2022-2024 and score 2025
        run: |
          python gold_axis_2026/tools/session_rm_ridge_reconstruction_v1_2025.py \
            --historical-exact "$HIST" \
            --challenge-exact "$CH" \
            --intraday-csv /tmp/session/xau_5m_2021_2025.csv \
            --contract gold_axis_2026/research_revival/session_rm_ridge_reconstruction_v1_contract.json \
            --output-dir /tmp/session/out | tee /tmp/session/out/run.log
      - name: Audit output
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/session/out/session_rm_ridge_reconstruction_v1_2025_summary.json')
          d=json.loads(p.read_text())
          assert d['status']=='PASS'
          assert d['original_identity_recovered'] is False
          assert d['challenge_refit'] is False
          assert d['hyperparameter_search'] is False
          assert d['threshold_search'] is False
          assert d['post_challenge_tuning'] is False
          assert d['challenge_feature_complete_rows'] >= 180
          d['intraday_input_sha256']=os.environ['INTRADAY_SHA256']
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          print('SESSION_RM_RIDGE_RECONSTRUCTION_2025_PASS')
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: session-rm-ridge-reconstruction-v1-2025
          path: /tmp/session/out/
          if-no-files-found: error
          retention-days: 90
