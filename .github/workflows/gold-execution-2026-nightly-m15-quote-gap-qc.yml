name: Gold 2026 Nightly 64xM15 Native Source Coverage Forensic
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_overnight_m15_gap_source_20261009.py
      - .github/workflows/gold-execution-2026-nightly-m15-quote-gap-qc.yml
permissions:
  contents: write
concurrency:
  group: gold-source-overnight-m15-price-observation-gaps
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Report native paired BID open close missing bars per exact Turkey regular night before changing HAR source contract
        run: |
          python gold_axis_2026/tools/gold_execution_2026_overnight_m15_gap_source_20261009.py
      - name: Commit only source-histogram QC (no private quotes)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_OVERNIGHT_M15_GAP_SHAPE_20261009_{YEAR_QC.csv,MISSING_CLOCK.csv,SUMMARY.json,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Quantify exact observed versus missing night market 15m bars in 2023-26 before any HAR realized vol risk correction'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
