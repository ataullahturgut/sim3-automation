name: Gold V34 original forward inference numerical parity (research only)
on:
  push:
    branches:
      - research/gold-v34-forward-parity-safe-20261030
    paths:
      - 'gold_axis_2026/research/case_control_v13/gold_v34_forward_parity_v1.py'
      - '.github/workflows/gold-v34-original-forward-parity-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  historical-origin-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Numerical dependencies from original research
        run: python -m pip install numpy pandas scipy scikit-learn 'psycopg[binary]>=3.2,<4'
      - name: Compile original forward-only adapter
        run: python -m py_compile gold_axis_2026/research/case_control_v13/gold_v34_forward_parity_v1.py
      - name: Reconstruct original V34 4-metal research snapshot and prove forward parity
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -u gold_v34_forward_parity_v1.py --mode historical-parity --out outputs/v34_forward_parity_research_only.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-v34-original-forward-parity-evidence
          path: gold_axis_2026/research/case_control_v13/outputs/v34_forward_parity_research_only.json
          if-no-files-found: warn
          retention-days: 30
