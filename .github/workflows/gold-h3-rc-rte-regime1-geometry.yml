name: Gold H3 RC-RTE Regime1 Geometry
on:
  push:
    branches: [gold-h3-rc-rte-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_rc_rte_regime1_geometry.py'
      - '.github/workflows/gold-h3-rc-rte-regime1-geometry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-rc-rte-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas scikit-learn
      - run: python gold_axis_2026/tools/gold_h3_rc_rte_regime1_geometry.py
      - name: Record regime geometry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_RC_RTE_REGIME1_GEOMETRY_DIAGNOSTIC_2026-10-04.md
          if ! git diff --cached --quiet; then
            git commit -m "Record RC-RTE regime1 geometry diagnostic"
            git pull --rebase origin gold-h3-rc-rte-v1-20261004
            git push origin HEAD:gold-h3-rc-rte-v1-20261004
          fi
