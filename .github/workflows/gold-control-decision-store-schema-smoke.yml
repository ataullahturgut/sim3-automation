name: Gold Control Decision Store Schema Smoke

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - '.github/workflows/gold-control-decision-store-schema-smoke.yml'
      - 'gold_axis_2026/GOLD_CONTROL_R4_1_EMITTED_STATE_CONTRACT.md'
      - 'gold_axis_2026/data_pipeline/schema_patch_decision_store_v1.sql'
      - 'gold_axis_2026/data_pipeline/test_decision_store_schema.py'
      - 'gold_axis_2026/data_pipeline/decision_store.py'
      - 'gold_axis_2026/data_pipeline/test_decision_store_writer.py'
      - 'gold_axis_2026/data_pipeline/decision_store_reader.py'
      - 'gold_axis_2026/data_pipeline/test_decision_store_reader.py'
      - 'gold_axis_2026/data_pipeline/r4_1_decision_adapter.py'
      - 'gold_axis_2026/data_pipeline/test_r4_1_decision_adapter.py'
      - 'gold_axis_2026/data_pipeline/r4_1_decision_bridge.py'
      - 'gold_axis_2026/data_pipeline/test_r4_1_decision_bridge.py'
      - 'gold_axis_2026/r4_1/src/gold_r4/**'
      - 'gold_axis_2026/r4_1/scripts/replay_daily.py'
      - 'gold_axis_2026/r4_1/config/frozen_r4_1.json'
      - 'gold_axis_2026/r4_1/pyproject.toml'
  workflow_dispatch:

concurrency:
  group: gold-control-decision-store-schema-smoke
  cancel-in-progress: true

jobs:
  rollback-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audited data-plane dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require private Neon connection secret
        shell: bash
        run: |
          test -n "$NEON_DATABASE_URL" || (echo "NEON_DATABASE_URL missing" && exit 1)
      - name: Compile decision-store and R4.1 integration tests
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/decision_store.py
          python -m py_compile gold_axis_2026/data_pipeline/decision_store_reader.py
          python -m py_compile gold_axis_2026/data_pipeline/r4_1_decision_adapter.py
          python -m py_compile gold_axis_2026/data_pipeline/r4_1_decision_bridge.py
          python -m py_compile gold_axis_2026/data_pipeline/test_decision_store_schema.py
          python -m py_compile gold_axis_2026/data_pipeline/test_decision_store_writer.py
          python -m py_compile gold_axis_2026/data_pipeline/test_decision_store_reader.py
          python -m py_compile gold_axis_2026/data_pipeline/test_r4_1_decision_adapter.py
          python -m py_compile gold_axis_2026/data_pipeline/test_r4_1_decision_bridge.py
      - name: Execute transactional DDL and rollback smoke
        run: python gold_axis_2026/data_pipeline/test_decision_store_schema.py
      - name: Execute rollback-only writer integration smoke
        run: python gold_axis_2026/data_pipeline/test_decision_store_writer.py
      - name: Execute rollback-only reader evidence-isolation smoke
        run: python gold_axis_2026/data_pipeline/test_decision_store_reader.py
      - name: Execute rollback-only deterministic R4.1 store roundtrip
        run: python gold_axis_2026/data_pipeline/test_r4_1_decision_adapter.py
      - name: Execute rollback-only guarded R4.1 bridge smoke
        run: python gold_axis_2026/data_pipeline/test_r4_1_decision_bridge.py
