name: Gold StakTrakr Four-Metal True Hourly History V38 (research-only)
on:
  push:
    branches:
      - data/gold-staktrakr-2026-fourmetal-hourly-backfill-20261030
      - main
    paths:
      - '.github/workflows/gold-staktrakr-2026-fourmetal-hourly-backfill-v1.yml'
      - 'gold_axis_2026/data_pipeline/staktrakr_fourmetal_hourly_research_backfill_v1.py'
      - 'gold_axis_2026/data_pipeline/test_staktrakr_fourmetal_hourly_research_backfill_v1.py'
  workflow_dispatch:
  schedule:
    # From main only, append completed-day v2 hourly research observations.
    - cron: '20 2 * * *'
permissions:
  contents: read
concurrency:
  group: gold-staktrakr-fourmetal-real-hourly-research
  cancel-in-progress: false
jobs:
  ingest-staktrakr-real-hourly:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python and source integrity invariants
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/staktrakr_fourmetal_hourly_research_backfill_v1.py
          python -m unittest gold_axis_2026/data_pipeline/test_staktrakr_fourmetal_hourly_research_backfill_v1.py -v
      - name: Probe real four-metal hourly files for 27–28 May (no writes)
        run: |
          python gold_axis_2026/data_pipeline/staktrakr_fourmetal_hourly_research_backfill_v1.py \
            --mode probe --start 2026-05-27 --end 2026-05-28 \
            --out staktrakr-hourly-probe-2026-05.json
      - name: Install Postgres client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Require Neon URL
        run: test -n "$NEON_DATABASE_URL"
      - name: Append source-backed hourly bars to separate RESEARCH-ONLY Neon table
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            START="$(date -u -d '15 days ago' +%Y-%m-%d)"
          else
            START="2026-03-25"
          fi
          python gold_axis_2026/data_pipeline/staktrakr_fourmetal_hourly_research_backfill_v1.py \
            --mode apply --start "$START" \
            --out staktrakr-hourly-research-ingest-evidence.json
      - name: Verify stored hourly counts and critical episodes
        run: |
          python - <<'PY'
          import psycopg,os
          with psycopg.connect(os.environ["NEON_DATABASE_URL"],
               options="-c default_transaction_read_only=on") as db:
              with db.cursor() as c:
                  c.execute("""
                     SELECT metal,count(*),min(bar_start_utc),max(bar_start_utc),
                       count(*) FILTER(WHERE bar_start_utc::date='2026-05-27'),
                       count(*) FILTER(WHERE bar_start_utc::date='2026-09-16')
                     FROM gold_weekly_live.staktrakr_fourmetal_hourly_ohlca_research_v1
                     GROUP BY metal ORDER BY metal
                  """)
                  rows=c.fetchall()
          for metal,n,first,last,may,sept in rows:
              print(f"{metal}: {n} bars {first} -> {last}; May27={may}; Sep16={sept}")
              assert n>0 and may>=6 and sept>=6
          assert len(rows)==4
          print("FOUR_METAL_RESEARCH_INGEST_VERIFIED_NOT_FIRSTPRINT")
          PY
      - name: Save source-coverage and write audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staktrakr-fourmetal-hourly-research-backfill-evidence
          path: |
            staktrakr-hourly-probe-2026-05.json
            staktrakr-hourly-research-ingest-evidence.json
          if-no-files-found: warn
          retention-days: 30
