name: Gold August 2026 R5 Release Audit
on:
  push:
    paths:
      - 'projects/gold_h1_r1/run_august_2026_release_audit_r5.py'
      - '.github/workflows/gold_august_2026_r5_release_audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python projects/gold_h1_r1/run_august_2026_release_audit_r5.py
      - name: Commit audit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/gold_h1_r1/AUGUST_2026_R5_RELEASE_AUDIT.csv projects/gold_h1_r1/AUGUST_2026_R5_DAY_BY_DAY.csv projects/gold_h1_r1/AUGUST_2026_R5_RELEASE_AUDIT.md
          git diff --cached --quiet || git commit -m 'Run August 2026 R5 release audit'
          git push
