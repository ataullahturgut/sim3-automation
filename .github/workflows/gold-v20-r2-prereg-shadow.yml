name: Gold V20 R2 pre-registered shadow gate
on:
  push:
    branches: ['research-gold-v20-r2-*']
  pull_request:
    branches: ['research-gold-v20-audit-repair-20261016']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  R2-prereg-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax validation
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --check v20_atlas_r2_shadow.js
          node --check v20_atlas_r2_shadow.test.js
      - name: New R2 contract adversarial tests
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: node --test v20_atlas_r2_shadow.test.js
      - name: Preserve frozen V15-V20 repaired unit invariants
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: npm run test:kavis-research
      - name: Confirm simulation-only research
        run: |
          if grep -E 'loadFullRows|v13_sentez_run|2026_FEB_SEP|function placeOrder' gold_axis_2026/apps/portfolio_guard_v1/v20_atlas_r2_shadow.js; then
            echo "Historical dataset or real trading API unexpectedly linked"
            exit 1
          fi
