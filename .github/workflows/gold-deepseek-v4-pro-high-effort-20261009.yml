name: Gold DeepSeek V4 Pro Scientific One-Shot
on:
  push:
    branches:
      - gold-execution-channel-audit-20261006
    paths:
      - .github/workflows/gold-deepseek-v4-pro-high-effort-20261009.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-deepseek-pro-20261009-single
  cancel-in-progress: false
jobs:
  high-reasoning-referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One provider call only with bounded high reasoning
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/tools/gold_deepseek_v4_pro_high_effort_one_shot_20261009.py
          python gold_axis_2026/tools/gold_deepseek_v4_pro_high_effort_one_shot_20261009.py
      - name: Save safe peer review and billing token receipt
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_DEEPSEEK_V4_PRO_HIGH_EFFORT_RESEARCH_20261009_{REVIEW.md,RESULT.json,FAILURE_QC.json}; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record high-effort one-call DeepSeek Pro external critique without market skill claims'
            for i in 1 2 3; do
              git pull --rebase origin gold-execution-channel-audit-20261006
              if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
