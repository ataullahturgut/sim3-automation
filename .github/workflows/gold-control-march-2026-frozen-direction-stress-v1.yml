name: Gold Control March 2026 Frozen Direction Stress V1
on:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - 'gold_axis_2026/tools/march_2026_frozen_direction_stress_v1.py'
      - '.github/workflows/gold-control-march-2026-frozen-direction-stress-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-control-march-2026-frozen-direction-stress-v1
  cancel-in-progress: false
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: /tmp/frozen/gold_axis_2026:/tmp/frozen/gold_axis_2026/tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: test -n "$NEON_DATABASE_URL"
      - run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'psycopg[binary]>=3.2,<4'
      - name: Materialize pinned authorities
        run: |
          mkdir -p /tmp/frozen/gold_axis_2026/tools /tmp/frozen/gold_axis_2026/regime_dampener_v1
          git show 2926796b6a7e9048d2c091c9c571cb928b773e02:gold_axis_2026/tools/downside_raw_vs_sqrt_har_dr_multiorigin_v1.py > /tmp/frozen/sqrt_auth.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py > /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_data.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_data.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_experts.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_experts.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py
      - name: Compile and assert read-only
        run: |
          python -m py_compile gold_axis_2026/tools/march_2026_frozen_direction_stress_v1.py
          python -m py_compile /tmp/frozen/sqrt_auth.py
          python -m py_compile /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table' gold_axis_2026/tools/march_2026_frozen_direction_stress_v1.py
          grep -n 'default_transaction_read_only' /tmp/frozen/sqrt_auth.py
          grep -n 'default_transaction_read_only' /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py
      - name: Run March 2026 stress reconstruction
        run: |
          rm -rf march_stress_out
          python gold_axis_2026/tools/march_2026_frozen_direction_stress_v1.py             --sqrt /tmp/frozen/sqrt_auth.py             --base /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py             --out march_stress_out
      - name: Freeze result
        run: |
          cp march_stress_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_2026_MARCH_FROZEN_DIRECTION_STRESS_V1_RESULT_2026-09-24.json
          git commit -m 'Freeze March 2026 frozen direction stress V1'
          git push origin HEAD:gold-direction-history-robustness-v1-20260924
