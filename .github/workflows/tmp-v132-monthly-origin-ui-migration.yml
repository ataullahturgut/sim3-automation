name: TMP Gold Control V1.32 Monthly Origin UI Migration

on:
  push:
    branches:
      - gold-control-v132-monthly-origin-contract
    paths:
      - 'gold_axis_2026/tools/patch_v132_monthly_origin_ui.py'
      - '.github/workflows/tmp-v132-monthly-origin-ui-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v132-monthly-origin-contract
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact v1.32 UI migration
        run: |
          set -euo pipefail
          python gold_axis_2026/tools/patch_v132_monthly_origin_ui.py
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq 'EYLÜL 2026 · 31 AĞUSTOS ORIGIN' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq '30 Eylül origin → Ekim 2026' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -Fq '4 Eylül' gold_axis_2026/apps/gold_control_mobile_v1.py
      - name: Commit migrated UI
        run: |
          set -euo pipefail
          git config user.name 'gold-control-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add gold_axis_2026/apps/gold_control_mobile_v1.py
          git diff --cached --quiet && { echo 'no changes'; exit 1; }
          git commit -m 'ui: align September forecast semantics with Aug31 origin contract v1.32'
          git push origin HEAD:gold-control-v132-monthly-origin-contract
