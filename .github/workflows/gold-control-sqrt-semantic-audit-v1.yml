name: Gold Control SQRT Semantic Audit V1

on:
  push:
    branches:
      - gold-sqrt-semantic-audit-v1-20260922
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_SQRT_ALARM_SEMANTIC_AUDIT_V1_PREREG_2026-09-22.md'
      - 'gold_axis_2026/tools/sqrt_semantic_audit_v1_run.py'
      - 'gold_axis_2026/tools/regime_v1_*.py'
      - 'gold_axis_2026/regime_dampener_v1/**'
      - '.github/workflows/gold-control-sqrt-semantic-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-sqrt-semantic-audit-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-sqrt-semantic-audit-v1-20260922
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'psycopg[binary]>=3.2,<4'

      - name: Compile implementation
        run: |
          python -m py_compile gold_axis_2026/tools/regime_v1_data.py
          python -m py_compile gold_axis_2026/tools/regime_v1_router_sqrt.py
          python -m py_compile gold_axis_2026/tools/sqrt_semantic_audit_v1_run.py

      - name: Assert governed DB read-only implementation
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table' gold_axis_2026/tools/regime_v1_*.py gold_axis_2026/tools/sqrt_semantic_audit_v1_run.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/regime_v1_data.py

      - name: Run semantic audit
        run: |
          rm -rf sqrt_semantic_audit_out
          python gold_axis_2026/tools/sqrt_semantic_audit_v1_run.py

      - name: Freeze results
        run: |
          cp sqrt_semantic_audit_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gold_axis_2026/GOLD_CONTROL_SQRT_ALARM_SEMANTIC_AUDIT_V1_LEDGER_2026-09-22.csv \
            gold_axis_2026/GOLD_CONTROL_SQRT_ALARM_SEMANTIC_AUDIT_V1_RESULT_2026-09-22.json \
            gold_axis_2026/GOLD_CONTROL_SQRT_ALARM_SEMANTIC_AUDIT_V1_RESULT_2026-09-22.md
          git commit -m 'Freeze SQRT alarm semantic audit V1 results'
          git push origin HEAD:gold-sqrt-semantic-audit-v1-20260922

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-sqrt-semantic-audit-v1
          retention-days: 30
          if-no-files-found: error
          path: sqrt_semantic_audit_out/
