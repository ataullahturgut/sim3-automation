name: Gold Intramonth BIST Endpoint Discovery

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_intramonth_bist_endpoint_discovery.py'
      - '.github/workflows/gold-intraday-bist-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover BIST metal data endpoint
        run: python gold_axis_2026/tools/gold_intramonth_bist_endpoint_discovery.py
