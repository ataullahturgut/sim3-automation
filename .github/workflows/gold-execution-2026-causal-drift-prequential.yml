name: Gold 2026 Causal Drift Expert First Preregistered Test
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_drift_probe_placeholder_20261008.py
      - .github/workflows/gold-execution-2026-causal-drift-prequential.yml
permissions:
  contents: write
concurrency:
  group: gold-execution-2026-prequential-drift
  cancel-in-progress: false
jobs:
  causal-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Actually evaluate the fixed four drift-aware candidates against HGB across 2023-2026
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_drift_probe_placeholder_20261008.py
          python gold_axis_2026/tools/gold_execution_drift_probe_placeholder_20261008.py
      - name: Preserve private dates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-drift-prereg-private-dated-predictions
          path: gold_axis_2026/GOLD_EXECUTION_2026_PREREG_CAUSAL_EW_CLASSBALANCED_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Commit only aggregate prereg scientific results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2026_PREREG_CAUSAL_EW_CLASSBALANCED_20261008_{YEAR_METRICS.csv,PAIRED.csv,SUMMARY.json}
          git diff --cached --quiet || git commit -m 'Record actual 2023–26 252-day decay and 504d rolling class-balanced expert performance'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
