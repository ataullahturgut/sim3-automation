name: Gold Monthly Boosting E6 2025 Final Holdout V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-boosting-e6-2025-final-holdout-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  boosting-e6:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'scipy>=1.13,<2'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'

      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_e6_2025_final_holdout_v1.py

      - name: Run E6 one-shot 2025 holdout
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_e6_2025_final_holdout_v1.py

      - name: Scientific gate
        run: |
          python - <<'PY'
          import json

          r=json.load(open('gold_monthly_boosting_e6_2025_final_holdout_v1_result.json'))
          c=r['contract']

          assert r['scope']=='BOOSTING_E6_2025_FINAL_HOLDOUT_V1'
          assert c['holdout']=='2025-01..2025-12'
          assert c['holdout_n']==12
          assert c['one_shot'] is True
          assert c['price_role']=='CATBOOST_PRICE'
          assert c['balance_direction_role']=='FULL5_MEDIAN'
          assert c['full5_components']==[
              'CATBOOST_PRICE','CATBOOST_BALANCED','GBRT','LIGHTGBM','XGB_DIRECTION'
          ]
          assert c['post_holdout_tuning']=='PROHIBITED'
          assert c['model_reselection']=='PROHIBITED'
          assert c['random_split']=='NONE'
          assert c['database']=='READ_ONLY'
          assert c['2026_role']=='QUARANTINED_NOT_USED'
          assert r['authority_invariants_before']==r['authority_invariants_after']

          assert r['PRICE']['model']=='CATBOOST_PRICE'
          assert r['BALANCE_DIRECTION']['model']=='FULL5_MEDIAN'
          assert r['PRICE']['metrics']['n']==12
          assert r['BALANCE_DIRECTION']['metrics']['n']==12
          assert len(r['PRICE']['rows'])==12
          assert len(r['BALANCE_DIRECTION']['rows'])==12

          p_targets=[x['target'] for x in r['PRICE']['rows']]
          b_targets=[x['target'] for x in r['BALANCE_DIRECTION']['rows']]
          expected=[f'2025-{m:02d}' for m in range(1,13)]
          assert p_targets==expected
          assert b_targets==expected

          for row in r['PRICE']['rows']:
              assert row['origin'] < row['target']
          for row in r['BALANCE_DIRECTION']['rows']:
              assert row['origin'] < row['target']
              assert set(row['component_forecasts'])==set(c['full5_components'])

          print('BOOSTING_E6_2025_FINAL_HOLDOUT_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-e6-2025-final-holdout-v1
          path: |
            gold_monthly_boosting_e6_2025_final_holdout_v1_result.json
            gold_axis_2026/GOLD_MONTHLY_BOOSTING_E6_2025_FINAL_HOLDOUT_RESULT_2026-09-28.md
          if-no-files-found: error

      - name: Commit final holdout report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_MONTHLY_BOOSTING_E6_2025_FINAL_HOLDOUT_RESULT_2026-09-28.md
          if git diff --cached --quiet; then
            echo "No holdout report change to commit"
          else
            git commit -m "Record Boosting E6 2025 final holdout result"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
