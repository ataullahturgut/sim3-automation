name: Gold Monthly RBFNN N1.3 Batch1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_rbfnn_n13_batch1_v1.py
      - .github/workflows/gold-monthly-rbfnn-n13-batch1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary] scikit-learn
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_rbfnn_n13_batch1_v1.py
      - name: Run RBFNN hybrid batch 1
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_rbfnn_n13_batch1_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-rbfnn-n13-batch1
          path: vw_midas_rbfnn_n13_batch1_result.json
          if-no-files-found: error
