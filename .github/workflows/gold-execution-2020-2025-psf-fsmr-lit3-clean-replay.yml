name: Gold Existing PSF FSMR LIT3 Source Corrected Replay 2020-2025
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2020_2025_psf_fsmr_lit3_clean_replay_20261008.py'
      - '.github/workflows/gold-execution-2020-2025-psf-fsmr-lit3-clean-replay.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-psf-fsmr-lit3-accepted-source-v1
  cancel-in-progress: false
jobs:
  backtest-original-stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Chronological source-true full PSF minus incomplete macro, FSMR and LIT3 price-only specs
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2020_2025_psf_fsmr_lit3_clean_replay_20261008.py
          python gold_axis_2026/tools/gold_execution_2020_2025_psf_fsmr_lit3_clean_replay_20261008.py
      - name: Keep dated research forecasts as limited-retention job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-psf-fsmr-lit3-original-model-date-source-retarget-predictions
          path: gold_axis_2026/GOLD_EXECUTION_2020_2025_EXISTING_PSF_FSMR_LIT3_SOURCE_REPLAY_20261008_PREDICTIONS.csv
          if-no-files-found: warn
      - name: Commit science summary and grouped metrics
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2020_2025_EXISTING_PSF_FSMR_LIT3_SOURCE_REPLAY_20261008_SUMMARY.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_EXISTING_PSF_FSMR_LIT3_SOURCE_REPLAY_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_EXISTING_PSF_FSMR_LIT3_SOURCE_REPLAY_20261008_METRICS.csv
          git diff --cached --quiet || git commit -m 'Record original 2020-25 source-true PSF FSMR and LIT3 specialists with exact holdout and weekday/weekend metrics'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
