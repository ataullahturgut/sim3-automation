name: Gold Execution Long History LIT Matched Comparison
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_long_history_lit_same_date_20261008.py'
      - '.github/workflows/gold-execution-long-history-lit-20261008.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-long-history-lit-20261008
  cancel-in-progress: false
jobs:
  match-and-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical libraries
        run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.12,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Run frozen-target matched history experiment
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_long_history_lit_same_date_20261008.py
          python gold_axis_2026/tools/gold_execution_long_history_lit_same_date_20261008.py
      - name: Save evaluation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-execution-long-history-lit-20261008
          retention-days: 30
          if-no-files-found: warn
          path: |
            gold_axis_2026/GOLD_EXECUTION_LONG_HISTORY_LIT_RESULT_2026-10-08.md
            gold_axis_2026/GOLD_EXECUTION_LONG_HISTORY_LIT_SUMMARY_2026-10-08.json
            gold_axis_2026/GOLD_EXECUTION_LONG_HISTORY_LIT_METRICS_2026-10-08.csv
      - name: Commit model evaluation only if actually completed
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_LONG_HISTORY_LIT_*
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual matched LIT 2020 vs 2022 training-history results'
          git fetch origin gold-execution-channel-audit-20261006
          git rebase origin/gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
