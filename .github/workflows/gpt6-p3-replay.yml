name: GPT6 P3 HAR macro rolling replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gold_axis_2026/GOLD_GPT6_P3_*"
      - "gold_axis_2026/tools/gold_gpt6_p3_replay.py"
      - ".github/workflows/gpt6-p3-replay.yml"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.24,<3"
      - run: python gold_axis_2026/tools/gold_gpt6_p3_replay.py
