name: Gold Monthly Metal Prehistory V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_metal_prehistory_v1.py
      - .github/workflows/gold-monthly-metal-prehistory-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev-snapshot.zip
          unzip -q dev-snapshot.zip -d dev_snapshot
      - name: Build prehistory
        run: |
          python gold_axis_2026/tools/gold_monthly_metal_prehistory_v1.py             --snapshot dev_snapshot/gold_monthly_dev_snapshot_v1.json             --output gold_monthly_metal_prehistory_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-metal-prehistory-v1-${{ github.sha }}
          path: gold_monthly_metal_prehistory_v1.json
          if-no-files-found: error
          retention-days: 90
