name: Gold 2026 Three-Event Competing First Passage Geometric Analog
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_threeway_firstpassage_cbr_20261008.py
      - .github/workflows/gold-execution-2026-threeway-firstpassage-cbr.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-threeway-firstpassage-pathmemory
  cancel-in-progress: false
jobs:
  competing:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Score genuinely different triple first-passage event objective without logistic and HGB
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_threeway_firstpassage_cbr_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_threeway_firstpassage_cbr_20261008.py
      - name: Preserve private event probabilities and dates in Actions only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-threeway-firstpassage-private-dated
          path: gold_axis_2026/GOLD_EXECUTION_2026_THREE_WAY_FIRSTPASSAGE_CBR_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Commit model score or explicit source failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_THREE_WAY_FIRSTPASSAGE_CBR_20261008_{SUMMARY.json,METRICS.csv,FAILURE_QC.json,LASTYEAR_MONTHBLOCK.csv}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Record genuine nonparametric XAU first-passage competing three-event forecasting calibration on 2023-26'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
