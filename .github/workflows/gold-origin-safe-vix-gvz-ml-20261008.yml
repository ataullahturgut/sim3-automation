name: Gold Origin Safe VIX GVZ Divergence Direction Challenge
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_origin_safe_vix_gvz_ml_challenge_20261008.py'
      - '.github/workflows/gold-origin-safe-vix-gvz-ml-20261008.yml'
permissions:
  contents: write
concurrency:
  group: gold-origin-safe-20261008-vix-gvz-direction
  cancel-in-progress: false
jobs:
  vix-gvz-challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Confirm source-safe runner compiles and fit previous-day Cboe VIX GVZ divergence models
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_origin_safe_vix_gvz_ml_challenge_20261008.py
          python gold_axis_2026/tools/gold_execution_origin_safe_vix_gvz_ml_challenge_20261008.py
      - name: Keep dated predictions private
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-origin-safe-vix-gvz-private-predictions
          path: gold_axis_2026/GOLD_EXECUTION_ORIGIN_SAFE_VIX_GVZ_ML_CHALLENGE_20261008_DATED_PREDICTIONS_PRIVATE.csv
          if-no-files-found: warn
      - name: Save only aggregate rates research evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_ORIGIN_SAFE_VIX_GVZ_ML_CHALLENGE_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_ORIGIN_SAFE_VIX_GVZ_ML_CHALLENGE_20261008_METRICS.csv
          git add gold_axis_2026/GOLD_EXECUTION_ORIGIN_SAFE_VIX_GVZ_ML_CHALLENGE_20261008_PAIRED_AUDIT.csv
          git diff --cached --quiet || git commit -m 'Record causal-time aligned VIX GVZ risk divergence model comparison'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
