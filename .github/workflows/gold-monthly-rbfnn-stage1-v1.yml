name: Gold Monthly RBFNN Stage 1 V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_rbfnn_stage1_v1.py
      - .github/workflows/gold-monthly-rbfnn-stage1-v1.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  batch1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        method: [PSO, GA, DE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary] scikit-learn
      - name: Run governed RBFNN
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_rbfnn_stage1_v1.py --method ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbfnn-stage1-${{ matrix.method }}
          path: rbfnn_stage1_*_result.json
          if-no-files-found: error
  batch2:
    needs: batch1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
