name: Gold Control Direction Error Anatomy Audit V1

on:
  push:
    branches:
      - gold-direction-error-anatomy-v1-20260923
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_ERROR_ANATOMY_AUDIT_V1_PREREG_2026-09-23.md'
      - 'gold_axis_2026/tools/direction_error_anatomy_audit_v1.py'
      - '.github/workflows/gold-control-direction-error-anatomy-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-error-anatomy-v1-20260923
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize frozen artifacts
        run: |
          git show eb928b2d5be6250227d8e14dea2d58abe494f762:gold_axis_2026/GOLD_CONTROL_RESIDUAL_ONE_SIDED_UP2_LOGIT_V1_LEDGER_2026-09-23.csv > /tmp/up2.csv
          git show cee7fadff9490a667716520ed0c9479932e5c41e:gold_axis_2026/GOLD_CONTROL_RESIDUAL_TRAJECTORY_REBOUND_UP2_V1_LEDGER_2026-09-23.csv > /tmp/morph.csv
          git show 2926796b6a7e9048d2c091c9c571cb928b773e02:gold_axis_2026/GOLD_CONTROL_DOWNSIDE_RAW_VS_SQRT_HAR_DR_MULTIORIGIN_V1_FORECASTS_2026-09-22.csv > /tmp/parent.csv

      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/direction_error_anatomy_audit_v1.py

      - name: Run audit
        run: |
          rm -rf anatomy_out
          python gold_axis_2026/tools/direction_error_anatomy_audit_v1.py \
            --up2 /tmp/up2.csv \
            --morph /tmp/morph.csv \
            --parent /tmp/parent.csv \
            --out anatomy_out

      - name: Freeze result
        run: |
          cp anatomy_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_ERROR_ANATOMY_AUDIT_V1_RESULT_2026-09-23.*
          git commit -m 'Freeze direction error anatomy audit V1'
          git push origin HEAD:gold-direction-error-anatomy-v1-20260923

      - uses: actions/upload-artifact@v4
        with:
          name: gold-control-direction-error-anatomy-audit-v1
          path: anatomy_out/
          retention-days: 30