name: Gold Monthly ANFIS Stage 1.1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_anfis_meta_screen_v1.py
      - .github/workflows/gold-monthly-anfis-stage11.yml
permissions:
  contents: read
jobs:
  hybrid:
    strategy:
      fail-fast: false
      matrix:
        method: [PSO, GA, DE]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary] scikit-learn scipy
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_anfis_meta_screen_v1.py
      - name: Run hybrid
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_anfis_meta_screen_v1.py --method ${{ matrix.method }}
      - name: Gate
        run: python -c "import json,glob; p=glob.glob('anfis_hybrid_*_result.json')[0]; r=json.load(open(p)); assert len(r['dev']['rows'])==33 and len(r['transport_2025']['rows'])==12 and len(r['stress_2026']['rows'])==7 and r['authority']['random_split']=='NONE'; print('OUTPUT_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: anfis-stage11-${{ matrix.method }}
          path: anfis_hybrid_*_result.json
          if-no-files-found: error
