name: Gold 2026 Frozen PRAMV Reversal Impulse Source-only Substudy
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_pramv_frozen_rfr_price_check_20261008.py
      - .github/workflows/gold-execution-2026-pramv-frozen-price-substudy.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-pramv-frozen-price-substudy
  cancel-in-progress: false
jobs:
  verify-original-price-pattern:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Score frozen old RFR sign mechanism using native 2026 BID 15min prices, no fabricated macro gate
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_pramv_frozen_rfr_price_check_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_pramv_frozen_rfr_price_check_20261008.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-pramv2026-rfr-frozen-private-observations
          path: gold_axis_2026/GOLD_EXECUTION_2026_FROZEN_RFR_PRICE_ONLY_CHECK_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Report actual precursor score or source failure
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_FROZEN_RFR_PRICE_ONLY_CHECK_20261008_{SUMMARY.json,METRICS.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Source-audit and score frozen PRAMV price reversal subrule 2023-26 without non-PIT macro assumptions'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
