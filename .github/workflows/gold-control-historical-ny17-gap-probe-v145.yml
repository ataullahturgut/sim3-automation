name: Gold Control V1.45 historical NY17 exact-date probe

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Prior immutable probe run containing the full candidate set'
        required: true
        default: '34286901329'
        type: string
      only_date:
        description: 'Single unresolved trade date to retry'
        required: true
        default: '2025-05-13'
        type: string
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - .github/workflows/gold-control-historical-ny17-gap-probe-v145.yml

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      RESUME_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id || '34286901329' }}
      ONLY_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.only_date || '2025-05-13' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify secret
        run: test -n "$TWELVE_DATA_API_KEY"
      - name: Run unit tests for retry and CSV union
        run: python gold_axis_2026/tests/test_probe_historical_ny17_gaps_v145.py
      - name: Download prior immutable full probe artifact
        run: |
          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name historical-ny17-exact-date-probe-v145 \
            --dir prior-probe
          test -s prior-probe/historical_ny17_exact_date_probe_v145.json
      - name: Retry only the unresolved date and merge fail-closed
        run: |
          python gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py \
            --resume-json prior-probe/historical_ny17_exact_date_probe_v145.json \
            --only-date "$ONLY_DATE" \
            --pacing-seconds 0 \
            --out-json historical_ny17_exact_date_probe_v145.json \
            --out-csv historical_ny17_exact_date_probe_v145.csv
      - name: Require complete final adjudication
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p=json.load(open('historical_ny17_exact_date_probe_v145.json',encoding='utf-8'))
          counts=Counter(r['acquisition_status'] for r in p['rows'])
          assert p['row_count']==684==len(p['rows']), (p['row_count'],len(p['rows']))
          assert set(counts) <= {'VALID_EXACT_BAR','PROVIDER_NO_BAR'}, counts
          assert counts['VALID_EXACT_BAR'] + counts['PROVIDER_NO_BAR'] == 684, counts
          print({'row_count':684,'status_counts':dict(counts),'final_adjudication':'PASS'})
          PY
      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ny17-exact-date-probe-v145
          if-no-files-found: error
          path: |
            historical_ny17_exact_date_probe_v145.json
            historical_ny17_exact_date_probe_v145.csv
