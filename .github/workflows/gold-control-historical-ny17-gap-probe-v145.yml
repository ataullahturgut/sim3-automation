name: Gold Control V1.45 historical NY17 exact-date probe

on:
  workflow_dispatch:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - .github/workflows/gold-control-historical-ny17-gap-probe-v145.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify secret
        run: test -n "$TWELVE_DATA_API_KEY"
      - name: Run fail-closed exact-date probe
        run: |
          python gold_axis_2026/tools/probe_historical_ny17_gaps_v145.py \
            --pacing-seconds 8.5 \
            --out-json historical_ny17_exact_date_probe_v145.json \
            --out-csv historical_ny17_exact_date_probe_v145.csv
      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ny17-exact-date-probe-v145
          if-no-files-found: error
          path: |
            historical_ny17_exact_date_probe_v145.json
            historical_ny17_exact_date_probe_v145.csv
