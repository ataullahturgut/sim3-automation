name: Cash Gold Strategy Jan 2026 Research

on:
  push:
    branches: [research-gold-cash-gold-strategy-20261015]
    paths:
      - gold_axis_2026/adaptive_volatility_learning/strategy/**
      - .github/workflows/gold-cash-gold-strategy-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Price and chronology unit tests
        run: python -m unittest discover -s gold_axis_2026/adaptive_volatility_learning/strategy -p 'test_*.py' -v
      - name: Costed strategy training and untouched-year checks
        run: |
          python gold_axis_2026/adaptive_volatility_learning/strategy/cash_gold_policy.py \
            --data gold_axis_2026/adaptive_volatility_learning/strategy/ASOF_3H_XAU_CHECKPOINTS_2023_JAN2026.csv \
            --events gold_axis_2026/adaptive_volatility_learning/strategy/MACRO_RELEASE_CLOCKS_RESEARCH.csv \
            --output strategy_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: costed-cash-gold-jan2026-research
          path: strategy_result.json
          retention-days: 30
