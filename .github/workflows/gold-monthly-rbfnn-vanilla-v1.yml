name: Gold Monthly RBFNN Vanilla V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_rbfnn_vanilla_v1.py
      - .github/workflows/gold-monthly-rbfnn-vanilla-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary] scikit-learn
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_rbfnn_vanilla_v1.py
      - name: Run canonical vanilla RBFNN
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_rbfnn_vanilla_v1.py
      - name: Scientific gate
        run: python -c "import json,math; r=json.load(open('vw_midas_rbfnn_vanilla_v1_result.json')); z=r['dev']['rows']+r['transport_2025']['rows']+r['stress_2026']['rows']; assert len(z)==52 and all(math.isfinite(x['forecast']) and abs(x['pred_log_return_gold'])<1 for x in z); print('SCIENTIFIC_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-rbfnn-vanilla-v1
          path: vw_midas_rbfnn_vanilla_v1_result.json
          if-no-files-found: error
