name: Gold Monthly ChHHO EFG Alarm Audit V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_efg_alarm_audit_v1.py
      - .github/workflows/gold-monthly-chhho-efg-alarm-audit-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'openpyxl>=3.1,<4'
      - name: Download frozen project authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/snapshot inputs/public inputs/chhho inputs/vix
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > snapshot.zip
          unzip -q snapshot.zip -d inputs/snapshot
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11015874673/zip" > public.zip
          unzip -q public.zip -d inputs/public
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10989389723/zip" > chhho.zip
          unzip -q chhho.zip -d inputs/chhho
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11042740289/zip" > vix.zip
          unzip -q vix.zip -d inputs/vix
          find inputs -maxdepth 2 -type f -print
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_efg_alarm_audit_v1.py
      - name: Run EFG alarm audit
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_efg_alarm_audit_v1.py             --snapshot inputs/snapshot/gold_monthly_dev_snapshot_v1.json             --public-bundle inputs/public/gold_monthly_public_current_bundle_v1.json             --chhho inputs/chhho/anfis_stage3c_chhho_result.json             --vix-transport inputs/vix/GOLD_MONTHLY_CHHHO_VIX_R1_FROZEN_TRANSPORT_2025_2026_2026-09-29.json             --output GOLD_MONTHLY_CHHHO_EFG_ALARM_AUDIT_V1_2026-09-29.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-efg-alarm-audit-${{ github.sha }}
          path: |
            GOLD_MONTHLY_CHHHO_EFG_ALARM_AUDIT_V1_2026-09-29.json
            wgc_gold_etf_flows.xlsx
          if-no-files-found: warn
          retention-days: 90
