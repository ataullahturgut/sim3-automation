name: Gold Monthly ChHHO F2 Representation V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_f2_representation_v1.py
      - gold_axis_2026/tools/gold_monthly_chhho_f2_summarize_v1.py
      - .github/workflows/gold-monthly-chhho-f2-representation-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  representation:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
          - CURRENT8
          - MR3_ALL
          - MR6_ALL
          - RV_ALL
          - RANGE_ALL
          - ABSRET_ALL
          - GOLD_MR3
          - SILVER_MR3
          - PLATINUM_MR3
          - PALLADIUM_MR3
          - GOLD_MR6
          - SILVER_MR6
          - PLATINUM_MR6
          - PALLADIUM_MR6
          - GOLD_RV
          - SILVER_RV
          - PLATINUM_RV
          - PALLADIUM_RV
          - GOLD_RANGE
          - SILVER_RANGE
          - PLATINUM_RANGE
          - PALLADIUM_RANGE
          - GOLD_ABSRET
          - SILVER_ABSRET
          - PLATINUM_ABSRET
          - PALLADIUM_ABSRET
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev-snapshot.zip
          unzip -q dev-snapshot.zip -d dev_snapshot
          test -s dev_snapshot/gold_monthly_dev_snapshot_v1.json
      - name: Download governed 2009 metal prehistory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11020520415/zip" > prehistory.zip
          unzip -q prehistory.zip -d prehistory
          test -s prehistory/gold_monthly_metal_prehistory_v1.json
      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_f2_representation_v1.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_f2_summarize_v1.py
      - name: Run F2 representation
        run: >
          python gold_axis_2026/tools/gold_monthly_chhho_f2_representation_v1.py
          --snapshot dev_snapshot/gold_monthly_dev_snapshot_v1.json
          --prehistory prehistory/gold_monthly_metal_prehistory_v1.json
          --variant "${{ matrix.variant }}"
          --output "chhho_f2_${{ matrix.variant }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: chhho-f2-${{ matrix.variant }}-${{ github.sha }}
          path: chhho_f2_${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 90

  summarize:
    needs: representation
    if: always() && needs.representation.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: chhho-f2-*-${{ github.sha }}
          path: f2_results
          merge-multiple: true
      - name: Summarize paired representation audit
        run: >
          python gold_axis_2026/tools/gold_monthly_chhho_f2_summarize_v1.py
          --dir f2_results
          --output GOLD_MONTHLY_CHHHO_F2_REPRESENTATION_RESULT_2026-09-29.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-f2-summary-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_F2_REPRESENTATION_RESULT_2026-09-29.json
          if-no-files-found: error
          retention-days: 90
