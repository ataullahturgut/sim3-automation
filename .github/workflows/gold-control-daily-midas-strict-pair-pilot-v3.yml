name: Gold Control Daily MIDAS Strict Pair Pilot V3
on:
  workflow_dispatch:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - gold_axis_2026/tools/daily_midas_strict_pair_pilot_v3.py
      - .github/workflows/gold-control-daily-midas-strict-pair-pilot-v3.yml

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require DB
        run: test -n "$NEON_DATABASE_URL"
      - name: Install
        run: python -m pip install "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.5.2" "psycopg[binary]>=3.2,<4"
      - name: Run
        working-directory: gold_axis_2026/tools
        run: python daily_midas_strict_pair_pilot_v3.py --out ../../GOLD_CONTROL_DAILY_MIDAS_STRICT_PAIR_PILOT_V3_RESULT_2026-09-25.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-daily-midas-strict-pair-pilot-v3
          path: GOLD_CONTROL_DAILY_MIDAS_STRICT_PAIR_PILOT_V3_RESULT_2026-09-25.json
