name: Gold Nextday Direction Hourly Lag V2

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_nextday_direction_hourly_lag_v2.py'
      - '.github/workflows/gold-nextday-direction-hourly-lag-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OUT_DIR: gold_nextday_hourly_lag_v2_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Run hourly lag V2
        run: python gold_axis_2026/tools/gold_nextday_direction_hourly_lag_v2.py
      - name: Commit evidence
        run: |
          cp "$OUT_DIR/HOURLY_LAG_V2_RESULT.md" gold_axis_2026/GOLD_NEXTDAY_DIRECTION_HOURLY_LAG_V2_RESULT_2026-10-02.md
          cp "$OUT_DIR/hourly_lag_v2_result.json" gold_axis_2026/GOLD_NEXTDAY_DIRECTION_HOURLY_LAG_V2_RESULT_2026-10-02.json
          cp "$OUT_DIR/hourly_lag_v2_metrics.csv" gold_axis_2026/GOLD_NEXTDAY_DIRECTION_HOURLY_LAG_V2_METRICS_2026-10-02.csv
          cp "$OUT_DIR/hourly_lag_v2_fitlog.csv" gold_axis_2026/GOLD_NEXTDAY_DIRECTION_HOURLY_LAG_V2_FITLOG_2026-10-02.csv
          cp "$OUT_DIR/hourly_lag_v2_coefficients.csv" gold_axis_2026/GOLD_NEXTDAY_DIRECTION_HOURLY_LAG_V2_COEFFICIENTS_2026-10-02.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_NEXTDAY_DIRECTION_HOURLY_LAG_V2_*_2026-10-02.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record hourly lag V2 next-day results"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-nextday-direction-hourly-lag-v2
          path: gold_nextday_hourly_lag_v2_out/
          if-no-files-found: warn
          retention-days: 90
