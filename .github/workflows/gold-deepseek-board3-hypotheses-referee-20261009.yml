name: Gold R3 Board Three Author Hypotheses Adversarial Referee
on:
  push:
    branches:
      - gold-execution-channel-audit-20261006
    paths:
      - .github/workflows/gold-deepseek-board3-hypotheses-referee-20261009.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-deepseek-board3-referee-once
  cancel-in-progress: false
jobs:
  review-three-preregistered-scientific-mechanisms:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Two-round hostile peer review of original preregistered hypotheses
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/tools/gold_deepseek_board3_formulated_hypotheses_referee_20261009.py
          python gold_axis_2026/tools/gold_deepseek_board3_formulated_hypotheses_referee_20261009.py --mode research
      - name: Persist aggregate-only review and provider token receipt
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_DEEPSEEK_BOARD3_HYPOTHESES_REFEREE_20261009_{REVIEW.md,RESULT.json,FAILURE_QC.json}; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record DeepSeek scientific refutation of three author-defined XAU hypotheses'
            for i in 1 2 3; do
              git pull --rebase origin gold-execution-channel-audit-20261006
              if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
