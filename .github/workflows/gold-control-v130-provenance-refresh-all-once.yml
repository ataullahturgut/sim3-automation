name: Gold Control V1.30 Provenance Refresh All Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-v130-provenance-refresh-all-once.yml'

permissions:
  contents: read

jobs:
  core-daily:
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-neon-ingest.yml@gold-r4-direction-engine
    with:
      mode: daily
    secrets: inherit

  fred-indices:
    needs: core-daily
    if: needs.core-daily.result == 'success'
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-fred-indices.yml@gold-r4-direction-engine
    with:
      mode: daily
    secrets: inherit

  twelve-market:
    needs: fred-indices
    if: needs.fred-indices.result == 'success'
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-twelve-market.yml@gold-r4-direction-engine
    secrets: inherit

  xau-ny17:
    needs: twelve-market
    if: needs.twelve-market.result == 'success'
    uses: ataullahturgut/sim3-automation/.github/workflows/gold-data-xau-ny17.yml@gold-r4-direction-engine
    secrets: inherit
