name: Gold Control Successor Twelve History Depth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-successor-twelve-history-depth.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Audit NY17 historical depth and interval compatibility
        run: python gold_axis_2026/tools/audit_successor_twelve_history_depth.py
