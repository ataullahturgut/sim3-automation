name: Gold R4 FX2 Independent Hostile Pre-result Review
on:
  push:
    branches:
      - gold-execution-channel-audit-20261006
    paths:
      - .github/workflows/gold-deepseek-r4-fx2-preresult-hostile-20261009.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-r4-deepseek-fx2-single-referee
  cancel-in-progress: false
jobs:
  referee-signed-fx-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hostile methodological review before FX study outcome available
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/tools/gold_deepseek_fx_pair_pre_result_hostile_referee_20261009.py
          python gold_axis_2026/tools/gold_deepseek_fx_pair_pre_result_hostile_referee_20261009.py
      - name: Save only safe aggregate research opinion and usage
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_DEEPSEEK_FX2_HOSTILE_PRERESULT_REVIEW_20261009_{REVIEW.md,RESULT.json,FAILURE_QC.json}; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record scientific counter-review on FX cross-signal without raw market rows'
            for i in 1 2 3; do
              git pull --rebase origin gold-execution-channel-audit-20261006
              if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
