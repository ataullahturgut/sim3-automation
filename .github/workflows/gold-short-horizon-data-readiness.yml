name: Gold Short Horizon Data Readiness Audit

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_data_readiness_audit.py'
      - '.github/workflows/gold-short-horizon-data-readiness.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run short-horizon readiness audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: short_horizon_readiness_out
        run: python gold_axis_2026/tools/gold_short_horizon_data_readiness_audit.py
      - name: Upload readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-data-readiness
          path: short_horizon_readiness_out/
          retention-days: 90
