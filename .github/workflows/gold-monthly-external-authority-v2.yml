name: Gold Monthly External Authority V2

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_external_authority_v2.py
      - .github/workflows/gold-monthly-external-authority-v2.yml

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download V1 external store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11018030682/zip" > external-v1.zip
          unzip -q external-v1.zip -d external_v1
          test -s external_v1/gold_monthly_direct_external_store_v1.json
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_external_authority_v2.py
      - name: Build V2 authority store
        run: |
          python gold_axis_2026/tools/gold_monthly_external_authority_v2.py             --v1-store external_v1/gold_monthly_direct_external_store_v1.json             --output gold_monthly_external_authority_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-external-authority-v2-${{ github.sha }}
          path: gold_monthly_external_authority_v2.json
          if-no-files-found: error
          retention-days: 90
