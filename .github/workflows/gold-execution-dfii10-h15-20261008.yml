name: Gold Execution DFII10 Free Federal Reserve H15
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_dfii10_official_h15_20261008.py'
      - '.github/workflows/gold-execution-dfii10-h15-20261008.yml'
permissions:
  contents: write
jobs:
  h15:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - run: python gold_axis_2026/tools/gold_execution_dfii10_official_h15_20261008.py
      - name: Save public Fed records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_DFII10_FED_H15_BACKFILL_2026-10-08.json
          git add -f gold_axis_2026/GOLD_EXECUTION_DFII10_FREE_CANDIDATE_2020_20261007.csv
          git diff --cached --quiet || git commit -m 'Record official 10 year real rates'
          git pull --rebase origin gold-execution-channel-audit-20261006
          git push origin HEAD:gold-execution-channel-audit-20261006
