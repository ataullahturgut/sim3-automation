name: Gold MIDAS Target Lane Isolation V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_target_lane_isolation_v1.py
      - .github/workflows/gold-midas-target-lane-isolation-v1.yml

permissions:
  contents: read

jobs:
  lane-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_target_lane_isolation_v1.py
      - name: Run lane isolation
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_target_lane_isolation_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_target_lane_isolation_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['model_specs']=='FROZEN_FROM_PREVIOUS_PRE2025_SELECTION_NO_RETUNING'
          print('OUTPUT_GATE=PASS')
          print(json.dumps(r['comparison'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-target-lane-isolation-v1-${{ github.sha }}
          path: vw_midas_target_lane_isolation_v1_result.json
          retention-days: 30
