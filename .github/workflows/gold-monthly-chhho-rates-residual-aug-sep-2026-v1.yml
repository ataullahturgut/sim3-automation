name: Gold Monthly ChHHO Rates Residual Aug Sep 2026 V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_rates_residual_aug_sep_2026_v1.py
      - .github/workflows/gold-monthly-chhho-rates-residual-aug-sep-2026-v1.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Download frozen ChHHO authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/chhho
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10989389723/zip" > chhho.zip
          unzip -q chhho.zip -d inputs/chhho
          test -s inputs/chhho/anfis_stage3c_chhho_result.json
      - name: Compile
        run: |
          python -m py_compile \
            gold_axis_2026/tools/gold_monthly_external_driver_residual_v1.py \
            gold_axis_2026/tools/gold_monthly_external_pit_residual_v1.py \
            gold_axis_2026/tools/vw_midas_anfis_stage3c_literature_v1.py \
            gold_axis_2026/tools/gold_monthly_chhho_rates_residual_aug_sep_2026_v1.py
      - name: Run August September report
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_rates_residual_aug_sep_2026_v1.py \
            --chhho-authority inputs/chhho/anfis_stage3c_chhho_result.json \
            --pit gold_axis_2026/data/GOLD_MONTHLY_EXTERNAL_PIT_COMPACT_V1_2026-09-28.json \
            --extension gold_axis_2026/data/GOLD_MONTHLY_PIT_RATES_2026_EXTENSION_V1_2026-09-29.json \
            --output GOLD_MONTHLY_CHHHO_RATES_RESIDUAL_AUG_SEP_2026_2026-09-29.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-rates-residual-aug-sep-2026-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_RATES_RESIDUAL_AUG_SEP_2026_2026-09-29.json
          if-no-files-found: error
          retention-days: 90
