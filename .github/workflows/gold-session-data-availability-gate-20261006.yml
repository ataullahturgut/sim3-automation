name: Gold Session Data Availability Gate 20261006
on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_data_availability_gate_20261006.py'
      - '.github/workflows/gold-session-data-availability-gate-20261006.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'requests>=2.31,<3'
      - run: python gold_axis_2026/tools/gold_session_data_availability_gate_20261006.py
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/DATA_AVAILABILITY_GATE_OUT/summary.json gold_axis_2026/GOLD_SESSION_DATA_AVAILABILITY_GATE_2026-10-06.json
          git add gold_axis_2026/GOLD_SESSION_DATA_AVAILABILITY_GATE_2026-10-06.json
          if ! git diff --cached --quiet; then
            git commit -m "Record session data availability gate"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
