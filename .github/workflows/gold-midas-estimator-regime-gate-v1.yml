name: Gold MIDAS Estimator Regime Gate V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_estimator_regime_gate_v1.py
      - .github/workflows/gold-midas-estimator-regime-gate-v1.yml

permissions:
  contents: read

jobs:
  regime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_estimator_regime_gate_v1.py
      - name: Run regime gate diagnostic
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_estimator_regime_gate_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_estimator_regime_gate_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['2025_role']=='LOCKED_TRANSPORT_NOT_GATE_TUNING'
          assert r['authority']['2026_role']=='RETROSPECTIVE_STRESS_NOT_GATE_TUNING'
          print('OUTPUT_GATE=PASS')
          print(json.dumps({'gate':r['gate'],'summary':r['summary']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-estimator-regime-gate-v1-${{ github.sha }}
          path: |
            vw_midas_estimator_regime_gate_v1_result.json
            vw_midas_estimator_regime_gate_v1_monthly.csv
          retention-days: 30
