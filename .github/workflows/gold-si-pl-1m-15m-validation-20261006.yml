name: Gold SI PL 1m 15m Validation 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_si_pl_1m_15m_validation_20261006.py'
      - '.github/workflows/gold-si-pl-1m-15m-validation-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'databento>=0.60,<1'
      - name: Require Databento key
        run: test -n "$DATABENTO_API_KEY"
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_si_pl_1m_15m_validation_20261006.py
      - name: Fetch and validate
        run: python gold_axis_2026/tools/gold_si_pl_1m_15m_validation_20261006.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/preflight_cost.json gold_axis_2026/GOLD_SI_PL_1M_15M_PREFLIGHT_COST_2026-10-06.json
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/summary.json gold_axis_2026/GOLD_SI_PL_1M_15M_VALIDATION_SUMMARY_2026-10-06.json
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/cross_resolution_audit.csv gold_axis_2026/GOLD_SI_PL_1M_15M_CROSS_RESOLUTION_AUDIT_2026-10-06.csv
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/coverage_15m.csv gold_axis_2026/GOLD_SI_PL_15M_COVERAGE_2022_2024.csv
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/manual_samples.csv gold_axis_2026/GOLD_SI_PL_1M_15M_MANUAL_SAMPLES_2026-10-06.csv
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/databento_si_pl_ohlcv1m_n0_2022_2024.csv.gz gold_axis_2026/GOLD_DATABENTO_SI_PL_OHLCV1M_N0_RAW_2022_2024.csv.gz
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/databento_si_pl_ohlcv15m_from1m_n0_2022_2024.csv.gz gold_axis_2026/GOLD_DATABENTO_SI_PL_OHLCV15M_N0_DERIVED_2022_2024.csv.gz
          cp gold_axis_2026/DATABENTO_SI_PL_1M_15M_VALIDATION_OUT/databento_si_pl_native_ohlcv1h_n0_2022_2024.csv.gz gold_axis_2026/GOLD_DATABENTO_SI_PL_NATIVE_OHLCV1H_N0_2022_2024.csv.gz
          git add gold_axis_2026/GOLD_SI_PL_* gold_axis_2026/GOLD_DATABENTO_SI_PL_*
          if ! git diff --cached --quiet; then
            git commit -m "Record SI PL 1m 15m source validation"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
