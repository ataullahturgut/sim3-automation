name: Gold H3 Multiscale Phase Cube
on:
  push:
    branches: [gold-h3-secular-rte-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_multiscale_phase_cube.py'
      - '.github/workflows/gold-h3-multiscale-phase-cube.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-secular-rte-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_multiscale_phase_cube.py
      - name: Record phase cube
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_MULTISCALE_PHASE_CUBE_2024_2026_2026-10-04.csv gold_axis_2026/GOLD_H3_MULTISCALE_PHASE_CUBE_2024_2026_2026-10-04.json gold_axis_2026/GOLD_H3_MULTISCALE_PHASE_CUBE_2024_2026_2026-10-04.md
          if ! git diff --cached --quiet; then
            git commit -m "Record OAR multiscale phase cube"
            git pull --rebase origin gold-h3-secular-rte-v1-20261004
            git push origin HEAD:gold-h3-secular-rte-v1-20261004
          fi
