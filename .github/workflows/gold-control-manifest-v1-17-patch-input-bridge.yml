name: Gold Control Manifest v1.17 Patch Input Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-manifest-v1-17-patch-input-bridge.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply manifest v1.17 reconciliation
        run: python gold_axis_2026/tools/reconcile_manifest_v1_17_patch_input_bridge.py
      - name: Verify scoped manifest update
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sed '/^$/d' | wc -l)" -eq 1
          git diff --name-only | grep -Fx 'gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md'
          grep -F '**Manifest version:** 1.17' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'BLOCKED_PATCH_PROSPECTIVE_INPUT_SEMANTICS_NOT_PROVEN' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F '33600343405' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F '33602829565' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'NASDAQCOM_MONTH_END_PIT_CONTINUATION_NOT_COMPLETE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'PATCH_DAILY_METALS_OPERATIONAL_CONTINUATION_NOT_PROVEN' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
      - name: Commit manifest v1.17 to canonical branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git commit -m 'gold-control: reconcile manifest v1.17 Patch input bridge'
          git push origin HEAD:gold-r4-direction-engine
