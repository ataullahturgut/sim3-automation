name: Gold Session Targets V5 Final Data Gate 20261006
on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_targets_v5_final_data_gate_20261006.py'
      - '.github/workflows/gold-session-targets-v5-final-data-gate-20261006.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'pandas>=2.2,<3'
      - run: python gold_axis_2026/tools/gold_session_targets_v5_final_data_gate_20261006.py
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_TARGETS_V5_FINAL_DATA_GATE_OUT/wgc2026_ny3_final.csv gold_axis_2026/GOLD_SESSION_TARGETS_WGC2026_NY3_FINAL_V5_2023_2025.csv
          cp gold_axis_2026/SESSION_TARGETS_V5_FINAL_DATA_GATE_OUT/sobti5_et_final.csv gold_axis_2026/GOLD_SESSION_TARGETS_SOBTI5_ET_FINAL_V5_2023_2025.csv
          cp gold_axis_2026/SESSION_TARGETS_V5_FINAL_DATA_GATE_OUT/excluded_rows.csv gold_axis_2026/GOLD_SESSION_TARGETS_V5_FINAL_EXCLUDED_ROWS_2023_2025.csv
          cp gold_axis_2026/SESSION_TARGETS_V5_FINAL_DATA_GATE_OUT/summary.json gold_axis_2026/GOLD_SESSION_TARGETS_V5_FINAL_SUMMARY_2026-10-06.json
          cp gold_axis_2026/SESSION_TARGETS_V5_FINAL_DATA_GATE_OUT/result.md gold_axis_2026/GOLD_SESSION_TARGETS_V5_FINAL_RESULT_2026-10-06.md
          git add gold_axis_2026/GOLD_SESSION_TARGETS_*V5* gold_axis_2026/GOLD_SESSION_TARGETS_SOBTI5_ET_FINAL_V5_2023_2025.csv gold_axis_2026/GOLD_SESSION_TARGETS_WGC2026_NY3_FINAL_V5_2023_2025.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record final V5 session target data gate"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
