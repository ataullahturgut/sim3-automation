name: Gold Monthly DMA DMS Batch 1 V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_dma_batch1_v1.py
      - .github/workflows/gold-monthly-dma-batch1-v1.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  batch1:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy psycopg[binary]
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_dma_batch1_v1.py
      - name: Run authority-governed DMA/DMS Batch 1
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_dma_batch1_v1.py
      - name: Result gate
        run: python -c "import json; r=json.load(open('vw_midas_dma_batch1_v1_result.json')); assert r['stage_scope']=='STAGE_0_TO_3_BATCH1'; assert len(r['dev_ranking'])==60; assert r['authority_invariants_before']==r['authority_invariants_after']; print('RESULT_GATE=PASS')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-dma-batch1-v1
          path: vw_midas_dma_batch1_v1_result.json
          if-no-files-found: error
