name: Gold R9 DeepSeek V4 Pro Macro Scientific Challenge
on:
  push:
    branches:
      - gold-execution-channel-audit-20261006
    paths:
      - .github/workflows/gold-r9-deepseek-pro-macro-causal-challenge-20261009.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-r9-deepseek-pro-once
  cancel-in-progress: false
jobs:
  pro-referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Budget-limited single external Pro scientific review
        run: |
          set -euo pipefail
          python -m py_compile gold_axis_2026/tools/gold_r9_deepseek_v4_pro_causal_challenge_20261009.py
          python gold_axis_2026/tools/gold_r9_deepseek_v4_pro_causal_challenge_20261009.py
      - name: Save safe model output / receipt with remote-HEAD rebase
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_R9_DEEPSEEK_V4_PRO_CPI_NFP_CAUSAL_20261009_{REVIEW.md,RESULT.json,FAILURE_QC.json}; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Archive bounded V4 Pro R9 causal innovation independent critique'
            for i in 1 2 3; do
              git pull --rebase origin gold-execution-channel-audit-20261006
              if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
