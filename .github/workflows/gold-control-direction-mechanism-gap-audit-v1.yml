name: Gold Control Direction Mechanism Gap Audit V1

on:
  push:
    branches:
      - gold-direction-mechanism-gap-v1-20260923
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_MECHANISM_GAP_AUDIT_V1_PREREG_2026-09-23.md'
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_MECHANISM_GAP_AUDIT_V1_IMPLEMENTATION_CLARIFICATION_2026-09-23.md'
      - 'gold_axis_2026/tools/direction_mechanism_gap_audit_v1.py'
      - '.github/workflows/gold-control-direction-mechanism-gap-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-mechanism-gap-v1-20260923
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'psycopg[binary]>=3.2,<4'

      - name: Materialize frozen artifacts
        run: |
          git show eb928b2d5be6250227d8e14dea2d58abe494f762:gold_axis_2026/GOLD_CONTROL_RESIDUAL_ONE_SIDED_UP2_LOGIT_V1_LEDGER_2026-09-23.csv > /tmp/up2.csv
          git show f187f89c166a75cefa8cf60709dcd4ce1027663d:gold_axis_2026/tools/downside_cbr_dtw_path_v1.py > /tmp/cbr.py

      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/direction_mechanism_gap_audit_v1.py

      - name: Assert read-only
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table' gold_axis_2026/tools/direction_mechanism_gap_audit_v1.py /tmp/cbr.py
          grep -n 'default_transaction_read_only' /tmp/cbr.py

      - name: Run mechanism-gap audit
        run: |
          rm -rf mechanism_gap_out
          python gold_axis_2026/tools/direction_mechanism_gap_audit_v1.py \
            --up2 /tmp/up2.csv \
            --cbr-code /tmp/cbr.py \
            --out mechanism_gap_out

      - name: Freeze result
        run: |
          cp mechanism_gap_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_MECHANISM_GAP_AUDIT_V1_RESULT_2026-09-23.*
          git commit -m 'Freeze direction mechanism-gap audit V1'
          git push origin HEAD:gold-direction-mechanism-gap-v1-20260923

      - uses: actions/upload-artifact@v4
        with:
          name: gold-control-direction-mechanism-gap-audit-v1
          path: mechanism_gap_out/
          retention-days: 30