name: Gold 2026 Orthogonal CME5 Crossvenue Case Analogue RFR Trial
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_cme5_rfr_k25_external_analogue_20261008.py
      - gold_axis_2026/GOLD_EXECUTION_2026_CME_FIVE_H1_SOURCE_QC_20261008.json
      - .github/workflows/gold-execution-2026-cme5-rfr-independent-k25.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-five-independent-cme-futures-rfr-case
  cancel-in-progress: false
jobs:
  nonparametric-independent-market:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'databento>=0.62' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Source-paired independent H1 CME GC SI ZN NQ CL completed-bar features and prior matured RFR candidate analogues
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_cme5_rfr_k25_external_analogue_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_cme5_rfr_k25_external_analogue_20261008.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-2026-cme5-independent-rfr-private-dated
          path: gold_axis_2026/GOLD_EXECUTION_2026_CME5_CROSSVENUE_RFR_K25_ANALOGUE_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Commit actual independent market model metrics or strict source block
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_CME5_CROSSVENUE_RFR_K25_ANALOGUE_20261008_{SUMMARY.json,METRICS.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Report actual independent CME five-market 1h futures leading-signal XAU RFR analogue trial or primary source block'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
