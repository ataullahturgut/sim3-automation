name: Gold Monthly Boosting Stage 1 Canonical V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_boosting_stage1_canonical_v1.py
      - .github/workflows/gold-monthly-boosting-stage1-canonical-v1.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  stage1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_stage1_canonical_v1.py
      - name: Run Stage 1 canonical DEV-only baselines
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_stage1_canonical_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gold_monthly_boosting_stage1_canonical_v1_result.json'))
          assert r['scope']=='STAGE_1_ONLY_DEV_ONLY'
          assert r['contract']['gold_only'] is True
          assert r['contract']['multioutput'] is False
          assert r['contract']['hyperparameter_selection']=='NONE_STAGE1_FIXED_CANONICAL'
          assert r['contract']['2025_role']=='NOT_OPENED_NOT_EVALUATED'
          assert r['contract']['2026_role']=='NOT_OPENED_NOT_EVALUATED'
          assert r['contract']['random_split']=='NONE'
          assert r['determinism']['status']=='PASS'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert len(r['models'])==5
          for m in r['models'].values():
              assert m['metrics']['n']==33
              assert len(m['rows'])==33
              assert all('2022-04' <= x['target'] <= '2024-12' for x in m['rows'])
          print('STAGE1_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-stage1-canonical-v1
          path: gold_monthly_boosting_stage1_canonical_v1_result.json
          if-no-files-found: error
