name: Gold StakTrakr Four-Metal 15m Public Snapshot Research Ingest V39
on:
  push:
    branches: [data/gold-staktrakr-fourmetal-15min-main-20261030, main]
    paths:
      - '.github/workflows/gold-staktrakr-fourmetal-15min-research-v1.yml'
      - 'gold_axis_2026/data_pipeline/staktrakr_fourmetal_15min_research_ingest_v1.py'
      - 'gold_axis_2026/data_pipeline/test_staktrakr_fourmetal_15min_research_ingest_v1.py'
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'
permissions:
  contents: read
concurrency:
  group: gold-staktrakr-fourmetal-15m-research
  cancel-in-progress: false
jobs:
  collect-separate-15m-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrity and chronology tests
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/staktrakr_fourmetal_15min_research_ingest_v1.py
          python -m unittest gold_axis_2026/data_pipeline/test_staktrakr_fourmetal_15min_research_ingest_v1.py -v
      - name: Probe four-metal 15-minute snapshots on 16 September, no writes
        run: |
          python gold_axis_2026/data_pipeline/staktrakr_fourmetal_15min_research_ingest_v1.py \
            --mode probe --start 2026-09-16 --end 2026-09-16 \
            --out fourmetal-15m-20260916-probe.json
      - name: Install Postgres driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Require Neon URL
        run: test -n "$NEON_DATABASE_URL"
      - name: Append 15-minute public four-metal research snapshots (deduped)
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            START="$(date -u -d '7 days ago' +%Y-%m-%d)"
          else
            START="2026-08-01"
          fi
          python gold_axis_2026/data_pipeline/staktrakr_fourmetal_15min_research_ingest_v1.py \
            --mode apply --start "$START" \
            --out staktrakr-fourmetal-15m-ingest-report.json
      - name: Verify four-metal September historical provenance and counts
        run: |
          python - <<'PY'
          import os,psycopg
          with psycopg.connect(os.environ['NEON_DATABASE_URL'],
               options='-c default_transaction_read_only=on') as db:
              with db.cursor() as c:
                  c.execute("""
                    SELECT metal,count(*) AS n, min(window_start_utc),
                           max(window_start_utc),
                           count(*) FILTER(WHERE window_start_utc::date='2026-09-16') sep16
                    FROM gold_weekly_live.staktrakr_fourmetal_15m_snapshot_research_v1
                    GROUP BY metal ORDER BY metal
                  """)
                  rows=c.fetchall()
          for m,n,first,last,sep in rows:
              print(f'{m}: {n} 15m rows, {first} to {last}; Sept16={sep}')
              assert n>=90 and sep>=75
          assert len(rows)==4
          print('FOUR_METAL_15M_PUBLIC_RESEARCH_LEDGER_VERIFIED')
          PY
      - name: Upload historical snapshot coverage and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-staktrakr-fourmetal-15m-source-research
          path: |
            fourmetal-15m-20260916-probe.json
            staktrakr-fourmetal-15m-ingest-report.json
          retention-days: 30
          if-no-files-found: warn
