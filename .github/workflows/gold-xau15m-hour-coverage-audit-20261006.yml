name: Gold XAU15m Hour Coverage Audit 20261006
on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_xau15m_hour_coverage_audit_20261006.py'
      - '.github/workflows/gold-xau15m-hour-coverage-audit-20261006.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3'
      - run: python gold_axis_2026/tools/gold_xau15m_hour_coverage_audit_20261006.py
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/XAU15M_HOUR_COVERAGE_AUDIT_OUT/summary.json gold_axis_2026/GOLD_XAU15M_HOUR_COVERAGE_AUDIT_2026-10-06.json
          cp gold_axis_2026/XAU15M_HOUR_COVERAGE_AUDIT_OUT/hour_coverage.csv gold_axis_2026/GOLD_XAU15M_HOUR_COVERAGE_BY_HOUR_2026-10-06.csv
          cp gold_axis_2026/XAU15M_HOUR_COVERAGE_AUDIT_OUT/exact_boundary_coverage.csv gold_axis_2026/GOLD_XAU15M_EXACT_BOUNDARY_COVERAGE_2026-10-06.csv
          cp gold_axis_2026/XAU15M_HOUR_COVERAGE_AUDIT_OUT/daily_coverage.csv gold_axis_2026/GOLD_XAU15M_DAILY_COVERAGE_2026-10-06.csv
          cp gold_axis_2026/XAU15M_HOUR_COVERAGE_AUDIT_OUT/monthly_coverage.csv gold_axis_2026/GOLD_XAU15M_MONTHLY_COVERAGE_2026-10-06.csv
          git add gold_axis_2026/GOLD_XAU15M_*
          if ! git diff --cached --quiet; then
            git commit -m "Record XAU 15m hour coverage audit"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
