name: Gold Weekly Mismatch Autopsy
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/gold_h1_r1/run_weekly_mismatch_autopsy.py'
      - '.github/workflows/gold_weekly_mismatch_autopsy.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy
      - run: python projects/gold_h1_r1/run_weekly_mismatch_autopsy.py
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/gold_h1_r1/weekly_mismatch_autopsy_2010_2022.csv projects/gold_h1_r1/WEEKLY_MISMATCH_AUTOPSY_R1.md
          git diff --cached --quiet || git commit -m 'Run weekly mismatch autopsy'
          git push
