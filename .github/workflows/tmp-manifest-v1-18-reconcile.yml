name: Gold Control Manifest V1.18 Reconcile

on:
  push:
    branches:
      - gold-r4-direction-engine
    paths:
      - .github/workflows/tmp-manifest-v1-18-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - name: Reconcile manifest
        run: python gold_axis_2026/tools/reconcile_manifest_v1_18_v4.py
      - name: Validate diff
        run: |
          git diff --check
          grep -F '**Manifest version:** 1.18' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'PATCH_R1_V4_XAU_ONLY_MODEL_IMPACT_PASS' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'CAUSAL_PATCH_R1_REPRO_V1_3_XAU_ONLY_ORIGIN_SAFE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git commit -m 'gold-control: reconcile manifest v1.18 after Patch V4 pass'
          git push origin HEAD:gold-r4-direction-engine
