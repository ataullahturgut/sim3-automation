name: KAVIS timeless learning CORE — strict causal contract (no research performance claim)
on:
  push:
    branches: ['research-gold-core-timeless-selective-learning-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeless-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and seven timeless-event math tests
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --check kavis_core_timeless_v0.js
          node --check kavis_core_timeless_v0.test.js
          node --test kavis_core_timeless_v0.test.js
      - name: Ensure decision CORE is untrained library, not fabricated backtest
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node - <<'NODE'
          const c=require('./kavis_core_timeless_v0');
          const s=c.create();
          if(s.totalMatured!==0||s.portfolio.trades!==0||s.portfolio.cash!==100)
            throw Error('PRETRAINING/EXPERIMENT_LEAK');
          if(c.LEGS_COST_PCT<1.6||c.LEGS_COST_PCT>1.62)
            throw Error('WRONG_BANK_FEE');
          console.log('TIMELESS_CORE_PROTOTYPE_PASS',c.NFEATURES,
            c.LEGS_COST_PCT, 'no training or profitability claimed');
          NODE
      - name: S1 adaptive-rule discovery as-of and delayed-learning contract
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_rule_discovery_s1.js
          node --check adaptive_rule_discovery_s1.test.js
          node --test adaptive_rule_discovery_s1.test.js
          node --check replay_reconstructed_jan2023_s1.js
          node --test replay_reconstructed_jan2023_s1.test.js
          node --check economic_evidence_s1.js
          node --test economic_evidence_s1.test.js

      - name: S1 economic PIT admission and paired-ablation tests
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check economic_pit_learning_s1.js
          node --check economic_pit_learning_s1.test.js
          node --test economic_pit_learning_s1.test.js

      - name: S1 reconstructed release research admission and no-event separation
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check replay_jan2023_economic_research_s1.js
          node --check economic_research_vintage_s1.test.js
          node --test economic_research_vintage_s1.test.js

      - name: S1 independent-release economic learning and negative-control contracts
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check independent_event_learning_s1.js
          node --check independent_event_research_query_s1.js
          node --check replay_independent_event_learning_s1.js
          node --check independent_event_learning_s1.test.js
          node --test independent_event_learning_s1.test.js

      - name: S1 actual CORE event-wave integration and delayed matured XAU labels
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check replay_macro_waves_in_existing_core_s1.js
          node --check replay_macro_waves_in_existing_core_s1.test.js
          node --test replay_macro_waves_in_existing_core_s1.test.js

      - name: S2 lifecycle and same-CORE S1/S2 composition guardrail tests
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_phase_lifecycle_s2.js
          node --check adaptive_market_core_s1_s2.js
          node --check replay_phase_lifecycle_s2.js
          node --check adaptive_phase_lifecycle_s2.test.js
          node --test adaptive_phase_lifecycle_s2.test.js


      - name: S2 slow session/trend lifecycle and same-core future-data guard tests
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_slow_lifecycle_s2.js
          node --check replay_slow_lifecycle_s2.js
          node --check adaptive_market_core_s1_s2.js
          node --check adaptive_slow_lifecycle_s2.test.js
          node --test adaptive_slow_lifecycle_s2.test.js

      - name: S3 fee-net CASH/GOLD shadow critic within the same adaptive CORE
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_position_value_s3.js
          node --check adaptive_position_value_s3.test.js
          node --check adaptive_market_core_s1_s2.js
          node --test adaptive_position_value_s3.test.js

      - name: S3 conditional economic position-value learning and evidence isolation
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_conditional_position_s3.js
          node --check adaptive_conditional_position_s3.test.js
          node --test adaptive_conditional_position_s3.test.js
          node --check replay_conditional_position_s3.js
          node --check replay_conditional_position_s3.test.js
          node --test replay_conditional_position_s3.test.js

      - name: S3 historical private replay contract without bank execution or private data
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check replay_position_value_s3.js
          node --check replay_position_value_s3.test.js
          node --test replay_position_value_s3.test.js

      - name: M4/M5 all-archive matured session-memory replay contract
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_position_memory_s3.js
          node --check replay_slow_position_memory_s3.js
          node --check replay_slow_position_memory_s3.test.js
          node --test replay_slow_position_memory_s3.test.js

      - name: M4 shadow chronological comparison runner and null-alpha contracts
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_long_cycle_s3.js
          node --check replay_s3_monthly_challengers.js
          node --test replay_s3_monthly_challengers.test.js

      - name: M4 Jan 2023 pretrained-state continuity contract
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check replay_pretrained_jan2023_s3.js
          node --test replay_pretrained_jan2023_s3.test.js
