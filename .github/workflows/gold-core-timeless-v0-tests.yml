name: KAVIS timeless learning CORE — strict causal contract (no research performance claim)
on:
  push:
    branches: ['research-gold-core-timeless-selective-learning-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timeless-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and seven timeless-event math tests
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --check kavis_core_timeless_v0.js
          node --check kavis_core_timeless_v0.test.js
          node --test kavis_core_timeless_v0.test.js
      - name: Ensure decision CORE is untrained library, not fabricated backtest
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node - <<'NODE'
          const c=require('./kavis_core_timeless_v0');
          const s=c.create();
          if(s.totalMatured!==0||s.portfolio.trades!==0||s.portfolio.cash!==100)
            throw Error('PRETRAINING/EXPERIMENT_LEAK');
          if(c.LEGS_COST_PCT<1.6||c.LEGS_COST_PCT>1.62)
            throw Error('WRONG_BANK_FEE');
          console.log('TIMELESS_CORE_PROTOTYPE_PASS',c.NFEATURES,
            c.LEGS_COST_PCT, 'no training or profitability claimed');
          NODE
      - name: S1 adaptive-rule discovery as-of and delayed-learning contract
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check adaptive_rule_discovery_s1.js
          node --check adaptive_rule_discovery_s1.test.js
          node --test adaptive_rule_discovery_s1.test.js
          node --check replay_reconstructed_jan2023_s1.js
          node --test replay_reconstructed_jan2023_s1.test.js
          node --check economic_evidence_s1.js
          node --test economic_evidence_s1.test.js

      - name: S1 economic PIT admission and paired-ablation tests
        working-directory: gold_axis_2026/adaptive_trading_core
        run: |
          node --check economic_pit_learning_s1.js
          node --check economic_pit_learning_s1.test.js
          node --test economic_pit_learning_s1.test.js
