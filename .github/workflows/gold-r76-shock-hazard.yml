name: R76 two-sided first-touch XAU shock pilot
on:
  pull_request:
    paths:
      - 'gold_axis_2026/tools/gold_r76_two_sided_shock_hazard.py'
      - 'gold_axis_2026/GOLD_R76_20261013_TWO_SIDED_SHOCK_HAZARD_PREREG.md'
      - 'gold_axis_2026/data_r76/GOLD_R76_20261013_09TR_SHOCK_FIRST_TOUCH_3D_ORIGINS.csv'
      - '.github/workflows/gold-r76-shock-hazard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shock-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal model dependencies
        run: pip install 'numpy>=1.24,<3' 'scikit-learn>=1.4,<2'
      - name: Run 2020-2024 train, 2025/26 frozen stress, compare rolling60
        run: python -u gold_axis_2026/tools/gold_r76_two_sided_shock_hazard.py
      - name: Archive first-touch alerts and all scored origin rows
        uses: actions/upload-artifact@v4
        with:
          name: r76-xau-3day-shock-pilot
          retention-days: 30
          path: |
            gold_axis_2026/GOLD_R76_20261013_RESULT.json
            gold_axis_2026/GOLD_R76_20261013_ROW_FORECASTS.csv
