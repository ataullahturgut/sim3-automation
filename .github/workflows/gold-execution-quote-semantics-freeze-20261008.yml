name: GOLD XAU Quote Semantics Freeze 20261008
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_quote_semantics_freeze_20261008.py'
      - '.github/workflows/gold-execution-quote-semantics-freeze-20261008.yml'
permissions:
  contents: write
jobs:
  quote-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_quote_semantics_freeze_20261008.py
      - name: Publish quote semantic binding receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_XAU_QUOTE_TYPE_SOURCE_CONTRACT_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Bind XAU HistData BID quote identity into private dataset'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
