name: Gold Session Selected Incremental Disagreement V1 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_selected_incremental_disagreement_v1_20261007.py'
      - '.github/workflows/gold-session-selected-incremental-disagreement-v1-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - name: Rebuild selected development ledgers
        run: |
          set -euo pipefail
          python gold_axis_2026/tools/gold_session_model03b_a1_feature_selection_20261007.py
          python gold_axis_2026/tools/gold_session_model04b_path_global_feature_selection_20261007.py
          python gold_axis_2026/tools/gold_session_model05b_structural_iris_1h_feature_selection_20261007.py
          python gold_axis_2026/tools/gold_session_model06b_sage_feature_selection_20261007.py
          python gold_axis_2026/tools/gold_session_model07b_sage_path_session_feature_selection_20261007.py
          python gold_axis_2026/tools/gold_session_model08b_sage_a1_session_feature_selection_20261007.py
          python gold_axis_2026/tools/gold_session_model09b_sage_a1_path_session_feature_selection_20261007.py
      - name: Run selected disagreement audit
        run: python gold_axis_2026/tools/gold_session_selected_incremental_disagreement_v1_20261007.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=gold_axis_2026/SESSION_SELECTED_INCREMENTAL_DISAGREEMENT_V1_OUT
          cp "$O/summary.json" gold_axis_2026/GOLD_SESSION_SELECTED_INCREMENTAL_DISAGREEMENT_V1_SUMMARY_2026-10-07.json
          cp "$O/result.md" gold_axis_2026/GOLD_SESSION_SELECTED_INCREMENTAL_DISAGREEMENT_V1_RESULT_2026-10-07.md
          cp "$O/selected_pairwise.csv" gold_axis_2026/GOLD_SESSION_SELECTED_INCREMENTAL_DISAGREEMENT_V1_PAIRWISE_2026-10-07.csv
          git add gold_axis_2026/GOLD_SESSION_SELECTED_INCREMENTAL_DISAGREEMENT_V1_*
          if ! git diff --cached --quiet; then
            git commit -m "Record selected session disagreement audit"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-session-selected-incremental-disagreement-v1-20261007
          path: gold_axis_2026/SESSION_SELECTED_INCREMENTAL_DISAGREEMENT_V1_OUT/
          if-no-files-found: warn
          retention-days: 90
