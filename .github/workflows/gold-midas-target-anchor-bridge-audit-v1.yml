name: Gold MIDAS Target Anchor Bridge Audit V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_target_anchor_bridge_audit_v1.py
      - .github/workflows/gold-midas-target-anchor-bridge-audit-v1.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4'
      - name: Run audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_target_anchor_bridge_audit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-target-anchor-bridge-audit-v1-${{ github.sha }}
          path: vw_midas_target_anchor_bridge_audit_v1.json
          retention-days: 30
