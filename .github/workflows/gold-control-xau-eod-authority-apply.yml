name: Gold Control XAU EOD Authority Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-xau-eod-authority-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0

      - name: Apply Twelve NY17 canonical source contract
        run: python gold_axis_2026/tools/apply_xau_eod_twelve_ny17_v1_6.py

      - name: Verify exact changed scope
        run: |
          python -m json.tool gold_axis_2026/data_pipeline/source_contracts.json >/dev/null
          grep -Fq '**Manifest version:** 1.6' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'XAU_EOD_TWELVE_NY17' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'TWELVE_XAU_NY17_EXECUTABLE_MAPPING_PROVEN' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          grep -Fq 'TWELVE_XAUUSD_NY17_CANONICAL_OPERATIONAL_SOURCE_APPROVED' gold_axis_2026/GOLD_CONTROL_XAU_EOD_SOURCE_CHANGE_CONTROL_2026-09-01.md
          grep -Fq 'APPROVED_EXECUTABLE_CANONICAL_SOURCE_CONTRACT; PIPELINE_NOT_YET_PRODUCTION_SUCCESS' gold_axis_2026/data_pipeline/source_contracts.json
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md gold_axis_2026/GOLD_CONTROL_XAU_EOD_SOURCE_CHANGE_CONTROL_2026-09-01.md gold_axis_2026/data_pipeline/source_contracts.json "

      - name: Commit Twelve NY17 contract to canonical branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
                  gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md \
                  gold_axis_2026/GOLD_CONTROL_XAU_EOD_SOURCE_CHANGE_CONTROL_2026-09-01.md \
                  gold_axis_2026/data_pipeline/source_contracts.json
          git commit -m "gold-control: freeze Twelve NY17 XAU EOD manifest v1.6"
          git push origin HEAD:gold-r4-direction-engine
