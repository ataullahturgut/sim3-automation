name: Gold Control Simple Expert V2 Promote

on:
  workflow_dispatch:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/tools/apply_simple_expert_v2_promotion.py'
      - '.github/workflows/gold-control-simple-expert-v2-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable PASS evidence before promotion
        run: |
          python - <<'PY'
          import json
          p='gold_axis_2026/simple_expert_v2/simple_expert_v2_source_binding_evidence.json'
          e=json.load(open(p))
          assert e['decision']=='SIMPLE_EXPERT_V2_SOURCE_BINDING_PASS'
          assert e['rw_decision']=='RW_R2_SOURCE_BINDING_MODEL_IMPACT_PASS'
          assert e['momentum_decision']=='MOMENTUM_3M_R2_SOURCE_BINDING_MODEL_IMPACT_PASS'
          assert e['future_information_violations']==0
          assert e['post_result_retune'] is False
          assert e['thresholds_relaxed'] is False
          print('SIMPLE_EXPERT_V2_PROMOTION_EVIDENCE_PASS')
          PY

      - name: Apply fail-closed registry manifest and observability patch
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'gold_axis_2026/tools')
          import apply_simple_expert_v2_promotion as p

          p.verify_evidence()
          p.patch_multi_expert()
          p.patch_multi_expert_tests()
          p.patch_observability()
          p.patch_observability_tests()
          p.patch_manifest()

          # Repair the one-shot patcher's workflow matcher, but do not mutate a workflow from the Actions token.
          patcher = Path('gold_axis_2026/tools/apply_simple_expert_v2_promotion.py')
          src = patcher.read_text(encoding='utf-8')
          start = src.index('def patch_mobile_workflow_manifest_gate() -> None:\n')
          end = src.index('\ndef main() -> None:\n', start)
          fixed = '''def patch_mobile_workflow_manifest_gate() -> None:\n    path = REPO_ROOT / ".github" / "workflows" / "gold-control-mobile-ui-v1.yml"\n    replace_once(path, "name: Gold Control Mobile UI V1.23 Engine Observability Final", "name: Gold Control Mobile UI V1.24 Engine Observability Final")\n    replace_once(path, "- name: Verify manifest v1.23 and engine observability governance", "- name: Verify manifest v1.24 and engine observability governance")\n    replace_once(path, "1.23' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md", "1.24' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md")\n    replace_once(path, "echo 'V123_ENGINE_OBSERVABILITY_UI_GOVERNANCE_PASS'", "echo 'V124_ENGINE_OBSERVABILITY_UI_GOVERNANCE_PASS'")\n    replace_once(path, "- name: Audit local imports and manifest v1.23 screen markers", "- name: Audit local imports and manifest v1.24 screen markers")\n\n'''
          patcher.write_text(src[:start] + fixed + src[end+1:], encoding='utf-8')
          print('SIMPLE_EXPERT_V2_PROMOTION_PATCH_PASS')
          PY

      - name: Compile promoted graph
        run: |
          python -m py_compile \
            gold_axis_2026/data_pipeline/multi_expert_forecast.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/tools/apply_simple_expert_v2_promotion.py

      - name: Run promoted deterministic contracts
        run: |
          pip install pytest 'psycopg[binary]>=3.2,<4'
          cd gold_axis_2026/data_pipeline
          pytest -q test_multi_expert_forecast.py
          cd ../apps
          pytest -q test_engine_observability_contract.py test_mobile_ui_contract.py

      - name: Verify selector action and manifest locks remain closed
        run: |
          grep -F 'SELECTOR_STATUS = "NOT_PROVEN_EXPERT_SELECTION_RULE"' gold_axis_2026/data_pipeline/multi_expert_forecast.py
          grep -F 'AUTO_SELECTOR = "OFF"' gold_axis_2026/data_pipeline/multi_expert_forecast.py
          grep -F 'AUTO_ENSEMBLE = "OFF"' gold_axis_2026/data_pipeline/multi_expert_forecast.py
          grep -F '**Manifest version:** 1.24' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'SIMPLE_EXPERT_V2_SOURCE_BINDING_PASS' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'WAITING_ELIGIBLE_MONTH_END_ORIGIN' gold_axis_2026/apps/engine_observability_contract.py
          echo 'SIMPLE_EXPERT_V2_LOCKS_AND_MANIFEST_PASS'

      - name: Commit promoted non-workflow state atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
            gold_axis_2026/data_pipeline/multi_expert_forecast.py \
            gold_axis_2026/data_pipeline/test_multi_expert_forecast.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/test_engine_observability_contract.py \
            gold_axis_2026/tools/apply_simple_expert_v2_promotion.py
          if git diff --cached --quiet; then
            echo 'PROMOTION_NO_DIFF'; exit 1
          fi
          git commit -m 'gold-control: promote source-bound RW and Momentum V2 experts'
          git push origin HEAD:gold-r4-direction-engine
