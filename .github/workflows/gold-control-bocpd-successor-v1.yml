name: Gold Control BOCPD Return Successor V1

on:
  push:
    branches: [gold-control-bocpd-successor-v1]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_UNRESOLVED_ENGINE_SUCCESSOR_ROADMAP_2026-09-04.md'
      - 'gold_axis_2026/GOLD_CONTROL_BOCPD_RETURN_SUCCESSOR_V1_CHANGE_CONTROL_2026-09-04.md'
      - 'gold_axis_2026/bocpd_successor_v1/**'
      - 'gold_axis_2026/tools/bocpd_return_successor_v1.py'
      - 'gold_axis_2026/tools/test_bocpd_return_successor_v1.py'
      - 'gold_axis_2026/core5_monthly.csv.gz.b64'
      - '.github/workflows/gold-control-bocpd-successor-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest

      - name: Contract and deterministic PIT tests
        working-directory: gold_axis_2026/tools
        run: pytest -q test_bocpd_return_successor_v1.py

      - name: Historical successor research replay
        id: replay
        working-directory: gold_axis_2026/tools
        run: |
          set -euo pipefail
          rm -rf ../bocpd_successor_v1/evidence
          python bocpd_return_successor_v1.py --output-dir ../bocpd_successor_v1/evidence | tee /tmp/bocpd_successor_v1.log

          grep -Fx 'CANDIDATE_STATUS=RESEARCH_SHADOW_CANDIDATE_ENGINEERING_PASS' /tmp/bocpd_successor_v1.log
          grep -Fx 'DIRECTION_VOTE_PERMITTED=NO' /tmp/bocpd_successor_v1.log
          grep -Fx 'POSITION_MAPPING_PERMITTED=NO' /tmp/bocpd_successor_v1.log
          grep -Fx 'PROSPECTIVE_CLAIM=NO' /tmp/bocpd_successor_v1.log
          grep -Fx 'PROMOTION_AUTHORIZED=NO' /tmp/bocpd_successor_v1.log
          grep -Fx 'DATABASE_WRITES=NONE' /tmp/bocpd_successor_v1.log

      - name: Audit generated evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('gold_axis_2026/bocpd_successor_v1/evidence/bocpd_return_successor_v1_evidence.json')
          j = json.loads(p.read_text())
          assert j['successor_id'] == 'BOCPD_RETURN_SUCCESSOR_V1'
          assert j['archived_identity'] == 'BOCPD'
          assert j['successor_id'] != j['archived_identity']
          assert j['archived_identity_status'].startswith('BLOCKED_')
          assert j['candidate_status'] == 'RESEARCH_SHADOW_CANDIDATE_ENGINEERING_PASS'
          assert j['direction_vote_permitted'] is False
          assert j['position_mapping_permitted'] is False
          assert j['database_writes'] == 'NONE'
          assert j['prospective_claim'] is False
          assert j['promotion_authorized'] is False
          assert j['archived_threshold_reused'] is False
          assert j['numeric_alarm_threshold'] is None
          assert j['row_count'] == 199
          assert j['period_counts'] == {'DEV': 132, 'LOCK': 31, 'VAL': 36}
          assert all(j['hard_gates'].values())
          assert len(j['determinism_sha256']) == 64
          print('BOCPD_SUCCESSOR_EVIDENCE_AUDIT=PASS')
          print('DATABASE_WRITES=NONE')
          print('PROSPECTIVE_CLAIM=NO')
          print('PROMOTION_AUTHORIZED=NO')
          PY

      - name: Upload non-production research evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-bocpd-return-successor-v1-evidence
          path: |
            gold_axis_2026/bocpd_successor_v1/evidence/bocpd_return_successor_v1_evidence.json
            gold_axis_2026/bocpd_successor_v1/evidence/bocpd_return_successor_v1_replay.csv
          if-no-files-found: error
          retention-days: 30
