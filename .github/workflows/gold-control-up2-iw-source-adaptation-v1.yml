name: Gold Control UP2 Importance Weighted Source Adaptation V1

on:
  push:
    branches:
      - gold-up2-iw-source-adaptation-v1-20260923
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_UP2_IMPORTANCE_WEIGHTED_SOURCE_ADAPTATION_V1_PREREG_2026-09-23.md'
      - 'gold_axis_2026/tools/up2_importance_weighted_source_adaptation_v1.py'
      - '.github/workflows/gold-control-up2-iw-source-adaptation-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-up2-iw-source-adaptation-v1
  cancel-in-progress: false

jobs:
  adaptation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: /tmp/frozen/gold_axis_2026:/tmp/frozen/gold_axis_2026/tools

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-up2-iw-source-adaptation-v1-20260923
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'psycopg[binary]>=3.2,<4'

      - name: Materialize frozen authorities
        run: |
          mkdir -p /tmp/frozen/gold_axis_2026/tools /tmp/frozen/gold_axis_2026/regime_dampener_v1
          git show b22235f04dc48b173a93a98cc2ce22081bb0054e:gold_axis_2026/tools/cbr_cascade_route_consistent_extension_v1_run.py > /tmp/frozen/route_authority.py
          git show f187f89c166a75cefa8cf60709dcd4ce1027663d:gold_axis_2026/tools/downside_cbr_dtw_path_v1.py > /tmp/frozen/cbr.py
          git show ad0fc4dcbe1687833bd9a153cd4bc6a754523464:gold_axis_2026/tools/regime_v1_router_sqrt.py > /tmp/frozen/regime_v1_router_sqrt.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py > /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_data.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_data.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/tools/regime_v1_experts.py > /tmp/frozen/gold_axis_2026/tools/regime_v1_experts.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_ttsm_realized_semivariance_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_bonato_qboost_realized_moments_spot_xau_v1.py
          git show 7982b422476df61eb0339b74265afd553414f2d2:gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py > /tmp/frozen/gold_axis_2026/regime_dampener_v1/frozen_direction_downside_realized_moments_logit_v2.py
          git show 12c0e7d9cb0adb65e43064592a29617c887e4675:gold_axis_2026/tools/direction_mechanism_gap_audit_v1.py > /tmp/frozen/mechanism.py
          git show eb928b2d5be6250227d8e14dea2d58abe494f762:gold_axis_2026/GOLD_CONTROL_RESIDUAL_ONE_SIDED_UP2_LOGIT_V1_LEDGER_2026-09-23.csv > /tmp/up2.csv
          git show 509c5ffa762f4ea49644b8ffe723ed2591ba52bf:gold_axis_2026/external_data/v2/dukascopy_xauusd_govsession_mid_5m_daily_features_2018_2021.csv > /tmp/external_daily.csv

      - name: Fetch pinned transient Dukascopy minute mirror
        run: |
          rm -rf /tmp/mdl
          git clone --filter=blob:none --no-checkout https://github.com/kevingtlin/Market-Data-Lab.git /tmp/mdl
          git -C /tmp/mdl sparse-checkout init --no-cone
          printf '%s\n' \
            '/xauusd/ask/m1/xauusd_ask_m1_2020_*.csv' \
            '/xauusd/ask/m1/xauusd_ask_m1_2021_*.csv' \
            '/xauusd/ask/m1/xauusd_ask_m1_2022_01.csv' \
            '/xauusd/bid/m1/xauusd_bid_m1_2020_*.csv' \
            '/xauusd/bid/m1/xauusd_bid_m1_2021_*.csv' \
            '/xauusd/bid/m1/xauusd_bid_m1_2022_01.csv' \
            > /tmp/mdl/.git/info/sparse-checkout
          git -C /tmp/mdl checkout 922f83a60cc574e7395fb27397077288055a1ef6
          test "$(find /tmp/mdl/xauusd/ask/m1 -name 'xauusd_ask_m1_*.csv' | wc -l)" -eq 25
          test "$(find /tmp/mdl/xauusd/bid/m1 -name 'xauusd_bid_m1_*.csv' | wc -l)" -eq 25

      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/up2_importance_weighted_source_adaptation_v1.py
          python -m py_compile /tmp/frozen/route_authority.py
          python -m py_compile /tmp/frozen/cbr.py
          python -m py_compile /tmp/frozen/mechanism.py

      - name: Assert read-only
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table' gold_axis_2026/tools/up2_importance_weighted_source_adaptation_v1.py /tmp/frozen/cbr.py
          grep -n 'default_transaction_read_only' /tmp/frozen/cbr.py

      - name: Run importance-weighted source adaptation
        run: |
          rm -rf iw_out
          python gold_axis_2026/tools/up2_importance_weighted_source_adaptation_v1.py \
            --raw-root /tmp/mdl \
            --external-spine /tmp/external_daily.csv \
            --sqrt-code /tmp/frozen/regime_v1_router_sqrt.py \
            --route-module /tmp/frozen/route_authority.py \
            --base-module /tmp/frozen/gold_axis_2026/tools/down_verifier_candidate_audit_v1_run.py \
            --cbr-code /tmp/frozen/cbr.py \
            --mechanism-code /tmp/frozen/mechanism.py \
            --up2-ledger /tmp/up2.csv \
            --out iw_out

      - name: Freeze result
        run: |
          cp iw_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_UP2_IMPORTANCE_WEIGHTED_SOURCE_ADAPTATION_V1_RESULT_2026-09-23.*
          git commit -m 'Freeze importance-weighted historical UP2 source adaptation V1'
          git push origin HEAD:gold-up2-iw-source-adaptation-v1-20260923

      - uses: actions/upload-artifact@v4
        with:
          name: gold-control-up2-iw-source-adaptation-v1
          path: iw_out/
          retention-days: 30