name: Gold Session DPTC Stage2 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_dptc_stage2_20261007.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3,<4' 'openpyxl>=3.1,<4'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_session_dptc_stage2_20261007.py
      - name: Run Stage2
        run: python gold_axis_2026/tools/gold_session_dptc_stage2_20261007.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=gold_axis_2026/SESSION_DPTC_STAGE2_OUT
          cp "$O/result.md" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_RESULT_2026-10-07.md
          cp "$O/summary.json" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_SUMMARY_2026-10-07.json
          cp "$O/feature_coverage.csv" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_FEATURE_COVERAGE_2026-10-07.csv
          cp "$O/sellr_grid.csv" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_SELLR_GRID_2026-10-07.csv
          cp "$O/sellr_selected.csv" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_SELLR_SELECTED_2026-10-07.csv
          cp "$O/dptc_metrics.csv" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_METRICS_2026-10-07.csv
          cp "$O/dptc_gate.csv" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_GATE_2026-10-07.csv
          cp "$O/actions.csv" gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_ACTIONS_2026-10-07.csv
          git add gold_axis_2026/GOLD_SESSION_DPTC_STAGE2_*
          if ! git diff --cached --quiet; then
            git commit -m "Record session DPTC Stage2 development replay"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-session-dptc-stage2-20261007
          path: gold_axis_2026/SESSION_DPTC_STAGE2_OUT/
          retention-days: 90
