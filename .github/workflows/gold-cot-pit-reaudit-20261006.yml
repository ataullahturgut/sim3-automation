name: Gold COT PIT Reaudit 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_cot_publication_pit_v1.py'
      - 'gold_axis_2026/tools/gold_cot_pit_reaudit_20261006.py'
      - '.github/workflows/gold-cot-pit-reaudit-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.31,<3'

      - name: Rebuild raw CFTC state and audit publication availability
        run: python gold_axis_2026/tools/gold_cot_pit_reaudit_20261006.py

      - name: Record evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp gold_axis_2026/COT_PIT_REAUDIT_OUT/summary.json gold_axis_2026/GOLD_COT_PIT_REAUDIT_SUMMARY_2026-10-06.json
          cp gold_axis_2026/COT_PIT_REAUDIT_OUT/cot_publication_calendar.csv gold_axis_2026/GOLD_COT_PUBLICATION_CALENDAR_PIT_V1.csv
          cp gold_axis_2026/COT_PIT_REAUDIT_OUT/cot_gold_pit_state_raw_rebuilt.csv gold_axis_2026/GOLD_COT_GOLD_PIT_STATE_RAW_REBUILT_2026-10-06.csv
          cp gold_axis_2026/COT_PIT_REAUDIT_OUT/old_opal_proven_early_rows.csv gold_axis_2026/GOLD_OPAL_OLD_PROVEN_EARLY_COT_ROWS_2026-10-06.csv
          cp gold_axis_2026/COT_PIT_REAUDIT_OUT/old_opal_pit_reaudit_rows.csv gold_axis_2026/GOLD_OPAL_OLD_COT_PIT_REAUDIT_ROWS_2026-10-06.csv
          cp gold_axis_2026/COT_PIT_REAUDIT_OUT/v5_session_cot_availability_map.csv gold_axis_2026/GOLD_V5_SESSION_COT_AVAILABILITY_MAP_2023_2025.csv

          git add             gold_axis_2026/GOLD_COT_PIT_REAUDIT_SUMMARY_2026-10-06.json             gold_axis_2026/GOLD_COT_PUBLICATION_CALENDAR_PIT_V1.csv             gold_axis_2026/GOLD_COT_GOLD_PIT_STATE_RAW_REBUILT_2026-10-06.csv             gold_axis_2026/GOLD_OPAL_OLD_PROVEN_EARLY_COT_ROWS_2026-10-06.csv             gold_axis_2026/GOLD_OPAL_OLD_COT_PIT_REAUDIT_ROWS_2026-10-06.csv             gold_axis_2026/GOLD_V5_SESSION_COT_AVAILABILITY_MAP_2023_2025.csv

          if ! git diff --cached --quiet; then
            git commit -m "Record governed COT PIT reaudit evidence"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
