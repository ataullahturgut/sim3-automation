name: Gold Recheck Existing HAR GVZ Tail Risk 2020-2025
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2020_2025_tail_har_gvz_clean_retest_20261008.py'
      - '.github/workflows/gold-existing-har-gvz-tail-newsource-2020-2025.yml'
permissions:
  contents: write
concurrency:
  group: gold-source-validated-har-gvz-old-tail-risk-v1
  cancel-in-progress: false
jobs:
  retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Rerun original source-corrected overnight magnitude and signed-tail models
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2020_2025_tail_har_gvz_clean_retest_20261008.py
          python gold_axis_2026/tools/gold_execution_2020_2025_tail_har_gvz_clean_retest_20261008.py
      - name: Store exact dated forecasts in protected workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-clean-original-har-gvz-tail-risk-predictions
          path: gold_axis_2026/GOLD_EXECUTION_2020_2025_TAIL_HAR_GVZ_CLEAN_SOURCE_RETEST_20261008_PREDICTIONS.csv
          if-no-files-found: warn
      - name: Record only aggregate risk scoring result and origin provenance
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2020_2025_TAIL_HAR_GVZ_CLEAN_SOURCE_RETEST_20261008_SUMMARY.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_TAIL_HAR_GVZ_CLEAN_SOURCE_RETEST_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_2020_2025_TAIL_HAR_GVZ_CLEAN_SOURCE_RETEST_20261008_METRICS.csv
          git diff --cached --quiet || git commit -m 'Record original low-capacity source-accurate HAR GVZ and signed downside upside risk calibrations'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
