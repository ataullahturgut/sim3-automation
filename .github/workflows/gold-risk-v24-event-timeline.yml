name: Gold risk V24 event-timing audit
on:
  push:
    branches:
      - research/gold-risk-v24-event-timeline-pit-20261026
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install numpy pandas tabulate
      - name: Event timeline replay, no DB writes
        working-directory: gold_axis_2026/research/case_control_v13
        run: |
          python risk_v24_event_timelines.py
          python risk_v24_source_publication_audit.py
      - name: Strict event and V23 regression tests
        working-directory: gold_axis_2026/research/case_control_v13
        run: python -m unittest -v test_risk_v24_event_timelines.py test_risk_v24_source_publication_audit.py test_risk_v24_committed_exports.py test_risk_v23_calendar_safe_audit.py
      - name: Archive complete event and source audit
        uses: actions/upload-artifact@v4
        with:
          name: gold-risk-v24-event-source-audit
          path: |
            gold_axis_2026/research/case_control_v13/outputs/v24_*.csv
            gold_axis_2026/research/case_control_v13/outputs/v24_*.json
          retention-days: 30
