name: Gold Monthly Alarm Fine Tuning V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_alarm_fine_tuning_v1.py
      - .github/workflows/gold-monthly-alarm-fine-tuning-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  tune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11093903747/zip" > matrix.zip
          unzip -q matrix.zip -d inputs
          test -s inputs/GOLD_MONTHLY_UNIFIED_ALARM_MATRIX_V2_FALSE_CALL_2026-09-30.json
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_alarm_fine_tuning_v1.py
      - name: Fine tune DEV only
        run: |
          python gold_axis_2026/tools/gold_monthly_alarm_fine_tuning_v1.py \
            --matrix-v2 inputs/GOLD_MONTHLY_UNIFIED_ALARM_MATRIX_V2_FALSE_CALL_2026-09-30.json \
            --output GOLD_MONTHLY_ALARM_FINE_TUNING_V1_2026-09-30.json
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_ALARM_FINE_TUNING_V1_2026-09-30.json'))
          assert r['status']=='FROZEN_DEV_ONLY'
          assert r['selection_scope']['rows']==33
          assert r['selection_scope']['test_2025_2026_opened'] is False
          assert r['governance']['2025_2026_used_for_selection'] is False
          assert r['governance']['underlying_signal_definitions_changed'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'config':r['config'],
            'T0_RED':r['selected']['T0_RED']['stats'],
            'T1_RED_CONFIRM':r['selected']['T1_RED_CONFIRM']['stats'],
            'FINAL_RED':r['selected']['FINAL_RED']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-alarm-fine-tuning-v1-${{ github.sha }}
          path: GOLD_MONTHLY_ALARM_FINE_TUNING_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
