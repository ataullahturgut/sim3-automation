name: Gold Short Horizon Stage6C Timing Diagnostic

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_stage6c_timing_diag.py'
      - '.github/workflows/gold-short-horizon-stage6c-timing-diag.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run post-run timing diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: stage6c_timing_diag_out
        run: python gold_axis_2026/tools/gold_short_horizon_stage6c_timing_diag.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-short-horizon-stage6c-timing-diagnostic
          path: stage6c_timing_diag_out/
          retention-days: 90
