name: TEMP V1.32 Fallback Source Fix

on:
  push:
    branches:
      - gold-control-v132-monthly-origin-contract
    paths:
      - '.github/workflows/tmp-v132-fallback-source-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v132-monthly-origin-contract
      - name: Patch DB-less snapshot source invocation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/apps/gold_control_mobile_v1.py')
          s=p.read_text(encoding='utf-8')
          old="""aug31_state_replay=safe_call(lambda:get_aug31_state_replay_cached(url),None) if url else None
aug31_replay_expansion=safe_call(lambda:get_aug31_replay_expansion_cached(url),None) if url else None"""
          new="""aug31_state_replay=safe_call(lambda:get_aug31_state_replay_cached(url),None)
aug31_replay_expansion=safe_call(lambda:get_aug31_replay_expansion_cached(url),None)"""
          assert s.count(old)==1, f'expected one exact fallback source block, got {s.count(old)}'
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py
          git diff --check
          git diff -- gold_axis_2026/apps/gold_control_mobile_v1.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gold_axis_2026/apps/gold_control_mobile_v1.py
          git commit -m "fix: use governed snapshots when Neon is unavailable"
          git push origin HEAD:gold-control-v132-monthly-origin-contract
