name: Gold H3 DPTC V1

on:
  push:
    branches: [gold-h3-competence-transition-program-v1-20261005]
    paths:
      - 'gold_axis_2026/tools/gold_h3_dptc_v1.py'
      - 'gold_axis_2026/GOLD_H3_DPTC_V1_DEVELOPMENT_FREEZE_2026-10-05.md'
      - '.github/workflows/gold-h3-dptc-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-competence-transition-program-v1-20261005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas
      - run: python gold_axis_2026/tools/gold_h3_dptc_v1.py
      - name: Record DPTC evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_H3_DPTC_V1_*.*
          if ! git diff --cached --quiet; then
            git commit -m "Record DPTC V1 evidence"
            git pull --rebase origin gold-h3-competence-transition-program-v1-20261005
            git push origin HEAD:gold-h3-competence-transition-program-v1-20261005
          fi
