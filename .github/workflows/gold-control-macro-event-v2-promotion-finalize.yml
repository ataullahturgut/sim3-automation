name: Gold Control Macro Event V2 Promotion Finalize

on:
  push:
    branches:
      - gold-control-macro-event-successor-v2-promotion
    paths:
      - '.github/workflows/gold-control-macro-event-v2-promotion-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-macro-event-successor-v2-promotion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Final manifest consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md')
          s=p.read_text(encoding='utf-8')
          old='After the v1.34 code + production runtime migration is applied and verified, the current governed application inventory is:'
          new='After the v1.35 code + production runtime migration is applied and verified, the current governed application inventory is:'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old2='The separate v1.34 BOCPD promotion authorization is independent of this GPR clause.'
          new2='The separate v1.34 BOCPD and v1.35 Macro Event promotion authorizations are independent of this GPR clause.'
          assert s.count(old2)==1
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Revalidate current registry
        run: |
          pip install pytest
          PYTHONPATH=gold_axis_2026/apps pytest -q gold_axis_2026/apps/test_engine_observability_contract.py
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          from engine_observability_contract import ENGINE_DISPLAY_ORDER, ENGINE_REGISTRY
          assert len(ENGINE_DISPLAY_ORDER)==12
          assert 'MACRO_EVENT' not in ENGINE_DISPLAY_ORDER
          assert 'MACRO_EVENT_SUCCESSOR_V2' in ENGINE_DISPLAY_ORDER
          assert ENGINE_REGISTRY['MACRO_EVENT_SUCCESSOR_V2']['direction_vote'] is False
          print('MACRO_EVENT_V2_FINAL_REGISTRY_PASS')
          PY
      - name: Remove temporary patch tooling and commit final contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git rm -f gold_axis_2026/tools/apply_macro_event_v2_promotion_patch.py
          git rm -f .github/workflows/gold-control-macro-event-successor-v2-promotion-patch.yml
          git rm -f .github/workflows/gold-control-macro-event-v2-promotion-finalize.yml
          git commit -m 'gold-control: finalize Macro Event V2 promotion contracts'
          git push origin HEAD:gold-control-macro-event-successor-v2-promotion
