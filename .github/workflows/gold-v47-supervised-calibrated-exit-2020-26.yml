name: Gold V47 Historical Learned Calibrated EXIT Only 2020-26 Research
on:
  workflow_dispatch:
  push:
    branches: [research/gold-v47-historical-regime-calibrated-exit-20261031]
    paths:
      - '.github/workflows/gold-v47-supervised-calibrated-exit-2020-26.yml'
      - 'gold_axis_2026/research/case_control_v13/risk_v47_yearwise_supervised_exit_adaptation.py'
      - 'gold_axis_2026/research/case_control_v13/test_risk_v47_yearwise_supervised_exit_adaptation.py'
permissions:
  contents: read
jobs:
  supervised-regime-exit-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chronological feature and supervised learner dependencies
        run: python -m pip install 'psycopg[binary]>=3.2,<4' 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'
      - name: Test no feature future-use and five session first barrier ground truth
        run: |
          python -m unittest gold_axis_2026/research/case_control_v13/test_risk_v47_yearwise_supervised_exit_adaptation.py -v
          python -m py_compile gold_axis_2026/research/case_control_v13/risk_v47_yearwise_supervised_exit_adaptation.py
      - name: Require historical read-only Neon connection
        run: test -n "$NEON_DATABASE_URL"
      - name: Fit 2020-22, calibrate 2023, freeze score cutoffs 2024, evaluate 2025 and 2026
        run: |
          python -m gold_axis_2026.research.case_control_v13.risk_v47_yearwise_supervised_exit_adaptation \
            --out gold-v47-historical-calibrated-sell-2025-2026.json
      - name: Archive fitted-period information and all V22 episode decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v47-learned-regime-calibrated-exit-research
          path: gold-v47-historical-calibrated-sell-2025-2026.json
          retention-days: 30
          if-no-files-found: warn
