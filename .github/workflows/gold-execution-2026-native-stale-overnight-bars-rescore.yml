name: Gold 2026 Native Dukascopy Stale Midnight Bars Real Frozen CBR HGB Rescore
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_native_stale_bar_quarantine_retest_20261009.py
      - .github/workflows/gold-execution-2026-native-stale-overnight-bars-rescore.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-direct-native-stale-midnight-quote-cbr-paired
  cancel-in-progress: false
jobs:
  quote-cleaning:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Exact unchanged model price-only rerun with 00 01 native zero-carry-forward M15 rows quarantined
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_native_stale_bar_quarantine_retest_20261009.py
          python gold_axis_2026/tools/gold_execution_2026_native_stale_bar_quarantine_retest_20261009.py
      - name: Save source-safe paired CBR HGB score deltas and firstpassage validity
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_DIRECT_NATIVE_STALE_QUARANTINE_RETEST_20261009_{PAIRED_METRICS.csv,SUMMARY.json,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Verify gold 2026 first-party midnight stale M15 quarantine and exact frozen CBR/HGB score impact'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
