name: Gold Control Patch R1 Repro Locked Replay

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold-control-patch-r1-repro-locked-replay.yml'

permissions:
  contents: write

concurrency:
  group: gold-control-patch-r1-repro-locked-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic replay runtime
        run: pip install pandas numpy requests torch
      - name: Verify manifest contract and pre-frozen geometry
        run: |
          set -euo pipefail
          grep -F '**Manifest version:** 1.16' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'CAUSAL_PATCH_R1_REPRO_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -F 'FROZEN_BEFORE_LOCKED_REPLAY_SCORE' gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_REPRO_CONTRACT_V1.md
          test -s gold_axis_2026/patch_repro_v1/frozen_geometry.json
          grep -F '"locked_score_window_used_for_selection": false' gold_axis_2026/patch_repro_v1/frozen_geometry.json
          grep -F '"L": 252' gold_axis_2026/patch_repro_v1/frozen_geometry.json
          grep -F '"P": 21' gold_axis_2026/patch_repro_v1/frozen_geometry.json
          grep -F '"D": 32' gold_axis_2026/patch_repro_v1/frozen_geometry.json
          python -m py_compile gold_axis_2026/tools/causal_patch_r1_repro_v1.py
      - name: Run frozen 43-month Patch replay twice
        run: python gold_axis_2026/tools/causal_patch_r1_repro_v1.py --mode replay
      - name: Verify replay evidence isolation
        run: |
          set -euo pipefail
          test -s gold_axis_2026/patch_repro_v1/locked_replay_43.csv
          test -s gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          grep -F '"evidence_class": "HISTORICAL_REPLAY"' gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          grep -F '"prospective_claim": false' gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          grep -F '"forecast_ledger_write": "NONE"' gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          grep -F '"decision_store_write": "NONE"' gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          grep -F '"target_reconciliation": "43/43"' gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          grep -F '"rw_reconciliation": "43/43"' gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
      - name: Commit immutable locked-replay evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            gold_axis_2026/patch_repro_v1/locked_replay_43.csv \
            gold_axis_2026/patch_repro_v1/locked_replay_evidence.json
          git commit -m 'gold-control: record Patch R1 repro locked replay'
          git push origin HEAD:gold-r4-direction-engine
