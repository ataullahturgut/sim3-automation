name: Gold 2026 Frozen 2020 2021 2022 History Direct Dukascopy
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2026_direct_dukascopy_frozen_history_holdout_20261008.py'
      - '.github/workflows/gold-execution-2026-frozen-historical-same-source-test.yml'
permissions:
  contents: write
concurrency:
  group: gold-execution-2026-direct-dukascopy-frozen-historical
  cancel-in-progress: false
jobs:
  independent-2026:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Download same direct-provider 2026 BID/ASK and score frozen historical models only if source gate passes
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_direct_dukascopy_frozen_history_holdout_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_direct_dukascopy_frozen_history_holdout_20261008.py
      - name: Retain private 2026 native BID/ASK candles and dated predictions in protected artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-direct-dukascopy-bidask-and-frozen-predictions
          path: |
            gold_axis_2026/GOLD_EXECUTION_2026_FROZEN_HISTORY_SAME_VENDOR_CHALLENGE_20261008_PRIVATE_2026_DIRECT_BIDASK_M15.csv
            gold_axis_2026/GOLD_EXECUTION_2026_FROZEN_HISTORY_SAME_VENDOR_CHALLENGE_20261008_DATED_PREDICTIONS_PRIVATE.csv
          if-no-files-found: warn
      - name: Commit aggregate 2026 source verdict and scoring only, never licensed BID ASK
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_FROZEN_HISTORY_SAME_VENDOR_CHALLENGE_20261008_{SUMMARY.json,YEARLY_METRICS.csv,MONTHLY_METRICS.csv,PAIRED_HISTORY.csv,DATA_QC.json}; do
            if test -f "$f"; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m 'Record direct-source 2026 gold fixed-model holdout or explicit validation block'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
