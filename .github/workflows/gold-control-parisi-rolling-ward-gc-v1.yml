name: Gold Control Parisi Rolling Ward GC V1

on:
  push:
    branches:
      - gold-direction-vlmc-bs-family-v2-20260918
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_PREREG_2026-09-21.md'
      - 'gold_axis_2026/tools/direction_parisi_rolling_ward_gc_v1.py'
      - '.github/workflows/gold-control-parisi-rolling-ward-gc-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-parisi-rolling-ward-gc-v1
  cancel-in-progress: false

jobs:
  parisi-ward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-vlmc-bs-family-v2-20260918
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require protected research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen runtime dependencies
        run: python -m pip install 'numpy==2.1.3' 'psycopg[binary]>=3.2,<4'

      - name: Compile research implementation
        run: python -m py_compile gold_axis_2026/tools/direction_parisi_rolling_ward_gc_v1.py

      - name: Assert no write SQL in research model
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table'             gold_axis_2026/tools/direction_parisi_rolling_ward_gc_v1.py
          echo 'PARISI_RESEARCH_READ_ONLY_SQL_PASS'

      - name: Run and freeze pre-2025 selection
        run: |
          rm -rf parisi_pre2025
          mkdir -p parisi_pre2025
          python gold_axis_2026/tools/direction_parisi_rolling_ward_gc_v1.py             --stage pre2025             --outdir parisi_pre2025

      - name: Commit frozen pre-2025 evidence before 2025 scoring
        run: |
          cp parisi_pre2025/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_SOURCE_AUDIT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_PRE2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_FROZEN_CONFIG_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_PRE2025_SELECTED_FORECASTS_2026-09-21.csv
          git commit -m 'Freeze Parisi rolling-Ward GC V1 pre-2025 evidence'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Run unchanged locked 2025 retrospective challenge
        run: |
          rm -rf parisi_2025
          mkdir -p parisi_2025
          python gold_axis_2026/tools/direction_parisi_rolling_ward_gc_v1.py             --stage 2025             --outdir parisi_2025             --config gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_FROZEN_CONFIG_2026-09-21.json             --pre-result gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_PRE2025_RESULT_2026-09-21.json

      - name: Commit locked 2025 result
        run: |
          cp parisi_2025/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_2025_FORECASTS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DIRECTION_PARISI_ROLLING_WARD_GC_V1_RESULT_2026-09-21.md
          git commit -m 'Freeze Parisi rolling-Ward GC V1 2025 challenge result'
          git push origin HEAD:gold-direction-vlmc-bs-family-v2-20260918

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-parisi-rolling-ward-gc-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            parisi_pre2025/
            parisi_2025/
