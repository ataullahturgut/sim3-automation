name: TMP Gold Control V1.32 Governance QA Migration

on:
  push:
    branches: [gold-control-v132-monthly-origin-contract]
    paths:
      - 'gold_axis_2026/tools/patch_v132_governance_and_qa.py'
      - '.github/workflows/tmp-v132-governance-qa-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v132-monthly-origin-contract
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply v1.32 workflow retirement and QA migration
        run: |
          set -euo pipefail
          python gold_axis_2026/tools/patch_v132_governance_and_qa.py
          python -m py_compile gold_axis_2026/apps/mobile_viewport_qa.py
          grep -Fq 'EYLÜL 2026 · 31 AĞUSTOS ORIGIN' gold_axis_2026/apps/mobile_viewport_qa.py
          grep -Fq 'Manifest version:** 1.32' .github/workflows/gold-control-mobile-ui-v125-final.yml
          grep -Fq 'Manifest version:** 1.32' .github/workflows/gold-control-bocpd-successor-v1.yml
      - name: Commit deterministic v1.32 migration
        run: |
          set -euo pipefail
          git config user.name 'gold-control-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows gold_axis_2026/apps/mobile_viewport_qa.py
          git diff --cached --quiet && { echo 'no changes'; exit 1; }
          git commit -m 'governance: retire legacy manifest writers and align active QA to v1.32'
          git push origin HEAD:gold-control-v132-monthly-origin-contract
