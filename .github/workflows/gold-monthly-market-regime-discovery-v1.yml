name: Gold Monthly Market Regime Discovery V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_market_regime_discovery_v1.py
      - .github/workflows/gold-monthly-market-regime-discovery-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  regime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install \
            'numpy>=2.0,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' \
            'openpyxl>=3.1,<4' 'lxml>=5,<7' 'scipy>=1.13,<2' \
            'scikit-learn>=1.5,<2' 'hmmlearn>=0.3.3,<0.4' 'ruptures>=1.1.9,<2'
      - name: Download frozen market authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/snapshot inputs/public inputs/external
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > snapshot.zip
          unzip -q snapshot.zip -d inputs/snapshot
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11015874673/zip" > public.zip
          unzip -q public.zip -d inputs/public
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11028494060/zip" > external.zip
          unzip -q external.zip -d inputs/external
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_market_regime_discovery_v1.py
      - name: Run market-state regime discovery
        run: |
          cd gold_axis_2026/tools
          python gold_monthly_market_regime_discovery_v1.py \
            --snapshot ../../inputs/snapshot/gold_monthly_dev_snapshot_v1.json \
            --public-bundle ../../inputs/public/gold_monthly_public_current_bundle_v1.json \
            --external ../../inputs/external/gold_monthly_external_authority_v2.json \
            --output ../../GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scope']['train_rows'] >= 168
          assert r['scope']['transport_rows'] == 20
          assert r['governance']['forecast_error_used'] is False
          assert r['governance']['alarm_labels_used'] is False
          assert r['governance']['model_forecasts_used'] is False
          assert r['governance']['2025_2026_used_to_choose_regime_model'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'evidence':r['evidence'],
            'occupancy':r['occupancy_transport'],
            'ood':r['ood_transport_months'],
            'transport':[{
              'month':x['month'],'state':x['state'],
              'p':x['state_probability'],'ood':x['ood_below_train_p05']
            } for x in r['monthly_regimes'] if x['period']!='REGIME_DEV']
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-market-regime-discovery-v1-${{ github.sha }}
          path: GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
