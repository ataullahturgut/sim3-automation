name: GOLD 2023 Independent Source Monthly Recovery
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2023_histdata_monthly_repair_20261008.py'
      - '.github/workflows/gold-execution-2023-histdata-monthly-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'histdata-fetcher>=0.1' 'psycopg[binary]>=3.2,<4'
      - run: python gold_axis_2026/tools/gold_execution_2023_histdata_monthly_repair_20261008.py
      - name: Record only provenance metadata
        if: always()
        run: |
          test -f gold_axis_2026/GOLD_EXECUTION_2023_HISTDATA_MONTHLY_REPAIR_QC_2026-10-08.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2023_HISTDATA_MONTHLY_REPAIR_QC_2026-10-08.json
          git diff --cached --quiet || git commit -m 'Record verified source 2023 monthwise backfill evidence'
          for i in 1 2 3 4; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 2
          done
          exit 1
