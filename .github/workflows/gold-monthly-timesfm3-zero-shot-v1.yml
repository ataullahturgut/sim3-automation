name: Gold Monthly TimesFM3 Zero Shot V1

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - gold_axis_2026/tools/gold_monthly_timesfm3_zero_shot_v1.py
  workflow_dispatch:

jobs:
  timesfm3-zero-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen packages
        run: python -m pip install 'numpy>=1.26.4,<3' 'psycopg[binary]==3.3.6' 'torch>=2.0.0' 'timesfm[torch]==3.0.2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_timesfm3_zero_shot_v1.py
      - name: Run TimesFM3 zero-shot multivariate
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_timesfm3_zero_shot_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open("gold_monthly_timesfm3_zero_shot_v1_result.json"))
          assert p["scientific_gate"] == "PASS"
          assert p["authority_invariants_unchanged"] is True
          assert p["contract"]["random_split"] == "NONE"
          assert p["contract"]["fine_tuning"] == "NONE_ZERO_SHOT"
          assert p["contract"]["2025_role"] == "LOCKED_REPORT_ONLY"
          assert p["contract"]["2026_role"] == "QUARANTINED_REPORT_ONLY"
          assert p["dev"]["metrics"]["n"] == 33
          print("TIMESFM3_ZERO_SHOT_GATE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-timesfm3-zero-shot-v1
          path: gold_monthly_timesfm3_zero_shot_v1_result.json
