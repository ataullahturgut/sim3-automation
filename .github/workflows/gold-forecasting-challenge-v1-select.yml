name: Gold Forecasting Challenge V1 Select

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_forecasting_challenge_v1_select.py'
      - '.github/workflows/gold-forecasting-challenge-v1-select.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: gold_forecasting_challenge_v1_select_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' requests
      - name: Resolve R2 readiness artifact
        id: aid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gold-short-horizon-global-xau-readiness-r2&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$AID"
          echo "aid=$AID" >> "$GITHUB_OUTPUT"
      - name: Run sealed-selection stage
        env:
          READINESS_ARTIFACT: ${{ steps.aid.outputs.aid }}
        run: python gold_axis_2026/tools/gold_forecasting_challenge_v1_select.py
      - name: Commit validation evidence
        run: |
          cp "$OUT_DIR/CHALLENGE_V1_SELECTION_RESULT.md" gold_axis_2026/GOLD_FORECASTING_CHALLENGE_V1_SELECTION_RESULT_2026-10-02.md
          cp "$OUT_DIR/challenge_v1_selection_result.json" gold_axis_2026/GOLD_FORECASTING_CHALLENGE_V1_SELECTION_RESULT_2026-10-02.json
          cp "$OUT_DIR/challenge_v1_validation_leaderboard.csv" gold_axis_2026/GOLD_FORECASTING_CHALLENGE_V1_VALIDATION_LEADERBOARD_2026-10-02.csv
          cp "$OUT_DIR/challenge_v1_champion_validation_annual.csv" gold_axis_2026/GOLD_FORECASTING_CHALLENGE_V1_CHAMPION_VALIDATION_ANNUAL_2026-10-02.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_FORECASTING_CHALLENGE_V1_*_2026-10-02.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Gold Forecasting Challenge V1 selection"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-forecasting-challenge-v1-select
          path: gold_forecasting_challenge_v1_select_out/
          if-no-files-found: warn
          retention-days: 90
