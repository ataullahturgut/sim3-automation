name: Gold Control Mobile UI V2 Final

on:
  workflow_dispatch:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md'
      - 'gold_axis_2026/GOLD_CONTROL_MOBILE_UI_PRODUCT_SPEC_V2_FINAL_MOCKUPS.md'
      - 'gold_axis_2026/apps/gold_control.py'
      - 'gold_axis_2026/apps/gold_control_mobile_v1.py'
      - 'gold_axis_2026/apps/mobile_viewport_qa.py'
      - 'gold_axis_2026/apps/decision_source.py'
      - 'gold_axis_2026/apps/forecast_source.py'
      - 'gold_axis_2026/apps/mobile_ui_contract.py'
      - 'gold_axis_2026/apps/test_mobile_ui_contract.py'
      - 'gold_axis_2026/apps/test_piyasa_contract.py'
      - '.github/workflows/gold-control-mobile-ui-v1.yml'

permissions:
  contents: read

jobs:
  mobile-ui-v2-final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install app and browser runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Verify manifest and final mockup governance
        run: |
          grep -q 'Manifest version:\*\* 1.20' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'APPROVED_FINAL_MOCKUP_UI_CONTRACT_V2' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'GOLD_CONTROL_MOBILE_UI_PRODUCT_SPEC_V2_FINAL_MOCKUPS.md' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'BLOCKED_NO_CANONICAL_SCENARIO_CONTRACT' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'NOT_PROVEN_POSITION_MAPPING' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'APPROVED_FINAL_MOCKUP_UI_CONTRACT_V2' gold_axis_2026/GOLD_CONTROL_MOBILE_UI_PRODUCT_SPEC_V2_FINAL_MOCKUPS.md
          echo 'FINAL_MOCKUP_GOVERNANCE_PASS'

      - name: Run deterministic UI contract tests
        working-directory: gold_axis_2026/apps
        run: pytest -q test_mobile_ui_contract.py test_piyasa_contract.py

      - name: Compile V2 UI readers and canonical app
        run: |
          python -m py_compile \
            gold_axis_2026/apps/mobile_ui_contract.py \
            gold_axis_2026/apps/decision_source.py \
            gold_axis_2026/apps/forecast_source.py \
            gold_axis_2026/apps/mobile_viewport_qa.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py \
            gold_axis_2026/apps/gold_control.py

      - name: Verify final V2 section markers in implementation
        run: |
          grep -q 'SİNYAL ÖZETİ' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'MODEL YÖNÜ (AYLIK)' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'FAST / SLOW TEYİDİ' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'SİNYAL ZAMAN ÇİZELGESİ' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'SENARYO MODÜLÜ KAPALI' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'MEVCUT FİYATA GÖRE FARK' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'MODEL PERFORMANSI' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'TAHMİN PERFORMANSI' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'HATA / KARAR ZAMAN ÇİZELGESİ' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'SEÇİLMİŞ GEÇMİŞ KAYITLAR' gold_axis_2026/apps/gold_control_mobile_v1.py
          grep -q 'spec_from_file_location' gold_axis_2026/apps/gold_control.py
          grep -q '_load_exact_module("decision_store"' gold_axis_2026/apps/gold_control.py
          grep -q '_load_exact_module("decision_store_reader"' gold_axis_2026/apps/gold_control.py
          grep -q 'refresh=True' gold_axis_2026/apps/gold_control.py
          if grep -Eq '^[[:space:]]*import[[:space:]]+runpy([[:space:]]|$)' gold_axis_2026/apps/gold_control.py; then
            echo 'RUNPY_ENTRYPOINT_FORBIDDEN'
            exit 1
          fi
          echo 'FINAL_V2_SECTION_MARKERS_PASS'

      - name: Streamlit Cloud import-path regression smoke
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        run: |
          REPO="$GITHUB_WORKSPACE"
          cd /tmp
          streamlit run "$REPO/gold_axis_2026/apps/gold_control.py" \
            --server.headless true --server.port 8502 --server.address 127.0.0.1 \
            > /tmp/gold_mobile_cloud_path.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo 'MOBILE_V2_CLOUD_PATH_HEALTH_PASS'
              kill $APP_PID || true
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gold_mobile_cloud_path.log
          kill $APP_PID || true
          wait $APP_PID || true
          exit 1

      - name: Canonical Streamlit runtime smoke
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        run: |
          streamlit run gold_axis_2026/apps/gold_control.py \
            --server.headless true --server.port 8501 --server.address 127.0.0.1 \
            > /tmp/gold_mobile_v2.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo 'MOBILE_V2_CANONICAL_STREAMLIT_HEALTH_PASS'
              kill $APP_PID || true
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gold_mobile_v2.log
          kill $APP_PID || true
          wait $APP_PID || true
          exit 1

      - name: 390px final mockup browser QA
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        run: |
          streamlit run gold_axis_2026/apps/gold_control.py \
            --server.headless true --server.port 8501 --server.address 127.0.0.1 \
            > /tmp/gold_mobile_v2_browser.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              break
            fi
            sleep 1
          done
          set +e
          python gold_axis_2026/apps/mobile_viewport_qa.py --url http://127.0.0.1:8501 --out /tmp/gold_mobile_v2_qa
          QA_RC=$?
          set -e
          kill $APP_PID || true
          wait $APP_PID || true
          if [ $QA_RC -ne 0 ]; then
            cat /tmp/gold_mobile_v2_browser.log
            exit $QA_RC
          fi

      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-mobile-v2-390px-screenshots
          path: /tmp/gold_mobile_v2_qa/*.png
          if-no-files-found: warn
