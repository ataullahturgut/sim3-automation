name: Gold Control Mobile UI V1

on:
  workflow_dispatch:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_MOBILE_UI_PRODUCT_SPEC_V1.md'
      - 'gold_axis_2026/apps/gold_control_mobile_v1.py'
      - 'gold_axis_2026/apps/forecast_source.py'
      - 'gold_axis_2026/apps/mobile_ui_contract.py'
      - 'gold_axis_2026/apps/test_mobile_ui_contract.py'
      - 'gold_axis_2026/tools/reconcile_manifest_v1_19_mobile_ui.py'
      - '.github/workflows/gold-control-mobile-ui-v1.yml'

permissions:
  contents: write

jobs:
  mobile-ui-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install app runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_axis_2026/apps/requirements.txt pytest

      - name: Reconcile manifest v1.19
        run: python gold_axis_2026/tools/reconcile_manifest_v1_19_mobile_ui.py

      - name: Run deterministic mobile UI contract tests
        working-directory: gold_axis_2026/apps
        run: pytest -q test_mobile_ui_contract.py test_piyasa_contract.py

      - name: Compile mobile UI readers and app
        run: |
          python -m py_compile \
            gold_axis_2026/apps/mobile_ui_contract.py \
            gold_axis_2026/apps/forecast_source.py \
            gold_axis_2026/apps/gold_control_mobile_v1.py

      - name: Streamlit mobile candidate runtime smoke
        env:
          STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
        run: |
          streamlit run gold_axis_2026/apps/gold_control_mobile_v1.py \
            --server.headless true --server.port 8501 --server.address 127.0.0.1 \
            > /tmp/gold_mobile.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo 'MOBILE_STREAMLIT_HEALTH_PASS'
              kill $APP_PID || true
              wait $APP_PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gold_mobile.log
          kill $APP_PID || true
          wait $APP_PID || true
          exit 1

      - name: Verify governance markers
        run: |
          grep -q 'Manifest version:\*\* 1.19' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'APPROVED_MOBILE_PRODUCT_UI_CONTRACT_V1' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'CAUSAL_PATCH_R1_REPRO_V1_6_COMPLETED_SESSION_DAILY_FEATURE_ORIGIN_SAFE' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'NOT_PROVEN_POSITION_MAPPING' gold_axis_2026/GOLD_CONTROL_MOBILE_UI_PRODUCT_SPEC_V1.md
          grep -q 'NOT_ISSUED_IN_CANONICAL_LEDGER' gold_axis_2026/GOLD_CONTROL_MOBILE_UI_PRODUCT_SPEC_V1.md
          echo 'MOBILE_UI_GOVERNANCE_PASS'

      - name: Commit manifest v1.19 reconciliation
        run: |
          if git diff --quiet -- gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md; then
            echo 'MANIFEST_ALREADY_RECONCILED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git commit -m 'gold-control: reconcile manifest v1.19 for Patch V7 and mobile UI'
          git push origin HEAD:gold-r4-direction-engine
