name: Gold Control Macro Event V3 USMPD Probe

on:
  push:
    branches: [gold-control-macro-event-successor-v3]
    paths:
      - '.github/workflows/gold-control-macro-event-v3-usmpd-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests openpyxl pandas
      - name: Download and inspect official SF Fed USMPD
        run: |
          python - <<'PY'
          import io, json, hashlib, requests, openpyxl
          url='https://www.frbsf.org/wp-content/uploads/USMPD.xlsx'
          r=requests.get(url,headers={'User-Agent':'Gold-Control-USMPD-Probe/1.0'},timeout=60)
          print('HTTP',r.status_code,'CT',r.headers.get('content-type'),'BYTES',len(r.content),'SHA256',hashlib.sha256(r.content).hexdigest())
          r.raise_for_status()
          wb=openpyxl.load_workbook(io.BytesIO(r.content),read_only=True,data_only=True)
          out={'url':url,'sha256':hashlib.sha256(r.content).hexdigest(),'sheets':{}}
          for ws in wb.worksheets:
              rows=list(ws.iter_rows(min_row=1,max_row=min(ws.max_row,12),values_only=True))
              out['sheets'][ws.title]={'max_row':ws.max_row,'max_column':ws.max_column,'sample_rows':[list(x) for x in rows]}
          open('usmpd_probe.json','w',encoding='utf-8').write(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: usmpd-probe
          path: usmpd_probe.json
          if-no-files-found: error
