name: Gold V17 Date-Invariant Learning and Synthetic Scenarios
on:
  push:
    branches:
      - 'research-gold-v17-*'
  pull_request:
    branches:
      - 'research-gold-v16-sequential-decision-20261016'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V17 syntax and provenance audit
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node --check v17_kavis_olay_doubleq.js
          node --check v17_kavis_olay_doubleq.test.js
          node --check v17_fictional_scenarios.js
      - name: V17 and V16 foundational synthetic verification
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: node --test v16_kavis_siralama.test.js v16_kavis_counterfactual_audit.test.js v17_kavis_olay_doubleq.test.js
      - name: Five independent FICTIONAL scenarios and V16 comparison
        working-directory: gold_axis_2026/apps/portfolio_guard_v1
        run: |
          node v17_fictional_scenarios.js > v17_synthetic_scenarios.json
          node -e "const z=require('./v17_synthetic_scenarios.json'); console.log(JSON.stringify({status:z.status,models:z.rows.map(r=>({world:r.scenario,model:r.model,capital:r.capital,hold:r.hold,trades:r.trades,maxDD:r.peakDrawdownPct,moves:r.moves.slice(0,9)}))},null,2))"
      - name: Prohibit historical price sources
        run: |
          if grep -E 'v13_sentez_run|v14_karar_run|v8_regret_engine|loadFullRows|OLAY_02_96_' gold_axis_2026/apps/portfolio_guard_v1/v17_kavis_olay_doubleq.js gold_axis_2026/apps/portfolio_guard_v1/v17_kavis_olay_doubleq.test.js gold_axis_2026/apps/portfolio_guard_v1/v17_fictional_scenarios.js; then
            echo "V17 phase must not access historical gold price datasets"
            exit 1
          fi
      - name: Preserve fictional scenario audit
        uses: actions/upload-artifact@v4
        with:
          name: v17-five-fictional-worlds
          path: gold_axis_2026/apps/portfolio_guard_v1/v17_synthetic_scenarios.json
          if-no-files-found: error
