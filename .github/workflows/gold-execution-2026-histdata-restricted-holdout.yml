name: Gold 2026 HistData Single Provider Restricted Frozen Holdout
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_execution_2026_histdata_restricted_holdout_20261008.py'
      - '.github/workflows/gold-execution-2026-histdata-restricted-holdout.yml'
permissions:
  contents: write
concurrency:
  group: gold-2026-histdata-2020-2022-frozen-restricted
  cancel-in-progress: false
jobs:
  frozen-2026-restricted:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Replay governed HistData BID prices and labels, score frozen 2026 no hindsight
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_histdata_restricted_holdout_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_histdata_restricted_holdout_20261008.py
      - name: Protect dated decisions in private workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-histdata-2026-restricted-dated-predictions
          path: gold_axis_2026/GOLD_EXECUTION_2026_HISTDATA_RESTRICTED_SOURCE_FROZEN_HOLDOUT_20261008_DATED_PREDICTIONS_PRIVATE.csv
          if-no-files-found: warn
      - name: Publish only aggregated 2026 HistData frozen-vintage research results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_EXECUTION_2026_HISTDATA_RESTRICTED_SOURCE_FROZEN_HOLDOUT_20261008_SUMMARY.json
          git add gold_axis_2026/GOLD_EXECUTION_2026_HISTDATA_RESTRICTED_SOURCE_FROZEN_HOLDOUT_20261008_YEAR_METRICS.csv
          git add gold_axis_2026/GOLD_EXECUTION_2026_HISTDATA_RESTRICTED_SOURCE_FROZEN_HOLDOUT_20261008_MONTH_METRICS.csv
          git add gold_axis_2026/GOLD_EXECUTION_2026_HISTDATA_RESTRICTED_SOURCE_FROZEN_HOLDOUT_20261008_PAIRED_TRAIN_START.csv
          git diff --cached --quiet || git commit -m 'Record independent 2026 source-governed HistData BID training-history performance'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
