# LEGACY HOLD: endpoint-change F4 design superseded by processing/frequency/optimizer parity reset.
# Manual dispatch only; do not use for scientific promotion.
name: Gold Monthly ChHHO F4 FX V1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate:
          - BASE
          - FX_BROAD
          - FX_CNY
          - FX_SAFEHAVEN
          - FX_BROAD_CNY
          - FX_BROAD_SAFE
          - FX_BREADTH_DISP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev-snapshot.zip
          unzip -q dev-snapshot.zip -d dev_snapshot
          test -s dev_snapshot/gold_monthly_dev_snapshot_v1.json
      - name: Download direct external store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11018030682/zip" > external.zip
          unzip -q external.zip -d external_store
          test -s external_store/gold_monthly_direct_external_store_v1.json
      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_f4_fx_candidate_v1.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_f4_fx_router_v1.py
      - name: Run native FX candidate
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_f4_fx_candidate_v1.py             --snapshot dev_snapshot/gold_monthly_dev_snapshot_v1.json             --external external_store/gold_monthly_direct_external_store_v1.json             --candidate "${{ matrix.candidate }}"             --output "f4_fx_${{ matrix.candidate }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: f4-fx-${{ matrix.candidate }}-${{ github.sha }}
          path: f4_fx_${{ matrix.candidate }}.json
          if-no-files-found: error
          retention-days: 90

  route:
    needs: candidate
    if: always() && needs.candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'psycopg[binary]>=3.2,<4'
      - uses: actions/download-artifact@v4
        with:
          pattern: f4-fx-*-${{ github.sha }}
          path: fx_results
          merge-multiple: true
      - name: Route by inner validation only
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_f4_fx_router_v1.py             --dir fx_results             --output GOLD_MONTHLY_CHHHO_F4_FX_RESULT_2026-09-29.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-f4-fx-summary-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_F4_FX_RESULT_2026-09-29.json
          if-no-files-found: error
          retention-days: 90
