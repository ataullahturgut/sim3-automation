name: Gold Monthly Market Regime Walk-Forward V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_market_regime_walkforward_v1.py
      - .github/workflows/gold-monthly-market-regime-walkforward-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  walkforward:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install             'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scipy>=1.13,<2'             'scikit-learn>=1.5,<2' 'hmmlearn>=0.3.3,<0.4'             'ruptures>=1.1.9,<2' 'requests>=2.32,<3'             'openpyxl>=3.1,<4' 'lxml>=5,<7'

      - name: Download frozen Market Regime Discovery V1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/regime
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11097041821/zip" > regime.zip
          unzip -q regime.zip -d inputs/regime
          test -f inputs/regime/GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json

      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_market_regime_walkforward_v1.py

      - name: Run real-time walk-forward regime detection audit
        run: |
          cd gold_axis_2026/tools
          python gold_monthly_market_regime_walkforward_v1.py             --regime-discovery-json ../../inputs/regime/GOLD_MONTHLY_MARKET_REGIME_DISCOVERY_V1_2026-09-30.json             --output ../../GOLD_MONTHLY_MARKET_REGIME_WALKFORWARD_V1_2026-09-30.json

      - name: Scientific governance gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_MARKET_REGIME_WALKFORWARD_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scientific_gate']=='PASS'
          assert len(r['walkforward_months']) == 134
          assert r['metrics']['core_2022_01_2026_08']['n_months'] == 56
          assert r['metrics']['transport_2025_01_2026_08']['n_months'] == 20
          g=r['governance']
          assert g['forecast_error_used'] is False
          assert g['alarm_labels_used'] is False
          assert g['model_forecasts_used'] is False
          assert g['future_market_state_used_in_fit'] is False
          assert g['reference_labels_used_in_fit'] is False
          assert g['current_month_used_in_fit'] is False
          assert g['alarm_selection_tested'] is False
          assert g['alarm_weighting_tested'] is False
          d=r['design']
          assert d['fit_window']=='expanding; strictly through t-1'
          assert d['current_month_used_in_parameter_fit'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'metrics':r['metrics'],
            'checkpoint_summary':r['checkpoint_summary'],
            'key_checkpoints':r['key_checkpoints'],
            'transitions':r['transitions'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-market-regime-walkforward-v1-${{ github.sha }}
          path: GOLD_MONTHLY_MARKET_REGIME_WALKFORWARD_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
