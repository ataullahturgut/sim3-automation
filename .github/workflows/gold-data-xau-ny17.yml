name: Gold Data XAU NY17 Canonical

on:
  workflow_call:
    secrets:
      NEON_DATABASE_URL:
        required: true
      TWELVE_DATA_API_KEY:
        required: true

concurrency:
  group: gold-data-xau-ny17-canonical
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen pipeline dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt

      - name: Require protected credentials
        run: |
          test -n "$NEON_DATABASE_URL"
          test -n "$TWELVE_DATA_API_KEY"

      - name: Compile and self-test canonical NY17 collector
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/twelve_xau_ny17.py
          python gold_axis_2026/data_pipeline/twelve_xau_ny17.py --self-test

      - name: Collect persist and verify canonical XAU EOD reference
        run: python gold_axis_2026/data_pipeline/twelve_xau_ny17.py --persist
