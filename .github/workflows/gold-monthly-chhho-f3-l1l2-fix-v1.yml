name: Gold Monthly ChHHO F3 L1L2 Fix V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_f3_lag_audit_v1.py
      - .github/workflows/gold-monthly-chhho-f3-l1l2-fix-v1.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NEON_DATABASE_URL: ''
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  l1l2:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Assert Neon disabled
        run: test -z "${NEON_DATABASE_URL:-}"
      - name: Download frozen DEV snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10985453248/zip" > dev-snapshot.zip
          unzip -q dev-snapshot.zip -d dev_snapshot
      - name: Download 2009 prehistory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11020520415/zip" > prehistory.zip
          unzip -q prehistory.zip -d prehistory
      - name: Run L1+L2
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_f3_lag_audit_v1.py             --snapshot dev_snapshot/gold_monthly_dev_snapshot_v1.json             --prehistory prehistory/gold_monthly_metal_prehistory_v1.json             --variant L1_L2             --output chhho_f3_L1_L2.json
      - uses: actions/upload-artifact@v4
        with:
          name: chhho-f3-l1l2-fix-${{ github.sha }}
          path: chhho_f3_L1_L2.json
          if-no-files-found: error
          retention-days: 90
