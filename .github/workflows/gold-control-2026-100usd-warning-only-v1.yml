name: Gold Control 2026 100USD Warning Only V1
on:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - gold_axis_2026/tools/warning_only_100usd_2026_v1.py
      - .github/workflows/gold-control-2026-100usd-warning-only-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: test -n "$NEON_DATABASE_URL"
      - run: python -m pip install "numpy==2.1.3" "psycopg[binary]>=3.2,<4"
      - name: Materialize external spine
        run: |
          git show 509c5ffa762f4ea49644b8ffe723ed2591ba52bf:gold_axis_2026/external_data/v2/dukascopy_xauusd_govsession_mid_5m_daily_features_2018_2021.csv > /tmp/external_daily.csv
      - name: Compile and governance
        run: |
          python -m py_compile gold_axis_2026/tools/warning_only_100usd_2026_v1.py
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table' gold_axis_2026/tools/warning_only_100usd_2026_v1.py
      - name: Run simulation
        run: |
          rm -rf warning_sim_out
          python gold_axis_2026/tools/warning_only_100usd_2026_v1.py --external-spine /tmp/external_daily.csv --out warning_sim_out
      - name: Freeze result
        run: |
          cp warning_sim_out/* gold_axis_2026/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_2026_100USD_WARNING_ONLY_SIM_V1_RESULT_2026-09-24.json
          git commit -m "Freeze 2026 100USD warning-only simulation V1"
          git push origin HEAD:gold-direction-history-robustness-v1-20260924
