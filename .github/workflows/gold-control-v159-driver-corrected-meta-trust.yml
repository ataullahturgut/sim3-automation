name: Gold Control V1.59 driver-corrected meta-trust thesis research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v159_thesis/**"
      - "gold_axis_2026/tests/test_v159_driver_corrected_meta_trust.py"
      - "gold_axis_2026/GOLD_CONTROL_V159_DRIVER_CORRECTED_META_TRUST_METHOD_MEMO_2026-09-12.md"
      - ".github/workflows/gold-control-v159-driver-corrected-meta-trust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-corrected-meta-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 requests==2.32.5 pytest==8.4.2
      - name: Test V1.59 chronology, driver ontology and meta-trust semantics
        run: python -m pytest -q gold_axis_2026/tests/test_v159_driver_corrected_meta_trust.py
      - name: Run V1.59 frozen retrospective successor audit
        run: python -m gold_axis_2026.v159_thesis.run_v159_entry
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v159-driver-corrected-meta-trust-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v159_thesis/
