name: Gold Intramonth Opportunity Stage3

on:
  push:
    branches:
      - gold-midas-headswap-v1-20260925
    paths:
      - 'gold_axis_2026/tools/gold_intramonth_opportunity_stage3.py'
      - '.github/workflows/gold-intraday-opportunity-stage3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas requests scikit-learn
      - name: Run strict Stage3 predictability screen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: stage3_out
        run: python gold_axis_2026/tools/gold_intramonth_opportunity_stage3.py
      - name: Upload Stage3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-intramonth-opportunity-stage3
          path: stage3_out/
          retention-days: 90
