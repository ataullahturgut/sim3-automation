name: Gold Control V1.30 Recovery Status Patch Once

on:
  push:
    branches: [gold-control-v130-recovery-status-hardening]
    paths:
      - '.github/workflows/gold-control-v130-recovery-status-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v130-recovery-status-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply frozen recovery-status replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'REPLACE_COUNT_MISMATCH:{path}:{old!r}:expected={expected}:actual={count}')
              p.write_text(text.replace(old, new))

          # Shadow-context fallback semantics.
          p = 'gold_axis_2026/apps/decision_source.py'
          replace_exact(p,
              'EMERGENCY_CONTEXT_STATUS = "BLOCKED_NO_PERSISTED_MONTHLY_PRICE_REFERENCE"',
              'EMERGENCY_CONTEXT_STATUS = "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE"')
          replace_exact(p,
              'BOCPD_CONTEXT_STATUS = "BLOCKED_EXACT_FORWARD_BOCPD_RULE_NOT_RECOVERED"',
              'BOCPD_CONTEXT_STATUS = "BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED"')
          replace_exact(p,
              'MACRO_EVENT_CONTEXT_STATUS = "BLOCKED_NOT_FULLY_RECOVERED"',
              'MACRO_EVENT_CONTEXT_STATUS = "BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED"')

          # Registry defaults and recovered-version semantics.
          p = 'gold_axis_2026/apps/engine_observability_contract.py'
          replace_exact(p, '"default_status": "BLOCKED_NOT_PROVEN_EXECUTABLE"',
              '"default_status": "BLOCKED_EXACT_REPLICATION_AND_PIT_SOURCE_CONTRACT_NOT_PROVEN"')
          replace_exact(p, '"version": "NOT_FULLY_RECOVERED"',
              '"version": "MACRO_EVENT_PARTIAL_RULE_RECOVERED_SOURCE_CONTRACT_BLOCKED"')
          replace_exact(p, '"default_status": "BLOCKED_NOT_FULLY_RECOVERED"',
              '"default_status": "BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED"')
          replace_exact(p, '"version": "R4_2_MONTHLY_REFERENCE_EMERGENCY_BRIDGE_PASS"',
              '"version": "R4_2_PATCH_EXPERT_REFERENCE_READY_V1"', expected=2)
          replace_exact(p, '"default_status": "BLOCKED_NO_PERSISTED_MONTHLY_PRICE_REFERENCE"',
              '"default_status": "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE"', expected=2)
          replace_exact(p, '"version": "NOT_RECOVERED_EXACT_FORWARD_RULE"',
              '"version": "BOCPD_RETURN_R1_PARTIAL_RECOVERY_L36_THRESHOLD_LOCKED"')
          replace_exact(p, '"default_status": "BLOCKED_EXACT_FORWARD_BOCPD_RULE_NOT_RECOVERED"',
              '"default_status": "BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED"')

          # Regression fixture/expectations must match production authority.
          p = 'gold_axis_2026/apps/test_engine_observability_contract.py'
          replace_exact(p, 'BLOCKED_NOT_PROVEN_EXECUTABLE',
              'BLOCKED_EXACT_REPLICATION_AND_PIT_SOURCE_CONTRACT_NOT_PROVEN', expected=3)
          replace_exact(p, 'BLOCKED_NOT_FULLY_RECOVERED',
              'BLOCKED_EXACT_MACRO_SCORE_CONSENSUS_AND_VINTAGE_CONTRACT_NOT_RECOVERED', expected=3)
          replace_exact(p, 'BLOCKED_NO_PERSISTED_MONTHLY_PRICE_REFERENCE',
              'WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE', expected=4)
          replace_exact(p, 'BLOCKED_EXACT_FORWARD_BOCPD_RULE_NOT_RECOVERED',
              'BLOCKED_EXACT_BOCPD_PRIOR_AND_RESET_SCORE_IMPLEMENTATION_NOT_RECOVERED', expected=3)
          replace_exact(p,
              '"EMERGENCY_LEVEL": ("BLOCKED", "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE", False),',
              '"EMERGENCY_LEVEL": ("WAITING", "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE", False),')
          replace_exact(p,
              '"EMERGENCY_REVERSAL": ("BLOCKED", "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE", False),',
              '"EMERGENCY_REVERSAL": ("WAITING", "WAITING_FIRST_GOVERNED_PATCH_EXPERT_REFERENCE", False),')
          replace_exact(p,
              'assert ENGINE_OBSERVABILITY_CONTRACT == "ALL_GOVERNED_FORECAST_DIRECTION_ENGINES_VISIBLE_V1"',
              'assert ENGINE_OBSERVABILITY_CONTRACT == "ALL_GOVERNED_FORECAST_DIRECTION_ENGINES_VISIBLE_V2_DUAL_STATE_REFERENCE"')
          replace_exact(p, 'assert counts["blocked"] == 5', 'assert counts["blocked"] == 3')
          replace_exact(p, 'assert counts["waiting"] == 3', 'assert counts["waiting"] == 5')
          PY
      - name: Compile changed app modules
        run: |
          python -m py_compile \
            gold_axis_2026/apps/decision_source.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/test_engine_observability_contract.py
      - name: Run engine observability regression
        run: |
          python -m pip install -q pytest
          cd gold_axis_2026/apps
          pytest -q test_engine_observability_contract.py
      - name: Verify frozen recovery audit locks
        run: |
          grep -q 'FROZEN_RECOVERY_AUDIT_V1' gold_axis_2026/GOLD_CONTROL_V130_UNRESOLVED_ENGINE_RECOVERY_AUDIT_2026-09-04.md
          grep -q 'AUTO_SELECTOR = OFF' gold_axis_2026/GOLD_CONTROL_V130_UNRESOLVED_ENGINE_RECOVERY_AUDIT_2026-09-04.md
          grep -q 'AUTO_ENSEMBLE = OFF' gold_axis_2026/GOLD_CONTROL_V130_UNRESOLVED_ENGINE_RECOVERY_AUDIT_2026-09-04.md
          grep -q 'ACTIVE = 4' gold_axis_2026/GOLD_CONTROL_V130_UNRESOLVED_ENGINE_RECOVERY_AUDIT_2026-09-04.md
          grep -q 'WAITING = 5' gold_axis_2026/GOLD_CONTROL_V130_UNRESOLVED_ENGINE_RECOVERY_AUDIT_2026-09-04.md
          grep -q 'BLOCKED = 3' gold_axis_2026/GOLD_CONTROL_V130_UNRESOLVED_ENGINE_RECOVERY_AUDIT_2026-09-04.md
          echo RECOVERY_STATUS_AUTHORITY_LOCK_PASS
      - name: Commit patched app status semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gold-control-ops'
          git config user.email 'gold-control-ops@users.noreply.github.com'
          git add gold_axis_2026/apps/decision_source.py \
                  gold_axis_2026/apps/engine_observability_contract.py \
                  gold_axis_2026/apps/test_engine_observability_contract.py
          git diff --cached --quiet && { echo NO_PATCH_CHANGES; exit 1; }
          git commit -m 'fix: align unresolved engine recovery states'
          git push origin HEAD:gold-control-v130-recovery-status-hardening
