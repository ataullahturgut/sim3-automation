name: Gold Monthly ANFIS PSO Stability V6
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_anfis_meta_screen_v6.py
      - .github/workflows/gold-monthly-anfis-pso-v6.yml
permissions: {contents: read}
jobs:
  pso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy psycopg[binary] scikit-learn scipy
      - run: python -m py_compile gold_axis_2026/tools/vw_midas_anfis_meta_screen_v6.py
      - name: Run
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_anfis_meta_screen_v6.py --method PSO
      - name: Gate
        run: python -c "import json,math; r=json.load(open('anfis_hybrid_pso_result.json')); z=r['dev']['rows']+r['transport_2025']['rows']+r['stress_2026']['rows']; assert all(math.isfinite(x['forecast']) and abs(x['pred_log_return_gold'])<1 for x in z); print('PASS')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: anfis-pso-v6, path: 'anfis_hybrid_*_result.json', if-no-files-found: error}
