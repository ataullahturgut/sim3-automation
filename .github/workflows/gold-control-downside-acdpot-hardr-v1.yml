name: Gold Control Downside ACDPOT + HARDR V1

on:
  push:
    branches:
      - gold-downside-acdpot-hardr-v1-20260921
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_PREREG_2026-09-21.md'
      - 'gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_PREREG_2026-09-21.md'
      - 'gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1.py'
      - 'gold_axis_2026/tools/downside_har_dr_xau_v1.py'
      - '.github/workflows/gold-control-downside-acdpot-hardr-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-downside-acdpot-hardr-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-downside-acdpot-hardr-v1-20260921
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'psycopg[binary]>=3.2,<4'

      - name: Compile implementations
        run: |
          python -m py_compile gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1.py
          python -m py_compile gold_axis_2026/tools/downside_har_dr_xau_v1.py

      - name: Assert read-only implementations
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table'             gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1.py
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table'             gold_axis_2026/tools/downside_har_dr_xau_v1.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/downside_har_dr_xau_v1.py

      - name: Run both pre-2025 freezes
        run: |
          rm -rf downside_pre2025
          mkdir -p downside_pre2025/acd downside_pre2025/har
          python gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1.py             --stage pre2025 --outdir downside_pre2025/acd
          python gold_axis_2026/tools/downside_har_dr_xau_v1.py             --stage pre2025 --outdir downside_pre2025/har

      - name: Freeze pre-2025 evidence before challenge
        run: |
          cp downside_pre2025/acd/* gold_axis_2026/
          cp downside_pre2025/har/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_FROZEN_CONFIG_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_PRE2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_2024_FORECASTS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_FROZEN_CONFIG_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_PRE2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_2024_FORECASTS_2026-09-21.csv
          git commit -m 'Freeze ACD-POT and HAR-DR pre-2025 evidence'
          git push origin HEAD:gold-downside-acdpot-hardr-v1-20260921

      - name: Run unchanged 2025 challenges
        run: |
          rm -rf downside_2025
          mkdir -p downside_2025/acd downside_2025/har
          python gold_axis_2026/tools/downside_discrete_burr_lacdpot_hazard_xau_v1.py             --stage 2025             --outdir downside_2025/acd             --config gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_FROZEN_CONFIG_2026-09-21.json             --pre-result gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_PRE2025_RESULT_2026-09-21.json
          python gold_axis_2026/tools/downside_har_dr_xau_v1.py             --stage 2025             --outdir downside_2025/har             --config gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_FROZEN_CONFIG_2026-09-21.json             --pre-result gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_PRE2025_RESULT_2026-09-21.json

      - name: Freeze 2025 challenge outputs
        run: |
          cp downside_2025/acd/* gold_axis_2026/
          cp downside_2025/har/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_DISCRETE_BURR_LACDPOT_HAZARD_XAU_V1_2025_FORECASTS_2026-09-21.csv             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_2025_RESULT_2026-09-21.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_HAR_DR_XAU_V1_2025_FORECASTS_2026-09-21.csv
          git commit -m 'Freeze ACD-POT and HAR-DR 2025 challenges'
          git push origin HEAD:gold-downside-acdpot-hardr-v1-20260921

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-downside-acdpot-hardr-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            downside_pre2025/
            downside_2025/
