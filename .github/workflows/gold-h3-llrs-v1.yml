name: Gold H3 LLRS V1
on:
  push:
    branches: [gold-h3-llrs-v1-20261004]
    paths:
      - 'gold_axis_2026/tools/gold_h3_llrs_v1.py'
      - '.github/workflows/gold-h3-llrs-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-h3-llrs-v1-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check numpy pandas scikit-learn requests
      - run: python gold_axis_2026/tools/gold_h3_llrs_v1.py
      - name: Record LLRS evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gold_axis_2026/GOLD_H3_LLRS_V1_HOURLY_PANEL_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_LLRS_V1_ORIGIN_SCORES_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_LLRS_V1_THRESHOLD_GRID_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_LLRS_V1_BLOCK_METRICS_2026-10-04.csv \
            gold_axis_2026/GOLD_H3_LLRS_V1_SUMMARY_2026-10-04.json \
            gold_axis_2026/GOLD_H3_LLRS_V1_RESULT_2026-10-04.md \
            gold_axis_2026/GOLD_H3_LLRS_V1_PROSPECTIVE_FREEZE_2026-10-04.json
          if ! git diff --cached --quiet; then
            git commit -m "Record LLRS-H3 V1 development evidence"
            git pull --rebase origin gold-h3-llrs-v1-20261004
            git push origin HEAD:gold-h3-llrs-v1-20261004
          fi
