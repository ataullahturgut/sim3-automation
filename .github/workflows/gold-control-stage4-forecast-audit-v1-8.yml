name: Gold Control Stage4 Forecast Audit v1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-stage4-forecast-audit-v1-8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0
      - name: Apply audited Stage4 forecast dependency contract
        run: python gold_axis_2026/tools/apply_stage4_forecast_audit_v1_8.py
      - name: Verify exact changed scope and blocker truth
        run: |
          grep -Fq '**Manifest version:** 1.8' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'PATCH_R1_CURRENT_ISSUER_NOT_PROVEN' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'VW_EXECUTABLE_REPRODUCTION_BLOCKED_NOT_PROVEN' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -Fq 'CANONICAL_XAU_HISTORY_BACKFILL_NOT_YET_SUCCESS' gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md
          grep -Fq '**Canonicalization version:** 1.2' gold_axis_2026/GOLD_CONTROL_FORECAST_CANONICALIZATION.md
          grep -Fq 'BLOCKED_WITH_EXPLICIT_CURRENT_ISSUER_AND_MONTHLY_CONTEXT_GAPS' gold_axis_2026/GOLD_CONTROL_STAGE4_FORECAST_ISSUANCE_AUDIT_2026-09-01.md
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "gold_axis_2026/GOLD_CONTROL_FORECAST_CANONICALIZATION.md gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md gold_axis_2026/GOLD_CONTROL_STAGE4_FORECAST_ISSUANCE_AUDIT_2026-09-01.md gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md "
      - name: Commit manifest v1.8 to canonical branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md \
                  gold_axis_2026/GOLD_CONTROL_STAGE4_STATUS_2026-09-01.md \
                  gold_axis_2026/GOLD_CONTROL_FORECAST_CANONICALIZATION.md \
                  gold_axis_2026/GOLD_CONTROL_STAGE4_FORECAST_ISSUANCE_AUDIT_2026-09-01.md
          git commit -m "gold-control: expose Stage4 forecast and monthly-context blockers v1.8"
          git push origin HEAD:gold-r4-direction-engine
