name: Gold Control v1.42 Bind Production Snapshot Once

on:
  push:
    branches:
      - gold-control-current-surface-v142
    paths:
      - '.github/workflows/gold-control-v142-bind-production-snapshot-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-current-surface-v142
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q 'psycopg[binary]>=3.2,<4' pytest pandas numpy
      - name: Export V142 production snapshot read-only
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing' && exit 1)
          python gold_axis_2026/tools/export_production_display_snapshot.py --out gold_axis_2026/apps/production_display_snapshot.json
      - name: Validate production snapshot and current surface
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import json
          from pathlib import Path
          from production_display_snapshot import CURRENT_SURFACE_CONTRACT, SNAPSHOT_CONTRACT, validate_production_display_snapshot
          snap=json.loads(Path('gold_axis_2026/apps/production_display_snapshot.json').read_text(encoding='utf-8'))
          validate_production_display_snapshot(snap)
          assert snap['snapshot_contract'] == SNAPSHOT_CONTRACT == 'GOLD_CONTROL_CURRENT_PRODUCTION_DISPLAY_SNAPSHOT_V142'
          assert snap['current_surface_contract'] == CURRENT_SURFACE_CONTRACT == 'GOLD_CONTROL_CURRENT_SURFACE_V142'
          assert len(snap['runtime']) == 12
          assert len(snap['features']) == 7
          assert snap['source_surface']['current_source_count'] == 45
          assert snap['source_surface']['disallowed_current_source_count'] == 0
          assert snap['authority_store_counts'] == {
              'monthly_forecast_contracts': 0,
              'decision_signal_snapshots': 0,
              'decision_runs': 0,
              'decision_events': 0,
          }
          print('V142_PRODUCTION_SNAPSHOT_PASS')
          PY
          python gold_axis_2026/tools/audit_current_surface_v142.py
      - name: Run V142 unit tests
        run: |
          PYTHONPATH=gold_axis_2026/apps pytest -q gold_axis_2026/apps/test_engine_observability_contract.py gold_axis_2026/apps/test_production_display_snapshot.py
          PYTHONPATH=gold_axis_2026/data_pipeline pytest -q gold_axis_2026/data_pipeline/test_data_evidence_spine_runtime_bootstrap.py gold_axis_2026/data_pipeline/test_multi_expert_forecast.py
      - name: Commit bound production snapshot
        run: |
          git config user.name gold-control-governance-bot
          git config user.email gold-control-governance-bot@users.noreply.github.com
          git add gold_axis_2026/apps/production_display_snapshot.json
          git commit -m 'Gold Control v1.42: bind production current snapshot'
          git push origin HEAD:gold-control-current-surface-v142
