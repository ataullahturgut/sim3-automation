name: Gold Control Emergency Reversal Volnorm V1 Formation

on:
  push:
    branches: [gold-emergency-reversal-volnorm-v1]
    paths:
      - 'gold_axis_2026/tools/emergency_reversal_volnorm_successor_v1.py'
      - 'gold_axis_2026/tools/run_emergency_reversal_volnorm_v1_formation.py'
      - 'gold_axis_2026/tests/test_emergency_reversal_volnorm_successor_v1.py'
      - 'gold_axis_2026/GOLD_CONTROL_EMERGENCY_REVERSAL_VOLNORM_SUCCESSOR_V1_PREREG_2026-09-15.md'
      - '.github/workflows/gold-control-emergency-reversal-volnorm-v1-formation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependencies
        run: pip install numpy pandas requests pytest
      - name: Run unit tests
        run: pytest -q gold_axis_2026/tests/test_emergency_reversal_volnorm_successor_v1.py
      - name: Prove no 2025 literal in formation runner data boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gold_axis_2026/tools/run_emergency_reversal_volnorm_v1_formation.py').read_text()
          assert 'FORMATION_YEARS = (2022, 2023, 2024)' in p
          assert '2025_NOT_READ' in p
          print('formation boundary source check PASS')
          PY
      - name: Run guarded pre-2025 formation only
        run: |
          test -n "$TWELVE_DATA_API_KEY"
          python gold_axis_2026/tools/run_emergency_reversal_volnorm_v1_formation.py \
            --output-dir /tmp/emergency-reversal-volnorm-v1-formation
      - name: Verify formation accounting
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/emergency-reversal-volnorm-v1-formation/formation_summary.json'))
          assert p['status'] == 'FORMATION_PASS_2025_NOT_READ'
          assert p['formation_years'] == [2022, 2023, 2024]
          assert p['last_input_date'] < '2025-01-01'
          assert p['future_2025_observations_consumed'] == 0
          assert p['production_write'] == 'NONE'
          assert p['reversal_alerts'] >= 3
          assert p['alert_rate'] < 0.20
          for y in ('2022','2023','2024'):
              row=p['source']['coverage'][y]
              assert row['ratio'] >= 0.90
          print(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emergency-reversal-volnorm-v1-formation
          retention-days: 90
          if-no-files-found: error
          path: /tmp/emergency-reversal-volnorm-v1-formation/
