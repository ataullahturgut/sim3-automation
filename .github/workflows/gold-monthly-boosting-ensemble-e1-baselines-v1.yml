name: Gold Monthly Boosting Ensemble E1 Baselines V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-boosting-ensemble-e1-baselines-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensemble-e1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_boosting_ensemble_e1_baselines_v1.py
      - name: Run E1
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_boosting_ensemble_e1_baselines_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gold_monthly_boosting_ensemble_e1_baselines_v1_result.json'))
          c=r['contract']
          assert r['scope']=='BOOSTING_ENSEMBLE_E1_BASELINES_V1'
          assert c['dev']=='2022-04..2024-12'
          assert c['dev_n']==33
          assert c['pool_frozen_before_ensemble_evaluation'] is True
          assert c['optimized_simplex']=='NOT_AUTHORIZED_NOT_RUN'
          assert c['subset_search']=='NONE'
          assert c['random_split']=='NONE'
          assert c['2025_role']=='NOT_OPENED_NOT_EVALUATED'
          assert c['2026_role']=='QUARANTINED_NOT_USED'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert set(r['pools'])=={'FULL5','REDUCED4'}
          for p in r['pools'].values():
              assert set(p['variants'])=={'EQUAL_MEAN','MEDIAN','PREQUENTIAL_INVERSE_MAE'}
              for v in p['variants'].values():
                  assert v['metrics']['n']==33
          print('BOOSTING_ENSEMBLE_E1_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-boosting-ensemble-e1-baselines-v1
          path: gold_monthly_boosting_ensemble_e1_baselines_v1_result.json
          if-no-files-found: error
