name: Gold Control Market Shock Direction Audit V1

on:
  push:
    branches:
      - gold-control-market-shock-direction-audit-v1
    paths:
      - '.github/workflows/gold-control-market-shock-direction-audit-v1.yml'
      - 'gold_axis_2026/tools/market_shock_direction_audit_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-control-market-shock-direction-audit-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TWELVE_MIN_REQUEST_INTERVAL_SECONDS: '9.0'
      GOLD_CODE_SHA: ${{ github.sha }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-market-shock-direction-audit-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit runtime
        run: pip install -q pandas numpy scipy requests
      - name: Require protected Twelve credential
        run: test -n "$TWELVE_DATA_API_KEY"
      - name: Compile audit
        run: |
          python -m py_compile gold_axis_2026/tools/market_shock_challenger_v1.py
          python -m py_compile gold_axis_2026/tools/market_shock_challenger_v1_lm_sn_fix.py
          python -m py_compile gold_axis_2026/tools/market_shock_direction_audit_v1.py
      - name: Run independent realized-move and forward-direction audit
        run: |
          python -m gold_axis_2026.tools.market_shock_direction_audit_v1 \
            --start '2020-04-06 00:00:00' \
            --end '2026-08-31 23:59:59' \
            --output market_shock_direction_audit_v1.json
      - name: Upload aggregate research evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-market-shock-direction-audit-v1
          path: market_shock_direction_audit_v1.json
          if-no-files-found: error
