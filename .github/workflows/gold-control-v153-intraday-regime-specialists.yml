name: Gold Control V1.53 intraday regime specialists thesis research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v153_thesis/**"
      - "gold_axis_2026/tests/test_v153_intraday_regime_specialists.py"
      - "gold_axis_2026/GOLD_CONTROL_V153_INTRADAY_REGIME_SPECIALISTS_METHOD_MEMO_2026-09-12.md"
      - ".github/workflows/gold-control-v153-intraday-regime-specialists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intraday-regime-specialists:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 pytest==8.4.2
      - name: Test V1.53 governance and chronology invariants
        run: python -m pytest -q gold_axis_2026/tests/test_v153_intraday_regime_specialists.py
      - name: Run V1.53 frozen intraday specialist retrospective diagnostics
        run: python -m gold_axis_2026.v153_thesis.run_v153_intraday_regime_specialists
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v153-intraday-regime-specialists-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v153_thesis/
