name: Gold Control V1.57 break-aware realized-moments thesis research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v157_thesis/**"
      - "gold_axis_2026/tests/test_v157_breakaware_realized_moments.py"
      - "gold_axis_2026/GOLD_CONTROL_V157_BREAKAWARE_REALIZED_MOMENTS_METHOD_MEMO_2026-09-12.md"
      - ".github/workflows/gold-control-v157-breakaware-realized-moments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breakaware-realized-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 pytest==8.4.2
      - name: Test V1.57 chronology, break gating, selective semantics and inference
        run: python -m pytest -q gold_axis_2026/tests/test_v157_breakaware_realized_moments.py
      - name: Run V1.57 frozen 2025/2026 retrospective audit
        run: python -m gold_axis_2026.v157_thesis.run_v157_entry
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v157-breakaware-realized-moments-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v157_thesis/
