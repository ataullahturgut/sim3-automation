name: Gold Monthly SVR DWT Stage2B Representation V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - .github/workflows/gold-monthly-svr-dwt-stage2b-representation-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage2b:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: >
          python -m pip install
          'numpy==2.4.6'
          'psycopg[binary]==3.3.6'
          'scikit-learn==1.9.1'
          'xgboost==3.4.1'
          'lightgbm==4.7.0'
          'catboost==1.2.10'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_svr_dwt_stage2b_representation_v1.py
      - name: Run Stage 2B
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_svr_dwt_stage2b_representation_v1.py
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('gold_monthly_svr_dwt_stage2b_representation_v1_result.json'))
          assert r['scope']=='STAGE2B_REPRESENTATION_ABLATION_DEV_ONLY_V1'
          assert r['contract']['kernel']=='rbf'
          assert r['contract']['C']==1.0
          assert r['contract']['epsilon']==0.1
          assert r['contract']['2025_role']=='LOCKED_NOT_OPENED'
          assert r['contract']['2026_role']=='QUARANTINED_NOT_USED'
          assert r['contract']['random_split']=='NONE'
          assert r['contract']['database']=='READ_ONLY'
          assert r['authority_invariants_before']==r['authority_invariants_after']
          assert r['determinism']['status']=='PASS'
          assert set(r['results'])=={'CURRENT8','RAW_LEVEL_LAGS8','SIMPLE_RETURNS8','DAILY_SUMMARY12','MIXED20'}
          for rep,v in r['results'].items():
              assert v['metrics']['n']==33
              assert len(v['rows'])==33
              assert all(x['train_last'] < x['target'] for x in v['rows'])
          print('SVR_DWT_STAGE2B_GATE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-monthly-svr-dwt-stage2b-representation-v1
          path: |
            gold_monthly_svr_dwt_stage2b_representation_v1_result.json
            gold_axis_2026/GOLD_MONTHLY_SVR_DWT_STAGE2B_REPRESENTATION_RESULT_2026-09-28.md
          if-no-files-found: error
      - name: Commit Stage 2B report
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_MONTHLY_SVR_DWT_STAGE2B_REPRESENTATION_RESULT_2026-09-28.md
          if git diff --cached --quiet; then
            echo "No report change"
          else
            git commit -m "Record SVR Stage 2B representation result"
            git push origin HEAD:gold-midas-headswap-v1-20260925
          fi
