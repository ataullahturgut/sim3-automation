name: Gold Control Current App Smoke

on:
  push:
    branches:
      - gold-r4-direction-engine
      - gold-control-clean-current-surface-v141
    paths:
      - 'gold_axis_2026/apps/**'
      - 'gold_axis_2026/tools/export_production_display_snapshot.py'
      - '.github/workflows/gold-control-app-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current app dependencies
        run: pip install -r gold_axis_2026/apps/requirements.txt pytest
      - name: Compile current app graph
        run: |
          python -m py_compile \
            gold_axis_2026/apps/gold_control.py \
            gold_axis_2026/apps/gold_control_mobile.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/live_sources.py \
            gold_axis_2026/apps/runtime_source.py \
            gold_axis_2026/apps/production_display_snapshot.py \
            gold_axis_2026/tools/export_production_display_snapshot.py
      - name: Run current app contract tests
        run: |
          cd gold_axis_2026/apps
          pytest -q test_engine_observability_contract.py test_production_display_snapshot.py
      - name: Validate committed current snapshot
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          from production_display_snapshot import load_production_display_snapshot
          snapshot=load_production_display_snapshot()
          assert len(snapshot['runtime']) == 12
          assert len(snapshot['features']) == 7
          assert all(r['runtime_status'] == 'ACTIVE' for r in snapshot['runtime'])
          assert all((r.get('metadata') or {}).get('current_surface_contract') == 'GOLD_CONTROL_CURRENT_SURFACE_V141' for r in snapshot['runtime'])
          print('CURRENT_APP_SNAPSHOT_PASS')
          PY
      - name: Production current-surface read-only smoke
        if: ${{ env.NEON_DATABASE_URL != '' }}
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import os
          from runtime_source import fetch_runtime_observability
          state=fetch_runtime_observability(os.environ['NEON_DATABASE_URL'])
          assert state['runtime_complete'] is True
          assert state['integrity_ok'] is True
          assert state['runtime_engine_count'] == 12
          assert state['context_feature_count'] == 7
          assert all(r['runtime_status'] == 'ACTIVE' for r in state['runtime'])
          print('CURRENT_APP_PRODUCTION_READ_PASS')
          PY
      - name: Live display connectivity diagnostic
        continue-on-error: true
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          from live_sources import fetch_gvz_latest, fetch_xau_spot
          xau=fetch_xau_spot(); assert float(xau['price']) > 0
          gvz=fetch_gvz_latest(); assert float(gvz['close']) > 0
          print('CURRENT_LIVE_DISPLAY_CONNECTIVITY_PASS')
          PY
