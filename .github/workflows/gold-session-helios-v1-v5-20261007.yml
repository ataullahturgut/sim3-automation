name: Gold Session HELIOS V1-V5 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_helios_v1_v5_20261007.py'
      - '.github/workflows/gold-session-helios-v1-v5-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'psycopg[binary]>=3.2,<4'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_session_helios_v1_v5_20261007.py
      - name: Run HELIOS
        run: python gold_axis_2026/tools/gold_session_helios_v1_v5_20261007.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          O=gold_axis_2026/SESSION_HELIOS_V1_V5_OUT
          cp "$O/summary.json" gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_SUMMARY_2026-10-07.json
          cp "$O/result.md" gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_RESULT_2026-10-07.md
          cp "$O/stage2_dev_metrics.csv" gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_STAGE2_DEV_METRICS_2026-10-07.csv
          cp "$O/stage2_eligibility.csv" gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_STAGE2_ELIGIBILITY_2026-10-07.csv
          cp "$O/stage3_2025_metrics.csv" gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_STAGE3_2025_METRICS_2026-10-07.csv
          cp "$O/stage4_2026_status.json" gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_STAGE4_2026_STATUS_2026-10-07.json
          git add gold_axis_2026/GOLD_SESSION_HELIOS_V1_V5_*
          if ! git diff --cached --quiet; then
            git commit -m "Record session HELIOS V1-V5 stage2-stage4 result"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-session-helios-v1-v5-20261007
          path: gold_axis_2026/SESSION_HELIOS_V1_V5_OUT/
          if-no-files-found: warn
          retention-days: 90
