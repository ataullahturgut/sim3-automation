name: Gold Control Direction History Robustness V1
on:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DIRECTION_ENGINE_ESTIMATION_WINDOW_ROBUSTNESS_V1_PREREG_2026-09-24.md'
      - 'gold_axis_2026/tools/direction_engine_estimation_window_robustness_v1.py'
      - '.github/workflows/gold-control-direction-history-robustness-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-direction-history-robustness-v1
  cancel-in-progress: false

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require research DB credential
        run: test -n "$NEON_DATABASE_URL"
      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'psycopg[binary]>=3.2,<4'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/direction_engine_estimation_window_robustness_v1.py
      - name: Assert read-only and locked-period exclusion
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table' gold_axis_2026/tools/direction_engine_estimation_window_robustness_v1.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/direction_engine_estimation_window_robustness_v1.py
          grep -n "2025-01-01" gold_axis_2026/tools/direction_engine_estimation_window_robustness_v1.py
      - name: Run pre-2025 robustness and structural-break analysis
        run: |
          rm -rf history_robustness_out
          python gold_axis_2026/tools/direction_engine_estimation_window_robustness_v1.py
      - name: Freeze research outputs
        run: |
          cp history_robustness_out/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_DIRECTION_ENGINE_ESTIMATION_WINDOW_ROBUSTNESS_V1_*
          git commit -m 'Freeze pre-2025 direction history robustness V1 results'
          git push origin HEAD:gold-direction-history-robustness-v1-20260924
      - uses: actions/upload-artifact@v4
        with:
          name: gold-control-direction-history-robustness-v1
          retention-days: 30
          if-no-files-found: error
          path: history_robustness_out/
