name: Gold Control V1.30 Current-Month Reference Regression

on:
  push:
    branches:
      - gold-control-v130-current-month-replay-context-fix
      - gold-r4-direction-engine
      - gold-r4-direction-engine-ui-v122-final
    paths:
      - '.github/workflows/gold-control-v130-current-month-reference-regression.yml'
      - 'gold_axis_2026/apps/gold_control_mobile_v1.py'
      - 'gold_axis_2026/apps/mobile_viewport_qa.py'
      - 'gold_axis_2026/apps/aug31_state_replay_source.py'
      - 'gold_axis_2026/apps/aug31_state_replay_snapshot.json'
      - 'gold_axis_2026/apps/forecast_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install locked runtime
        run: |
          pip install -r gold_axis_2026/apps/requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Compile and deterministic contracts
        run: |
          python -m py_compile gold_axis_2026/apps/gold_control_mobile_v1.py gold_axis_2026/apps/mobile_viewport_qa.py gold_axis_2026/apps/aug31_state_replay_source.py
          cd gold_axis_2026/apps
          pytest -q test_mobile_ui_contract.py test_engine_observability_contract.py test_aug31_state_replay_source.py test_production_display_snapshot.py
      - name: Read-only production current-month evidence audit
        run: |
          test -n "$NEON_DATABASE_URL"
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import os
          from aug31_state_replay_source import fetch_aug31_state_replay
          from forecast_source import TRACK_HISTORICAL_REPLAY, fetch_latest_expert_forecasts
          s=fetch_aug31_state_replay(os.environ['NEON_DATABASE_URL'])
          assert s['target_context']=='2026-09'
          assert s['state_as_of']=='2026-08-31T21:00:00+00:00'
          assert s['evidence_class']=='HISTORICAL_REPLAY'
          assert s['prospective_h1_claim'] is False
          assert s['canonical_authority'] is False
          assert s['monthly_direction_3m']=='DOWN'
          assert s['fast_state']=='ROBUST_UP'
          assert s['slow_state']=='ROBUST_UP'
          rows=fetch_latest_expert_forecasts(os.environ['NEON_DATABASE_URL'],TRACK_HISTORICAL_REPLAY)
          by={r['expert_id']:r for r in rows}
          assert abs(float(by['MOMENTUM_3M']['forecast_value'])-4345.814584037808)<1e-9
          assert abs(float(by['RANDOM_WALK']['forecast_value'])-4397.305673870967)<1e-9
          assert all(str(r['target_month'])[:7]=='2026-09' for r in rows)
          assert all(r['evidence_class']=='HISTORICAL_REPLAY' for r in rows)
          assert all(r['canonical_authority'] is False for r in rows)
          print('V130_CURRENT_MONTH_REFERENCE_DB_AUDIT_PASS writes=NONE')
          PY
      - name: Production-backed 390x844 browser QA
        run: |
          rm -rf /tmp/gold_current_month && mkdir -p /tmp/gold_current_month
          streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8561 --server.address 127.0.0.1 >/tmp/gold_current_month.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8561/_stcore/health >/dev/null && break; sleep 1; done
          python gold_axis_2026/apps/mobile_viewport_qa.py --url http://127.0.0.1:8561 --out /tmp/gold_current_month
          kill $PID || true; wait $PID || true
      - name: Exact Tahmin hero semantics
        run: |
          streamlit run gold_axis_2026/apps/gold_control.py --server.headless true --server.port 8562 --server.address 127.0.0.1 >/tmp/gold_current_month_exact.log 2>&1 &
          PID=$!
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8562/_stcore/health >/dev/null && break; sleep 1; done
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
            page.goto('http://127.0.0.1:8562',wait_until='domcontentloaded',timeout=60000)
            page.get_by_text('GOLD CONTROL',exact=False).first.wait_for(state='visible',timeout=45000)
            nav=page.locator('.st-key-gc_main_nav label[data-testid="stRadioOption"]')
            nav.filter(has_text=re.compile('Tahmin',re.I)).first.click()
            page.get_by_text('EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE',exact=True).first.wait_for(state='visible',timeout=20000)
            text=page.locator('body').inner_text()
            for x in ('4,345.81 / 4,397.31 USD','31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT','DOWN','ROBUST_UP','REPLAY · PROSPECTIVE ISSUED DEĞİL','Eylül kapanana kadar mevcut ay için referans/context olarak görünür kalırlar','NOT_ISSUED_MISSED_2026_08_31_ORIGIN'):
              assert x in text,x
            assert 'CANONICAL ORIGIN' not in text.split('GEÇMİŞ VE TAHMİN KARŞILAŞTIRMASI')[0]
            page.screenshot(path='/tmp/gold_current_month/tahmin_current_month_reference_390x844.png',full_page=False)
            b.close()
          print('V130_CURRENT_MONTH_REFERENCE_BROWSER_PASS')
          PY
          kill $PID || true; wait $PID || true
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v130-current-month-reference-390x844
          path: /tmp/gold_current_month/*.png
          if-no-files-found: error
          retention-days: 30
