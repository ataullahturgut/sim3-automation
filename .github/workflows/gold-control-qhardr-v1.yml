name: Gold Control QHAR-DR V1

on:
  push:
    branches:
      - gold-downside-qhardr-v1-20260922
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_PREREG_2026-09-22.md'
      - 'gold_axis_2026/tools/downside_qhar_dr_xau_v1.py'
      - '.github/workflows/gold-control-qhardr-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-control-qhardr-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-downside-qhardr-v1-20260922
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require research DB credential
        run: test -n "$NEON_DATABASE_URL"

      - name: Install frozen dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'psycopg[binary]>=3.2,<4'

      - name: Compile implementation
        run: python -m py_compile gold_axis_2026/tools/downside_qhar_dr_xau_v1.py

      - name: Assert read-only implementation
        run: |
          ! grep -Eini 'insert[[:space:]]+into|update[[:space:]]+[a-zA-Z_]|delete[[:space:]]+from|create[[:space:]]+table|drop[[:space:]]+table|alter[[:space:]]+table'             gold_axis_2026/tools/downside_qhar_dr_xau_v1.py
          grep -n 'default_transaction_read_only' gold_axis_2026/tools/downside_qhar_dr_xau_v1.py

      - name: Run pre-2025 freeze
        run: |
          rm -rf qhardr_pre2025
          mkdir -p qhardr_pre2025
          python gold_axis_2026/tools/downside_qhar_dr_xau_v1.py             --stage pre2025             --outdir qhardr_pre2025

      - name: Freeze pre-2025 evidence before challenge
        run: |
          cp qhardr_pre2025/* gold_axis_2026/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_FROZEN_CONFIG_2026-09-22.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_PRE2025_RESULT_2026-09-22.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_2024_FORECASTS_2026-09-22.csv
          git commit -m 'Freeze QHAR-DR pre-2025 evidence'
          git push origin HEAD:gold-downside-qhardr-v1-20260922

      - name: Run unchanged locked 2025 challenge
        run: |
          rm -rf qhardr_2025
          mkdir -p qhardr_2025
          python gold_axis_2026/tools/downside_qhar_dr_xau_v1.py             --stage 2025             --outdir qhardr_2025             --config gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_FROZEN_CONFIG_2026-09-22.json             --pre-result gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_PRE2025_RESULT_2026-09-22.json

      - name: Freeze challenge outputs
        run: |
          cp qhardr_2025/* gold_axis_2026/
          git add             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_2025_RESULT_2026-09-22.json             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_2025_FORECASTS_2026-09-22.csv             gold_axis_2026/GOLD_CONTROL_DOWNSIDE_QHAR_DR_XAU_V1_RESULT_2026-09-22.md
          git commit -m 'Freeze QHAR-DR 2025 challenge'
          git push origin HEAD:gold-downside-qhardr-v1-20260922

      - name: Upload reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-qhardr-v1
          retention-days: 30
          if-no-files-found: error
          path: |
            qhardr_pre2025/
            qhardr_2025/
