name: Gold Control XAU NY17 History Backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-xau-ny17-history-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require protected credentials
        run: |
          test -n "$NEON_DATABASE_URL"
          test -n "$TWELVE_DATA_API_KEY"
      - name: Backfill canonical NY17 July-August history and verify
        run: python gold_axis_2026/data_pipeline/twelve_xau_ny17_backfill.py --start 2026-07-01 --end 2026-08-31 --persist
