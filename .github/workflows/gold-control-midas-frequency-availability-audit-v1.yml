name: Gold Control MIDAS Frequency Availability Audit V1
on:
  workflow_dispatch:
  push:
    branches:
      - gold-direction-history-robustness-v1-20260924
    paths:
      - gold_axis_2026/tools/midas_frequency_availability_audit_v1.py
      - .github/workflows/gold-control-midas-frequency-availability-audit-v1.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-direction-history-robustness-v1-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require DB
        run: test -n "$NEON_DATABASE_URL"
      - name: Install
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run
        run: python gold_axis_2026/tools/midas_frequency_availability_audit_v1.py
      - name: Freeze
        run: |
          cp GOLD_CONTROL_MIDAS_FREQUENCY_AVAILABILITY_AUDIT_V1_RESULT_2026-09-24.json gold_axis_2026/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_CONTROL_MIDAS_FREQUENCY_AVAILABILITY_AUDIT_V1_RESULT_2026-09-24.json
          if ! git diff --cached --quiet; then
            git commit -m "Freeze MIDAS frequency availability audit"
            git push origin HEAD:gold-direction-history-robustness-v1-20260924
          fi
