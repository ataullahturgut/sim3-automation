name: Gold Short Horizon Global XAU Drift Audit R2

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_global_xau_drift_audit_r2.py'
      - '.github/workflows/gold-short-horizon-global-xau-drift-audit-r2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: global_xau_r2_drift_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' requests
      - name: Resolve artifacts
        id: aids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=gold-short-horizon-global-xau-readiness-r2&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id')"
          TID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=global-xau-r2-transport&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$RID"; test -n "$TID"
          echo "rid=$RID" >> "$GITHUB_OUTPUT"
          echo "tid=$TID" >> "$GITHUB_OUTPUT"
      - name: Run drift audit
        env:
          READINESS_ARTIFACT: ${{ steps.aids.outputs.rid }}
          TRANSPORT_ARTIFACT: ${{ steps.aids.outputs.tid }}
        run: python gold_axis_2026/tools/gold_short_horizon_global_xau_drift_audit_r2.py
      - name: Commit drift evidence
        run: |
          cp "$OUT_DIR/DRIFT_RESULT.md" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_DRIFT_RESULT_2026-10-02.md
          cp "$OUT_DIR/drift_summary.json" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_DRIFT_SUMMARY_2026-10-02.json
          cp "$OUT_DIR/feature_drift.csv" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_FEATURE_DRIFT_2026-10-02.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_*DRIFT*_2026-10-02.* gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_FEATURE_DRIFT_2026-10-02.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Global XAU R2 drift diagnostic"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        with:
          name: global-xau-r2-drift
          path: global_xau_r2_drift_out/
          retention-days: 90
