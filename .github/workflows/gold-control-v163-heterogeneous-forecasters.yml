name: Gold Control V1.63 heterogeneous forecasters research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v163_research/**"
      - "gold_axis_2026/tests/test_v163_heterogeneous_forecasters.py"
      - ".github/workflows/gold-control-v163-heterogeneous-forecasters.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heterogeneous-forecasters:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 psycopg[binary]==3.2.10 requests==2.32.5 pytest==8.4.2
      - name: Test V1.63 chronology, role and governance locks
        run: python -m pytest -q gold_axis_2026/tests/test_v163_heterogeneous_forecasters.py
      - name: Run V1.63 frozen retrospective forecaster audit
        run: python -m gold_axis_2026.v163_research.run_v163_heterogeneous_forecasters
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v163-heterogeneous-forecasters-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v163_research/
