name: Gold Short Horizon Global XAU Stage3 R2

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - 'gold_axis_2026/tools/gold_short_horizon_global_xau_stage3_r2.py'
      - '.github/workflows/gold-short-horizon-global-xau-stage3-r2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: global_xau_r2_stage3_out
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-midas-headswap-v1-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' requests
      - name: Resolve R2 Stage2 artifact
        id: aid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=global-xau-r2-stage2&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id')"
          test -n "$AID"
          echo "aid=$AID" >> "$GITHUB_OUTPUT"
      - name: Run R2 Stage3
        env:
          STAGE2_ARTIFACT: ${{ steps.aid.outputs.aid }}
        run: python gold_axis_2026/tools/gold_short_horizon_global_xau_stage3_r2.py
      - name: Commit R2 Stage3 evidence
        run: |
          cp "$OUT_DIR/STAGE3_RESULT.md" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE3_RESULT_2026-10-02.md
          cp "$OUT_DIR/stage3_summary.json" gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE3_SUMMARY_2026-10-02.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gold_axis_2026/GOLD_SHORT_HORIZON_GLOBAL_XAU_R2_STAGE3_*_2026-10-02.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Global XAU R2 Stage3 calibration"
          git pull --rebase origin gold-midas-headswap-v1-20260925
          git push origin HEAD:gold-midas-headswap-v1-20260925
      - uses: actions/upload-artifact@v4
        with:
          name: global-xau-r2-stage3
          path: global_xau_r2_stage3_out/
          retention-days: 90
