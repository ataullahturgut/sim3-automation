name: Gold Monthly H1 Neon Source Contract V2
on:
  push:
    branches:
      - gold-monthly-h1-neon-source-adapter-v2-20261023
    paths:
      - gold_axis_2026/tools/gold_monthly_h1_neon_source_v2.py
      - gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py
      - gold_axis_2026/tools/test_gold_monthly_h1_neon_source_v2.py
      - gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
      - .github/workflows/gold-monthly-h1-neon-source-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.4,<2'
      - name: Compile original H1 learner and new strict source adapter
        run: |
          python -m py_compile gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
          python -m py_compile gold_axis_2026/tools/vw_midas_anfis_stage3c_literature_v1.py
          python -m py_compile gold_axis_2026/tools/vw_midas_rbfnn_stage1_v1.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_neon_source_v2.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py
      - name: Unit tests for historical GPR vintages, price parity and no target leakage
        run: python -m unittest discover -v -s gold_axis_2026/tools -p 'test_gold_monthly_h1_neon_source_v2.py'
      - name: Check live Neon data and exact eight-feature model inputs
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "LIVE_NEON_AUDIT=NOT_RUN_NO_SECRET"
          else
            python gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py \
              --mode inputs --targets 2022-04,2025-01,2026-08,2026-09 \
              --output /tmp/gold_monthly_h1_live_neon_input_check.json
            python - <<'PY'
          import json
          r=json.load(open('/tmp/gold_monthly_h1_live_neon_input_check.json'))
          assert r['mode']=='inputs' and len(r['rows'])==4
          assert all(x['feature_count']==8 for x in r['rows'])
          assert all(x['gpr_origin_vintage_verified'] for x in r['rows'])
          assert r['source_contract']=='NEON_STAKTRAKR_GPR_V2'
          assert r['status']=='RESEARCH_REPLAY_ONLY_NOT_ASOF_PRICE_CERTIFIED'
          print('LIVE_NEON_H1_8_FEATURES=PASS')
          PY
          fi
      - name: Actual ChHHO-ANFIS one-origin training and prediction smoke test
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "ACTUAL_CHHHO_REPLAY=NOT_RUN_NO_SECRET"
          else
            OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py \
              --mode replay --models CHHHO --targets 2026-08 \
              --output /tmp/h1_chhho_model_smoke.json
            python - <<'PY'
          import json,math
          r=json.load(open('/tmp/h1_chhho_model_smoke.json'))
          assert len(r['rows'])==1
          x=r['rows'][0]
          assert x['model']=='CHHHO' and x['target_month']=='2026-08'
          assert x['feature_contract']=='CURRENT8_4x_MR1_VW_GPR_ORIGIN'
          assert x['training_rows']>=30
          assert math.isfinite(x['forecast_xau_average'])
          assert r['status']=='RESEARCH_REPLAY_ONLY_NOT_ASOF_PRICE_CERTIFIED'
          print('ACTUAL_CHHHO_REPLAY_PASS',x['target_month'],
                'forecast=',x['forecast_xau_average'],
                'absolute_error=',x['absolute_error'])
          PY
          fi
      - name: Ensure new model cannot silently load legacy CORE5 GPR
        run: |
          python - <<'PY'
          import pathlib
          a=pathlib.Path('gold_axis_2026/tools/gold_monthly_h1_neon_source_v2.py').read_text()
          b=pathlib.Path('gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py').read_text()
          old=pathlib.Path('gold_axis_2026/tools/vw_midas_msvr_successor_v1.py').read_text()
          assert 'gpr_origin_safe_model_v1' in a
          assert 'staktrakr_single_repository_monthly_research_v1' in a
          assert 'GOLD_MONTHLY_H1_DATA_CONTRACT' in old
          assert 'source_gate(bundle)' in b
          assert 'RESEARCH_REPLAY_ONLY_NOT_ASOF_PRICE_CERTIFIED' in b
          assert 'modelTrained' not in b
          print('NO_CORE5_SOURCE_PROMOTION=PASS')
          PY
