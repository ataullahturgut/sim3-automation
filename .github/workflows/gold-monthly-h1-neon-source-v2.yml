name: Gold Monthly H1 Neon Source Contract V2
on:
  push:
    branches:
      - gold-monthly-h1-neon-source-adapter-v2-20261023
    paths:
      - gold_axis_2026/tools/gold_monthly_h1_neon_source_v2.py
      - gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py
      - gold_axis_2026/tools/test_gold_monthly_h1_neon_source_v2.py
      - gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
      - .github/workflows/gold-monthly-h1-neon-source-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4'
      - name: Compile original H1 learner and new strict source adapter
        run: |
          python -m py_compile gold_axis_2026/tools/vw_midas_msvr_successor_v1.py
          python -m py_compile gold_axis_2026/tools/vw_midas_anfis_stage3c_literature_v1.py
          python -m py_compile gold_axis_2026/tools/vw_midas_rbfnn_stage1_v1.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_neon_source_v2.py
          python -m py_compile gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py
      - name: Unit tests for historical GPR vintages, price parity and no target leakage
        run: python -m unittest discover -v -s gold_axis_2026/tools -p 'test_gold_monthly_h1_neon_source_v2.py'
      - name: Ensure new model cannot silently load legacy CORE5 GPR
        run: |
          python - <<'PY'
          import pathlib
          a=pathlib.Path('gold_axis_2026/tools/gold_monthly_h1_neon_source_v2.py').read_text()
          b=pathlib.Path('gold_axis_2026/tools/gold_monthly_h1_retrain_v2.py').read_text()
          old=pathlib.Path('gold_axis_2026/tools/vw_midas_msvr_successor_v1.py').read_text()
          assert 'gpr_origin_safe_model_v1' in a
          assert 'staktrakr_single_repository_monthly_research_v1' in a
          assert 'GOLD_MONTHLY_H1_DATA_CONTRACT' in old
          assert 'source_gate(bundle)' in b
          assert 'RESEARCH_REPLAY_ONLY_NOT_ASOF_PRICE_CERTIFIED' in b
          assert 'modelTrained' not in b
          print('NO_CORE5_SOURCE_PROMOTION=PASS')
          PY
