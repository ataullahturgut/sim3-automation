name: Gold XAU15 Native1H Cross Resolution Audit 20261006

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_xau15_native1h_cross_resolution_audit_20261006.py'
      - '.github/workflows/gold-xau15-native1h-cross-resolution-audit-20261006.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'psycopg[binary]>=3.2,<4'
      - name: Require Neon key
        run: test -n "$NEON_DATABASE_URL"
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_xau15_native1h_cross_resolution_audit_20261006.py
      - name: Run XAU cross-resolution audit
        run: python gold_axis_2026/tools/gold_xau15_native1h_cross_resolution_audit_20261006.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/XAU15_NATIVE1H_CROSS_RESOLUTION_OUT/summary.json gold_axis_2026/GOLD_XAU15_NATIVE1H_CROSS_RESOLUTION_SUMMARY_2026-10-06.json
          cp gold_axis_2026/XAU15_NATIVE1H_CROSS_RESOLUTION_OUT/matched_hours.csv gold_axis_2026/GOLD_XAU15_NATIVE1H_CROSS_RESOLUTION_MATCHED_2026-10-06.csv
          cp gold_axis_2026/XAU15_NATIVE1H_CROSS_RESOLUTION_OUT/samples.csv gold_axis_2026/GOLD_XAU15_NATIVE1H_CROSS_RESOLUTION_SAMPLES_2026-10-06.csv
          git add gold_axis_2026/GOLD_XAU15_NATIVE1H_CROSS_RESOLUTION_*
          if ! git diff --cached --quiet; then
            git commit -m "Record XAU 15m versus native 1h audit"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
