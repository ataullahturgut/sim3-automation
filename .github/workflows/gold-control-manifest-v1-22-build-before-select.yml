name: Gold Control Manifest v1.22 Build Before Select

on:
  push:
    branches:
      - gold-r4-direction-engine
    paths:
      - .github/workflows/gold-control-manifest-v1-22-build-before-select.yml

permissions:
  contents: write

jobs:
  patch-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0

      - name: Patch canonical manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md')
          text = path.read_text(encoding='utf-8')

          old_version = '**Manifest version:** 1.21  '
          new_version = '**Manifest version:** 1.22  '
          if old_version not in text:
              raise SystemExit('MANIFEST_VERSION_ANCHOR_NOT_FOUND_OR_ALREADY_CHANGED')
          text = text.replace(old_version, new_version, 1)

          anchor = '## 7.1 H=1 role freeze — restored agreed architecture\n'
          if anchor not in text:
              raise SystemExit('H1_ROLE_FREEZE_ANCHOR_NOT_FOUND')

          block = '''## 7.B BUILD-FIRST / SELECT-LATER EXECUTION POLICY — v1.22\n\nThis subsection freezes the implementation order for the multi-expert monthly forecast system.\n\n### Binding execution order\n\n1. **Build the multi-expert forecasting substrate before selecting a winner.** The system must first be able to run, identify, persist and compare the separately governed outputs of Causal Patch Transformer, VW-MIDAS-MSVR, 3M Momentum and the Random Walk benchmark.\n2. During this build phase, **no expert is promoted to canonical authority merely because it looks best on already observed 2026 outcomes**. The existing operational forward-issuer role freeze remains separate from the architectural multi-expert design.\n3. `auto selector = OFF` and `auto ensemble = OFF` remain binding while the substrate and clean forecast history are being built.\n4. The Early Indicative lane may be implemented before an expert selector exists. On each eligible completed-session update, every executable expert is recomputed using only point-in-time-safe information available at that `as_of` time; each expert result is stored separately with target month, origin/as-of time, model/version identity, immutable input lineage and evidence class.\n5. Early Indicative outputs are **not** the canonical month-end H=1 forecast and must not be merged into the official month-end prospective scorecard. They form a separate forecast-revision history for the same fixed target month.\n6. Only after a sufficiently clean comparable expert history exists may a selector/aggregation research phase begin. Candidate selection/combination rules must be learned and validated with leakage-safe rolling/expanding-origin procedures using only information available before each evaluated origin.\n7. Selector/aggregation research must compare against at least the individual experts, Random Walk and simple transparent combination baselines where applicable. A more complex selector is not accepted merely because it wins one episode or one recent year.\n8. A selector/aggregation rule may become canonical only through explicit change control, with a named version, frozen rule, reproducible code, provenance, robustness evidence and prospective-compatible validation.\n9. If no selector/aggregation rule demonstrates stable incremental value, the system keeps the expert outputs separate and does **not** force a synthetic winner for presentation convenience.\n10. The purpose of this order is to generate the unbiased evidence required to choose the best selection/aggregation mechanism later, rather than choosing the mechanism first and then backfitting the evidence to it.\n\nCanonical implementation sequence:\n\n```text\nBuild Multi-Expert Forecast Pipeline\n        ↓\nPersist Separate Expert Outputs + Immutable Inputs\n        ↓\nRun Early Indicative Revision Track with New PIT-Safe Data\n        ↓\nAccumulate Comparable Historical / Prospective Evidence\n        ↓\nResearch Selector / Combination Rules\n        ↓\nLeakage-Safe Rolling-Origin Validation\n        ↓\nChange-Control Decision: FREEZE SELECTOR / KEEP EXPERTS SEPARATE\n```\n\n**Binding interpretation:** infrastructure and clean evidence come first; expert selection comes later. No future selector may be justified by hindsight from the outcomes it is supposed to predict.\n\n'''

          if '## 7.B BUILD-FIRST / SELECT-LATER EXECUTION POLICY — v1.22' in text:
              raise SystemExit('V1_22_BUILD_FIRST_ALREADY_PRESENT')

          text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate manifest patch
        shell: bash
        run: |
          grep -q 'Manifest version:.*1.22' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q '7.B BUILD-FIRST / SELECT-LATER EXECUTION POLICY' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'Build the multi-expert forecasting substrate before selecting a winner' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'auto selector = OFF' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'Early Indicative outputs are' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          grep -q 'infrastructure and clean evidence come first' gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          echo MANIFEST_V1_22_BUILD_FIRST_SELECT_LATER_PASS

      - name: Commit manifest v1.22
        shell: bash
        run: |
          git config user.name 'gold-control-governance-bot'
          git config user.email 'gold-control-governance-bot@users.noreply.github.com'
          git add gold_axis_2026/GOLD_CONTROL_PROJECT_MANIFEST.md
          git commit -m 'gold-control: freeze build-first select-later policy in manifest v1.22'
          git push origin HEAD:gold-r4-direction-engine
