name: Gold Control v1.42 Archive Retired Branches Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gold-control-v142-archive-retired-branches-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Fetch all refs
        run: git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Archive exact retired branches then delete branch refs
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            gold-control-broad-research-data-spine-r1
            gold-control-data-spine-ui-read-v1
            gold-control-vw-midas-svr-xau-successor-v1
            gold-control-vw-midas-svr-xau-successor-v2-validation
            noop
            noop2
            tmp-delete-me-recovery
            tmp-engine-observability-v123
            unused-do-not-use
            why-this-keeps-happening-stop
            gold-control-archive-retired-branches-v142
          )
          : > /tmp/archive-map.txt
          for branch in "${targets[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "ALREADY_ABSENT $branch"
              continue
            fi
            sha="$(git rev-parse "refs/remotes/origin/$branch")"
            tag="archive/2026-09-07/$branch"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              existing="$(git rev-parse "refs/tags/$tag")"
              test "$existing" = "$sha" || { echo "ARCHIVE_TAG_COLLISION $tag $existing != $sha"; exit 1; }
            else
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag"
            fi
            remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
            test "$remote_tag_sha" = "$sha" || { echo "REMOTE_TAG_VERIFY_FAILED $tag"; exit 1; }
            git push origin --delete "$branch"
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "BRANCH_DELETE_VERIFY_FAILED $branch"
              exit 1
            fi
            printf '%s -> %s -> %s\n' "$branch" "$tag" "$sha" | tee -a /tmp/archive-map.txt
          done
      - name: Upload archive map
        uses: actions/upload-artifact@v4
        with:
          name: gold-control-v142-retired-branch-archive-map
          path: /tmp/archive-map.txt
          if-no-files-found: error
      - name: Remove one-shot workflow from main
        run: |
          git config user.name 'gold-control-governance-bot'
          git config user.email 'gold-control-governance-bot@users.noreply.github.com'
          git rm .github/workflows/gold-control-v142-archive-retired-branches-once.yml
          git commit -m 'Gold Control v1.42: remove completed retired-branch archiver'
          git push origin HEAD:main
