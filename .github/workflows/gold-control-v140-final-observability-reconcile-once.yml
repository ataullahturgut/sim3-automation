name: Gold Control v1.40 Final Observability Reconcile Once

on:
  push:
    branches:
      - gold-r4-direction-engine
    paths:
      - '.github/workflows/gold-control-v140-final-observability-reconcile-once.yml'
      - 'gold_axis_2026/tools/finalize_v1_40_current_reference_observability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply final v1.40 observability patches
        run: python gold_axis_2026/tools/finalize_v1_40_current_reference_observability.py
      - name: Install runtime
        run: python -m pip install 'psycopg[binary]==3.3.5' pytest
      - name: Compile changed Python
        run: |
          python -m py_compile gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py
          python -m py_compile gold_axis_2026/apps/engine_observability_contract.py
          python -m py_compile gold_axis_2026/apps/production_display_snapshot.py
          python -m py_compile gold_axis_2026/tools/export_production_display_snapshot.py
      - name: Run data governance tests
        run: |
          cd gold_axis_2026/data_pipeline
          pytest -q test_data_evidence_spine.py test_data_evidence_spine_preflight.py test_data_evidence_spine_runtime_bootstrap.py test_multi_expert_forecast.py test_multi_expert_early_indicative.py
      - name: Run app observability tests
        run: |
          cd gold_axis_2026/apps
          pytest -q test_engine_observability_contract.py test_production_display_snapshot.py
      - name: Export fresh production snapshot read-only
        run: |
          test -n "$NEON_DATABASE_URL" || (echo 'NEON_DATABASE_URL missing' && exit 1)
          python gold_axis_2026/tools/export_production_display_snapshot.py --out gold_axis_2026/apps/production_display_snapshot.json
      - name: Assert production current state and authority locks
        run: |
          PYTHONPATH=gold_axis_2026/apps python - <<'PY'
          import json, os
          from pathlib import Path
          import psycopg
          from production_display_snapshot import validate_production_display_snapshot

          p=Path('gold_axis_2026/apps/production_display_snapshot.json')
          snap=json.loads(p.read_text(encoding='utf-8'))
          validate_production_display_snapshot(snap)
          assert snap['snapshot_contract']=='FROZEN_PRODUCTION_DISPLAY_SNAPSHOT_V3_CURRENT_MONTH_REFERENCES'
          assert len(snap['runtime'])==12
          assert all(r['runtime_status']=='ACTIVE' for r in snap['runtime'])
          rows={r['engine_id']:r for r in snap['runtime']}
          expected_values={
              'CAUSAL_PATCH':4452.046728838838,
              'VW_MIDAS_MSVR_SUCCESSOR_V1':4565.115907930242,
              'MOMENTUM_3M':4345.814584037808,
              'RANDOM_WALK':4397.305673870967,
          }
          for engine_id,value in expected_values.items():
              ref=rows[engine_id]['metadata']['current_month_reference']
              assert ref['evidence_class']=='HISTORICAL_REPLAY'
              assert ref['forecast_value']==value
              assert ref['forecast_origin']=='2026-08-31T21:00:00Z'
              assert ref['information_cutoff']=='2026-08-31T21:00:00Z'
              assert ref['prospective_claim'] is False
              assert ref['canonical_authority'] is False
              assert ref['auto_selector']=='OFF'
              assert ref['auto_ensemble']=='OFF'
          assert rows['EMERGENCY_LEVEL']['metadata']['current_month_reference']['state_value']=='NEUTRAL'
          assert rows['EMERGENCY_REVERSAL']['metadata']['current_month_reference']['state_value']=='OFF'
          assert rows['EMERGENCY_LEVEL']['metadata']['current_month_reference']['reference_kind']=='HISTORICAL_REPLAY_MONTH_OPEN_STATE'
          assert rows['EMERGENCY_REVERSAL']['metadata']['current_month_reference']['reference_kind']=='HISTORICAL_REPLAY_MONTH_OPEN_STATE'

          with psycopg.connect(os.environ['NEON_DATABASE_URL'], autocommit=False) as conn:
              with conn.cursor() as cur:
                  cur.execute('SET TRANSACTION READ ONLY')
                  for table in ('monthly_forecast_contracts','decision_signal_snapshots','decision_runs','decision_events'):
                      cur.execute(f'SELECT count(*) FROM {table}')
                      assert cur.fetchone()[0]==0, table
              conn.rollback()
          print('V140_PRODUCTION_CURRENT_STATE_PASS active=12 waiting=0 blocked=0 authority_stores=0/0/0/0')
          PY
      - name: Commit reconciled code and production snapshot
        run: |
          git config user.name 'gold-control-governance-bot'
          git config user.email 'gold-control-governance-bot@users.noreply.github.com'
          git add \
            gold_axis_2026/data_pipeline/data_evidence_spine_runtime_bootstrap.py \
            gold_axis_2026/apps/engine_observability_contract.py \
            gold_axis_2026/apps/production_display_snapshot.py \
            gold_axis_2026/tools/export_production_display_snapshot.py \
            gold_axis_2026/apps/production_display_snapshot.json
          git commit -m 'Gold Control v1.40: reconcile current September observability'
          git push origin HEAD:gold-r4-direction-engine
