name: Gold Session Structural IRIS S1.4 V2 Warmup22 20261007

on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_session_structural_iris_s14_v2_warmup22_20261007.py'
      - '.github/workflows/gold-session-structural-iris-s14-v2-warmup22-20261007.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_session_structural_iris_s14_v2_warmup22_20261007.py
      - name: Run governed 2022-warmup S1.4
        run: python gold_axis_2026/tools/gold_session_structural_iris_s14_v2_warmup22_20261007.py
      - name: Record evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/summary.json gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_SUMMARY_2026-10-07.json
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/result.md gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_RESULT_2026-10-07.md
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/metrics.csv gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_METRICS_2026-10-07.csv
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/paired.csv gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_PAIRED_2026-10-07.csv
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/coverage.csv gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_COVERAGE_2026-10-07.csv
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/selection_events.csv gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_SELECTION_EVENTS_2026-10-07.csv
          cp gold_axis_2026/SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_OUT/predictions.csv gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_PREDICTIONS_2026-10-07.csv
          git add gold_axis_2026/GOLD_SESSION_STRUCTURAL_IRIS_S14_V2_WARMUP22_*
          if ! git diff --cached --quiet; then
            git commit -m "Record S1.4 Structural IRIS replay with 2022 warmup"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
