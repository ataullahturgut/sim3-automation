name: GPR Stage 0 Canonical Baselines V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gpr_core_v1.py
      - gold_axis_2026/tools/gpr_experiment_v1.py
      - .github/workflows/gpr-stage0-v1.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        method: [SO_RBF, VANILLA_ICM_RBF, ICM_M32, REGULARIZED_ICM_RBF]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 psycopg[binary] scikit-learn
      - run: python gold_axis_2026/tools/test_gpr_core_v1.py
      - name: Run origin-safe canonical GP
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gpr_experiment_v1.py --method ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpr-stage0-${{ matrix.method }}
          path: gpr_*_result.json
          if-no-files-found: error
