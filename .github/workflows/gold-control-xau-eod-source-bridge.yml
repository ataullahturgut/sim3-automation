name: Gold Control XAU EOD Source Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-control-xau-eod-source-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: pip install -r gold_axis_2026/data_pipeline/requirements.txt
      - name: Require protected credentials
        run: |
          test -n "$NEON_DATABASE_URL" || { echo 'NEON_DATABASE_URL_MISSING'; exit 1; }
          test -n "$TWELVE_DATA_API_KEY" || { echo 'TWELVE_DATA_API_KEY_MISSING'; exit 1; }
      - name: Compare candidate EOD geometry read-only without logging prices
        shell: python
        run: |
          import os
          import sys
          import numpy as np
          import pandas as pd
          import psycopg
          import requests

          sys.path.insert(0, 'gold_axis_2026/r4_1/src')
          from gold_r4 import Direction, classify_state, completed_weekly_closes, fast_state, slow_state
          from gold_r4.emergency import EmergencyState

          with psycopg.connect(os.environ['NEON_DATABASE_URL'], autocommit=False) as conn:
              with conn.cursor() as cur:
                  cur.execute('SET TRANSACTION READ ONLY')
                  cur.execute('''
                      SELECT DISTINCT ON (observation_ts::date)
                             observation_ts::date AS d, value
                      FROM usable_observations
                      WHERE series_id = 'XAU_DAILY_XAUS'
                      ORDER BY observation_ts::date, retrieved_at DESC
                  ''')
                  xaus_rows = cur.fetchall()
              conn.rollback()

          if len(xaus_rows) < 25:
              raise SystemExit(f'XAUS_DAILY_INSUFFICIENT:{len(xaus_rows)}')
          xaus = pd.DataFrame(xaus_rows, columns=['date', 'xaus_close'])
          xaus['date'] = pd.to_datetime(xaus['date'])
          xaus['xaus_close'] = pd.to_numeric(xaus['xaus_close'], errors='raise')

          headers = {
              'Authorization': f"apikey {os.environ['TWELVE_DATA_API_KEY']}",
              'User-Agent': 'GoldControl-Stage4-SourceBridge/1.1',
          }
          r = requests.get(
              'https://api.twelvedata.com/time_series',
              params={'symbol':'XAU/USD','interval':'1day','outputsize':5000,'format':'JSON','start_date':'2016-01-01'},
              headers=headers,
              timeout=(8, 35),
          )
          r.raise_for_status()
          p = r.json()
          if p.get('status') == 'error':
              raise SystemExit(f"TWELVE_API_ERROR:{p.get('code')}:{p.get('message')}")
          vals = p.get('values') or []
          if len(vals) < 25:
              raise SystemExit(f'TWELVE_DAILY_INSUFFICIENT:{len(vals)}')
          twelve = pd.DataFrame([
              {'date': pd.to_datetime(v.get('datetime'), errors='coerce'),
               'twelve_close': pd.to_numeric(v.get('close'), errors='coerce')}
              for v in vals
          ]).dropna().drop_duplicates('date', keep='last')

          z = xaus.merge(twelve, on='date', how='inner').sort_values('date').reset_index(drop=True)
          if len(z) < 25:
              raise SystemExit(f'COMMON_DATE_INSUFFICIENT:{len(z)}')

          ratio_gap = (z['twelve_close'] / z['xaus_close'] - 1.0).abs() * 100.0
          ret_a = z['xaus_close'].pct_change()
          ret_b = z['twelve_close'].pct_change()
          valid_ret = ret_a.notna() & ret_b.notna()
          return_corr = float(ret_a[valid_ret].corr(ret_b[valid_ret])) if valid_ret.sum() >= 3 else float('nan')
          sign_agree = float((np.sign(ret_a[valid_ret]) == np.sign(ret_b[valid_ret])).mean() * 100.0)

          fast_pairs = []
          slow_pairs = []
          for i, row in z.iterrows():
              ha = z.loc[:i, ['date','xaus_close']].rename(columns={'xaus_close':'close'})
              hb = z.loc[:i, ['date','twelve_close']].rename(columns={'twelve_close':'close'})
              fa = fast_state(ha['close'].tolist()).value
              fb = fast_state(hb['close'].tolist()).value
              if fa != 'INSUFFICIENT_DATA' and fb != 'INSUFFICIENT_DATA':
                  fast_pairs.append((fa, fb))
              sa = slow_state(completed_weekly_closes(ha[['date','close']], pd.Timestamp(row['date']))).value
              sb = slow_state(completed_weekly_closes(hb[['date','close']], pd.Timestamp(row['date']))).value
              if sa != 'INSUFFICIENT_DATA' and sb != 'INSUFFICIENT_DATA':
                  slow_pairs.append((sa, sb))

          fast_agree = float(sum(a == b for a,b in fast_pairs) / len(fast_pairs) * 100.0) if fast_pairs else float('nan')
          slow_agree = float(sum(a == b for a,b in slow_pairs) / len(slow_pairs) * 100.0) if slow_pairs else float('nan')

          closure = pd.read_csv('gold_axis_2026/production_closure/production_2026.csv')
          vw = dict(zip(closure['month'].astype(str), pd.to_numeric(closure['vw'], errors='raise')))
          ea, eb = EmergencyState(), EmergencyState()
          emergency_rows = []
          classification_checks = []
          for i, row in z.iterrows():
              month = pd.Timestamp(row['date']).strftime('%Y-%m')
              if month not in vw:
                  continue
              la, ra = ea.update(pd.Timestamp(row['date']), float(row['xaus_close']), float(vw[month]))
              lb, rb = eb.update(pd.Timestamp(row['date']), float(row['twelve_close']), float(vw[month]))
              ha = z.loc[:i, ['date','xaus_close']].rename(columns={'xaus_close':'close'})
              hb = z.loc[:i, ['date','twelve_close']].rename(columns={'twelve_close':'close'})
              fa = fast_state(ha['close'].tolist())
              fb = fast_state(hb['close'].tolist())
              sa = slow_state(completed_weekly_closes(ha[['date','close']], pd.Timestamp(row['date'])))
              sb = slow_state(completed_weekly_closes(hb[['date','close']], pd.Timestamp(row['date'])))
              emergency_rows.append((la.value, lb.value, ra.value, rb.value))
              for md in (Direction.UP, Direction.DOWN, Direction.NEUTRAL):
                  ca = classify_state(md, la, ra, fa, sa, False)
                  cb = classify_state(md, lb, rb, fb, sb, False)
                  classification_checks.append(ca == cb)

          if not emergency_rows:
              raise SystemExit('NO_CANONICAL_VW_OVERLAP_FOR_EMERGENCY_AUDIT')
          level_agree = sum(a == b for a,b,_,_ in emergency_rows) / len(emergency_rows) * 100.0
          reversal_agree = sum(a == b for _,_,a,b in emergency_rows) / len(emergency_rows) * 100.0
          classification_agree = sum(classification_checks) / len(classification_checks) * 100.0

          print('XAU_EOD_SOURCE_BRIDGE_READ_ONLY=PASS')
          print(f'XAUS_ROWS={len(xaus)}')
          print(f'TWELVE_ROWS={len(twelve)}')
          print(f'COMMON_DATES={len(z)}')
          print(f'COMMON_START={z.date.min().date().isoformat()}')
          print(f'COMMON_END={z.date.max().date().isoformat()}')
          print(f'MEDIAN_ABS_LEVEL_GAP_PCT={ratio_gap.median():.6f}')
          print(f'P95_ABS_LEVEL_GAP_PCT={ratio_gap.quantile(0.95):.6f}')
          print(f'MAX_ABS_LEVEL_GAP_PCT={ratio_gap.max():.6f}')
          print(f'DAILY_RETURN_CORRELATION={return_corr:.6f}')
          print(f'DAILY_RETURN_SIGN_AGREEMENT_PCT={sign_agree:.3f}')
          print(f'FAST_STATE_AGREEMENT_PCT={fast_agree:.3f}')
          print(f'FAST_ELIGIBLE_DATES={len(fast_pairs)}')
          print(f'SLOW_STATE_AGREEMENT_PCT={slow_agree:.3f}')
          print(f'SLOW_ELIGIBLE_DATES={len(slow_pairs)}')
          print(f'EMERGENCY_LEVEL_AGREEMENT_PCT={level_agree:.3f}')
          print(f'REVERSAL_ALERT_AGREEMENT_PCT={reversal_agree:.3f}')
          print(f'EMERGENCY_ELIGIBLE_DATES={len(emergency_rows)}')
          print(f'CLASSIFICATION_AGREEMENT_ACROSS_ALL_MONTHLY_DIRECTIONS_PCT={classification_agree:.3f}')
          print(f'CLASSIFICATION_CASES={len(classification_checks)}')
          print('RAW_MARKET_VALUES_LOGGED=NO')
          print('DATABASE_WRITES=NONE')
          print('GOLD_CONTROL_XAU_EOD_SOURCE_BRIDGE_PASS')
