name: Gold Monthly ChHHO Backcast Reconcile V1
on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_backcast_reconcile_v1.py
      - .github/workflows/gold-monthly-chhho-backcast-reconcile-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4' 'requests>=2.32,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2'
      - run: python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_backcast_reconcile_v1.py
      - name: Reconcile
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/gold_monthly_chhho_backcast_reconcile_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-backcast-reconcile-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_BACKCAST_RECONCILE_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
