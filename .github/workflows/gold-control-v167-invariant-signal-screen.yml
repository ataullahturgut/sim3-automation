name: Gold Control V1.67 invariant signal screening research

on:
  pull_request:
    paths:
      - "gold_axis_2026/v167_research/**"
      - "gold_axis_2026/tests/test_v167_invariant_signal_screen.py"
      - ".github/workflows/gold-control-v167-invariant-signal-screen.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  invariant-signal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      V164_ARTIFACT_DIR: /tmp/v164_artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen V1.67 dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 pytest==8.4.2
      - name: Test V1.67 governance chronology and target locks
        run: python -m pytest -q gold_axis_2026/tests/test_v167_invariant_signal_screen.py
      - name: Download and verify immutable V1.64 source artifact
        run: |
          mkdir -p /tmp/v164_artifact
          gh api repos/ataullahturgut/sim3-automation/actions/artifacts/10316352769/zip > /tmp/v164_artifact.zip
          echo "23901808b5b8db4b2065797865f7ac4269bf544953fe1ce38b37964e19ab78da  /tmp/v164_artifact.zip" | sha256sum -c -
          unzip -q /tmp/v164_artifact.zip -d /tmp/v164_artifact
      - name: Run frozen V1.67 invariant signal screen
        run: python -m gold_axis_2026.v167_research.run_v167_invariant_signal_screen
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v167-invariant-signal-screen-${{ github.sha }}
          path: gold_axis_2026/data_pipeline/audits/v167_research/
