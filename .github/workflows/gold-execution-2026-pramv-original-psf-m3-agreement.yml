name: Gold 2026 Frozen Original PSF M3 Signature FPCA Price Agreement
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_legacy_psf_m3_agreement_20261008.py
      - .github/workflows/gold-execution-2026-pramv-original-psf-m3-agreement.yml
permissions:
  contents: write
concurrency:
  group: gold-pramv-original-psf-m3-agreement-original-clock
  cancel-in-progress: false
jobs:
  exact-original-m3:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Exact old M3 PSF signature PCA family with no nonexistent 2026 macro labels
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_legacy_psf_m3_agreement_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_legacy_psf_m3_agreement_20261008.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-pramv-2026-source-exact-m3-private-dated
          path: gold_axis_2026/GOLD_EXECUTION_2026_LEGACY_PSF_M3_PRICE_AGREEMENT_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Aggregate model evidence or honest model blocker
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_LEGACY_PSF_M3_PRICE_AGREEMENT_20261008_{SUMMARY.json,YEAR_METRICS.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Report true original PSF M3 signature FPCA confirmation gate on XAU 2026 native BID 16h, macro M4 withheld'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
