name: TEMP V1.30 Reconcile Replay Regression

on:
  push:
    branches:
      - gold-control-v130-current-month-replay-context-fix
    paths:
      - '.github/workflows/_tmp_v130_reconcile_replay_regression.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-control-v130-current-month-replay-context-fix
          fetch-depth: 0
      - name: Reconcile old September regression and change-control wording
        run: |
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/gold-control-v130-september-replay-motor-visibility.yml')
          s=w.read_text(encoding='utf-8')
          repl={
            "grep -Fq 'REPLAY · PROSPECTIVE DEĞİL' gold_axis_2026/apps/gold_control_mobile_v1.py":"grep -Fq 'REPLAY · PROSPECTIVE ISSUED DEĞİL' gold_axis_2026/apps/gold_control_mobile_v1.py",
            "grep -Fq 'EYLÜL 2026 H=1 REPLAY' gold_axis_2026/apps/gold_control_mobile_v1.py":"grep -Fq 'EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE' gold_axis_2026/apps/gold_control_mobile_v1.py\n          grep -Fq '31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT' gold_axis_2026/apps/gold_control_mobile_v1.py",
            "page.get_by_text('EYLÜL 2026 H=1 REPLAY',exact=True).first.wait_for(state='visible',timeout=20000)":"page.get_by_text('EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE',exact=True).first.wait_for(state='visible',timeout=20000)",
            "('4,345.81 / 4,397.31 USD','3M Momentum / Random Walk','REPLAY · PROSPECTIVE DEĞİL','STATE BAĞLAMI','REPLAY ORIGIN','EYLÜL 2026 HISTORICAL REPLAY','NOT_ISSUED_MISSED_2026_08_31_ORIGIN')":"('4,345.81 / 4,397.31 USD','3M Momentum / Random Walk','REPLAY · PROSPECTIVE ISSUED DEĞİL','31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT','DOWN','ROBUST_UP','REPLAY ORIGIN','EYLÜL 2026 HISTORICAL REPLAY','NOT_ISSUED_MISSED_2026_08_31_ORIGIN')",
            "('4,345.81 / 4,397.31 USD','REPLAY · PROSPECTIVE DEĞİL','REPLAY ORIGIN')":"('4,345.81 / 4,397.31 USD','REPLAY · PROSPECTIVE ISSUED DEĞİL','31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT','DOWN','ROBUST_UP','REPLAY ORIGIN')",
          }
          for old,new in repl.items():
            if old not in s:
              raise SystemExit(f'old regression anchor not found: {old[:80]}')
            s=s.replace(old,new)
          w.write_text(s,encoding='utf-8')

          d=Path('gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md')
          t=d.read_text(encoding='utf-8')
          old='''- The hero must say `EYLÜL 2026 H=1 REPLAY` and `REPLAY · PROSPECTIVE DEĞİL`.\n- Replay origin must be labelled `REPLAY ORIGIN`, never `CANONICAL ORIGIN`.\n- The values remain separate expert outputs; no average, winner, selector, ensemble, or synthetic canonical forecast may be invented.\n- Official prospective September state remains `NOT_ISSUED_MISSED_2026_08_31_ORIGIN`.'''
          new='''- Because the replay target is `2026-09` and September is still open, the first visible hero must treat these rows as a **current-month reference**, not as expired history.\n- The hero must say `EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE` and `REPLAY · PROSPECTIVE ISSUED DEĞİL`.\n- The same hero must expose the governed 31 August month-open replay direction context: `MONTHLY_DIRECTION_3M = DOWN`, `FAST = ROBUST_UP`, `SLOW = ROBUST_UP`.\n- Replay origin must be labelled `REPLAY ORIGIN`, never `CANONICAL ORIGIN`.\n- Target relevance and evidence provenance are separate: the rows remain relevant to September until September closes, while their evidence class remains `HISTORICAL_REPLAY` and their prospective-issued claim remains false.\n- The values remain separate expert outputs; no average, winner, selector, ensemble, synthetic canonical forecast, or position action may be invented.\n- Official prospective issuance state remains `NOT_ISSUED_MISSED_2026_08_31_ORIGIN`.'''
          if old not in t:
            raise SystemExit('change-control presentation anchor not found')
          t=t.replace(old,new,1)
          old2='''The September 2026 H=1 rows already persisted in production Neon are historical replay evidence and must be visible to the user during September without being misrepresented as a prospective/canonical forecast.'''
          new2='''The September 2026 H=1 rows already persisted in production Neon are historical replay evidence. Because their target month is the currently open September 2026 period, they must remain visible during September as current-month reference evidence without being misrepresented as prospectively issued or canonical.'''
          if old2 not in t:
            raise SystemExit('change-control purpose anchor not found')
          t=t.replace(old2,new2,1)
          d.write_text(t,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/gold-control-v130-september-replay-motor-visibility.yml').read_text(encoding='utf-8')
          d=Path('gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md').read_text(encoding='utf-8')
          for x in ('EYLÜL 2026 H=1 · CURRENT-MONTH REFERENCE','31 AĞUSTOS AY-AÇILIŞ YÖN CONTEXT','REPLAY · PROSPECTIVE ISSUED DEĞİL','DOWN','ROBUST_UP'):
            assert x in w,x
          for x in ('current-month reference','Target relevance and evidence provenance are separate','MONTHLY_DIRECTION_3M = DOWN','FAST = ROBUST_UP','SLOW = ROBUST_UP'):
            assert x in d,x
          print('V130_REPLAY_SEMANTICS_RECONCILIATION_PASS')
          PY
      - name: Commit and self-remove
        run: |
          rm .github/workflows/_tmp_v130_reconcile_replay_regression.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gold-control-v130-september-replay-motor-visibility.yml gold_axis_2026/GOLD_CONTROL_SEPTEMBER_REPLAY_VISIBILITY_CHANGE_CONTROL_2026-09-04.md .github/workflows/_tmp_v130_reconcile_replay_regression.yml
          git commit -m 'gold-control: align September replay contract with open-month semantics'
          git push origin HEAD:gold-control-v130-current-month-replay-context-fix
