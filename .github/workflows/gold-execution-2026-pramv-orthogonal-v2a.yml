name: Gold 2026 Original PRAMV Orthogonal Early Path Reliability Audit
on:
  workflow_dispatch:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - gold_axis_2026/tools/gold_execution_2026_orthogonal_rfr_v2a_20261008.py
      - .github/workflows/gold-execution-2026-pramv-orthogonal-v2a.yml
permissions:
  contents: write
concurrency:
  group: gold-2026-pramv-orthogonal-earlypath-reliability
  cancel-in-progress: false
jobs:
  early-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'psycopg[binary]>=3.2,<4'
      - name: Reuse original PSF exact signature feature and test strictly prior early path RFR hit reliability
        run: |
          python -m py_compile gold_axis_2026/tools/gold_execution_2026_orthogonal_rfr_v2a_20261008.py
          python gold_axis_2026/tools/gold_execution_2026_orthogonal_rfr_v2a_20261008.py
      - name: Store dated 2026 predictions only in private Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-2026-orthogonal-psf-v2a-private-dated
          path: gold_axis_2026/GOLD_EXECUTION_2026_ORTHOGONAL_EARLY_PATH_RFR_RELIABILITY_20261008_PRIVATE_DATED.csv
          if-no-files-found: warn
      - name: Save actual aggregate scores or explicit no-score
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in gold_axis_2026/GOLD_EXECUTION_2026_ORTHOGONAL_EARLY_PATH_RFR_RELIABILITY_20261008_{SUMMARY.json,METRICS.csv,FAILURE_QC.json}; do if test -f "$f"; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m 'Record actual original PRAMV orthogonal RFR early path reliability experiment on audited 2023-26 XAU'
          for i in 1 2 3 4 5; do
            git pull --rebase origin gold-execution-channel-audit-20261006
            if git push origin HEAD:gold-execution-channel-audit-20261006; then exit 0; fi
            sleep 3
          done
          exit 1
