name: Gold MIDAS ELM Meta Batch 21 25 V1

on:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/vw_midas_elm_meta_batch_21_25_v1.py
      - .github/workflows/gold-midas-elm-meta-batch-21-25-v1.yml

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.26,<3' 'psycopg[binary]>=3.2,<4'
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/vw_midas_elm_meta_batch_21_25_v1.py
      - name: Run batch
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python gold_axis_2026/tools/vw_midas_elm_meta_batch_21_25_v1.py
      - name: Inspect
        run: |
          python - <<'PY'
          import json
          r=json.load(open('vw_midas_elm_meta_batch_21_25_v1_result.json'))
          assert r['authority']['database_access']=='READ_ONLY'
          assert r['authority']['inner_validation']=='CHRONOLOGICAL_TAIL_ONLY_NO_RANDOM_SPLIT'
          assert set(r['models'])=={'HGS','CHOA','HGSO','AOA','CPA'}
          print('OUTPUT_GATE=PASS')
          for k,v in r['models'].items():
              print(k, json.dumps({
                  'dev':v['dev']['metrics'],
                  'transport_2025':v['transport_2025']['metrics'],
                  'stress_2026':v['stress_2026']['metrics']
              },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-midas-elm-meta-batch-21-25-v1-${{ github.sha }}
          path: vw_midas_elm_meta_batch_21_25_v1_result.json
          retention-days: 30
