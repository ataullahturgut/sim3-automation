name: Gold Control Patch V5 Monthly Level

on:
  push:
    branches: [gold-r4-direction-engine]
    paths:
      - 'gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_MONTHLY_LEVEL_INPUT_CHANGE_CONTROL_V5_2026-09-02.md'
      - 'gold_axis_2026/tools/causal_patch_r1_repro_v5_monthly_level.py'
      - '.github/workflows/gold-control-patch-v5-monthly-level.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locked-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-r4-direction-engine
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked runtime
        run: pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'requests>=2.31,<3' 'torch>=2.5,<3'

      - name: Require protected provider credentials
        run: |
          test -n "$TWELVE_DATA_API_KEY"
          test -n "$FRED_API_KEY"

      - name: Verify V5 contract was frozen before result and V4 geometry remains unchanged
        run: |
          grep -F 'FROZEN_BEFORE_V5_SOURCE_RESULT' gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_MONTHLY_LEVEL_INPUT_CHANGE_CONTROL_V5_2026-09-02.md
          grep -F 'CAUSAL_PATCH_R1_REPRO_V1_4_XAU_MONTHLY_LEVEL_ORIGIN_SAFE' gold_axis_2026/GOLD_CONTROL_CAUSAL_PATCH_R1_MONTHLY_LEVEL_INPUT_CHANGE_CONTROL_V5_2026-09-02.md
          python - <<'PY'
          import json
          p='gold_axis_2026/patch_repro_v1/frozen_geometry.json'
          g=json.load(open(p))['selected_pre_2023_geometry']
          assert (int(g['L']),int(g['P']),int(g['D'])) == (252,21,32), g
          print('V5_FROZEN_GEOMETRY_252_21_32_PASS')
          PY

      - name: Run frozen V5 source and locked model-impact gates
        id: v5
        continue-on-error: true
        run: python gold_axis_2026/tools/causal_patch_r1_repro_v5_monthly_level.py

      - name: Verify no prohibited write/log semantics in evidence
        if: always()
        run: |
          test -f gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json
          grep -F '"raw_vendor_market_values_logged": false' gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json
          grep -F '"database_write": "NONE"' gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json
          grep -F '"forecast_ledger_write": "NONE"' gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json
          grep -F '"decision_store_write": "NONE"' gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json
          test -f gold_axis_2026/patch_repro_v1/locked_replay_v5_monthly_level_evidence.json
          grep -F '"post_result_retune": false' gold_axis_2026/patch_repro_v1/locked_replay_v5_monthly_level_evidence.json

      - name: Commit immutable V5 evidence before declaring workflow result
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json \
                  gold_axis_2026/patch_repro_v1/locked_replay_v5_monthly_level_evidence.json
          if test -f gold_axis_2026/patch_repro_v1/locked_replay_v5_monthly_level_43.csv; then
            git add gold_axis_2026/patch_repro_v1/locked_replay_v5_monthly_level_43.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'gold-control: record frozen Patch V5 monthly-level evidence'
            git push origin HEAD:gold-r4-direction-engine
          fi

      - name: Enforce V5 PASS for downstream eligibility
        run: |
          python - <<'PY'
          import json
          s=json.load(open('gold_axis_2026/patch_repro_v1/prospective_monthly_level_v5_source_evidence.json'))
          m=json.load(open('gold_axis_2026/patch_repro_v1/locked_replay_v5_monthly_level_evidence.json'))
          if s.get('decision') != 'PATCH_MONTHLY_LEVEL_BRIDGE_V5_SOURCE_PASS':
              raise SystemExit('V5_SOURCE_GATE_FAIL_NO_RETUNE')
          if m.get('decision') != 'PATCH_R1_V5_MONTHLY_LEVEL_MODEL_IMPACT_PASS' or not m.get('model_impact_pass'):
              raise SystemExit('V5_MODEL_IMPACT_FAIL_NO_RETUNE')
          print('PATCH_MONTHLY_LEVEL_BRIDGE_V5_SOURCE_PASS')
          print('PATCH_R1_V5_MONTHLY_LEVEL_MODEL_IMPACT_PASS')
          PY
