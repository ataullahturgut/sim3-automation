name: Gold H2 frozen H3 exact-clock information replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gold_axis_2026/GOLD_H2_20261012_*"
      - "gold_axis_2026/tools/gold_h2_20261012_frozen_h3_truth_replay.py"
      - ".github/workflows/gold-h2-20261012-truth-replay.yml"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 gold_axis_2026/tools/gold_h2_20261012_frozen_h3_truth_replay.py
