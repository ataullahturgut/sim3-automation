name: Gold Monthly ChHHO Historical Performance Audit V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_chhho_historical_performance_audit_v1.py
      - .github/workflows/gold-monthly-chhho-historical-performance-audit-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'xlrd>=2.0,<3' 'requests>=2.32,<3' 'psycopg[binary]>=3.2,<4' 'scikit-learn>=1.5,<2' 'scipy>=1.13,<2'
      - name: Download frozen authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/predev inputs/chhho
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11084467079/zip" > predev.zip
          unzip -q predev.zip -d inputs/predev
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10989389723/zip" > chhho.zip
          unzip -q chhho.zip -d inputs/chhho
      - name: Compile
        run: python -m py_compile gold_axis_2026/tools/gold_monthly_chhho_historical_performance_audit_v1.py
      - name: Run audit
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python gold_axis_2026/tools/gold_monthly_chhho_historical_performance_audit_v1.py \
            --predev inputs/predev/GOLD_MONTHLY_CHHHO_PREDEV_CURRENTGPR_V2_2026-09-30.json \
            --chhho inputs/chhho/anfis_stage3c_chhho_result.json
      - name: Scientific gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_CHHHO_HISTORICAL_PERFORMANCE_AUDIT_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['blocks']['H1_COUNTERFACTUAL']['metrics']['n']>0
          assert r['blocks']['H2_VALID_PREDEV']['metrics']['n']==5
          assert r['blocks']['H3_CANONICAL_DEV']['metrics']['n']==33
          assert r['governance']['H1_is_counterfactual_not_pit'] is True
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({k:v['metrics'] for k,v in r['blocks'].items()},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-chhho-historical-performance-audit-${{ github.sha }}
          path: GOLD_MONTHLY_CHHHO_HISTORICAL_PERFORMANCE_AUDIT_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
