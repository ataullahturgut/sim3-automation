name: Gold XAU15m Missing Slot Audit 20261006
on:
  push:
    branches: [gold-execution-channel-audit-20261006]
    paths:
      - 'gold_axis_2026/tools/gold_xau15m_missing_slot_audit_20261006.py'
      - '.github/workflows/gold-xau15m-missing-slot-audit-20261006.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gold-execution-channel-audit-20261006
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check 'pandas>=2.2,<3'
      - run: python gold_axis_2026/tools/gold_xau15m_missing_slot_audit_20261006.py
      - name: Record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold_axis_2026/XAU15M_MISSING_SLOT_AUDIT_OUT/summary.json gold_axis_2026/GOLD_XAU15M_MISSING_SLOT_AUDIT_2026-10-06.json
          cp gold_axis_2026/XAU15M_MISSING_SLOT_AUDIT_OUT/patterns.csv gold_axis_2026/GOLD_XAU15M_MISSING_SLOT_PATTERNS_2026-10-06.csv
          git add gold_axis_2026/GOLD_XAU15M_MISSING_SLOT_*
          if ! git diff --cached --quiet; then
            git commit -m "Record XAU 15m missing-slot audit"
            git pull --rebase origin gold-execution-channel-audit-20261006
            git push origin HEAD:gold-execution-channel-audit-20261006
          fi
