name: Claude PUSULA FRED dollar fetch (research branch only)
on:
  workflow_dispatch:
  push:
    branches: [research-gold-claude-pusula-v1-20261016]
    paths:
      - 'gold_axis_2026/apps/claude_pusula_v1/tools/fetch_fred_dollar.py'
      - '.github/workflows/claude-pusula-fred-dollar-20261016.yml'
permissions:
  contents: write
jobs:
  fred:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-gold-claude-pusula-v1-20261016
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - run: python gold_axis_2026/apps/claude_pusula_v1/tools/fetch_fred_dollar.py
      - name: Save public FRED dollar series
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f gold_axis_2026/apps/claude_pusula_v1/data/FRED_DOLLAR_2020_2026.csv gold_axis_2026/apps/claude_pusula_v1/data/FRED_DOLLAR_2020_2026_META.json
          git diff --cached --quiet || git commit -m 'Record FRED broad dollar and EURUSD daily series (public data)'
          git pull --rebase origin research-gold-claude-pusula-v1-20261016
          git push origin HEAD:research-gold-claude-pusula-v1-20261016
