name: Gold Monthly V2 Independent Risk Channel V1

on:
  workflow_dispatch:
  push:
    branches: [gold-midas-headswap-v1-20260925]
    paths:
      - gold_axis_2026/tools/gold_monthly_v2_independent_risk_channel_v1.py
      - .github/workflows/gold-monthly-v2-independent-risk-channel-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frozen audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/audit
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11120035621/zip" > audit.zip
          unzip -q audit.zip -d inputs/audit
          test -f inputs/audit/GOLD_MONTHLY_ALARM_REGIME_V2_RELIABILITY_AUDIT_V1_2026-09-30.json

      - name: Compile
        run: |
          python -m py_compile gold_axis_2026/tools/gold_monthly_v2_independent_risk_channel_v1.py

      - name: Run audit
        run: |
          python gold_axis_2026/tools/gold_monthly_v2_independent_risk_channel_v1.py             --audit-json inputs/audit/GOLD_MONTHLY_ALARM_REGIME_V2_RELIABILITY_AUDIT_V1_2026-09-30.json             --output GOLD_MONTHLY_V2_INDEPENDENT_RISK_CHANNEL_V1_2026-09-30.json

      - name: Scientific governance gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('GOLD_MONTHLY_V2_INDEPENDENT_RISK_CHANNEL_V1_2026-09-30.json'))
          assert r['status']=='COMPLETE'
          assert r['scientific_gate']=='PASS'
          assert r['primary_schedule']=='EXPANDING_REFIT'
          assert r['periods']['DEV_2022_04_2024_12']['n']==33
          assert r['periods']['OPENED_2025']['n']==12
          assert r['periods']['OPENED_2026']['n']==8
          assert r['periods']['OPENED_2025_2026']['n']==20
          assert r['periods']['FULL_COMMON']['n']==58
          g=r['governance']
          assert g['v2_retuned'] is False
          assert g['v2_threshold_changed'] is False
          assert g['alarm_definitions_changed'] is False
          assert g['severity_thresholds_changed'] is False
          assert g['weight_model_fit'] is False
          assert g['2025_2026_used_for_candidate_selection'] is False
          assert g['target_month_v2_state_used'] is False
          print('SCIENTIFIC_GATE=PASS')
          print(json.dumps({
            'dev_candidate_gate':r['dev_candidate_gate'],
            'dev':r['periods']['DEV_2022_04_2024_12'],
            'opened_2025':r['periods']['OPENED_2025'],
            'opened_2026':r['periods']['OPENED_2026'],
            'opened_2025_2026':r['periods']['OPENED_2025_2026'],
            'full_common':r['periods']['FULL_COMMON'],
            'transition_rows':r['transition_rows_full_common'],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gold-monthly-v2-independent-risk-channel-v1-${{ github.sha }}
          path: GOLD_MONTHLY_V2_INDEPENDENT_RISK_CHANNEL_V1_2026-09-30.json
          if-no-files-found: error
          retention-days: 90
